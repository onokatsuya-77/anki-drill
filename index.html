<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>暗記ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --bg2:#F1F3F6; --bg3:#E6E9EE; --ink:#1A2230; --ink2:#5E6875; --line:#D3D9E2;
  --ai:#22497A; --ai-ink:#FFFFFF; --ai-soft:#E3ECF7;
  --shu:#C2312B; --shu-ink:#FFFFFF; --shu-soft:#FBE8E6;
  --midori:#2B7A4B; --midori-ink:#FFFFFF; --midori-soft:#E1F1E7;
  --ki:#9A5E0A; --ki-soft:#FBF0D9;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
    --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
    --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
    --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
    --ki:#E7B562; --ki-soft:#3A2D14;
  }
}
:root[data-theme="dark"]{
  --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
  --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
  --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
  --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
  --ki:#E7B562; --ki-soft:#3A2D14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
p{margin:0}
#app{max-width:680px;margin:0 auto;padding:0 14px 60px;}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line);}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.top h1{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.top .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);margin-top:1px}
.counts{display:inline-flex;gap:10px}
.counts b{color:var(--ink);font-weight:700}
.counts .mk b{color:var(--shu)}
.counts .un b{color:var(--ai)}
@media (max-width:400px){.tabs button{font-size:.82rem}}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:-1px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 8px;font-size:.9rem;white-space:nowrap;color:var(--ink2);cursor:pointer;font-weight:700}
.tabs button.on{color:var(--ai);border-bottom-color:var(--ai)}
.tabs button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
main{padding-top:16px}
.tab{display:none}
.tab.on{display:block}

.panel{background:var(--bg2);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.panel h2{font-size:1.02rem;margin-bottom:8px}
.lbl{font-size:.85rem;color:var(--ink2);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer}
.chip.on{border-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:700}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 16px;font-size:1rem;cursor:pointer;min-height:46px;font-weight:700}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.ok{background:var(--midori);border-color:var(--midori);color:var(--midori-ink)}
.btn.ng{background:var(--shu);border-color:var(--shu);color:var(--shu-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:12px}
.mt2{margin-top:20px}
.muted{color:var(--ink2);font-size:.88rem}
.small{font-size:.85rem}

/* quiz card */
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;min-height:340px;display:flex;flex-direction:column}
.card .meta{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:.85rem}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;background:var(--bg3);color:var(--ink2);font-weight:700}
.tag.r1{background:#E9EEDF;color:#4A5D1E}.tag.r2{background:#EBE4F2;color:#5A3F80}.tag.r3{background:#FDEBD3;color:#8A4B06}.tag.r4{background:#DDEAF6;color:#1E4E7A}.tag.r5{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag.r1,:root[data-theme="dark"] .tag.r2,:root[data-theme="dark"] .tag.r3,:root[data-theme="dark"] .tag.r4,:root[data-theme="dark"] .tag.r5{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.r1,:root:not([data-theme="light"]) .tag.r2,:root:not([data-theme="light"]) .tag.r3,:root:not([data-theme="light"]) .tag.r4,:root:not([data-theme="light"]) .tag.r5{background:var(--bg3);color:var(--ink2)}}
.q{font-size:1.18rem;font-weight:700;line-height:1.55;margin:14px 0 6px;flex:0 0 auto}
.hint{color:var(--ink2);font-size:.88rem}
.ansarea{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;margin:14px 0}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.box{width:2.1em;height:2.1em;border:1.5px solid var(--ink2);border-radius:3px;display:grid;place-items:center;font-family:var(--serif);font-size:1.55rem;font-weight:800;line-height:1;color:var(--ai);position:relative;background:var(--bg)}
.box::after{content:"";position:absolute;inset:0;border:1px dashed var(--line);margin:3px;border-radius:2px;opacity:.7}
.box span{opacity:0;transition:opacity .18s}
.card.revealed .box span{opacity:1}
.box.suffix{border:0;width:auto;height:auto;font-size:1.25rem;color:var(--ink);font-family:var(--sans);font-weight:700}
.box.suffix::after{display:none}
.answer{font-family:var(--serif);font-size:1.4rem;font-weight:800;line-height:1.35;color:var(--ai);display:none}
.card.revealed .answer{display:block}
.note{display:none;color:var(--ink2);font-size:.92rem;margin-top:10px;padding-left:10px;border-left:3px solid var(--line)}
.card.revealed .note{display:block}
.alt{display:none;font-size:.88rem;color:var(--ink2);margin-top:4px}
.card.revealed .alt{display:block}
.yomi{display:none;font-size:.9rem;color:var(--ink2);letter-spacing:.06em;margin-bottom:4px}
.card.revealed .yomi{display:block}
.expl{display:none;width:100%;margin-top:12px;padding:10px 12px;background:var(--bg2);border-left:3px solid var(--ai);border-radius:0 8px 8px 0;font-size:.92rem;line-height:1.6}
.card.revealed .expl{display:block}
.expl-t{font-size:.72rem;font-weight:700;color:var(--ai);letter-spacing:.1em;margin-bottom:3px}
.expl p + p{margin-top:4px}
.expl .pt{font-weight:700}
.expl .pt::before{content:"★ ";color:var(--ki)}
.badge.n.first{background:var(--ki-soft);color:var(--ki)}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark .btn{min-height:56px;font-size:1.08rem}
.prog{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--ai);width:0}
@media (prefers-reduced-motion:reduce){.box span{transition:none}}

/* next steps / progress */
.next h2{margin-bottom:6px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ai);border-radius:var(--r);padding:11px 14px;cursor:pointer;line-height:1.4}
.step:first-child{background:var(--ai-soft)}
.step b{font-size:1.02rem}
.step-n{font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--ai);min-width:1.2em}
.step .go{margin-left:auto;color:var(--ai);font-size:.9rem}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.prow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem}
.prow-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pbar{position:relative;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-top:4px}
.pbar i{position:absolute;left:0;top:0;height:100%;display:block}
.pbar i.d{background:var(--ai)}
.pbar i.m{background:var(--shu)}
.red{color:var(--shu)}
.btn.sm[disabled]{opacity:.4}

/* tips */
.tip h2{font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tip .tags .tag{font-size:.7rem}
.tipb{margin:8px 0 0;padding-left:1.3em;font-size:.95rem;line-height:1.7}
.tipb li + li{margin-top:4px}
.tipb li.key{font-weight:700}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.list li:first-child{border-top:0}
.list .num{color:var(--ink2);font-size:.85rem;min-width:1.8em;padding-top:2px}
.list .body{flex:1}
.list .qq{font-size:.95rem}
.list .aa{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.08rem}
.yomi-in{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:.04em}
.list .body .small.muted{margin-top:2px;line-height:1.5}
.list .st{font-size:.8rem;color:var(--ink2);white-space:nowrap;padding-top:3px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700}
.badge.w{background:var(--shu-soft);color:var(--shu)}
.badge.c{background:var(--midori-soft);color:var(--midori)}
.badge.n{background:var(--bg3);color:var(--ink2)}
.setbtn{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setbtn + .setbtn{margin-top:8px}
.setbtn b{font-size:1rem}
.setbtn .muted{font-size:.8rem}

/* order */
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:44px;border:1.5px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.slot.filled{border-style:solid;border-color:var(--ai);background:var(--ai-soft)}
.slot .n{font-family:var(--serif);font-weight:800;color:var(--ink2);min-width:1.4em}
.slot.filled .n{color:var(--ai)}
.slot .y{margin-left:auto;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.slot.right{border-style:solid;border-color:var(--midori);background:var(--midori-soft)}
.slot.wrong{border-style:solid;border-color:var(--shu);background:var(--shu-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .btn{font-weight:400;font-size:.98rem}

/* mock */
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--headH,96px));z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.05em}
.timer.warn{color:var(--ki)}
.timer.over{color:var(--shu)}
.mq{padding:14px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}
.mq .qt{font-weight:700;margin-bottom:8px}
.mq .qn{font-family:var(--serif);font-weight:800;color:var(--ink2);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--bg);text-align:left;font-size:.98rem;line-height:1.5}
.opt.on{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--midori);background:var(--midori-soft)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.opt .k{font-weight:700;min-width:1.4em}
.daimon{font-family:var(--serif);font-weight:800;font-size:1.1rem;margin:22px 0 4px;color:var(--ink)}
.write{border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--ink2);font-size:.92rem;background:var(--bg)}
.gradeans{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.15rem}
.self{display:flex;gap:8px;margin-top:8px}
.score{font-family:var(--serif);font-weight:800;font-size:2.4rem;color:var(--ai);line-height:1.1}
.score small{font-size:1rem;color:var(--ink2);font-family:var(--sans);font-weight:400}

/* notes */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:800;line-height:1.1}
.stat.w b{color:var(--shu)}
.stat span{font-size:.78rem;color:var(--ink2)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
input[type=search]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.empty{padding:22px 10px;text-align:center;color:var(--ink2);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* ---- 新アプリで足した見た目 ---- */
:root{--ki-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ki-ink:#2A1C02}}
:root[data-theme="dark"]{--ki-ink:#2A1C02}
#sess{display:none}
#sess.on{display:block}
.tag.r6{background:#F8E1DC;color:#8A2A20}.tag.r7{background:#DDF0EA;color:#1F5E52}.tag.r8{background:#F3E9C9;color:#6E5206}.tag.r9{background:#E6E3F5;color:#45368A}.tag.r10{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:var(--bg3);color:var(--ink2)}}
.mark3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mark3 .btn{min-height:64px;font-size:1.25rem;flex-direction:column;gap:1px;line-height:1.15;padding:8px 4px}
.mark3 .btn small{font-size:.74rem;font-weight:700}
.btn.tri{background:var(--ki);border-color:var(--ki);color:var(--ki-ink)}
.sep{font-family:var(--serif);font-size:1.3rem;font-weight:800;color:var(--ink2)}
.banner{background:var(--midori-soft);color:var(--midori);border-radius:var(--r);padding:10px 14px;font-weight:700;margin-bottom:12px;font-size:.95rem}
.banner.warn{background:var(--shu-soft);color:var(--shu)}
.kprompt{font-family:var(--serif);font-size:1.7rem;font-weight:800;letter-spacing:.06em;margin:14px 0 2px}
.q.sub{font-size:.98rem;font-weight:400;color:var(--ink2);margin-top:10px}
.stat.tri b{color:var(--ki)}
.stat.ok b{color:var(--midori)}
.badge.t{background:var(--ki-soft);color:var(--ki)}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stgc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center}
.stgc b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:800;line-height:1.2}
.stgc span{font-size:.68rem;color:var(--ink2);white-space:nowrap}
input[type=date]{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
#nFound .list li{align-items:center}
.tests{list-style:none;margin:0;padding:0;font-size:.95rem}
.tests li{padding:5px 0;border-top:1px solid var(--line)}
.tests li:first-child{border-top:0}
.tests li.past{color:var(--ink2)}
.list .num{font-weight:700}

/* ---- バッジと3つの輪 ---- */
@media (max-width:460px){.tabs button{font-size:.76rem;padding-left:0;padding-right:0}}
.tabs button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--shu);margin-left:3px;vertical-align:top}
.grn{color:var(--midori)}
.ringrow{display:flex;align-items:center;gap:16px}
.ringrow.mt2{margin-top:18px}
.rings{flex:0 0 auto}
.rings circle{fill:none;stroke-width:9}
.rings .trk{stroke:var(--bg3)}
.rings .p{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px}
.rings .p.none{opacity:.3}
.rings .r-ai{stroke:var(--ai)}.rings .r-midori{stroke:var(--midori)}.rings .r-ki{stroke:var(--ki)}
.ringlist{display:grid;gap:3px;font-size:.98rem}
.ringlist b{font-family:var(--serif);font-size:1.15rem;font-weight:800}
.ringlist .dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;margin-right:8px}
.dot.ai{background:var(--ai)}.dot.midori{background:var(--midori)}.dot.ki{background:var(--ki)}
.ringlist .okm{color:var(--midori);font-weight:700;margin-left:8px}
button.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;text-align:left;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.banner.bnew{background:var(--ki-soft);color:var(--ki)}
#sess .banner.bnew{margin:14px 0 0}
.banner.bnew .go{border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;font-size:.85rem;white-space:nowrap}
.banner.bnew:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px;margin-top:12px;align-items:start}
.bdg{display:block;background:none;border:0;padding:0;text-align:center;cursor:pointer;color:var(--ink2);font:inherit}
.medal{position:relative;width:68px;height:68px;border-radius:50%;margin:0 auto 6px;display:grid;place-content:center;border:2px dashed var(--line);background:var(--bg);line-height:1}
.medal b{font-family:var(--serif);font-weight:800;font-size:1.5rem;display:block}
.medal.sm b{font-size:1.02rem}
.medal i{font-style:normal;font-size:.62rem;font-weight:700;display:block;margin-top:3px}
.bdg.c-ai{--c:var(--ai);--cs:var(--ai-soft)}.bdg.c-midori{--c:var(--midori);--cs:var(--midori-soft)}.bdg.c-ki{--c:var(--ki);--cs:var(--ki-soft)}.bdg.c-shu{--c:var(--shu);--cs:var(--shu-soft)}
.bdg.on{color:var(--ink)}
.bdg.on .medal{border:3px solid var(--c);background:var(--cs);color:var(--c);box-shadow:inset 0 0 0 3px var(--bg)}
.bdg.shut{opacity:.55}
.bdg.sel .medal,.bdg:focus-visible .medal{outline:2px solid var(--ai);outline-offset:3px}

.medal .new{position:absolute;right:-6px;top:-4px;background:var(--shu);color:var(--shu-ink);border-radius:999px;font-size:.62rem;font-weight:700;padding:3px 5px}
.bn{display:block;font-size:.78rem;font-weight:700;line-height:1.35}
.bs{display:block;font-size:.72rem;color:var(--ink2);margin-top:1px;min-height:1em}
.bdetail{margin-top:14px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-size:.92rem;line-height:1.6}
/* ---- メダル（金属の見た目）と、もらったときの演出 ---- */
.m-ai,.bdg.c-ai{--m1:#A9C8F0;--m2:#3F72B5;--m3:#1D3F70;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.m-midori,.bdg.c-midori{--m1:#A8E0BC;--m2:#3A9462;--m3:#1C5A37;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.m-ki,.bdg.c-ki{--m1:#FFEDB0;--m2:#DDAA28;--m3:#8C6208;--mt:#3F2B00;--ms:rgba(255,255,255,.45)}
.m-shu,.bdg.c-shu{--m1:#F8B9B3;--m2:#CB463F;--m3:#7C1E19;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.bdg.on .medal{border:0;color:var(--mt);text-shadow:0 1px 1px var(--ms);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),linear-gradient(145deg,var(--m1),var(--m2) 46%,var(--m3));box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),inset 0 0 0 5px var(--m3),0 2px 5px rgba(0,0,0,.22)}
.bdg.on .medal .cnt,.bdg.on .medal .new{text-shadow:none}
.rings.flash{animation:ringpop 1.2s ease-out}
.rings.flash .p{animation:ringglow 1.2s ease-out}
@keyframes ringpop{0%{transform:scale(1)}30%{transform:scale(1.14)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes ringglow{0%,100%{stroke-width:9}30%{stroke-width:12;filter:brightness(1.35)}}
#cele{position:fixed;inset:0;z-index:50;background:rgba(9,14,26,.88);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;color:#FFFFFF;text-align:center}
#cele[hidden]{display:none}
.cele-in{position:relative;max-width:420px;width:100%}
.cele-top{font-weight:700;letter-spacing:.08em;color:#F2D58A;min-height:1.6em;margin-bottom:10px;font-size:1.05rem}
.stage{perspective:900px;display:grid;place-items:center;height:232px}
.bigm{position:relative;width:190px;height:190px;transform-style:preserve-3d;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.bigm .face,.bigm .edge{position:absolute;inset:0;border-radius:50%}
.bigm .edge{background:var(--m3)}
.bigm .face{-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-content:center;overflow:hidden;color:var(--mt);text-shadow:0 2px 1px var(--ms);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 44%),linear-gradient(145deg,var(--m1),var(--m2) 46%,var(--m3));box-shadow:inset 0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 11px var(--m3),inset 0 0 0 13px rgba(255,255,255,.28)}
.bigm .front{transform:translateZ(5px)}
.bigm .back{transform:rotateY(180deg) translateZ(5px)}
.bigm .face b,.bigm .face i,.bigm .face em{display:block;font-style:normal;line-height:1}
.bigm .front b{font-family:var(--serif);font-weight:800;font-size:4.4rem}
.bigm .front b.sm{font-size:2.6rem}
.bigm .front i{font-weight:700;font-size:1.05rem;margin-top:10px;letter-spacing:.06em}
.bigm .back i{font-size:.85rem;font-weight:700}
.bigm .back b{font-family:var(--serif);font-weight:800;font-size:1.65rem;margin-top:8px}
.bigm .back em{font-weight:700;font-size:1rem;margin-top:8px;min-height:1em}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 64%);transform:translateX(-130%);pointer-events:none}
.front.go .shine{animation:shine .9s ease-out}
@keyframes shine{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
#cele h2{font-family:var(--serif);font-size:1.6rem;font-weight:800;margin-top:12px;color:#FFFFFF}
.cele-cond{margin-top:6px;font-size:.98rem;color:#D5DCE8;line-height:1.6}
.cele-more{margin-top:6px;font-size:.92rem;color:#F2D58A;min-height:1.3em}
.cele-hint{margin-top:8px;font-size:.8rem;color:#9FAABD}
#celeBtn{margin-top:16px;min-width:190px;background:#FFFFFF;border-color:#FFFFFF;color:#1A2230}
#celeBtn:focus-visible{outline:3px solid #F2D58A;outline-offset:3px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-8vh;border-radius:2px;animation-name:conf;animation-timing-function:linear;animation-fill-mode:both}

.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid.four{grid-template-columns:repeat(4,1fr)}
.tgrid label{display:block;font-size:.82rem;color:var(--ink2);min-width:0}
.tgrid input{display:block;width:100%;min-width:0;margin-top:3px;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
#tPanel .list li{align-items:center}
/* ---- 印刷用シート（画面では重ねて表示、印刷ではシートだけ） ---- */
#sheet{display:none;position:fixed;inset:0;z-index:20;background:#fff;color:#111;overflow:auto;padding:0 0 40px}
#sheet.show{display:block}
#sheet .bar{position:sticky;top:0;background:#f3f4f6;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sheet .bar .btn{background:#fff;border-color:#bbb;color:#111;min-height:40px;padding:8px 14px}

#sheet .bar .chip{background:#fff;border-color:#bbb;color:#111}
#sheet .bar .chip.on{border-color:#22497A;background:#E3ECF7;color:#22497A}
.paper{max-width:760px;margin:0 auto;padding:24px 20px;font-family:var(--sans);font-size:13px;line-height:1.5;color:#111}

.paper .sub{font-size:12px;color:#555;margin-bottom:14px}
.paper h2{font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid #111}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper td{border-bottom:1px solid #ccc;padding:6px 4px;vertical-align:top}
.paper td.n{width:2.2em;color:#666}
.paper td.r{width:3.6em;color:#666;font-size:11px}

","a":"小野妹子","y":"おののいもこ","h":"漢字4字","x":"「日出づる処の天子」の手紙を隋の皇帝に。"},{"id":"m:15","t":"mc","q":"仏教を日本に公に伝えた朝鮮半島の国はどこですか。","o":["新羅","高句麗","百済","伽耶"],"ans":2,"x":"538年、百済から。儒教も百済から（5世紀）。"},{"id":"m:16","t":"w","q":"645年、中大兄皇子とともに蘇我氏を倒した人物の名を答えなさい。","a":"中臣鎌足","y":"なかとみのかまたり","h":"漢字4字","x":"後の藤原鎌足。藤原氏の祖。"},{"id":"m:17","t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 白村江の戦い　B 壬申の乱　C 大化の改新　D 藤原京に都が移る","o":["A→C→B→D","C→A→B→D","C→B→A→D","A→B→C→D"],"ans":1,"x":"大化の改新645→白村江663→壬申の乱672→藤原京694。"},{"id":"m:18","t":"w","q":"天武天皇のころにつくられた、日本で最初の銅銭を何といいますか。","a":"富本銭","y":"ふほんせん","h":"漢字3字","x":"和同開珎（708年・奈良時代）より古い。"}]},{"title":"3　奈良時代","qs":[{"id":"m:19","t":"w","q":"701年、唐の制度にならって定められた法令を何といいますか。","a":"大宝律令","y":"たいほうりつりょう","h":"漢字4字","x":"律＝刑罰、令＝政治のしくみ。"},{"id":"m:20","t":"mc","q":"律令の税や兵役について述べた文として正しいものを選びなさい。","o":["租は、地方の特産物を都に納める税です。","庸は、都で10日間働く代わりに布を納める税です。","調は、口分田にかけられ稲を納める税です。","防人は、1年間都の守りにつく兵士です。"],"ans":1,"x":"租＝稲、調＝特産物、庸＝布。防人は3年間九州、衛士が1年間都。"},{"id":"m:21","t":"w","q":"平城京が手本にした唐の都の名を答えなさい。","a":"長安","y":"ちょうあん","h":"漢字2字","x":"平安京も長安がモデル。碁盤の目の道路。"},{"id":"m:22","t":"mc","q":"聖武天皇について述べた次のⅠ・Ⅱの文の正誤の組み合わせとして正しいものを選びなさい。\nⅠ 国ごとに国分寺・国分尼寺を建てるよう命じました。\nⅡ 都を平城京から平安京に移しました。","o":["Ⅰ＝正・Ⅱ＝正","Ⅰ＝正・Ⅱ＝誤","Ⅰ＝誤・Ⅱ＝正","Ⅰ＝誤・Ⅱ＝誤"],"ans":1,"x":"国分寺は聖武天皇（741年）。平安京に移したのは桓武天皇（794年）なのでⅡは誤。"},{"id":"m:23","t":"w","q":"各地で仏の教えを説き、池や橋をつくり、後に東大寺の大仏づくりに協力した僧の名を答えなさい。","a":"行基","y":"ぎょうき","h":"漢字2字","x":"鑑真（唐から来た僧・唐招提寺）と混同しない。"},{"id":"m:24","t":"mc","q":"743年に出された、開墾した田を永久に自分のものにしてよいとするきまりはどれですか。","o":["三世一身の法","班田収授の法","墾田永年私財法","改新の詔"],"ans":2,"x":"743年墾田永年私財法＝永久。723年三世一身の法＝3代まで。"},{"id":"m:25","t":"w","q":"唐から来日し、日本の僧の制度を整えた鑑真が奈良に開いた寺の名を答えなさい。","a":"唐招提寺","y":"とうしょうだいじ","h":"漢字4字","x":"「唐から招いた」鑑真の寺。"},{"id":"m:26","t":"mc","q":"書物とその説明の組み合わせとして正しいものを選びなさい。","o":["『古事記』 ― 各国の産物や地名の由来をまとめた","『風土記』 ― 720年に完成した歴史書","『万葉集』 ― 現存する日本最古の和歌集","『日本書紀』 ― 712年に完成した歴史書"],"ans":2,"x":"古事記712（歴史）、風土記713（産物・地名）、日本書紀720（歴史）、万葉集（和歌）。"},{"id":"m:27","t":"w","q":"正倉院の建物に用いられている、三角柱の木材を組んで壁をつくる建築様式を何といいますか。","a":"校倉造","y":"あぜくらづくり","h":"漢字3字","x":"寝殿造（貴族の屋敷・平安時代）と区別。"}]},{"title":"4　平安時代","qs":[{"id":"m:28","t":"w","q":"794年、都を平安京に移した天皇の名を答えなさい。","a":"桓武天皇","y":"かんむてんのう","h":"漢字4字","x":"784年長岡京、794年平安京。"},{"id":"m:29","t":"mc","q":"桓武天皇の政治について述べた文として正しくないものを選びなさい。","o":["国司に対する監督をきびしくしました。","農民の兵役をやめ、負担を軽くしました。","坂上田村麻呂を征夷大将軍に任命しました。","菅原道真の提案で遣唐使を停止しました。"],"ans":3,"x":"遣唐使の停止は894年、菅原道真の提案。桓武天皇（8世紀末）より約100年後。"},{"id":"m:30","t":"w","q":"894年、遣唐使の停止を提案した人物の名を答えなさい。","a":"菅原道真","y":"すがわらのみちざね","h":"漢字4字","x":"後に大宰府に流され、「学問の神様」に。"},{"id":"m:31","t":"mc","q":"天皇が成人した後に、天皇をたすけて政治を行う役職を何といいますか。","o":["摂政","関白","太政大臣","征夷大将軍"],"ans":1,"x":"幼いとき＝摂政、成人後＝関白。"},{"id":"m:32","t":"w","q":"「この世をば わが世とぞ思ふ 望月の かけたることも なしと思へば」とよんだ人物の名を答えなさい。","a":"藤原道長","y":"ふじわらのみちなが","h":"漢字4字","x":"「望月の歌」。藤原氏の全盛期。"},{"id":"m:33","t":"mc","q":"939年、関東地方で反乱を起こした人物と、瀬戸内海で反乱を起こした人物の組み合わせとして正しいものを選びなさい。","o":["平将門 ― 藤原純友","藤原純友 ― 平将門","源義家 ― 平将門","平将門 ― 源義家"],"ans":0,"x":"関東＝平将門（下総）、瀬戸内海＝藤原純友（伊予）。源義家は11世紀の東北。"},{"id":"m:34","t":"w","q":"1086年、白河上皇が始めた、上皇が院で行う政治を何といいますか。","a":"院政","y":"いんせい","h":"漢字2字","x":"摂関政治→院政→平氏の政治の順。"},{"id":"m:35","t":"mc","q":"平清盛について述べた文として正しいものを選びなさい。","o":["保元の乱で源義朝に敗れました。","武士として初めて征夷大将軍になりました。","大輪田泊を整え、日宋貿易をさかんにしました。","平泉を中心に約100年間栄えました。"],"ans":2,"x":"清盛は平治の乱で義朝に勝った。役職は太政大臣（征夷大将軍ではない）。平泉は奥州藤原氏。"},{"id":"m:36","t":"w","q":"最澄が比叡山に建てた寺の名を答えなさい。","a":"延暦寺","y":"えんりゃくじ","h":"漢字3字","x":"滋賀県。空海は高野山金剛峯寺（和歌山県）。"},{"id":"m:37","t":"mc","q":"作者と作品の組み合わせとして正しいものを選びなさい。","o":["清少納言 ― 『源氏物語』","紫式部 ― 『枕草子』","紀貫之 ― 『土佐日記』","清少納言 ― 『竹取物語』"],"ans":2,"x":"紀貫之＝土佐日記・古今和歌集。紫式部＝源氏物語、清少納言＝枕草子。竹取物語の作者は不明。"},{"id":"m:38","t":"w","q":"平安時代の貴族の屋敷のつくりを何といいますか。","a":"寝殿造","y":"しんでんづくり","h":"漢字3字","x":"渡り廊下で建物をつなぐ。"},{"id":"m:39","t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 院政が始まる　B 保元の乱　C 藤原道長が摂政になる　D 平清盛が太政大臣になる","o":["C→A→B→D","A→C→B→D","C→B→A→D","A→B→C→D"],"ans":0,"x":"道長摂政1016→院政1086→保元1156→清盛太政大臣1167。"},{"id":"m:40","t":"w","q":"荘園に認められた、朝廷に税を納めなくてもよい権利を何といいますか。","a":"不輸の権","y":"ふゆのけん","h":"漢字2字＋の権","x":"不入の権は役人の立ち入りを断る権利。"}]}]},{"id":"c2","title":"第6〜9回","doneId":"mock:done:c2","cycle":2,"note":"いまは第6回の分だけ。第7〜9回の問題が入ると、ここに足される。","sections":[{"title":"第6回　鎌倉時代","qs":[{"t":"mc","q":"1185年、源頼朝が国ごとに置いた、軍事・警察の仕事をする役職はどれですか。","o":["地頭","守護","執権","国司"],"ans":1,"x":"守護＝国ごと。地頭＝荘園ごとで、土地の管理と年貢の取り立て。","id":"m:c2-6-01"},{"t":"w","q":"将軍が御家人の領地を認めたり、手柄に応じて新しい領地をあたえたりすることを何といいますか。","a":"御恩","y":"ごおん","h":"漢字2字","x":"将軍→御家人が御恩、御家人→将軍が奉公。この関係が封建制度。","id":"m:c2-6-02"},{"t":"mc","q":"鎌倉幕府のしくみについて述べた文として正しいものを選びなさい。","o":["侍所は、裁判を担当しました。","問注所は、御家人の取りしまりを担当しました。","政所は、政治一般を担当しました。","六波羅探題は、鎌倉に置かれました。"],"ans":2,"x":"侍所＝御家人の取りしまりと軍事、政所＝政治一般、問注所＝裁判。六波羅探題は京都。","id":"m:c2-6-03"},{"t":"w","q":"1221年、後鳥羽上皇が幕府をたおそうとして敗れた戦いを何といいますか。","a":"承久の乱","y":"じょうきゅうのらん","h":"漢字2字＋の乱","x":"源氏の将軍が3代で絶えたのをきっかけに起こった。上皇は隠岐に流された。","id":"m:c2-6-04"},{"t":"mc","q":"人物とできごとの組み合わせとして正しいものを選びなさい。","o":["北条義時 ― 御成敗式目","北条泰時 ― 承久の乱","北条時宗 ― 元寇","北条政子 ― 永仁の徳政令"],"ans":2,"x":"義時＝承久の乱（1221年）、泰時＝御成敗式目（1232年）、時宗＝元寇（1274年・1281年）。","id":"m:c2-6-05"},{"t":"w","q":"承久の乱の後、朝廷の監視と西国の御家人の取りしまりのために、京都に置かれた役所を何といいますか。","a":"六波羅探題","y":"ろくはらたんだい","h":"漢字5字","x":"これで幕府の支配が全国におよぶようになった。","id":"m:c2-6-06"},{"t":"mc","q":"元寇について述べた文として正しくないものを選びなさい。","o":["1回目の襲来を文永の役、2回目を弘安の役といいます。","元軍は、集団戦法と火薬を使った兵器で日本の武士を苦しめました。","元寇の後、御家人は十分な領地をほうびとしてあたえられました。","文永の役の後、博多湾の沿岸に石塁が築かれました。"],"ans":2,"x":"新しい土地を得た戦いではなかったので、十分なほうびが出せず、御家人の不満が高まった。","id":"m:c2-6-07"},{"t":"w","q":"稲をかりとった後に麦をつくるように、同じ田畑で1年に2種類の作物をつくることを何といいますか。","a":"二毛作","y":"にもうさく","h":"漢字3字","x":"鎌倉時代に西日本で広まった。同じ作物を年2回つくる二期作と区別する。","id":"m:c2-6-08"},{"t":"mc","q":"鎌倉時代の仏教について、開いた人物と宗派の組み合わせとして正しいものを選びなさい。","o":["法然 ― 浄土真宗","親鸞 ― 浄土宗","日蓮 ― 時宗","道元 ― 曹洞宗"],"ans":3,"x":"法然＝浄土宗、親鸞＝浄土真宗、一遍＝時宗、日蓮＝日蓮宗、栄西＝臨済宗、道元＝曹洞宗。","id":"m:c2-6-09"},{"t":"w","q":"琵琶法師によって語り伝えられた、平氏の盛衰をえがいた軍記物を何といいますか。","a":"平家物語","y":"へいけものがたり","h":"漢字4字","x":"語りで伝えたので、文字を読めない人にも親しまれた。","id":"m:c2-6-10"},{"t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 承久の乱　B 御成敗式目が定められる　C 守護・地頭が置かれる　D 文永の役","o":["C→A→B→D","A→C→B→D","C→B→A→D","A→B→C→D"],"ans":0,"x":"守護・地頭1185年→承久の乱1221年→御成敗式目1232年→文永の役1274年。","id":"m:c2-6-11"},{"t":"w","q":"東大寺南大門にある、運慶・快慶らがつくった彫刻を何といいますか。","a":"金剛力士像","y":"こんごうりきしぞう","h":"漢字5字","x":"力強く写実的な、鎌倉文化を代表する彫刻。","id":"m:c2-6-12"}]}]}],"tests":[{"date":"2026-11-08","name":"組分けテスト","cycle":2,"rounds":[6,7,8,9]},{"date":"2026-12-13","name":"組分けテスト","cycle":3,"rounds":[11,12,13,14]},{"date":"2027-01-11","name":"志望校判定テスト","cycle":0},{"date":"2027-01-24","name":"組分けテスト","cycle":4,"rounds":[16,17,18]}],"items":[{"id":"s5b01-001","u":"s5b01","q":"数万年前、日本列島が大陸と陸続きだったころ、ナウマン象などの化石が発掘された長野県の湖","a":"野尻湖","y":"のじりこ","k":"kanji","e":"長野県。ナウマン象やオオツノジカの化石が見つかった。旧石器時代は日本が大陸と陸続きで、象が歩いて来られた。"},{"id":"s5b01-002","u":"s5b01","q":"石を打ち欠いただけの、旧石器時代の道具","a":"打製石器","y":"だせいせっき","k":"kanji","e":"「打」＝打ち欠く。石をたたいて割っただけの石器。みがいた磨製石器（縄文時代）と区別する。"},{"id":"s5b01-003","u":"s5b01","q":"1946年、相沢忠洋が打製石器を発見し、日本にも旧石器時代があったことを明らかにした群馬県の遺跡","a":"岩宿","y":"いわじゅく","s":"遺跡","k":"kanji","e":"相沢忠洋が関東ローム層から黒曜石の打製石器を見つけた。これで「日本にも旧石器時代があった」とわかった。「岩宿＝群馬」をセットで。"},{"id":"s5b01-004","u":"s5b01","q":"岩宿遺跡がある都道府県","a":"群馬県","y":"ぐんまけん","k":"kanji","e":"岩宿遺跡は群馬県みどり市。長野県（野尻湖）と混同しやすい。"},{"id":"s5b01-005","u":"s5b01","q":"旧石器時代の人々は、狩りや木の実の採集をしながらどのようにくらしていたか","a":"移住しながらくらしていた","k":"free","e":"食べ物をさがして移動する生活。定住が始まるのは縄文時代（竪穴住居）から。"},{"id":"s5b01-006","u":"s5b01","q":"約1万年前、地球の気候があたたかくなり、氷河がとけて起こったこと","a":"海面が上昇し、今のような日本列島ができた","k":"free","e":"氷河がとけて海面が上がり、大陸とはなれて島になった。これが縄文時代の始まりごろ。"},{"id":"s5b01-007","u":"s5b01","q":"縄目の文様がつけられた土器","a":"縄文土器","y":"じょうもんどき","k":"kanji","e":"縄をころがした文様がある。厚くてもろい。土器で煮たきができ、どんぐりなども食べられるようになった。"},{"id":"s5b01-008","u":"s5b01","q":"縄文時代はどのくらい続いたか","a":"1万年以上","k":"free","e":"約1万数千年前から紀元前4世紀ごろまで。旧石器時代は「数万年前」、縄文時代は「約1万年」と桁で覚える。"},{"id":"s5b01-009","u":"s5b01","q":"地面を掘り下げて柱を立て、屋根をかけた縄文時代の住居","a":"竪穴住居","y":"たてあなじゅうきょ","k":"kanji","e":"地面を掘り下げ（＝竪穴）、柱を立てて草の屋根をかける。縄文時代に始まり、奈良時代の農民もまだ住んでいた。"},{"id":"s5b01-010","u":"s5b01","q":"石をみがいてつくった石器","a":"磨製石器","y":"ませいせっき","k":"kanji","e":"「磨」＝みがく。石をみがいて形を整えた。縄文時代から。旧石器時代の打製石器とセットで区別。"},{"id":"s5b01-011","u":"s5b01","q":"動物の骨や角でつくった、つりばりなどの道具","a":"骨角器","y":"こっかくき","k":"kanji","e":"動物の骨や角でつくったつりばりや矢じり。「骨」と「角」の字を思い出せば書ける。"},{"id":"s5b01-012","u":"s5b01","q":"たくさんの貝がらが積み上げられた縄文時代の遺跡","a":"貝塚","y":"かいづか","k":"kanji","n":"全国に約3000か所","e":"貝がらのごみ捨て場。骨や土器も出てきて当時のくらしがわかる。内陸で見つかるのは、当時の海面が今より高かったから（当時の海岸線がわかる）。"},{"id":"s5b01-013","u":"s5b01","q":"明治時代にアメリカ人のモースが発見した東京都の貝塚","a":"大森貝塚","y":"おおもりかいづか","k":"kanji","e":"東京都。モースが列車の窓から見つけた。「大森＝モース＝東京」をセットで。"},{"id":"s5b01-014","u":"s5b01","q":"大森貝塚を発見したアメリカ人","a":"モース","k":"kana","e":"アメリカ人の動物学者。大森貝塚の発掘が日本の考古学の手本になった。"},{"id":"s5b01-015","u":"s5b01","q":"魔よけや安産・豊かな収穫を祈るためにつくられた、おもに女性をかたどった土の人形","a":"土偶","y":"どぐう","k":"kanji","e":"縄文時代。おもに女性の形で、魔よけ・安産・豊作を祈った。古墳時代の埴輪と混同しやすい。土偶＝縄文、埴輪＝古墳。"},{"id":"s5b01-016","u":"s5b01","q":"青森市にある、最大500人をこえる人がくらした縄文時代の大規模な集落跡","a":"三内丸山","y":"さんないまるやま","s":"遺跡","k":"kanji","n":"約1500年間続いた。世界文化遺産","e":"青森県。遠くの黒曜石やひすいも出土し、遠い地域と交流していたことがわかる。"},{"id":"s5b01-017","u":"s5b01","q":"縄文時代、足りないものをおぎなった交換の方法","a":"物々交換","y":"ぶつぶつこうかん","k":"kanji","e":"お金がない時代、品物と品物をとりかえた。黒曜石やひすいが遠くまで運ばれたのはこのため。"},{"id":"s5b01-018","u":"s5b01","q":"縄文時代の社会にほとんどなかったもの（住居や墓に差がないことからわかる）","a":"貧富の差・身分のちがい","k":"free","e":"住居の大きさや墓に差がないから。差が生まれるのは弥生時代に稲作が始まってから。"},{"id":"s5b01-019","u":"s5b01","q":"縄文時代の終わりごろ、中国や朝鮮半島から伝わった2つのもの","a":"稲作と金属器（鉄器・青銅器）","k":"free","e":"九州北部に伝わった。弥生時代の2大特色。"},{"id":"s5b01-020","u":"s5b01","q":"縄文土器と比べた弥生土器の特徴","a":"うすくてかたく、文様が少ない","k":"free","n":"東京都文京区弥生で初めて発見","e":"縄文土器は厚くてもろい、弥生土器はうすくてかたい。"},{"id":"s5b01-021","u":"s5b01","q":"弥生時代は紀元前4世紀ごろから紀元後3世紀ごろまで、約何年間続いたか","a":"約700年間","k":"free","e":"紀元前4世紀（前400〜前301年）から紀元後3世紀（201〜300年）まで。紀元前と後をまたぐので約700年。"},{"id":"s5b01-022","u":"s5b01","q":"稲作が紀元前2世紀ごろに達した、本州北端の県","a":"青森県","y":"あおもりけん","k":"kanji","e":"稲作は九州北部から始まり、本州の北のはしまで広がった。"},{"id":"s5b01-023","u":"s5b01","q":"弥生時代に、まだ稲作が行われていなかった2つの地域","a":"北海道と沖縄","k":"free","e":"寒い北海道と、暑い沖縄には広まらず、狩りや漁の生活が続いた。"},{"id":"s5b01-024","u":"s5b01","q":"田を耕すために使った木製の農具（2つ）","a":"すき・くわ","k":"free","e":"木でつくった。すきは土を掘り起こす、くわは土をたがやす。鉄の農具が広まるのは古墳時代（渡来人）。"},{"id":"s5b01-025","u":"s5b01","q":"ぬかるんだ田で足がしずまないようにはいたもの","a":"田げた","k":"free","e":"大きな板を足にひもでくくりつけた。"},{"id":"s5b01-026","u":"s5b01","q":"稲の穂をつみとるために使われた石器","a":"石包丁","y":"いしぼうちょう","k":"kanji","e":"稲の穂だけをつみとる石の道具。穴にひもを通して指にかけた。「稲刈り＝石包丁」。"},{"id":"s5b01-027","u":"s5b01","q":"収穫した稲をたくわえた、ねずみ返しのある建物","a":"高床倉庫","y":"たかゆかそうこ","k":"kanji","e":"床を高くして湿気とねずみを防ぐ。柱についた板が「ねずみ返し」。"},{"id":"s5b01-028","u":"s5b01","q":"収穫した稲の脱穀に使った木の道具（2つ）","a":"うすときね","k":"free","e":"うすに入れた稲をきねでついて、もみがらを取る＝脱穀。"},{"id":"s5b01-029","u":"s5b01","q":"弥生時代、武器や工具（木の農具をつくる道具）として使われた金属器","a":"鉄器","y":"てっき","k":"kanji","e":"じょうぶで武器や工具に使った。数が少なく貴重で、石器もまだ使われた。祭りに使う青銅器と役割を分けて覚える。"},{"id":"s5b01-030","u":"s5b01","q":"銅剣・銅鉾・銅鐸・銅鏡などの青銅器は、おもに何として使われたか","a":"祭器（豊作などを神々に祈る道具）","k":"free","e":"青銅はやわらかいので実用の武器に向かず、祭りの道具になった。"},{"id":"s5b01-031","u":"s5b01","q":"人々の生活のようすが描かれたものもある、つりがね形の青銅器","a":"銅鐸","y":"どうたく","k":"kanji","e":"表面に狩りや脱穀の絵が描かれたものがあり、当時のようすがわかる。"},{"id":"s5b01-032","u":"s5b01","q":"福岡県にある、弥生時代の集落や水田のあとが残る遺跡","a":"板付","y":"いたづけ","s":"遺跡","k":"kanji","e":"福岡県。日本最古級の水田あと。稲作が九州北部から広まった証拠。"},{"id":"s5b01-033","u":"s5b01","q":"静岡市にある、弥生時代の水田のあとが残る遺跡","a":"登呂","y":"とろ","s":"遺跡","k":"kanji","e":"静岡県静岡市。水田・住居・高床倉庫のあとが残る。"},{"id":"s5b01-034","u":"s5b01","q":"敵の侵入に備えて、まわりに濠をめぐらせた集落","a":"環濠集落","y":"かんごうしゅうらく","k":"kanji","e":"「濠」＝ほり。戦いに備えて村のまわりに濠をめぐらせた。稲作が広まって争いが起きた証拠。"},{"id":"s5b01-035","u":"s5b01","q":"佐賀県にある、日本最大級の環濠集落の遺跡","a":"吉野ヶ里","y":"よしのがり","s":"遺跡","k":"kanji","n":"2重の濠。かめ棺が3000以上","e":"佐賀県。物見やぐらや大きな建物のあともあり、「くに」の中心だったと考えられる。"},{"id":"s5b01-036","u":"s5b01","q":"稲作が広まると、人々の間に生まれたもの","a":"貧富の差・身分の差","k":"free","e":"米のたくわえの多い少ないで差がつき、指導者（王）が現れた。"},{"id":"s5b01-037","u":"s5b01","q":"弥生時代に争いが起きた原因","a":"土地や水、たくわえた米をめぐって","k":"free","e":"稲作に必要な土地や水、たくわえた米をめぐる争い。だから環濠集落や大きなやじり（武器）が生まれた。"},{"id":"s5b01-038","u":"s5b01","q":"縄文時代と比べた、弥生時代のやじりの特徴","a":"大きくて重い（戦いの武器になった）","k":"free","e":"縄文のやじりは小さく軽い（狩り用）。弥生後半は大きく重い（人との戦い用）。矢が狩りの道具から戦いの武器に変わった。"},{"id":"s5b01-039","u":"s5b01","q":"有力なむらの指導者がいくつかのむらをまとめ、小さなくにをつくった。その指導者は何とよばれたか","a":"王","y":"おう","k":"kanji","e":"むら→くに。指導者が「王」になり、古墳時代には「豪族」とよばれる。"},{"id":"s5b01-040","u":"s5b01","q":"紀元前1世紀ごろ、倭は100あまりの小国に分かれていたと記した中国の歴史書","a":"『漢書』地理志","y":"かんじょちりし","k":"kanji","e":"「紀元前1世紀・100あまりの小国・楽浪郡」がキーワード。"},{"id":"s5b01-041","u":"s5b01","q":"1世紀の中ごろ、倭の奴国の王の使いに漢の皇帝が金印を授けたと記した歴史書","a":"『後漢書』東夷伝","y":"ごかんじょとういでん","k":"kanji","e":"「1世紀半ば・奴国・金印」がキーワード。"},{"id":"s5b01-042","u":"s5b01","q":"金印にきざまれた5つの文字","a":"漢委奴国王","y":"かんのわのなのこくおう","k":"kanji","e":"「委」は倭（わ）と同じ。5字とも書けるように。"},{"id":"s5b01-043","u":"s5b01","q":"金印が江戸時代（18世紀の終わりごろ）に発見された福岡県の島","a":"志賀島","y":"しかのしま","k":"kanji","e":"福岡県の博多湾にある島。江戸時代に農民が見つけた。奴国は福岡市あたり。"},{"id":"s5b01-044","u":"s5b01","q":"奴国があったと考えられる現在の場所","a":"福岡市のあたり","k":"free","e":"金印が出た志賀島も福岡県。"},{"id":"s5b01-045","u":"s5b01","q":"3世紀、邪馬台国の女王が30あまりの小国を従えていたと記した歴史書","a":"『魏志』倭人伝","y":"ぎしわじんでん","k":"kanji","e":"「3世紀・邪馬台国・卑弥呼・30あまりの国」がキーワード。魏は三国時代の国。"},{"id":"s5b01-046","u":"s5b01","q":"邪馬台国の女王","a":"卑弥呼","y":"ひみこ","k":"kanji","e":"魏に使いを送り「親魏倭王」の称号と銅鏡をもらった。"},{"id":"s5b01-047","u":"s5b01","q":"卑弥呼が魏の皇帝から授けられた称号","a":"親魏倭王","y":"しんぎわおう","k":"kanji","n":"銅鏡も授けられた","e":"「魏と親しい倭の王」という意味の称号。金印ではなく「称号と銅鏡」。奴国の金印と混同しない。"},{"id":"s5b01-048","u":"s5b01","q":"卑弥呼が国を治めた方法","a":"まじない","k":"free","e":"神につかえ、まじないで人々を治め、弟が政治を助けた。"},{"id":"s5b01-049","u":"s5b01","q":"邪馬台国の位置についての2つの説","a":"九州北部説と大和（奈良県）説","k":"free","e":"まだ決まっていない。"},{"id":"s5b02-001","u":"s5b02","q":"3世紀後半〜7世紀ごろ、大王や豪族がつくった大きな墓","a":"古墳","y":"こふん","k":"kanji","e":"土を高くもり上げた墓。大きさで力の強さを示した。"},{"id":"s5b02-002","u":"s5b02","q":"四角形と円形を組み合わせた形の古墳","a":"前方後円墳","y":"ぜんぽうこうえんふん","k":"kanji","n":"「漢字4字」と聞かれたら前方後円","e":"「前が四角（方）、後ろが円」という形。かぎ穴の形。"},{"id":"s5b02-003","u":"s5b02","q":"大阪府堺市にある日本最大の古墳","a":"大仙古墳","y":"だいせんこふん","k":"kanji","alt":["仁徳陵古墳"],"e":"全長486mで日本最大。仁徳天皇の墓とされ「仁徳陵古墳」ともいう。"},{"id":"s5b02-004","u":"s5b02","q":"古墳の斜面に、もり土がくずれないようにしきつめられた石","a":"ふき石","k":"free","e":"できた当時の古墳は石で白く見えた。"},{"id":"s5b02-005","u":"s5b02","q":"古墳のまわりや頂上に置かれた素焼きの土製品","a":"埴輪","y":"はにわ","k":"kanji","e":"円筒形や人・馬・家の形。埴輪＝古墳時代、土偶＝縄文時代。"},{"id":"s5b02-006","u":"s5b02","q":"古墳の内部に納められた鏡・玉・剣などを何というか","a":"副葬品","y":"ふくそうひん","k":"kanji","e":"死者といっしょに納めた品。はじめは鏡・玉・剣、後には武器や馬具。"},{"id":"s5b02-007","u":"s5b02","q":"3世紀中ごろ〜4世紀、大和地方（奈良県北部）の豪族が中心となってつくった政権","a":"ヤマト政権","k":"free","alt":["大和政権"],"e":"豪族の連合政権。中心は大王（おおきみ）。"},{"id":"s5b02-008","u":"s5b02","q":"ヤマト政権の支配者のよび名（後の天皇）","a":"大王","y":"おおきみ","k":"kanji","e":"「おおきみ」と読む。後の天皇。"},{"id":"s5b02-009","u":"s5b02","q":"ワカタケル大王の名がきざまれた鉄剣が出土した埼玉県の古墳","a":"稲荷山","y":"いなりやま","s":"古墳","k":"kanji","e":"埼玉県は「鉄剣」。熊本県の江田船山古墳は「鉄刀」。埼玉＝剣、熊本＝刀。"},{"id":"s5b02-010","u":"s5b02","q":"ワカタケル大王の名がきざまれた鉄刀が出土した熊本県の古墳","a":"江田船山","y":"えたふなやま","s":"古墳","k":"kanji","e":"熊本県。関東（埼玉）と九州（熊本）の両方に同じ大王の名があるので、支配が広い範囲におよんだとわかる。"},{"id":"s5b02-011","u":"s5b02","q":"ワカタケル大王は、中国の歴史書にある倭の五王のうちだれにあたるか","a":"武","y":"ぶ","k":"kanji","n":"雄略天皇にあたる","e":"倭の五王の最後の王。中国（宋）に手紙を送った。"},{"id":"s5b02-012","u":"s5b02","q":"稲荷山古墳と江田船山古墳の鉄剣・鉄刀からわかること","a":"5世紀後半、ヤマト政権の支配が九州中部から関東地方までおよんでいた","k":"free","e":"埼玉と熊本の両方から同じ大王の名が出た＝広い範囲を従えていた。記述でよく出る。"},{"id":"s5b02-013","u":"s5b02","q":"豪族たちがそれぞれつくっていた集団","a":"氏","y":"うじ","k":"kanji","e":"「うじ」と読む。豪族の一族。蘇我氏・物部氏など。"},{"id":"s5b02-014","u":"s5b02","q":"大王が氏の家柄に応じてあたえた、臣・連などの地位","a":"姓","y":"かばね","k":"kanji","e":"「かばね」と読む。臣（おみ）・連（むらじ）など。"},{"id":"s5b02-015","u":"s5b02","q":"氏と姓によって豪族を政治に参加させたしくみ","a":"氏姓制度","y":"しせいせいど","k":"kanji","e":"氏（一族）と姓（地位）で豪族をまとめた。"},{"id":"s5b02-016","u":"s5b02","q":"中国や朝鮮半島から日本に渡ってきた人々","a":"渡来人","y":"とらいじん","k":"kanji","e":"土木・鉄製農具・須恵器・機織り・漢字・儒教・仏教を伝えた。"},{"id":"s5b02-017","u":"s5b02","q":"渡来人がのぼりがまで高温で焼いた、かたくてこわれにくい土器","a":"須恵器","y":"すえき","k":"kanji","e":"のぼりがまで高温で焼く、かたくて水もれしない灰色の土器。"},{"id":"s5b02-018","u":"s5b02","q":"渡来人が伝えた、生糸を原料に機で絹織物をつくる技術","a":"機織り","y":"はたおり","k":"free","e":"生糸（きいと）はカイコのまゆからとる。"},{"id":"s5b02-019","u":"s5b02","q":"渡来人が伝えた技術（土器・絹織物のほかに2つ）","a":"土木工事（古墳・ため池・用水路）と鉄製の農具","k":"free","e":"渡来人の技術は4つ：①土木工事 ②鉄製 岐（島根県）に流された。『新古今和歌集』をつくらせた人でもある。"},{"id":"s5b06-024","u":"s5b06","q":"1221年、後鳥羽上皇が幕府をたおそうとして敗れた戦い","a":"承久","y":"じょうきゅう","k":"kanji","e":"源氏の将軍が絶えたのをきっかけに起こった。幕府が勝ち、支配が全国に広がった。","s":"の乱"},{"id":"s5b06-025","u":"s5b06","q":"承久の乱のときの執権","a":"北条義時","y":"ほうじょうよしとき","k":"kanji","e":"義時＝承久の乱（1221年）、泰時＝御成敗式目（1232年）、時宗＝元寇。3人の執権を区別する。"},{"id":"s5b06-026","u":"s5b06","q":"承久の乱の後、後鳥羽上皇が流された場所","a":"隠岐","y":"おき","k":"kanji","e":"現在の島根県の島。"},{"id":"s5b06-027","u":"s5b06","q":"承久の乱の後、朝廷の監視と西国の御家人の取りしまりのために京都に置かれた役所","a":"六波羅探題","y":"ろくはらたんだい","k":"kanji","e":"「京都」「朝廷の監視」がキーワード。"},{"id":"s5b06-028","u":"s5b06","q":"承久の乱の後、幕府の支配はどのように変わったか","a":"上皇方の領地を取りあげて新たに地頭を置き、幕府の支配が西国をふくむ全国におよぶようになった","k":"free","e":"六波羅探題を置いたこととあわせて答えられるようにする。記述でねらわれやすい。"},{"id":"s5b06-029","u":"s5b06","q":"1232年に定められた、武士がつくった最初の法律","a":"御成敗式目","y":"ごせいばいしきもく","k":"kanji","e":"武家社会のしきたりをもとにつくられ、政治や裁判のよりどころになった。後の武家法の手本。","alt":["貞永式目"]},{"id":"s5b06-030","u":"s5b06","q":"御成敗式目を定めた執権","a":"北条泰時","y":"ほうじょうやすとき","k":"kanji","e":"承久の乱の後、地頭と荘園領主の土地をめぐる争いが増えたことから定めた。"},{"id":"s5b06-031","u":"s5b06","q":"13世紀の初め、遊牧民の部族をまとめてモンゴル帝国をつくった人物","a":"チンギス＝ハン","k":"kana","e":"子孫が領土を広げ、ユーラシア大陸の東西にまたがる大帝国になった。フビライはその孫。"},{"id":"s5b06-032","u":"s5b06","q":"チンギス＝ハンの孫で、中国を支配し、日本に従うように求めた皇帝","a":"フビライ＝ハン","k":"kana","e":"国名を元とした。日本にたびたび使いを送ったが、執権の北条時宗は求めに応じなかった。"},{"id":"s5b06-033","u":"s5b06","q":"フビライ＝ハンが、モンゴル高原から中国にかけての地域につけた国名","a":"元","y":"げん","k":"kanji","e":"1271年。フビライの死後におとろえ、14世紀後半には中国で明が成立した。"},{"id":"s5b06-034","u":"s5b06","q":"元に従えられ、元寇のときに兵を出した朝鮮半島の王朝","a":"高麗","y":"こうらい","k":"kanji","e":"新羅の後、10世紀前半に朝鮮半島を統一した。約30年モンゴル軍に抵抗したが、元に降伏した。"},{"id":"s5b06-035","u":"s5b06","q":"元の求めに応じなかった、元寇のときの執権","a":"北条時宗","y":"ほうじょうときむね","k":"kanji","e":"文永の役・弘安の役の2度とも時宗が執権。"},{"id":"s5b06-036","u":"s5b06","q":"1274年、元軍が博多湾沿岸に攻めてきた戦い","a":"文永","y":"ぶんえい","k":"kanji","e":"約3万の元軍。日本の武士は集団戦法と火薬の兵器に苦戦した。1回目＝文永、2回目＝弘安。","s":"の役"},{"id":"s5b06-037","u":"s5b06","q":"1281年、元軍が再び九州北部に攻めてきた戦い","a":"弘安","y":"こうあん","k":"kanji","e":"約14万の大軍。石塁と武士の抵抗で上陸できず、暴風雨にあって引きあげた。","s":"の役"},{"id":"s5b06-038","u":"s5b06","q":"2度にわたる元軍の襲来をまとめて何というか","a":"元寇","y":"げんこう","k":"kanji","e":"「寇」は外から攻めてくる敵の意味。当時は「蒙古襲来」とよんだ。","alt":["蒙古襲来"]},{"id":"s5b06-039","u":"s5b06","q":"文永の役で、日本の武士が苦戦した元軍の戦い方と兵器は何か","a":"集団戦法と、火薬を使った兵器（てつはう）","k":"free","e":"日本の武士は一騎うちが中心だった。『蒙古襲来絵詞』（竹崎季長）に戦いのようすがえがかれている。"},{"id":"s5b06-040","u":"s5b06","q":"文永の役の後、元の襲来に備えて博多湾沿岸に築かれた石垣","a":"石塁","y":"せきるい","k":"kanji","e":"弘安の役では、この石塁にはばまれて元軍は上陸できなかった。今も福岡県に残る。","alt":["防塁"]},{"id":"s5b06-041","u":"s5b06","q":"元軍が攻めてきた、九州北部の湾","a":"博多","y":"はかた","k":"kanji","e":"現在の福岡県。地図で場所を確かめておく。","s":"湾"},{"id":"s5b06-042","u":"s5b06","q":"元寇の後、御家人が幕府に不満をもつようになったのはなぜか","a":"新しい土地を得た戦いではなかったので、十分なほうび（領地）をもらえなかったから","k":"free","e":"御恩（領地）と奉公（戦い）のつりあいがくずれた。多くの費用を使い、命がけで戦ったのにほうびがなかった。"},{"id":"s5b06-043","u":"s5b06","q":"生活に苦しむ御家人を救うために幕府が出した、借金の取り消しを命じる法令","a":"徳政令","y":"とくせいれい","k":"kanji","e":"1297年の永仁の徳政令が最初。効果はあがらず、かえって幕府は信用を失った。"},{"id":"s5b06-044","u":"s5b06","q":"フビライに仕え、日本を「ジパング」としてヨーロッパに紹介したイタリアの商人","a":"マルコ＝ポーロ","k":"kana","e":"見聞きしたことを『世界の記述（東方見聞録）』に残した。"},{"id":"s5b06-045","u":"s5b06","q":"鎌倉時代の農民が苦しんだ「2重の負担」とは何か","a":"荘園領主と地頭の両方から、税や労働を課されたこと","k":"free","e":"地頭の乱暴を荘園領主にうったえたり、村からいっせいに逃げたりして抵抗する農民もいた。"},{"id":"s5b06-046","u":"s5b06","q":"稲をかりとった後に麦をつくるように、同じ田畑で1年に2種類の作物をつくること","a":"二毛作","y":"にもうさく","k":"kanji","e":"鎌倉時代に西日本で広まった。同じ作物を年2回つくる二期作と区別する。"},{"id":"s5b06-047","u":"s5b06","q":"鎌倉時代に進んだ農業の技術を2つ答えなさい","a":"牛や馬を使って耕すこと、草や木の灰を肥料にすること","k":"free","e":"西日本ではおもに牛、東日本では馬を使った。生産が高まり、定期市が開かれるもとになった。"},{"id":"s5b06-048","u":"s5b06","q":"交通の便のよいところなどで、月に3回、決まった日に開かれた市","a":"定期市","y":"ていきいち","k":"kanji","e":"四日市・五日市などの地名は、定期市がたった日に由来する。"},{"id":"s5b06-049","u":"s5b06","q":"年貢などを保管したり運んだりした運送業者","a":"問","y":"とい","k":"kanji","e":"問丸ともいう。交通の便のよい港などに現れた。","alt":["問丸"]},{"id":"s5b06-050","u":"s5b06","q":"商工業者がつくった同業者の組合","a":"座","y":"ざ","k":"kanji","e":"営業を独占しようとした。"},{"id":"s5b06-051","u":"s5b06","q":"定期市の取り引きで使われた、中国から輸入された銅銭","a":"宋銭","y":"そうせん","k":"kanji","e":"朝廷も鎌倉幕府もお金を発行しなかったので、日宋貿易で入ってきた宋のお金を使った。"},{"id":"s5b06-052","u":"s5b06","q":"「南無阿弥陀仏」ととなえれば極楽に生まれ変われると説いた、浄土宗の開祖","a":"法然","y":"ほうねん","k":"kanji","e":"浄土宗＝法然、浄土真宗＝親鸞（法然の弟子）。"},{"id":"s5b06-053","u":"s5b06","q":"阿弥陀仏を信じさえすれば救われ、悪人にこそ救われる道があると説いた僧","a":"親鸞","y":"しんらん","k":"kanji","e":"法然の弟子。「鸞」は字がむずかしいので、何度も書いて覚える。"},{"id":"s5b06-054","u":"s5b06","q":"親鸞が開いた仏教の宗派","a":"浄土真宗","y":"じょうどしんしゅう","k":"kanji","e":"一向宗ともいう。法然の浄土宗と「真」の字で区別する。","alt":["一向宗"]},{"id":"s5b06-055","u":"s5b06","q":"諸国を歩いて踊り念仏を広めた、時宗の開祖","a":"一遍","y":"いっぺん","k":"kanji","e":"『一遍上人絵伝』には、武士の館や定期市のようすがえがかれている。"},{"id":"s5b06-056","u":"s5b06","q":"「南無妙法蓮華経」の題目をとなえれば救われると説いた僧","a":"日蓮","y":"にちれん","k":"kanji","e":"法華経が正しいと説き、日蓮宗（法華宗）を開いた。念仏（南無阿弥陀仏）と題目を区別する。"},{"id":"s5b06-057","u":"s5b06","q":"宋から臨済宗を伝えた僧","a":"栄西","y":"えいさい","k":"kanji","e":"「ようさい」とも読む。茶の効用についての書物を書いたことでも知られる。"},{"id":"s5b06-058","u":"s5b06","q":"栄西が宋から伝え、幕府の保護を受けた禅宗","a":"臨済宗","y":"りんざいしゅう","k":"kanji","e":"鎌倉幕府や、それに続く室町幕府の保護を受けた。"},{"id":"s5b06-059","u":"s5b06","q":"宋から曹洞宗を伝えた僧","a":"道元","y":"どうげん","k":"kanji","e":"栄西＝臨済宗、道元＝曹洞宗。どちらも禅宗。"},{"id":"s5b06-060","u":"s5b06","q":"座禅によって悟りを得ることを重んじる仏教をまとめて何というか","a":"禅宗","y":"ぜんしゅう","k":"kanji","e":"臨済宗と曹洞宗。武士の気風にあっていた。"},{"id":"s5b06-061","u":"s5b06","q":"鎌倉時代の新しい仏教が、武士や民衆に広まったのはなぜか","a":"教えがわかりやすく、実行しやすかったから","k":"free","e":"戦乱やききんで不安を強めた人々が、心のよりどころを仏教に求めていた。"},{"id":"s5b06-062","u":"s5b06","q":"宋から伝えられた建築様式でつくられた、奈良の寺の門","a":"東大寺南大門","y":"とうだいじなんだいもん","k":"kanji","e":"高さ約26m。左右に金剛力士像が置かれている。"},{"id":"s5b06-063","u":"s5b06","q":"東大寺南大門に置かれている、力強い写実的な彫刻","a":"金剛力士像","y":"こんごうりきしぞう","k":"kanji","e":"運慶・快慶らの作。高さ約8m。"},{"id":"s5b06-064","u":"s5b06","q":"金剛力士像をつくった仏師を2人答えなさい","a":"運慶・快慶","y":"うんけい・かいけい","k":"kanji","e":"鎌倉文化の彫刻は、力強く写実的。"},{"id":"s5b06-065","u":"s5b06","q":"後鳥羽上皇の命令で、藤原定家らが編集した歌集","a":"『新古今和歌集』","y":"しんこきんわかしゅう","k":"kanji","e":"『万葉集』（奈良）→『古今和歌集』（平安・紀貫之）→『新古今和歌集』（鎌倉・藤原定家）。"},{"id":"s5b06-066","u":"s5b06","q":"『新古今和歌集』を編集した中心人物","a":"藤原定家","y":"ふじわらのさだいえ","k":"kanji","e":"「ていか」とも読む。"} ],"cycle":1},{"id":"K","title":"土地のきまりの流れ","items":[["公地公民（改新の詔）","646年"],["班田収授の法（大宝律令）","701年"],["三世一身の法","723年"],["墾田永年私財法","743年"],["荘園の寄進が広がる（不輸・不入の権）","10世紀〜"]],"cycle":1},{"id":"L","title":"仏教の流れ","items":[["仏教が百済から公に伝わる","538年"],["飛鳥文化（法隆寺）","7世紀初め"],["国分寺・東大寺の大仏","741・743年"],["鑑真が来日し唐招提寺を開く","754年〜"],["最澄・空海が天台宗・真言宗を伝える","9世紀初め"],["浄土教が広まり平等院鳳凰堂が建つ","1053年"]],"cycle":1},{"id":"M","title":"人物の活躍した順","items":[["桓武天皇","794年"],["菅原道真","894年"],["藤原純友","939年"],["藤原道長","1016年"],["白河上皇","1086年"],["平清盛","1167年"]],"cycle":1},{"id":"N","title":"中国の歴史書の順番","items":[["『漢書』地理志（100あまりの小国）","紀元前1世紀のようす"],["『後漢書』東夷伝（奴国の金印）","1世紀のようす"],["『魏志』倭人伝（卑弥呼）","3世紀のようす"],["『宋書』倭国伝（倭の五王）","5世紀のようす"]],"cycle":1},{"id":"6a","title":"源平の争いから鎌倉幕府の成立へ","items":[["源頼朝が伊豆で兵をあげる","1180年"],["一ノ谷の戦い","1184年"],["壇ノ浦の戦いで平氏が滅びる","1185年3月"],["守護と地頭が置かれる","1185年11月"],["源頼朝が征夷大将軍になる","1192年"]],"cycle":2},{"id":"6b","title":"執権政治の流れ","items":[["源頼朝が征夷大将軍になる","1192年"],["北条義時が執権になる","1205年"],["源実朝が殺され、源氏の将軍が絶える","1219年"],["承久の乱","1221年"],["御成敗式目が定められる","1232年"]],"cycle":2},{"id":"6c","title":"元寇と幕府のおとろえ","items":[["チンギス＝ハンがモンゴル帝国をつくる","13世紀初め"],["フビライ＝ハンが国名を元とする","1271年"],["文永の役","1274年"],["弘安の役","1281年"],["永仁の徳政令","1297年"],["鎌倉幕府が滅びる","1333年"]],"cycle":2},{"id":"6d","title":"鎌倉文化と新しい仏教","items":[["栄西が臨済宗を伝える","1191年"],["東大寺南大門の金剛力士像がつくられる","1203年"],["『新古今和歌集』が編集される","1205年"],["親鸞が浄土真宗を開く","1224年"],["道元が曹洞宗を伝える","1227年"],["日蓮が日蓮宗を開く","1253年"]],"cycle":2},{"id":"6e","title":"3人の執権とできごと","items":[["北条義時（承久の乱）","1221年"],["北条泰時（御成敗式目）","1232年"],["北条時宗（文永の役）","1274年"],["北条時宗（弘安の役）","1281年"]],"cycle":2}],"tips":[{"t":"世紀の数え方","r":[1,5],"b":["世紀は100年ごとのまとまり。1世紀＝1〜100年、3世紀＝201〜300年。","早わざ：西暦の上2桁に1を足すと世紀。794年→7＋1＝8世紀。1086年→10＋1＝11世紀。ただし下2桁が00の年は足さない（1000年は10世紀）。","紀元前は逆向きに数える。紀元前1世紀＝紀元前100〜1年。弥生時代（紀元前4世紀〜紀元後3世紀）は紀元前と紀元後をまたぐので約700年間。"]},{"t":"打製石器・磨製石器・骨角器","r":[1],"b":["打製石器＝石を打ち欠いただけ→旧石器時代。","磨製石器＝石をみがいた→縄文時代から。","骨角器＝動物の骨や角のつりばり→縄文時代。","字で覚える：「打」つ、「磨」く、「骨」と「角」。"]},{"t":"土偶（縄文）と埴輪（古墳）","r":[1,2],"b":["土偶：縄文時代。女性の形の土人形。魔よけ・安産・豊作を祈る。","埴輪：古墳時代。古墳のまわりに並べた素焼き。円筒・人・馬・家。","写真問題で出る。「どぐう＝じょうもん」「はにわ＝こふん」と声に出して覚える。"]},{"t":"3つの土器：縄文・弥生・須恵器","r":[1,2],"b":["縄文土器：厚くてもろい。縄目の文様。低温で焼く。","弥生土器：うすくてかたい。文様が少ない。赤茶色。","須恵器：古墳時代に渡来人が伝えた。のぼりがまで高温。かたくて灰色、水もれしない。"]},{"t":"鉄器と青銅器の使い分け","r":[1],"b":["鉄器：かたい→武器・工具（木の農具をつくる）。数が少なく貴重。","青銅器：やわらかい→祭器（銅剣・銅鉾・銅鐸・銅鏡）。豊作を祈る道具。","「鉄は仕事、青銅はお祈り」。"]},{"t":"中国の歴史書は「数字」で見分ける","r":[1,5],"b":["『漢書』地理志：紀元前1世紀。倭は100あまりの小国。","『後漢書』東夷伝：1世紀半ば。奴国の王に金印（漢委奴国王）。","『魏志』倭人伝：3世紀。邪馬台国の卑弥呼、30あまりの国、親魏倭王の称号と銅鏡。","『宋書』倭国伝：5世紀。倭の五王（武＝ワカタケル大王）。","100→30と国がまとまっていく流れ。金印は奴国、称号と銅鏡は卑弥呼。"]},{"t":"稲荷山（埼玉・鉄剣）と江田船山（熊本・鉄刀）","r":[2],"b":["どちらも「ワカタケル大王」の名がある。","埼玉県の稲荷山古墳＝鉄剣。熊本県の江田船山古墳＝鉄刀。","関東と九州の両方から同じ大王の名→5世紀後半のヤマト政権の支配は九州中部から関東まで（記述でよく出る）。"]},{"t":"冠位十二階（603）と憲法十七条（604）","r":[2],"b":["冠位十二階：役人の「位」。家柄でなく能力で。冠の色で12段階。","憲法十七条：役人の「心がまえ」。和をとうとぶ・仏教をうやまう・天皇の命令に従う。","1年ちがい。「位が先、心がまえが後」。今の憲法とは意味がちがう。"]},{"t":"天智・天武・持統はどういう関係？","r":[2],"b":["天智天皇＝中大兄皇子。大化の改新→白村江の戦い（663）→大津に都→即位。初めての全国的な戸籍。","天武天皇＝天智の弟。壬申の乱（672）で天智の息子に勝って即位。都を飛鳥にもどす。富本銭。","持統天皇＝天武の皇后。藤原京（694）を築いた。","順番：天智→（壬申の乱）→天武→持統。"]},{"t":"律と令／二官八省／国司・郡司・里長","r":[3],"b":["律＝刑罰のきまり、令＝政治のしくみのきまり。順番も「律令」。","中央：二官（神祇官・太政官）と八省。太政官が政策を決め、八省が実行。","地方：国（国司＝都から派遣された貴族）→郡（郡司＝その土地の豪族）→里（里長＝税の取り立て）。","九州には大宰府。"]},{"t":"租・調・庸・雑徭・衛士・防人","r":[3],"b":["租：口分田の稲、収穫の約3％を地方に納める。女子も。","調：地方の特産物を都に納める。","庸：都で10日働くかわりに布を都に納める。","雑徭：国司のもとで年60日以内の労働。","衛士：1年間、都の守り。防人：3年間、九州の守り（おもに関東の人）。","「租はイネ、調はトクサンブツ、庸はヌノ」。調と庸は都まで自分で運ぶので負担が重かった。"]},{"t":"「大」宰府と「太」政官・「太」政大臣","r":[3,4],"b":["大宰府（だざいふ）＝九州の役所→「大」。","太政官（だいじょうかん）＝中央の役所、太政大臣（だいじょうだいじん）＝最高の役職→「太」。","漢字1字で失点しやすい。声に出して「だざいふはダイ、だいじょうはタイ」。"]},{"t":"三世一身の法（723）と墾田永年私財法（743）","r":[3],"b":["三世一身：新しく水路をつくって開墾すれば3代まで私有OK。効果が弱かった。","墾田永年私財法：開墾した田は永久に私有OK。聖武天皇のとき。","結果：貴族や寺社が農民を使って土地を広げ→荘園ができる→公地公民がくずれる。","「三世（3代）→永年（永久）」、20年後。"]},{"t":"奈良時代の4つの書物","r":[3],"b":["古事記（712）：歴史書。神話から。","風土記（713）：各国の産物・地名の由来。","日本書紀（720）：歴史書。正式。","万葉集（奈良時代後半）：和歌集。約4500首。万葉がな。","覚え方：712・713・720の順。「古事記が先、日本書紀が後」。"]},{"t":"摂政・関白・院政・平氏の政治","r":[2,4],"b":["摂政：天皇が幼い・女性のときにかわって政治。聖徳太子（推古天皇）、藤原道長。","関白：天皇が成人した後にたすける。藤原氏が独占。","摂関政治（9世紀後半〜11世紀）→院政（1086年白河上皇）→平氏の政治（1167年平清盛が太政大臣）の順。","「幼いときは摂政、大人になったら関白」。"]},{"t":"最澄と空海","r":[4],"b":["最澄：天台宗。比叡山延暦寺（滋賀県）。","空海：真言宗。高野山金剛峯寺（和歌山県）。","どちらも9世紀初め、唐に留学。","「さいちょう・てんだい・ひえいざん」「くうかい・しんごん・こうやさん」。空也（念仏・浄土教）と混同しない。"]},{"t":"藤原がつく人物は5人いる","r":[2,3,4],"b":["藤原鎌足（中臣鎌足）：大化の改新。藤原氏の祖。","藤原不比等：鎌足の子。光明皇后の父。","藤原道長・頼通：摂関政治の全盛。","藤原純友：伊予国の元役人。939年に瀬戸内海で反乱を起こした側。","藤原元命：尾張国の国司。悪政を農民に訴えられた。","純友と元命は藤原氏の本流とは別。「純友は海賊、元命は悪い国司」。"]},{"t":"平将門と藤原純友（939年）","r":[4],"b":["平将門：下総国（千葉・茨城）の豪族。関東で「新皇」と名のる。","藤原純友：伊予国（愛媛）の元役人。瀬戸内海の海賊を率いる。","同じ939年。どちらも武士の力で鎮圧され、武士の力が認められた。"]},{"t":"保元の乱（1156）と平治の乱（1159）","r":[4],"b":["保元の乱：上皇方 vs 天皇方。天皇方（平清盛・源義朝）が勝つ。","平治の乱：平清盛 vs 源義朝。清盛が勝つ→平氏の時代。","3年差。「保元で天皇が勝ち、平治で平氏が勝つ」。"]},{"t":"不輸の権と不入の権","r":[4],"b":["不輸の権：税を納めなくてよい権利（輸＝運ぶ）。","不入の権：国司の役人を立ち入らせない権利（入＝入る）。","この権利をもつ荘園が増えて、国の収入が減った。"]},{"t":"校倉造と寝殿造","r":[3,4],"b":["校倉造（あぜくらづくり）：正倉院。三角柱の木材を組む。奈良時代。","寝殿造（しんでんづくり）：貴族の屋敷。建物を渡り廊下でつなぐ。平安時代。","「あぜくら＝そうこ、しんでん＝やしき」。"]},{"t":"都の移りかわりと天皇","r":[2,3,4,5],"b":["飛鳥（推古天皇のころ）→藤原京（持統・694）→平城京（元明・710）→長岡京（桓武・784）→平安京（桓武・794）。","大津（天智・白村江の後）は一時的。","平城京と平安京はどちらも唐の長安がモデル、碁盤の目。"]},{"t":"文化の順番と代表するもの","r":[2,3,4,5],"b":["飛鳥文化（7世紀初め）：法隆寺。日本最初の仏教文化。","白鳳文化（7世紀後半）：高松塚古墳の壁画。唐の初期の影響。","天平文化（8世紀）：東大寺・正倉院・古事記・万葉集。唐と仏教の影響、貴族中心。","国風文化（9世紀後半〜）：かな文字・源氏物語・枕草子・寝殿造・大和絵。","浄土教（10世紀〜）：平等院鳳凰堂・中尊寺金色堂。"]},{"t":"この範囲の世界文化遺産","r":[1,2,3,4,5],"b":["三内丸山遺跡（北海道・北東北の縄文遺跡群）","沖ノ島（神宿る島）","法隆寺・東大寺・平等院鳳凰堂（奈良・京都）","中尊寺金色堂（平泉）","厳島神社（広島）"]},{"t":"守護と地頭","r":[6],"b":["守護＝国ごとに置く。軍事・警察、御家人の取りしまり。","地頭＝荘園などに置く。土地の管理、年貢の取り立て。","覚え方：守護は国を「守」る、地頭は土「地」の頭。","どちらも1185年。征夷大将軍（1192年）より前。"]},{"t":"侍所・政所・問注所","r":[6],"b":["侍所＝御家人の取りしまり、軍事。","政所＝政治一般（はじめは公文所）。読みは「まんどころ」。","問注所＝裁判。","覚え方：「侍」は武士、「政」は政治、「問」はうったえを問いただす。"]},{"t":"御恩と奉公","r":[6],"b":["御恩＝将軍から御家人へ。領地を認める、新しい領地をあたえる。","奉公＝御家人から将軍へ。京都や鎌倉の警備、命がけで戦う。","この関係を封建制度という。キーワードは「土地をなかだちとした」。","元寇では新しい土地が手に入らず、御恩が出せなかった→御家人の不満。"]},{"t":"3人の執権：義時・泰時・時宗","r":[6],"b":["北条義時＝承久の乱（1221年）。","北条泰時＝御成敗式目（1232年）。","北条時宗＝元寇（1274年・1281年）。","覚え方：よし（義時）→やす（泰時）→とき（時宗）の順。"]},{"t":"承久の乱の「前」と「後」","r":[6],"b":["前：幕府の力はおもに東国。西国は朝廷の力が強かった。","後：京都に六波羅探題を置き、朝廷を監視。","後：上皇方の領地を取りあげ、新たに地頭を置いた。","結果：幕府の支配が全国におよんだ。"]},{"t":"文永の役と弘安の役","r":[6],"b":["文永の役（1274年）＝1回目。約3万。集団戦法と火薬の兵器に苦戦。","弘安の役（1281年）＝2回目。約14万。石塁で上陸をふせぎ、暴風雨で元軍が引きあげた。","石塁は文永の役の「後」につくった。","どちらも執権は北条時宗、元の皇帝はフビライ＝ハン。"]},{"t":"二毛作と二期作","r":[6],"b":["二毛作＝同じ田畑で1年に2種類（米のあとに麦）。鎌倉時代に西日本で広まった。","二期作＝同じ作物（米）を1年に2回つくる。","覚え方：「毛」は作物の種類、「期」は時期。"]},{"t":"鎌倉仏教：開いた人と宗派","r":[6],"b":["法然＝浄土宗（南無阿弥陀仏ととなえる）。","親鸞＝浄土真宗（一向宗）。法然の弟子。","一遍＝時宗（踊り念仏）。","日蓮＝日蓮宗（法華宗）。題目「南無妙法蓮華経」。","栄西＝臨済宗、道元＝曹洞宗。この2つが禅宗（座禅）。","念仏は「南無阿弥陀仏」、題目は「南無妙法蓮華経」。まぜない。"]},{"t":"鎌倉時代の文学：作品と人","r":[6],"b":["『新古今和歌集』＝藤原定家ら（後鳥羽上皇の命令）。","『平家物語』＝軍記物。琵琶法師が語り伝えた。","『方丈記』＝鴨長明の随筆。","『徒然草』＝兼好法師の随筆。","平安時代の『古今和歌集』（紀貫之）・『枕草子』（清少納言）とまぜない。"]}]};

<script>
(function(){
"use strict";
const APP_VER="1.8.0";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=86400000;

/* ---------- content index ---------- */
const UNITS=CONTENT.units, ITEMS=CONTENT.items, SETS=CONTENT.sets, TIPS=CONTENT.tips, CYCLES=CONTENT.cycles, TESTS=CONTENT.tests||[];
const UNIT={};UNITS.forEach(u=>UNIT[u.id]=u);
const ITEM={};ITEMS.forEach(it=>ITEM[it.id]=it);
const SET={};SETS.forEach(s=>SET[s.id]=s);
const ROUND_SHORT={};UNITS.forEach(u=>ROUND_SHORT[u.round]=u.short);
const ROUNDS=Array.from(new Set(UNITS.map(u=>u.round))).sort((a,b)=>a-b);
const SUBS=["社会","漢字","ことば"].filter(x=>UNITS.some(u=>u.sub===x));

/* ---------- storage ---------- */
const KEY="gakushu-v1";            // このアプリの記録
const OLD_KEY="shakai5b-drill-v1"; // 旧「社会 暗記ドリル」の記録（同じアドレスの下なら読める）
const SUB_CHUNK={"社会":20,"漢字":10,"ことば":10};
const DEF={round:ROUNDS[ROUNDS.length-1],cap:30,chunk:20,back:10,goalNew:20,rest:2,rndS:false,rndK:true,rndW:false,cardOn:true,sound:true,testDate:"",iv:[1,3,7,14,30,60,120]};
let S={schema:1,log:[],cfg:{},meta:{},days:{},badges:{},tests:[]}; // log: [id, g(2=○,1=△,0=×), t(ms), src]
let storageOk=true;
function cfg(k){const v=S.cfg?S.cfg[k]:null;
  if(k==="round"){if(v!=null&&ROUNDS.includes(Number(v)))return Number(v);const u=S.cfg?S.cfg.unit:null;if(u&&UNIT[u])return UNIT[u].round;return DEF.round;}
  return v==null?DEF[k]:v;}
function setCfg(k,v){S.cfg[k]=v;(S.meta.cfgT=S.meta.cfgT||{})[k]=Date.now();save();}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.log)){S.log=o.log;S.cfg=o.cfg||{};S.meta=o.meta||{};S.days=o.days||{};S.badges=o.badges||{};S.tests=Array.isArray(o.tests)?o.tests:[];}}}catch(e){storageOk=false;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}syncSoon();}
function mapLegacyId(id){const m=/^q([1-5])-(\d\d)$/.exec(id);return m?("s5b0"+m[1]+"-0"+m[2]):id;}
function mergeEntries(list,legacy){const seen=new Set(S.log.map(a=>a[0]+"|"+a[2]));let added=0;
  list.forEach(a=>{if(!Array.isArray(a)||a.length<3)return;let id=String(a[0]);const t=Number(a[2]);if(!t||!isFinite(t))return;let g;
    if(legacy){id=mapLegacyId(id);g=a[1]?2:0;}else{g=Number(a[1]);g=g===2?2:(g===1?1:0);}
    const k=id+"|"+t;if(seen.has(k))return;seen.add(k);S.log.push([id,g,t,String(a[3]||"")]);added++;});
  if(added)S.log.sort((x,y)=>x[2]-y[2]);return added;}
function importLegacy(){try{const raw=localStorage.getItem(OLD_KEY);if(!raw)return 0;const o=JSON.parse(raw);if(!o||!Array.isArray(o.attempts))return 0;return mergeEntries(o.attempts,true);}catch(e){return 0;}}

/* ---------- 復習の段階（履歴から毎回計算し直す） ---------- */
let ST={};
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.getTime();}
function todayStart(){return dayStart(Date.now());}
function applyEntry(a){const iv=cfg("iv");const id=a[0],g=a[1],t=a[2];let s=ST[id];
  if(!s)s=ST[id]={stage:0,due:0,c:0,w:0,k:0,kp:0,seq:[],lastT:0,firstT:t,firstSrc:a[3]||"",maxStage:0,clr:0,kclr:0};
  const wasMarked=isMarked(s),wasKp=s.kp>0;
  if(g===2){s.c++;if(s.stage===0||t>=s.due){s.stage=Math.min(s.stage+1,iv.length);s.due=addDays(dayStart(t),iv[s.stage-1]);}if(s.kp>0)s.kp--;}
  else{s.w++;if(g===1){s.k++;s.kp=2;}s.stage=1;s.due=addDays(dayStart(t),iv[0]);}
  s.seq.push(g);if(s.seq.length>6)s.seq.shift();s.lastT=t;
  if(s.stage>s.maxStage)s.maxStage=s.stage;if(wasMarked&&!isMarked(s))s.clr=1;if(wasKp&&s.kp===0)s.kclr=1;}
function rebuild(){ST={};for(const a of S.log)applyEntry(a);}
function record(id,g,src){const a=[id,g,Date.now(),src||""];S.log.push(a);applyEntry(a);checkBadges();save();updateCounts();}
function isMarked(s){if(!s||s.w===0)return false;const n=s.seq.length;return !(n>=2&&s.seq[n-1]===2&&s.seq[n-2]===2);}
function isKanjiPending(s){return !!s&&s.kp>0;}

/* ---------- きょうの出題 ---------- */
function curRound(){return cfg("round");}
function curUnits(){const r=curRound();return UNITS.filter(u=>u.round===r);}
function curCycle(){const l=curUnits();return l.length?l[0].cycle:UNITS[UNITS.length-1].cycle;}
function rangeUnits(){const t=nextTest();if(t&&t.days<=7){if(t.cycle===0)return UNITS.slice();if(t.cycle>0){const l=UNITS.filter(u=>u.cycle===t.cycle);if(l.length)return l;}}
  const c=curCycle();return UNITS.filter(u=>u.cycle===c);}
function newList(sub){const r=curRound();return ITEMS.filter(it=>{const u=UNIT[it.u];return u.round===r&&(!sub||u.sub===sub)&&!ST[it.id];});}
function backlogList(){const r=curRound();const so=x=>SUBS.indexOf(UNIT[x.u].sub);const sq=x=>Number(x.id.slice(-3));return ITEMS.filter(it=>UNIT[it.u].round<r&&!ST[it.id]).sort((a,b)=>UNIT[a.u].round-UNIT[b.u].round||sq(a)-sq(b)||so(a)-so(b));}
function dueList(){const ts=todayStart();return ITEMS.filter(it=>{const s=ST[it.id];return s&&s.due<=ts;}).sort((a,b)=>{const x=ST[a.id],y=ST[b.id];return x.stage-y.stage||(isMarked(y)-isMarked(x))||x.due-y.due;});}
function weakList(){const us=new Set(rangeUnits().map(u=>u.id));return ITEMS.filter(it=>us.has(it.u)&&isMarked(ST[it.id])).sort((a,b)=>ST[b.id].w-ST[a.id].w||ST[a.id].lastT-ST[b.id].lastT);}
function kanjiList(){return ITEMS.filter(it=>isKanjiPending(ST[it.id])).sort((a,b)=>ST[b.id].k-ST[a.id].k);}
function todayMissed(){const ts=todayStart();const m={},out=[];
  S.log.forEach(a=>{if(a[2]<ts||!ITEM[a[0]])return;let x=m[a[0]];
    if(a[1]<2){if(!x){x=m[a[0]]={id:a[0],x:0,t:0,last:a[1]};out.push(x);}if(a[1]===0)x.x++;else x.t++;}
    if(x)x.last=a[1];});return out;}
function todayEntries(){const ts=todayStart();return S.log.filter(a=>a[2]>=ts);}
function reviewsToday(){const set=new Set();todayEntries().forEach(a=>{if(a[3]==="review")set.add(a[0]);});return set.size;}
let extraToday=0,extraDay=0;
function reviewQuota(){if(extraDay!==todayStart()){extraDay=todayStart();extraToday=0;}return Math.max(0,cfg("cap")+extraToday-reviewsToday());}
function testList(){const list=TESTS.map(t=>({date:t.date,name:t.name,cycle:t.cycle}));const c=cfg("testDate");
  if(c&&!list.some(t=>t.date===c))list.push({date:c,name:"テスト",cycle:-1});
  const ts=todayStart();return list.map(t=>{const ms=new Date(t.date+"T00:00:00").getTime();return Object.assign(t,{ms,days:Math.round((ms-ts)/DAY)});}).filter(t=>isFinite(t.ms)).sort((a,b)=>a.ms-b.ms);}
function nextTest(){return testList().find(t=>t.days>=0)||null;}
function daysToTest(){const t=nextTest();return t?t.days:null;}
function isPreTest(){const n=daysToTest();return n!=null&&n<=7;}
function testDateText(t){const d=new Date(t.ms);return (d.getMonth()+1)+"月"+d.getDate()+"日";}

/* ---------- helpers ---------- */
const RND_KEY={"社会":"rndS","漢字":"rndK","ことば":"rndW"};
function isRnd(it){const u=UNIT[it.u];return !!(u&&cfg(RND_KEY[u.sub]));}
/* 「ばらばら」の教科の語だけを、その語どうしの位置で入れかえる。社会など「教科書の順」の語は動かさない。
   grp を渡すと、同じ組（例：同じ回）の中だけで入れかえる */
function arrange(list,grp){const g={};list.forEach((it,i)=>{if(!isRnd(it))return;const k=grp?grp(it):"";(g[k]=g[k]||[]).push(i);});
  const out=list.slice();Object.keys(g).forEach(k=>{const pos=g[k];const sh=shuffle(pos.map(p=>list[p]));pos.forEach((p,n)=>{out[p]=sh[n];});});return out;}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function tag(r){return '<span class="tag r'+r+'">'+esc(ROUND_SHORT[r]||("第"+r+"回"))+'</span>';}
function utag(it){const u=UNIT[it.u];return '<span class="tag r'+u.round+'">'+esc(u.sub+" "+u.short)+'</span>';}
const fullAns=it=>it.a+(it.s||"");
const bare=it=>it.a.replace(/[『』「」＝・]/g,"");
function hintText(it){const n=bare(it).length;
  if(it.k==="kanji"){const all=/^[\u3400-\u9FFF々]+$/.test(bare(it));return (all?"漢字"+n+"字":n+"字（漢字で書く）")+(it.s?"＋「"+esc(it.s)+"」":"");}
  if(it.k==="kana")return "カタカナ"+n+"字"+(it.s?"＋「"+esc(it.s)+"」":"");
  return UNIT[it.u].sub==="ことば"?"ことばを答える（ひらがなでもよい）":"ことばで答える";}
function boxesHtml(it){if(it.k!=="kanji"&&it.k!=="kana")return "";let h='<div class="boxes">';
  it.a.replace(/[『』「」]/g,"").split("").forEach(c=>{if(c==="＝"||c==="・")h+='<span class="sep">'+esc(c)+'</span>';else h+='<span class="box"><span>'+esc(c)+'</span></span>';});
  if(it.s)h+='<span class="box suffix">'+esc(it.s)+'</span>';return h+'</div>';}
function explHtml(it){const parts=[];if(it.n)parts.push('<p class="pt">'+esc(it.n)+'</p>');if(it.e)parts.push('<p>'+esc(it.e)+'</p>');if(!parts.length)return "";return '<div class="expl"><div class="expl-t">解説</div>'+parts.join("")+'</div>';}
function scrollTop(){window.scrollTo({top:0,behavior:"auto"});}
function bar(done,total,marked){const pd=total?Math.round(done/total*100):0;const pm=total?Math.round(marked/total*100):0;return '<div class="pbar"><i class="d" style="width:'+pd+'%"></i><i class="m" style="width:'+pm+'%"></i></div>';}
function unitProgress(u){const list=ITEMS.filter(it=>it.u===u.id);let done=0,marked=0,solid=0;list.forEach(it=>{const s=ST[it.id];if(s){done++;if(isMarked(s))marked++;if(s.stage>=3)solid++;}});return {u,total:list.length,done,un:list.length-done,marked,solid};}
function fmtDate(t){const d=new Date(t);return (d.getMonth()+1)+"月"+d.getDate()+"日";}

function todaySteps(){const steps=[];const chunk=cfg("chunk");const rs="第"+curRound()+"回";
  const ts0=todayStart();const fresh=l=>l.filter(it=>ST[it.id].lastT<ts0);
  const nw=newList(),due=dueList(),weak=fresh(weakList()),quota=reviewQuota(),back=backlogList();
  const sNew=SUBS.map(sub=>{const l=newList(sub);if(!l.length)return null;const n=SUB_CHUNK[sub]||chunk;
    return {label:sub+" "+rs+"の新しい語を "+Math.min(n,l.length)+"語",sub:"のこり"+l.length+"語。"+(cfg(RND_KEY[sub])?"順番はばらばらに出る":"教科書の順に出る"),
      act:()=>startSession(arrange(newList(sub)).slice(0,n).map(it=>it.id),{src:"new",title:sub+" "+rs+"の新しい語"})};}).filter(Boolean);
  let sRev=null;
  if(due.length&&quota>0){const n=Math.min(due.length,quota,chunk);
    sRev={label:"今日の復習 "+n+"語",sub:due.length>n?("復習待ちは"+due.length+"語。1日"+cfg("cap")+"語まで、少しずつ進める"):"前に解いた語を、忘れるころにもう一度",
      act:()=>startSession(arrange(dueList().slice(0,Math.min(reviewQuota(),chunk))).map(it=>it.id),{src:"review",title:"今日の復習"})};}
  const nt0=nextTest();const wName=(isPreTest()&&nt0&&nt0.cycle===0)?"これまでの範囲の弱点":"組分け範囲の弱点";
  const sWeak=weak.length?{label:wName+" "+Math.min(weak.length,chunk)+"語",sub:"印つき"+weak.length+"語から、まちがいの多い順",
    act:()=>startSession(arrange(fresh(weakList()).slice(0,chunk)).map(it=>it.id),{src:"weak",title:wName})}:null;
  const nb=cfg("back");const doneBack=todayEntries().filter(a=>a[3]==="back").length;
  const sBack=(back.length&&doneBack<nb)?{label:"前の回のまだ解いていない語を "+Math.min(nb-doneBack,back.length)+"語",sub:"のこり"+back.length+"語。1日"+nb+"語ずつ進める",
    act:()=>startSession(arrange(backlogList(),it=>UNIT[it.u].round).slice(0,Math.max(1,nb-doneBack)).map(it=>it.id),{src:"back",title:"前の回のまだ解いていない語"})}:null;
  (isPreTest()?[sWeak,sRev].concat(sNew,[sBack]):sNew.concat([sRev,sWeak,sBack])).forEach(s=>{if(s)steps.push(s);});
  return {steps,due,quota,nw,weak,back};}

function endSession(){view.sess=null;scrollTop();render();}
function renderSess(){const q=view.sess;if(q.done){renderSessDone();return;}

  +(cid?cardImgHtml(cid,q.revealed?"b":"f"):did?dcardHtml(did,q.revealed&&!q.dflip):q.kanji&&it.y?'<div class="kprompt">'+esc(it.y)+'</div><div class="hint">を漢字で書く　'+hintText(it)+'</div><div class="q sub">'+esc(it.q)+'</div>'

const PAST_MIN=20;  // バッジを入れる前の日は、この数以上解いた日を「輪がそろった日」とみなす
const pad2=n=>String(n).padStart(2,"0");
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function keyMs(k){return new Date(k+"T00:00:00").getTime();}
function mdText(k){const p=k.split("-");return Number(p[1])+"月"+Number(p[2])+"日";}
function isAns(a){return !!ITEM[a[0]]&&a[3]!=="manual";}

/* きょうの3つの輪 */
function rings(){const ts=todayStart();const r=curRound();let nDone=0,bDone=0;
  ITEMS.forEach(it=>{const s=ST[it.id];if(!s||s.firstT<ts||s.firstSrc==="manual")return;const ur=UNIT[it.u].round;if(ur===r)nDone++;else if(ur<r)bDone++;});
  const nGoal=Math.min(cfg("goalNew"),nDone+newList().length);
  const rDone=reviewsToday();const rGoal=Math.min(cfg("cap"),rDone+dueList().length);
  let bGoal,bLabel="前の回の語";const bLeft=backlogList().length;
  if(bDone+bLeft>0){bGoal=Math.min(cfg("back"),bDone+bLeft);}
  else{const set=new Set();todayEntries().forEach(a=>{if(a[3]==="weak"&&ITEM[a[0]])set.add(a[0]);});bDone=set.size;
    bGoal=Math.min(cfg("back"),bDone+weakList().filter(it=>ST[it.id].lastT<ts).length);bLabel="印つきの語";}

/* 輪がそろった日・連続・週 */
function achievedFn(){const cnt={};S.log.forEach(a=>{if(isAns(a)){const k=dayKey(a[2]);cnt[k]=(cnt[k]||0)+1;}});const from=S.meta.badgeFrom||0;
  return k=>!!S.days[k]||(keyMs(k)<from&&(cnt[k]||0)>=PAST_MIN);}
function mondayOf(ds){return addDays(ds,-((new Date(ds).getDay()+6)%7));}
function streakInfo(ach){const REST=cfg("rest");const today=todayStart();const r={cur:0,best:0,restLeft:REST,ach:0,w5:[],w7:[],weekNow:0};
  const fa=S.log.find(isAns);if(!fa)return r;const first=dayStart(fa[2]);const used={};let cur=0;
  for(let d=first;d<=today;d=addDays(d,1)){const k=dayKey(d);
    if(ach(k)){cur++;r.ach++;if(cur>r.best)r.best=cur;}
    else if(d!==today&&cur>0){const m=k.slice(0,7);if((used[m]||0)<REST)used[m]=(used[m]||0)+1;else cur=0;}}
  r.cur=cur;r.restLeft=REST-(used[dayKey(today).slice(0,7)]||0);
  const mNow=mondayOf(today);
  for(let w=mondayOf(first);w<=today;w=addDays(w,7)){let n=0;for(let i=0;i<7;i++){if(ach(dayKey(addDays(w,i))))n++;}
    if(n>=5)r.w5.push(dayKey(w));if(n>=7)r.w7.push(dayKey(w));if(w===mNow)r.weekNow=n;}
  return r;}
function roundStat(r){const us=new Set(UNITS.filter(u=>u.round===r).map(u=>u.id));let total=0,done=0,solid=0,marked=0;
  ITEMS.forEach(it=>{if(!us.has(it.u))return;total++;const s=ST[it.id];if(s){done++;if(s.stage>=3)solid++;if(isMarked(s))marked++;}});return {total,done,solid,marked};}

  ROUNDS.forEach(r=>{const x=roundStat(r);if(!x.total)return;const need=Math.ceil(x.total*0.9);
    one("r1:"+r,C3,"midori",String(r),"回","第"+r+"回 \nひととおり","第"+r+"回の語を、ぜんぶ1回は解く",x.done>=x.total,[x.done,x.total]);
    one("r9:"+r,C3,"midori",String(r),"制覇","第"+r+"回 制覇","第"+r+"回の語の9割が定着する（間をあけて3回つづけて○）",x.solid>=need,[Math.min(x.solid,need),need]);});
  [10,50,100].forEach(n=>one("clr:"+n,C4,"ki",String(n),"克服","印つき克服\n"+n+"語","印が消えた語が、"+n+"語になる（2回つづけて○で消える）",clr>=n,[Math.min(clr,n),n]));
  [10,30].forEach(n=>one("kclr:"+n,C4,"ki",String(n),"漢字","社会の漢字\n克服"+n+"語","漢字ミスが消えた語が、"+n+"語になる",kclr>=n,[Math.min(kclr,n),n]));
  CYCLES.forEach(c=>{const sets=SETS.filter(s=>s.cycle===c.id);if(!sets.length)return;const okN=sets.filter(s=>{const x=ST["o:"+s.id];return x&&x.seq[x.seq.length-1]===2;}).length;
    one("ord:"+c.id,C4,"ki","順","全問","並べかえ\n全問正解",c.name+"の並べかえを、ぜんぶ○にする",okN>=sets.length,[okN,sets.length],{sub:c.name});});
  TESTS.forEach(t=>{const ms=keyMs(t.date);if(!isFinite(ms))return;const days=Math.round((ms-today)/DAY);const md=mdText(t.date);const p=t.date.split("-");
    if(t.rounds&&t.rounds.length){const have=t.rounds.filter(r=>ROUNDS.includes(r));const complete=have.length===t.rounds.length;let total=0,done=0,marked=0;
      have.forEach(r=>{const x=roundStat(r);total+=x.total;done+=x.done;marked+=x.marked;});
      const a=t.rounds[0],b=t.rounds[t.rounds.length-1];const rt="第"+a+"〜"+b+"回";
      one("ch:"+t.date,C5,"shu",a+"-"+b,"挑戦",rt+"\nチャレンジ",md+"の"+t.name+"の前の日までに、"+rt+"の語をぜんぶ解き、印つきを10語以下にする",
        complete&&days>=1&&total>0&&done>=total&&marked<=10,total?[done,total]:null,{closed:days<1,note:complete?("印つき "+marked+"語"):(have.length?"のこりの回は、これから入る":"問題は、これから入る")});}
    let n=0;for(let i=1;i<=7;i++){if(ach(dayKey(addDays(ms,-i))))n++;}
    one("pre7:"+t.date,C5,"shu",Number(p[1])+"/"+Number(p[2]),"直前","直前7日\nやり切り",md+"の"+t.name+"の前の7日間、毎日3つの輪がそろう",n>=7,(days>=1&&days<=7)?[n,7]:null,{closed:days<1,sub:md});});
  const wb=weeklyBests();
  defs.push({key:"wb",pre:"wb:",derived:true,cat:C5,cls:"shu",big:"最高",small:"週テスト",name:"週テスト\n自己ベスト",cond:"週テストで、どれかの教科か4科合計の点数が、これまでの最高をこえる。こえるたびにもらえる",ok:Object.keys(wb).map(id=>"wb:"+id),prog:null});
  defs.push({key:"ks",pre:"ks:",derived:true,cat:C5,cls:"shu",big:"S",small:"クラス",name:"組分け\nSクラス",cond:"組分けテストでSクラスになる。なるたびにもらえる",ok:S.tests.filter(t=>t.kind==="k"&&t.cls==="S").map(t=>"ks:"+t.id),prog:null});
  return {defs,st};}

  if(o.testDel&&typeof o.testDel==="object"&&!Array.isArray(o.testDel)){Object.keys(o.testDel).forEach(id=>{if(!td[id]){td[id]=Number(o.testDel[id])||1;ch=true;}});

  if(Array.isArray(o.tests))o.tests.forEach(t=>{if(!t||!t.id||td[String(t.id)]||!/^\d{4}-\d\d-\d\d$/.test(String(t.d))||S.tests.some(x=>x.id===String(t.id)))return;const sc={};

    S.tests.push({id:String(t.id),d:String(t.d),kind:t.kind==="k"?"k":"w",no:(t.no==null||!isFinite(Number(t.no)))?null:Number(t.no),sc,cls:/^[SCBA]$/.test(String(t.cls))?String(t.cls):""});ch=true;});

function tone(f,t0,dur,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.03);}
function sfx(name){if(!cfg("sound")||!actx||actx.state!=="running")return;try{const t=actx.currentTime;
  if(name==="tick"){const now=performance.now();if(now-lastTick<45)return;lastTick=now;tone(1500,t,0.05,"triangle",0.05);}
  else if(name==="ding"){tone(2093,t,0.9,"sine",0.2);tone(3136,t+0.01,0.7,"sine",0.1);tone(4186,t+0.02,0.5,"sine",0.04);}
  else if(name==="fanfare"){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.11,0.36,"triangle",0.15));tone(2093,t+0.5,1.1,"sine",0.2);tone(3136,t+0.51,0.9,"sine",0.1);}
  else if(name==="ring"){[783.99,987.77,1174.66].forEach((f,i)=>tone(f,t+i*0.13,0.42,"sine",0.13));}
  }catch(e){}}

  const turns=CE.view?1:3,dur=CE.view?700:1900,from=-360*turns,t0=performance.now();CE.intro=true;CE.ang=from;
  (function step(now){const p=Math.max(0,Math.min(1,(now-t0)/dur));const e=1-Math.pow(1-p,3);
    CE.scale=CE.view?1:(0.25+0.75*(1-Math.pow(1-Math.min(1,p/0.3),3)));setAng(from*(1-e));
    if(p<1)CE.raf=requestAnimationFrame(step);else{CE.scale=1;setAng(0,true);celeAfter();}})(t0);}
function celeAfter(){CE.intro=false;if(!REDUCE)shine();
  if(!CE.view){sfx(CE.rank===3?"fanfare":"ding");if(CE.rank===3&&!REDUCE)confetti();}}
function coast(){cancelAnimationFrame(CE.raf);(function step(){CE.vel*=0.95;
  if(Math.abs(CE.vel)>0.8){setAng(CE.ang+CE.vel);CE.raf=requestAnimationFrame(step);}else settle();})();}
function settle(){const from=CE.ang,to=Math.round(from/180)*180,t0=performance.now();
  (function step(now){const p=Math.max(0,Math.min(1,(now-t0)/320));const e=1-Math.pow(1-p,3);setAng(from+(to-from)*e,true);
    if(p<1)CE.raf=requestAnimationFrame(step);else{setAng(to,true);if(((to%360)+360)%360===0)shine();}})(t0);}

  CE.vel=Math.max(-60,Math.min(60,dx*0.8/dt*16));setAng(CE.ang+dx*0.8);});

/* ======================================================
   テストの点数（つきそう人が入力）とテスト結果のバッジ
====================================================== */
const TSUB=[["ma","算数"],["ja","国語"],["sc","理科"],["so","社会"]];
function testsSorted(){return S.tests.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.id<b.id?-1:(a.id>b.id?1:0)));}
function testTotal(t){let n=0;for(const x of TSUB){const v=t.sc?t.sc[x[0]]:null;if(v==null)return null;n+=v;}return n;}
/* 週テストごとに、これまでの最高をこえた教科（最初の1回はくらべる相手がないので対象外） */
function weeklyBests(){const best={},out={};testsSorted().forEach(t=>{if(t.kind!=="w")return;
  const vals=TSUB.map(x=>[x[0],x[1],t.sc?t.sc[x[0]]:null]);vals.push(["tot","4科合計",testTotal(t)]);const hit=[];
  vals.forEach(v=>{if(v[2]==null)return;if(best[v[0]]!=null&&v[2]>best[v[0]])hit.push(v[1]);if(best[v[0]]==null||v[2]>best[v[0]])best[v[0]]=v[2];});
  if(hit.length)out[t.id]=hit;});return out;}
function readTf(){const f=view.tf;const g=id=>{const e=$(id);return e?e.value:null;};
  const d=g("#tD");if(d!=null)f.d=d;const no=g("#tNo");if(no!=null)f.no=no;TSUB.forEach(x=>{const v=g("#t_"+x[0]);if(v!=null)f[x[0]]=v;});}

    +'<div class="lbl">テストの種類</div><div class="chips">'+[["w","週テスト"],["k","組分けテスト"]].map(x=>'<button class="chip'+(f.kind===x[0]?" on":"")+'" data-tk="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'
    +'<div class="tgrid mt"><label>テストの日<input type="date" id="tD" value="'+esc(f.d||dayKey(Date.now()))+'"></label><label>回（なくてもよい）<input type="number" id="tNo" min="1" max="40" inputmode="numeric" placeholder="例：6" value="'+esc(f.no)+'"></label></div>'
    +'<div class="lbl">点数（受けた教科だけ）</div><div class="tgrid four">'+TSUB.map(x=>'<label>'+x[1]+'<input type="number" id="t_'+x[0]+'" min="0" max="999" inputmode="numeric" value="'+esc(f[x[0]])+'"></label>').join("")+'</div>'
    +(f.kind==="k"?'<div class="lbl">組（クラス）</div><div class="chips">'+["S","C","B","A"].map(c=>'<button class="chip'+(f.cls===c?" on":"")+'" data-tc="'+c+'">'+c+'</button>').join("")+'</div>':"")
    +'<div class="row mt"><button class="btn sm primary" id="tAdd">記録する</button><span class="small'+(f.err?" red":" grn")+'" id="tMsg" role="status">'+esc(f.msg)+'</span></div>';
  if(list.length){h+='<ul class="list mt">'+list.map(t=>{const sc=TSUB.filter(x=>t.sc&&t.sc[x[0]]!=null).map(x=>x[1].charAt(0)+t.sc[x[0]]).join("　");const tot=testTotal(t);
      return '<li><div class="body"><div class="qq"><b>'+esc(mdText(t.d))+'</b>　'+(t.kind==="k"?"組分けテスト":"週テスト")+(t.no?"　第"+esc(t.no)+"回":"")+(t.cls?'　<b>'+esc(t.cls)+'クラス</b>':"")+'</div>'
        +'<div class="small">'+esc(sc)+(tot!=null?"　計"+tot:"")+'</div>'+(wb[t.id]?'<div class="small grn"><b>自己ベスト：'+esc(wb[t.id].join("・"))+'</b></div>':"")+'</div>'
        +'<button class="btn sm'+(f.del===t.id?" ng":"")+'" data-tdel="'+esc(t.id)+'">'+(f.del===t.id?"もう一度おすと消える":"消す")+'</button></li>';}).join("")+'</ul>';}
  else h+='<div class="empty">まだ記録はありません。</div>';
  return h+'</div>';}
function bindTestPanel(el){const f=view.tf;
  el.querySelectorAll("[data-tk]").forEach(b=>b.addEventListener("click",()=>{readTf();f.kind=b.dataset.tk;f.msg="";f.del=null;renderNotesKeep();}));

    let no=null;if(String(f.no||"").trim()!==""){no=Number(f.no);if(!isFinite(no)||no<1||no>99||Math.floor(no)!==no){f.msg="回は数字で入れてください。";renderNotesKeep();return;}}
    const t={id:"t"+Date.now().toString(36),d,kind:f.kind==="k"?"k":"w",no,sc,cls:f.kind==="k"?(f.cls||""):""};S.tests.push(t);
    checkBadges();save();const wb=weeklyBests()[t.id];
    f.err=false;f.msg="記録しました。"+(wb?"自己ベスト："+wb.join("・"):"")+(t.cls==="S"?"Sクラス！":"");TSUB.forEach(x=>{f[x[0]]="";});f.no="";f.cls="";

/* ======================================================
   印刷用シート
   対象：mark＝印つき / kanji＝社会の漢字ミス / round＝今週の回のすべて
   形：1＝答えをかくす（書きこみ用） 0＝答えつき 2＝答えと解説つき

const sheet=document.createElement("div");sheet.id="sheet";sheet.setAttribute("aria-label","印刷用シート");document.body.appendChild(sheet);
const SH={mode:1,scope:"mark",rk:{}};
function sheetKey(it,idx){if(!isRnd(it))return idx[it.id];if(SH.rk[it.id]==null)SH.rk[it.id]=Math.random();return SH.rk[it.id];}
function sheetItems(scope){const idx={};ITEMS.forEach((it,i)=>{idx[it.id]=i;});let l;
  if(scope==="today")l=todayMissed().map(x=>ITEM[x.id]);else if(scope==="kanji")l=kanjiList();else if(scope==="round"){const r=curRound();l=ITEMS.filter(it=>UNIT[it.u].round===r);}else l=ITEMS.filter(it=>isMarked(ST[it.id]));
  return l.slice().sort((a,b)=>SUBS.indexOf(UNIT[a.u].sub)-SUBS.indexOf(UNIT[b.u].sub)||UNIT[a.u].round-UNIT[b.u].round||sheetKey(a,idx)-sheetKey(b,idx));}

  return '<span class="line"></span>';}
function openSheet(scope){if(scope)SH.scope=scope;SH.rk={};buildSheet();sheet.classList.add("show");document.body.style.overflow="hidden";sheet.scrollTop=0;}
function closeSheet(){sheet.classList.remove("show");document.body.style.overflow="";}
function buildSheet(){const hide=SH.mode===1,withE=SH.mode===2;const d=new Date();const date=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  const n={today:sheetItems("today").length,mark:sheetItems("mark").length,kanji:sheetItems("kanji").length,round:sheetItems("round").length};const list=sheetItems(SH.scope);

        +'<td class="a">'+(hide?sheetBlanks(it):esc(fullAns(it))+(it.y?' <span class="yo">'+esc(it.y)+'</span>':""))+'</td><td class="cnt">'+(s&&s.w?"×"+s.w:"")+'</td></tr>';}).join("")+'</table>';});

const FB_CONFIG={apiKey:"AIzaSyBG_tnNafzVao3_jThXLHY0XbjMSv7OHBk",authDomain:"anki-drill.firebaseapp.com",projectId:"anki-drill",storageBucket:"anki-drill.firebasestorage.app",messagingSenderId:"629552548443",appId:"1:629552548443:web:7da5f23c9d235db6824d7e"};

function fbBackend(){let U,F,auth,db;

      const u2=F.onSnapshot(F.doc(db,"users",uid,"state","main"),o,sn=>{h.onState(sn.exists()?sn.data():null,!!sn.metadata.fromCache);},h.onError);

    pushLog(uid,m,strs){return F.setDoc(F.doc(db,"users",uid,"log",m),{e:F.arrayUnion.apply(null,strs),u:F.serverTimestamp()},{merge:true});},
    pushState(uid,d){return F.setDoc(F.doc(db,"users",uid,"state","main"),Object.assign({u:F.serverTimestamp()},d),{merge:true});},
    watchCards(uid,cb,onErr){return F.onSnapshot(F.collection(db,"users",uid,"cardsets"),sn=>{cb(sn.docs.map(d=>Object.assign({},d.data(),{id:d.id})));},onErr);},
    getCard(uid,id){return F.getDoc(F.doc(db,"users",uid,"cards",id)).then(sn=>{if(!sn.exists())return null;const d=sn.data();return {f:d.f?d.f.toUint8Array():null,b:d.b?d.b.toUint8Array():null};});},
    putCard(uid,c){return F.setDoc(F.doc(db,"users",uid,"cards",c.id),{set:c.set,n:c.n,kind:c.kind,item:c.item||null,w:c.w||"",f:F.Bytes.fromBase64String(c.f),b:c.b?F.Bytes.fromBase64String(c.b):null});},
