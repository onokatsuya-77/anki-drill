d":"s5b06-001","u":"s5b06","q":"1180年に伊豆で兵をあげ、鎌倉を本拠地にして関東の支配をかためた人物","a":"源頼朝","y":"みなもとのよりとも","k":"kanji","e":"父の源義朝が平治の乱で敗れ、伊豆に流されていた。妻・北条政子の一族である北条氏の力をかりて兵をあげた。"},{"id":"s5b06-002","u":"s5b06","q":"源頼朝の弟で、一ノ谷・屋島・壇ノ浦の戦いで平氏を破った人物","a":"源義経","y":"みなもとのよしつね","k":"kanji","e":"平氏を滅ぼすのに大きなはたらきをしたが、後に頼朝と対立して東北地方へ追われ、平泉で亡くなった。"},{"id":"s5b06-003","u":"s5b06","q":"1185年、源氏が平氏を滅ぼした戦い","a":"壇ノ浦","y":"だんのうら","k":"kanji","e":"現在の山口県。一ノ谷（1184年）→屋島（1185年）→壇ノ浦（1185年）と、西へ西へと追いつめた。","s":"の戦い"},{"id":"s5b06-004","u":"s5b06","q":"1185年、頼朝が国ごとに置いた、軍事・警察の仕事をする役職","a":"守護","y":"しゅご","k":"kanji","e":"御家人を京都の警備につかせ、謀反や殺人などの犯罪人を取りしまった。地頭（荘園ごと）と区別する。","n":"国ごとに置く"},{"id":"s5b06-005","u":"s5b06","q":"1185年、頼朝が荘園などに置いた、土地の管理や年貢の取り立てをする役職","a":"地頭","y":"じとう","k":"kanji","e":"義経をとらえることを口実にして、守護とともに置くことを朝廷に認めさせた。これで頼朝の支配が西国にも広がった。","n":"荘園ごとに置く"},{"id":"s5b06-006","u":"s5b06","q":"1192年、源頼朝が朝廷から任命された役職","a":"征夷大将軍","y":"せいいたいしょうぐん","k":"kanji","e":"平安時代に坂上田村麻呂が任命された役職。頼朝のあとは、政権をとった武士にあたえられる役職になった。"},{"id":"s5b06-007","u":"s5b06","q":"12世紀末、源頼朝が鎌倉にたてた武士の政府","a":"鎌倉幕府","y":"かまくらばくふ","k":"kanji","e":"幕府ができた後も、国司や荘園の持ち主（貴族・寺社）は残った。全国は朝廷と幕府の2重の支配を受けた。"},{"id":"s5b06-008","u":"s5b06","q":"鎌倉に幕府が置かれた理由を、地形から説明しなさい","a":"三方が山で一方が海に面し、守りやすい地形だったから","k":"free","e":"源氏にゆかりのある土地でもあった。「山」「海」「守りやすい」の3つを入れて書く。"},{"id":"s5b06-009","u":"s5b06","q":"鎌倉の周囲に、山をけずってつくられたせまい道","a":"切通","y":"きりどおし","k":"kanji","e":"7つあった。馬が1頭ずつしか通れないほどせまく、敵の大軍が一気に攻めこめない。","s":"し"},{"id":"s5b06-010","u":"s5b06","q":"鎌倉幕府で、御家人の取りしまりと軍事を担当した役所","a":"侍所","y":"さむらいどころ","k":"kanji","e":"「侍」＝武士（御家人）をまとめる役所、と覚える。政所・問注所と区別する。"},{"id":"s5b06-011","u":"s5b06","q":"鎌倉幕府で、政治一般を担当した役所","a":"政所","y":"まんどころ","k":"kanji","e":"はじめは公文所といった。「政」治の役所。読みは「まんどころ」。"},{"id":"s5b06-012","u":"s5b06","q":"鎌倉幕府で、裁判を担当した役所","a":"問注所","y":"もんちゅうじょ","k":"kanji","e":"うったえを「問」いただす役所＝裁判。"},{"id":"s5b06-013","u":"s5b06","q":"将軍と主従関係を結んだ家来の武士","a":"御家人","y":"ごけにん","k":"kanji","e":"将軍から御恩を受け、奉公でこたえた。"},{"id":"s5b06-014","u":"s5b06","q":"将軍が御家人の領地を認めて保護したり、手柄に応じて新しい領地をあたえたりすること","a":"御恩","y":"ごおん","k":"kanji","e":"将軍→御家人。あたえるものは「領地（土地）」。","n":"将軍から御家人へ"},{"id":"s5b06-015","u":"s5b06","q":"御家人が京都や鎌倉の警備につき、戦いが起これば命がけで戦うこと","a":"奉公","y":"ほうこう","k":"kanji","e":"御家人→将軍。「いざ鎌倉」とかけつけた。","n":"御家人から将軍へ"},{"id":"s5b06-016","u":"s5b06","q":"領地（土地）をなかだちとした、主人と家来の関係","a":"封建制度","y":"ほうけんせいど","k":"kanji","e":"御恩と奉公の関係のこと。「土地をなかだちとした」がキーワード。"},{"id":"s5b06-017","u":"s5b06","q":"鎌倉時代の武士は、ふだんどこに住み、どのようにくらしていたか","a":"領地のある農村に住み、農民に農業を行わせながら、武芸の訓練をしていた","k":"free","e":"板のへいや堀で囲んだ館にくらした。武芸には、馬に乗って矢を射る流鏑馬（やぶさめ）などがある。"},{"id":"s5b06-018","u":"s5b06","q":"源頼朝の妻で、頼朝の死後に「尼将軍」とよばれた人物","a":"北条政子","y":"ほうじょうまさこ","k":"kanji","e":"承久の乱のとき、御家人たちに頼朝の御恩を説いて、団結をうったえた。"},{"id":"s5b06-019","u":"s5b06","q":"源頼朝の死後、幕府の実権をにぎった一族","a":"北条","y":"ほうじょう","k":"kanji","e":"北条政子の実家。代々、執権の役職についた。","s":"氏"},{"id":"s5b06-020","u":"s5b06","q":"将軍をたすける役職で、北条氏が代々ついたもの","a":"執権","y":"しっけん","k":"kanji","e":"北条氏は執権として幕府の政治を動かした。これを執権政治という。"},{"id":"s5b06-021","u":"s5b06","q":"源氏の3代将軍で、殺されて源氏の将軍が絶えることになった人物","a":"源実朝","y":"みなもとのさねとも","k":"kanji","e":"1219年、兄・頼家の子の公暁に殺された。頼朝→頼家→実朝の3代。"},{"id":"s5b06-022","u":"s5b06","q":"源氏の将軍は何代、およそ何年で絶えたか","a":"3代、約30年","k":"free","e":"その後、北条氏は名ばかりの将軍を京都からむかえ、執権として実権をにぎった。"},{"id":"s5b06-023","u":"s5b06","q":"1221年、朝廷の勢力を回復しようと、北条義時を討てと命令した上皇","a":"後鳥羽上皇","y":"ごとばじょうこう","k":"kanji","e":"承久の乱で敗れ、隠岐（島根県）に流された。『新古今和歌集』をつくらせた人でもある。"},{"id":"s5b06-024","u":"s5b06","q":"1221年、後鳥羽上皇が幕府をたおそうとして敗れた戦い","a":"承久","y":"じょうきゅう","k":"kanji","e":"源氏の将軍が絶えたのをきっかけに起こった。幕府が勝ち、支配が全国に広がった。","s":"の乱"},{"id":"s5b06-025","u":"s5b06","q":"承久の乱のときの執権","a":"北条義時","y":"ほうじょうよしとき","k":"kanji","e":"義時＝承久の乱（1221年）、泰時＝御成敗式目（1232年）、時宗＝元寇。3人の執権を区別する。"},{"id":"s5b06-026","u":"s5b06","q":"承久の乱の後、後鳥羽上皇が流された場所","a":"隠岐","y":"おき","k":"kanji","e":"現在の島根県の島。"},{"id":"s5b06-027","u":"s5b06","q":"承久の乱の後、朝廷の監視と西国の御家人の取りしまりのために京都に置かれた役所","a":"六波羅探題","y":"ろくはらたんだい","k":"kanji","e":"「京都」「朝廷の監視」がキーワード。"},{"id":"s5b06-028","u":"s5b06","q":"承久の乱の後、幕府の支配はどのように変わったか","a":"上皇方の領地を取りあげて新たに地頭を置き、幕府の支配が西国をふくむ全国におよぶようになった","k":"free","e":"六波羅探題を置いたこととあわせて答えられるようにする。記述でねらわれやすい。"},{"id":"s5b06-029","u":"s5b06","q":"1232年に定められた、武士がつくった最初の法律","a":"御成敗式目","y":"ごせいばいしきもく","k":"kanji","e":"武家社会のしきたりをもとにつくられ、政治や裁判のよりどころになった。後の武家法の手本。","alt":["貞永式目"]},{"id":"s5b06-030","u":"s5b06","q":"御成敗式目を定めた執権","a":"北条泰時","y":"ほうじょうやすとき","k":"kanji","e":"承久の乱の後、地頭と荘園領主の土地をめぐる争いが増えたことから定めた。"},{"id":"s5b06-031","u":"s5b06","q":"13世紀の初め、遊牧民の部族をまとめてモンゴル帝国をつくった人物","a":"チンギス＝ハン","k":"kana","e":"子孫が領土を広げ、ユーラシア大陸の東西にまたがる大帝国になった。フビライはその孫。"},{"id":"s5b06-032","u":"s5b06","q":"チンギス＝ハンの孫で、中国を支配し、日本に従うように求めた皇帝","a":"フビライ＝ハン","k":"kana","e":"国名を元とした。日本にたびたび使いを送ったが、執権の北条時宗は求めに応じなかった。"},{"id":"s5b06-033","u":"s5b06","q":"フビライ＝ハンが、モンゴル高原から中国にかけての地域につけた国名","a":"元","y":"げん","k":"kanji","e":"1271年。フビライの死後におとろえ、14世紀後半には中国で明が成立した。"},{"id":"s5b06-034","u":"s5b06","q":"元に従えられ、元寇のときに兵を出した朝鮮半島の王朝","a":"高麗","y":"こうらい","k":"kanji","e":"新羅の後、10世紀前半に朝鮮半島を統一した。約30年モンゴル軍に抵抗したが、元に降伏した。"},{"id":"s5b06-035","u":"s5b06","q":"元の求めに応じなかった、元寇のときの執権","a":"北条時宗","y":"ほうじょうときむね","k":"kanji","e":"文永の役・弘安の役の2度とも時宗が執権。"},{"id":"s5b06-036","u":"s5b06","q":"1274年、元軍が博多湾沿岸に攻めてきた戦い","a":"文永","y":"ぶんえい","k":"kanji","e":"約3万の元軍。日本の武士は集団戦法と火薬の兵器に苦戦した。1回目＝文永、2回目＝弘安。","s":"の役"},{"id":"s5b06-037","u":"s5b06","q":"1281年、元軍が再び九州北部に攻めてきた戦い","a":"弘安","y":"こうあん","k":"kanji","e":"約14万の大軍。石塁と武士の抵抗で上陸できず、暴風雨にあって引きあげた。","s":"の役"},{"id":"s5b06-038","u":"s5b06","q":"2度にわたる元軍の襲来をまとめて何というか","a":"元寇","y":"げんこう","k":"kanji","e":"「寇」は外から攻めてくる敵の意味。当時は「蒙古襲来」とよんだ。","alt":["蒙古襲来"]},{"id":"s5b06-039","u":"s5b06","q":"文永の役で、日本の武士が苦戦した元軍の戦い方と兵器は何か","a":"集団戦法と、火薬を使った兵器（てつはう）","k":"free","e":"日本の武士は一騎うちが中心だった。『蒙古襲来絵詞』（竹崎季長）に戦いのようすがえがかれている。"},{"id":"s5b06-040","u":"s5b06","q":"文永の役の後、元の襲来に備えて博多湾沿岸に築かれた石垣","a":"石塁","y":"せきるい","k":"kanji","e":"弘安の役では、この石塁にはばまれて元軍は上陸できなかった。今も福岡県に残る。","alt":["防塁"]},{"id":"s5b06-041","u":"s5b06","q":"元軍が攻めてきた、九州北部の湾","a":"博多","y":"はかた","k":"kanji","e":"現在の福岡県。地図で場所を確かめておく。","s":"湾"},{"id":"s5b06-042","u":"s5b06","q":"元寇の後、御家人が幕府に不満をもつようになったのはなぜか","a":"新しい土地を得た戦いではなかったので、十分なほうび（領地）をもらえなかったから","k":"free","e":"御恩（領地）と奉公（戦い）のつりあいがくずれた。多くの費用を使い、命がけで戦ったのにほうびがなかった。"},{"id":"s5b06-043","u":"s5b06","q":"生活に苦しむ御家人を救うために幕府が出した、借金の取り消しを命じる法令","a":"徳政令","y":"とくせいれい","k":"kanji","e":"1297年の永仁の徳政令が最初。効果はあがらず、かえって幕府は信用を失った。"},{"id":"s5b06-044","u":"s5b06","q":"フビライに仕え、日本を「ジパング」としてヨーロッパに紹介したイタリアの商人","a":"マルコ＝ポーロ","k":"kana","e":"見聞きしたことを『世界の記述（東方見聞録）』に残した。"},{"id":"s5b06-045","u":"s5b06","q":"鎌倉時代の農民が苦しんだ「2重の負担」とは何か","a":"荘園領主と地頭の両方から、税や労働を課されたこと","k":"free","e":"地頭の乱暴を荘園領主にうったえたり、村からいっせいに逃げたりして抵抗する農民もいた。"},{"id":"s5b06-046","u":"s5b06","q":"稲をかりとった後に麦をつくるように、同じ田畑で1年に2種類の作物をつくること","a":"二毛作","y":"にもうさく","k":"kanji","e":"鎌倉時代に西日本で広まった。同じ作物を年2回つくる二期作と区別する。"},{"id":"s5b06-047","u":"s5b06","q":"鎌倉時代に進んだ農業の技術を2つ答えなさい","a":"牛や馬を使って耕すこと、草や木の灰を肥料にすること","k":"free","e":"西日本ではおもに牛、東日本では馬を使った。生産が高まり、定期市が開かれるもとになった。"},{"id":"s5b06-048","u":"s5b06","q":"交通の便のよいところなどで、月に3回、決まった日に開かれた市","a":"定期市","y":"ていきいち","k":"kanji","e":"四日市・五日市などの地名は、定期市がたった日に由来する。"},{"id":"s5b06-049","u":"s5b06","q":"年貢などを保管したり運んだりした運送業者","a":"問","y":"とい","k":"kanji","e":"問丸ともいう。交通の便のよい港などに現れた。","alt":["問丸"]},{"id":"s5b06-050","u":"s5b06","q":"商工業者がつくった同業者の組合","a":"座","y":"ざ","k":"kanji","e":"営業を独占しようとした。"},{"id":"s5b06-051","u":"s5b06","q":"定期市の取り引きで使われた、中国から輸入された銅銭","a":"宋銭","y":"そうせん","k":"kanji","e":"朝廷も鎌倉幕府もお金を発行しなかったので、日宋貿易で入ってきた宋のお金を使った。"},{"id":"s5b06-052","u":"s5b06","q":"「南無阿弥陀仏」ととなえれば極楽に生まれ変われると説いた、浄土宗の開祖","a":"法然","y":"ほうねん","k":"kanji","e":"浄土宗＝法然、浄土真宗＝親鸞（法然の弟子）。"},{"id":"s5b06-053","u":"s5b06","q":"阿弥陀仏を信じさえすれば救われ、悪人にこそ救われる道があると説いた僧","a":"親鸞","y":"しんらん","k":"kanji","e":"法然の弟子。「鸞」は字がむずかしいので、何度も書いて覚える。"},{"id":"s5b06-054","u":"s5b06","q":"親鸞が開いた仏教の宗派","a":"浄土真宗","y":"じょうどしんしゅう","k":"kanji","e":"一向宗ともいう。法然の浄土宗と「真」の字で区別する。","alt":["一向宗"]},{"id":"s5b06-055","u":"s5b06","q":"諸国を歩いて踊り念仏を広めた、時宗の開祖","a":"一遍","y":"いっぺん","k":"kanji","e":"『一遍上人絵伝』には、武士の館や定期市のようすがえがかれている。"},{"id":"s5b06-056","u":"s5b06","q":"「南無妙法蓮華経」の題目をとなえれば救われると説いた僧","a":"日蓮","y":"にちれん","k":"kanji","e":"法華経が正しいと説き、日蓮宗（法華宗）を開いた。念仏（南無阿弥陀仏）と題目を区別する。"},{"id":"s5b06-057","u":"s5b06","q":"宋から臨済宗を伝えた僧","a":"栄西","y":"えいさい","k":"kanji","e":"「ようさい」とも読む。茶の効用についての書物を書いたことでも知られる。"},{"id":"s5b06-058","u":"s5b06","q":"栄西が宋から伝え、幕府の保護を受けた禅宗","a":"臨済宗","y":"りんざいしゅう","k":"kanji","e":"鎌倉幕府や、それに続く室町幕府の保護を受けた。"},{"id":"s5b06-059","u":"s5b06","q":"宋から曹洞宗を伝えた僧","a":"道元","y":"どうげん","k":"kanji","e":"栄西＝臨済宗、道元＝曹洞宗。どちらも禅宗。"},{"id":"s5b06-060","u":"s5b06","q":"座禅によって悟りを得ることを重んじる仏教をまとめて何というか","a":"禅宗","y":"ぜんしゅう","k":"kanji","e":"臨済宗と曹洞宗。武士の気風にあっていた。"},{"id":"s5b06-061","u":"s5b06","q":"鎌倉時代の新しい仏教が、武士や民衆に広まったのはなぜか","a":"教えがわかりやすく、実行しやすかったから","k":"free","e":"戦乱やききんで不安を強めた人々が、心のよりどころを仏教に求めていた。"},{"id":"s5b06-062","u":"s5b06","q":"宋から伝えられた建築様式でつくられた、奈良の寺の門","a":"東大寺南大門","y":"とうだいじなんだいもん","k":"kanji","e":"高さ約26m。左右に金剛力士像が置かれている。"},{"id":"s5b06-063","u":"s5b06","q":"東大寺南大門に置かれている、力強い写実的な彫刻","a":"金剛力士像","y":"こんごうりきしぞう","k":"kanji","e":"運慶・快慶らの作。高さ約8m。"},{"id":"s5b06-064","u":"s5b06","q":"金剛力士像をつくった仏師を2人答えなさい","a":"運慶・快慶","y":"うんけい・かいけい","k":"kanji","e":"鎌倉文化の彫刻は、力強く写実的。"},{"id":"s5b06-065","u":"s5b06","q":"後鳥羽上皇の命令で、藤原定家らが編集した歌集","a":"『新古今和歌集』","y":"しんこきんわかしゅう","k":"kanji","e":"『万葉集』（奈良）→『古今和歌集』（平安・紀貫之）→『新古今和歌集』（鎌倉・藤原定家）。"},{"id":"s5b06-066","u":"s5b06","q":"『新古今和歌集』を編集した中心人物","a":"藤原定家","y":"ふじわらのさだいえ","k":"kanji","e":"「ていか」とも読む。"},{"id":"s5b06-067","u":"s5b06","q":"琵琶法師によって語り伝えられた、平氏の盛衰をえがいた軍記物","a":"『平家物語』","y":"へいけものがたり","k":"kanji","e":"語りで伝えたので、文字を読めない多くの人にも喜ばれた。"},{"id":"s5b06-068","u":"s5b06","q":"鴨長明が書いた随筆","a":"『方丈記』","y":"ほうじょうき","k":"kanji","e":"『枕草子』（清少納言・平安）、『方丈記』（鴨長明）、『徒然草』（兼好法師）が三大随筆。"},{"id":"s5b06-069","u":"s5b06","q":"兼好法師が書いた随筆","a":"『徒然草』","y":"つれづれぐさ","k":"kanji","e":"1330年ごろ。読みは「つれづれぐさ」。"},{"id":"s5b06-070","u":"s5b06","q":"鎌倉文化の特色を答えなさい","a":"武士や僧などによる、素朴で力強い文化","k":"free","e":"平安時代の国風文化（貴族による、はなやかな文化）とくらべる。"},{"q":"1333年、楠木正成や足利尊氏らの協力を得て、鎌倉幕府を倒した天皇","a":"後醍醐天皇","y":"ごだいごてんのう","k":"kanji","e":"朝廷に政権を取りもどそうとした。「醍醐」の字に注意。","id":"s5b07-001","u":"s5b07"},{"q":"1334年に元号を建武と改め、後醍醐天皇が自ら行った政治","a":"建武の新政","y":"けんむのしんせい","k":"kanji","e":"武家社会のならわしを無視して天皇に権力を集めたので、武士や農民、一部の公家の不満が高まり、2年あまりでくずれた。","id":"s5b07-002","u":"s5b07"},{"q":"建武の新政が、わずか2年あまりでくずれた理由を説明しなさい","a":"それまでの武家社会のならわしを無視し、天皇に権力を集めたため、武士などの不満が高まったから","k":"free","e":"「武士のしきたりを無視」「天皇に権力を集中」「武士の不満」の3つを入れる。","id":"s5b07-003","u":"s5b07"},{"q":"1333年に鎌倉幕府を倒すのに協力したが、後に武家政治の再建をめざして兵をあげ、京都に幕府を開いた人物","a":"足利尊氏","y":"あしかがたかうじ","k":"kanji","e":"1338年、北朝の天皇から征夷大将軍に任命された。「尊」の字に注意。","id":"s5b07-004","u":"s5b07"},{"q":"後醍醐天皇が京都をのがれて朝廷を開いた、現在の奈良県の土地","a":"吉野","y":"よしの","k":"kanji","e":"吉野の朝廷を南朝、京都の朝廷を北朝という。","id":"s5b07-005","u":"s5b07"},{"q":"吉野の朝廷（南朝）と京都の朝廷（北朝）が対立し、全国の武士が二つに分かれて争った、約60年間続いた争乱","a":"南北朝の内乱","y":"なんぼくちょうのないらん","k":"kanji","e":"この時代を南北朝時代という。1392年、足利義満が合一した。","alt":["南北朝の争乱"],"id":"s5b07-006","u":"s5b07"},{"q":"1338年、足利尊氏が北朝の天皇から任命された役職","a":"征夷大将軍","y":"せいいたいしょうぐん","k":"kanji","e":"鎌倉幕府の源頼朝（1192年）と同じ役職。これで室町幕府が成立した。","id":"s5b07-007","u":"s5b07"},{"q":"足利氏が京都に開いた幕府","a":"室町幕府","y":"むろまちばくふ","k":"kanji","e":"3代将軍義満が京都の室町に幕府を移したことから、この名でよばれる。約240年間続いた。","id":"s5b07-008","u":"s5b07"},{"q":"室町幕府で、将軍をたすける役職。鎌倉幕府の執権にあたる","a":"管領","y":"かんれい","k":"kanji","e":"細川氏などの有力な守護大名が任命された。鎌倉幕府の「執権」とまぜない。","id":"s5b07-009","u":"s5b07"},{"q":"室町幕府が関東などを支配するために置いた役所","a":"鎌倉府","y":"かまくらふ","k":"kanji","e":"中央の幕府は京都、地方には鎌倉府と守護・地頭が置かれた。","id":"s5b07-010","u":"s5b07"},{"q":"室町時代、任命された国を自分の領地のように支配するようになった守護のこと","a":"守護大名","y":"しゅごだいみょう","k":"kanji","e":"鎌倉時代の守護は軍事・警察の役職だったが、室町時代には国を支配する大名になった。","id":"s5b07-011","u":"s5b07"},{"q":"京都の室町に豪華な屋敷を建てて幕府を移し、守護大名を従えて勢力を強めた3代将軍","a":"足利義満","y":"あしかがよしみつ","k":"kanji","e":"1392年に南北朝の合一、1404年から日明貿易、金閣を建てた。室町幕府の全盛期をきずいた。","id":"s5b07-012","u":"s5b07"},{"q":"足利義満が京都の室町に建てた豪華な屋敷","a":"花の御所","y":"はなのごしょ","k":"kanji","e":"ここに幕府を移したので「室町幕府」とよばれる。","id":"s5b07-013","u":"s5b07"},{"q":"1392年、足利義満が南朝と北朝を一つにまとめたこと","a":"南北朝の合一","y":"なんぼくちょうのごういつ","k":"kanji","e":"これで約60年続いた南北朝の内乱が終わった。年号1392年を覚える。","id":"s5b07-014","u":"s5b07"},{"q":"15世紀半ばの8代将軍。この人物の後つぎ争いなどから応仁の乱が起こった","a":"足利義政","y":"あしかがよしまさ","k":"kanji","e":"東山に銀閣を建てた。義満（3代・金閣）とまぜない。","id":"s5b07-015","u":"s5b07"},{"q":"1467年、将軍の後つぎ争いや守護大名どうしの争いがからんで京都で始まり、11年も続いた戦乱","a":"応仁の乱","y":"おうにんのらん","k":"kanji","e":"細川勝元と山名宗全の争いに将軍家・管領家の後つぎ争いがからんだ。京都は焼け野原になり、将軍の力は完全におとろえた。","id":"s5b07-016","u":"s5b07"},{"q":"応仁の乱で争った有力な守護大名を2人答えなさい","a":"細川勝元と山名宗全（持豊）","k":"free","e":"細川氏は管領の家。この2人の争いに、将軍の後つぎ争いがからんだ。","id":"s5b07-017","u":"s5b07"},{"q":"応仁の乱の後、幕府が支配できたのは都のあった1国だけになった。その国","a":"山城国","y":"やましろのくに","k":"kanji","e":"現在の京都府。1485年には山城の国一揆が起こった。","alt":["山城"],"id":"s5b07-018","u":"s5b07"},{"q":"応仁の乱の後、都の文化が地方に広まった理由を説明しなさい","a":"戦乱を逃れて、公家や僧が地方に下ったから","k":"free","e":"「戦乱をのがれる」「公家や僧」「地方へ」を入れる。","id":"s5b07-019","u":"s5b07"},{"q":"義満が将軍になったころ、元が滅んで中国に成立した国","a":"明","y":"みん","k":"kanji","e":"日本に倭寇の取りしまりを求め、国交を開いた。","id":"s5b07-020","u":"s5b07"},{"q":"元寇の後、中国や朝鮮半島をあらした日本人の海賊","a":"倭寇","y":"わこう","k":"kanji","e":"明と朝鮮の両方が、日本に取りしまりを求めてきた。「倭」は日本のこと。","id":"s5b07-021","u":"s5b07"},{"q":"日本が明に貢ぎ物をもっていく形で行われた貿易。足利義満が始めた","a":"日明貿易","y":"にちみんぼうえき","k":"kanji","e":"勘合という合い札を使ったので勘合貿易ともいう。幕府の重要な収入になった。","alt":["勘合貿易"],"id":"s5b07-022","u":"s5b07"},{"q":"明が、貿易船と倭寇を区別するために使わせた合い札","a":"勘合","y":"かんごう","k":"kanji","e":"日本の印と明の印を合わせて確かめた。この貿易を勘合貿易ともいう。","id":"s5b07-023","u":"s5b07"},{"q":"日本が明に貢ぎ物をもっていき、お返しに品物をもらう形の貿易を何といいますか","a":"朝貢","k":"free","e":"「朝貢貿易」ともいう。日明貿易はこの形で始まった。","alt":["朝貢貿易"],"id":"s5b07-024","u":"s5b07"},{"q":"日明貿易で、明から日本に輸入されたものを2つ答えなさい","a":"銅銭（明銭）、陶磁器、絹織物など","k":"free","e":"日本からは銅・硫黄・刀・扇などを輸出した。輸入＝明銭・陶磁器・絹織物、輸出＝銅・硫黄・刀剣。","id":"s5b07-025","u":"s5b07"},{"q":"日明貿易で、日本から明に輸出されたものを2つ答えなさい","a":"銅、硫黄、刀剣、扇など","k":"free","e":"輸入と輸出を入れかえないこと。","id":"s5b07-026","u":"s5b07"},{"q":"日明貿易で中国から輸入された、絹織物の材料になるもの","a":"生糸","y":"きいと","k":"kanji","e":"絹織物そのものも輸入された。演習問題集の問いに出る。","id":"s5b07-027","u":"s5b07"},{"q":"明から輸入された銅銭。永楽通宝が代表的","a":"明銭","y":"みんせん","k":"kanji","e":"産業が発達して貨幣の必要が増え、宋銭とともに市で広く使われた。","id":"s5b07-028","u":"s5b07"},{"q":"代表的な明銭の名前","a":"永楽通宝","y":"えいらくつうほう","k":"kanji","e":"和同開珎（奈良時代）・富本銭（飛鳥時代）とまぜない。","id":"s5b07-029","u":"s5b07"},{"q":"中国で明が成立したころ、朝鮮半島で高麗に代わって成立した国","a":"朝鮮","y":"ちょうせん","k":"kanji","e":"ハングルという文字がつくられた。日本とは対等な貿易を行った。","id":"s5b07-030","u":"s5b07"},{"q":"朝鮮でつくられた文字","a":"ハングル","k":"kana","e":"朝鮮から日本には木綿やお経、にんじんなどが輸入された。","id":"s5b07-031","u":"s5b07"},{"q":"朝鮮から日本に輸入されたものを2つ答えなさい","a":"木綿、お経、にんじんなど","k":"free","e":"日本からは銅・硫黄・刀剣などを輸出した。","id":"s5b07-032","u":"s5b07"},{"q":"1429年、沖縄で3つの小国が統一されて成立した国","a":"琉球王国","y":"りゅうきゅうおうこく","k":"kanji","e":"都は首里。日本・中国・朝鮮や東南アジアを結ぶ中継貿易でさかえた。","id":"s5b07-033","u":"s5b07"},{"q":"琉球王国の都","a":"首里","y":"しゅり","k":"kanji","e":"現在の那覇市。首里城があった。","id":"s5b07-034","u":"s5b07"},{"q":"ある国から輸入した品物を、そのままほかの国へ輸出する貿易","a":"中継貿易","y":"なかつぎぼうえき","k":"kanji","e":"琉球の船は、明銭や東南アジアの香料を積んで堺や博多の港にやって来た。","id":"s5b07-035","u":"s5b07"},{"q":"鎌倉時代に西日本に広まり、室町時代に各地に広まった、同じ田畑で米と麦をつくる農業","a":"二毛作","y":"にもうさく","k":"kanji","e":"近畿地方では三毛作も行われた。同じ作物を年2回つくる二期作と区別する。","id":"s5b07-036","u":"s5b07"},{"q":"室町時代、かんがいのために水を引くのに使われた道具","a":"水車","y":"すいしゃ","k":"kanji","e":"かんがい（田に水を引くこと）の技術が発達した。","id":"s5b07-037","u":"s5b07"},{"q":"室町時代に肥料として広く使われるようになったものを2つ答えなさい","a":"草木の灰と人糞","k":"free","e":"鎌倉時代の草木の灰に加えて、人糞も使われるようになり、農業の生産が高まった。","id":"s5b07-038","u":"s5b07"},{"q":"みかんの特産地になった、現在の和歌山県","a":"紀伊","y":"きい","k":"kanji","e":"紀伊＝みかん、甲斐＝ぶどう、宇治＝茶、三河＝綿花。","id":"s5b07-039","u":"s5b07"},{"q":"ぶどうの特産地になった、現在の山梨県","a":"甲斐","y":"かい","k":"kanji","e":"紀伊＝みかん、甲斐＝ぶどう、宇治＝茶、三河＝綿花。","id":"s5b07-040","u":"s5b07"},{"q":"茶の特産地になった、現在の京都府の地名","a":"宇治","y":"うじ","k":"kanji","e":"紀伊＝みかん、甲斐＝ぶどう、宇治＝茶、三河＝綿花。","id":"s5b07-041","u":"s5b07"},{"q":"綿花の特産地になった、現在の愛知県","a":"三河","y":"みかわ","k":"kanji","e":"紀伊＝みかん、甲斐＝ぶどう、宇治＝茶、三河＝綿花。","id":"s5b07-042","u":"s5b07"},{"q":"室町時代に栽培が増えた、手工業の原料になる作物を2つ答えなさい","a":"茶、うるし、えごま（油の原料）など","k":"free","e":"えごまは油の原料。くわ（絹の原料）も手工業の原料。","id":"s5b07-043","u":"s5b07"},{"q":"室町時代に朝鮮や中国から大量に輸入され、16世紀には国内でも栽培されるようになった、あたたかく汗をよく吸う衣服の材料","a":"木綿","y":"もめん","k":"kanji","e":"麻に代わって庶民の衣服に使われた。船の帆や鉄砲の火縄にも使われた。","id":"s5b07-044","u":"s5b07"},{"q":"室町時代に月に6回開かれるところも見られた市","a":"定期市","y":"ていきいち","k":"kanji","e":"鎌倉時代は月に3回。回数が増えた。取り引きには宋銭や明銭が使われた。","id":"s5b07-045","u":"s5b07"},{"q":"室町時代、定期市は月に何回開かれるところがありましたか","a":"6回","k":"free","e":"鎌倉時代は月に3回。","id":"s5b07-046","u":"s5b07"},{"q":"有名な寺社の門前に発達した町","a":"門前町","y":"もんぜんまち","k":"kanji","e":"善光寺のある長野など。港町は博多・堺・兵庫・敦賀など。","id":"s5b07-047","u":"s5b07"},{"q":"日明貿易で栄えた港町を2つ","a":"博多・堺","y":"はかた・さかい","k":"kanji","e":"ほかに兵庫・敦賀など。堺は有力な商工業者を中心に自治が行われた。","id":"s5b07-048","u":"s5b07"},{"q":"鎌倉時代の問（問丸）から発達した、交通の要地にできた卸売業者","a":"問屋","y":"といや","k":"kanji","e":"鎌倉時代の「問（問丸）」が発達したもの。","id":"s5b07-049","u":"s5b07"},{"q":"京都などで、高い利子で庶民に金を貸して富をたくわえた、現在の質屋にあたる業者","a":"土倉","y":"どそう","k":"kanji","e":"酒屋も同じように金貸しを行った。土一揆でおそわれた。","id":"s5b07-050","u":"s5b07"},{"q":"土倉とともに、高い利子で庶民に金を貸した業者","a":"酒屋","k":"free","e":"土倉と酒屋は、土一揆でおそわれる対象になった。","id":"s5b07-051","u":"s5b07"},{"q":"馬を使って物資を運んだ運送業者","a":"馬借","y":"ばしゃく","k":"kanji","e":"正長の土一揆は、近江国の馬借が中心となって起こした。","id":"s5b07-052","u":"s5b07"},{"q":"平安時代後期にでき、商工業の発達によって数や種類が増えた、同業者の組合","a":"座","y":"ざ","k":"kanji","e":"公家や寺社に税を納めて保護を受け、営業を独占した。","id":"s5b07-053","u":"s5b07"},{"q":"絹織物の特産地になった、京都の地名","a":"西陣","y":"にしじん","k":"kanji","e":"西陣＝絹織物、美濃＝和紙、瀬戸＝焼き物。","id":"s5b07-054","u":"s5b07"},{"q":"和紙の特産地になった、現在の岐阜県","a":"美濃","y":"みの","k":"kanji","e":"西陣＝絹織物、美濃＝和紙、瀬戸＝焼き物。","id":"s5b07-055","u":"s5b07"},{"q":"焼き物の特産地になった、現在の愛知県の地名","a":"瀬戸","y":"せと","k":"kanji","e":"西陣＝絹織物、美濃＝和紙、瀬戸＝焼き物。「せともの」の語源。","id":"s5b07-056","u":"s5b07"},{"q":"室町時代、有力な商工業者を中心に自治が行われた都市を2つ答えなさい","a":"京都、堺、博多など","k":"free","e":"港町の堺や博多、幕府のある京都。京都では町衆が祇園祭を復興させた。","id":"s5b07-057","u":"s5b07"},{"q":"京都で自治を行った、豊かな商工業者たち","a":"町衆","y":"まちしゅう","k":"kanji","e":"応仁の乱で中断した祇園祭を復興させた。","id":"s5b07-058","u":"s5b07"},{"q":"平安時代から続く京都の祭りで、応仁の乱で中断したが、町衆のはたらきで復興した祭り","a":"祇園祭","y":"ぎおんまつり","k":"kanji","e":"「祇園」の字に注意。","id":"s5b07-059","u":"s5b07"},{"q":"農民たちが自ら村を治める自治を行うようになった村","a":"惣","y":"そう","k":"kanji","e":"惣村ともいう。戦乱から村を守るため、周囲に堀をめぐらせた惣もあった。","alt":["惣村"],"id":"s5b07-060","u":"s5b07"},{"q":"農民が神社などで開き、山林や用水路の管理、祭り、年貢の納入、村のおきてなどを話し合った会合","a":"寄合","y":"よりあい","k":"kanji","e":"村のおきて（決まり）を定めた。一揆の相談も行われた。","id":"s5b07-061","u":"s5b07"},{"q":"寄合で話し合われたことを2つ答えなさい","a":"山林原野や用水路の共同管理、祭り、年貢の納入、村のおきてなど","k":"free","e":"租調庸の負担量は奈良時代の税なので、室町時代の寄合では話し合わない。","id":"s5b07-062","u":"s5b07"},{"q":"ある目的のために団結して行動すること","a":"一揆","y":"いっき","k":"kanji","e":"農民だけでなく、武士や僧も加わった。室町時代の三大一揆：正長の土一揆・山城の国一揆・加賀の一向一揆。","id":"s5b07-063","u":"s5b07"},{"q":"年貢の軽減や徳政令を求めた、農民による一揆","a":"土一揆","y":"つちいっき","k":"kanji","e":"15世紀にしばしば起きた。徳政令を要求するものは徳政一揆ともいう。","id":"s5b07-064","u":"s5b07"},{"q":"借金を取り消す法令。土一揆はこれを求めた","a":"徳政令","y":"とくせいれい","k":"kanji","e":"鎌倉時代の永仁の徳政令（1297年）は幕府が御家人のために出したもの。室町時代は農民が要求した。","id":"s5b07-065","u":"s5b07"},{"q":"1428年、近江国の馬借や農民たちが徳政令を求めて起こした一揆","a":"正長の土一揆","y":"しょうちょうのつちいっき","k":"kanji","e":"正長の徳政一揆ともいう。近江国は現在の滋賀県。「正長元年ヨリサキハ、借金ハナシ」と石にきざんだ。","alt":["正長の徳政一揆"],"id":"s5b07-066","u":"s5b07"},{"q":"正長の土一揆が起こった国。現在の滋賀県","a":"近江国","y":"おうみのくに","k":"kanji","e":"馬借や農民が中心。京都の町にも広がった。","alt":["近江"],"id":"s5b07-067","u":"s5b07"},{"q":"1485年、山城国（京都府）で村の侍（国人）と農民が団結して守護大名の軍を追放し、8年間自治を行った一揆","a":"山城の国一揆","y":"やましろのくにいっき","k":"kanji","e":"国人＝村に住む侍。平等院に集まっておきてを定めた。","id":"s5b07-068","u":"s5b07"},{"q":"1488年、加賀国（石川県）で一向宗の信者が中心となって守護大名を滅ぼし、約100年間支配した一揆","a":"加賀の一向一揆","y":"かがのいっこういっき","k":"kanji","e":"一向宗は浄土真宗のこと（親鸞が開いた）。「進者往生極楽 退者無間地獄」の旗を使った。","id":"s5b07-069","u":"s5b07"},{"q":"加賀の一向一揆の中心となった、浄土真宗の別の呼び名","a":"一向宗","y":"いっこうしゅう","k":"kanji","e":"浄土真宗（開祖は親鸞）。一向一揆の「一向」はここから。","id":"s5b07-070","u":"s5b07"},{"q":"3つの一揆（正長の土一揆・山城の国一揆・加賀の一向一揆）を、起こった年の古い順に並べなさい","a":"正長の土一揆（1428年）→山城の国一揆（1485年）→加賀の一向一揆（1488年）","k":"free","e":"正長1428＝応仁の乱の前、山城1485・加賀1488＝応仁の乱の後。","id":"s5b07-071","u":"s5b07"},{"q":"室町文化の特色を、「武家」「公家」「禅宗」の3つの言葉を使って説明しなさい","a":"武家と公家の文化がとけあい、幕府が臨済宗を保護したことから禅宗の影響が強い文化","k":"free","e":"民衆の文化が成長したことも特色。義満のころの北山文化と、義政のころの東山文化に分けられる。","id":"s5b07-072","u":"s5b07"},{"q":"室町幕府が保護した禅宗の宗派。鎌倉時代に栄西が開いた","a":"臨済宗","y":"りんざいしゅう","k":"kanji","e":"道元の曹洞宗とまぜない。幕府の保護で、禅宗の影響が室町文化に強く見られる。","id":"s5b07-073","u":"s5b07"},{"q":"足利義満のころの文化","a":"北山文化","y":"きたやまぶんか","k":"kanji","e":"金閣（北山）を中心とする文化。能が大成された。","id":"s5b07-074","u":"s5b07"},{"q":"足利義政のころの文化","a":"東山文化","y":"ひがしやまぶんか","k":"kanji","e":"銀閣（東山）を中心とする文化。書院造・水墨画・茶の湯・生け花。","id":"s5b07-075","u":"s5b07"},{"q":"14世紀末、足利義満が京都の北山に建てた別荘。柱や壁に金箔がはられた","a":"金閣","y":"きんかく","k":"kanji","e":"義満の死後、鹿苑寺という寺になった。","id":"s5b07-076","u":"s5b07"},{"q":"金閣は、足利義満の死後に何という寺になりましたか","a":"鹿苑寺","y":"ろくおんじ","k":"kanji","e":"金閣＝鹿苑寺、銀閣＝慈照寺。","id":"s5b07-077","u":"s5b07"},{"q":"応仁の乱の後に完成した、足利義政が京都の東山に建てた2階建ての別荘","a":"銀閣","y":"ぎんかく","k":"kanji","e":"1階は書院造風。義政の死後、慈照寺という寺になった。","id":"s5b07-078","u":"s5b07"},{"q":"銀閣は、足利義政の死後に何という寺になりましたか","a":"慈照寺","y":"じしょうじ","k":"kanji","e":"銀閣と同じ慈照寺の東求堂に、書院造の部屋がある。","id":"s5b07-079","u":"s5b07"},{"q":"慈照寺の東求堂に見られる、現在の和風建築のもとになった建築様式","a":"書院造","y":"しょいんづくり","k":"kanji","e":"角柱、ふすまや障子の間仕切り、畳をしきつめた床、違い棚、明障子、付書院が特色。","id":"s5b07-080","u":"s5b07"},{"q":"書院造の部屋の特色を3つ答えなさい","a":"畳をしきつめる、ふすまや障子で間仕切りする、違い棚や付書院がある（柱が角柱）","k":"free","e":"円柱ではなく角柱。大鋸で角材や板をつくれるようになったため。","id":"s5b07-081","u":"s5b07"},{"q":"書院造の部屋の柱は、それまでとちがってどんな形になりましたか。また、その理由を答えなさい","a":"角柱。新しい工具（大鋸）が使われて木材を加工しやすくなったから","k":"free","e":"それまでは丸太と同じような円柱が多かった。","id":"s5b07-082","u":"s5b07"},{"q":"猿楽や田楽をもとに大成された、室町時代の芸能","a":"能","y":"のう","k":"kanji","e":"観阿弥・世阿弥父子が足利義満の保護を受けて大成した。","id":"s5b07-083","u":"s5b07"},{"q":"足利義満の保護を受け、能を大成した父子","a":"観阿弥・世阿弥","y":"かんあみ・ぜあみ","k":"kanji","e":"父が観阿弥、子が世阿弥。「阿弥」の字に注意。","id":"s5b07-084","u":"s5b07"},{"q":"能の幕間に演じられる、社会を風刺した内容の多い劇。当時の話しことばを使い、庶民に喜ばれた","a":"狂言","y":"きょうげん","k":"kanji","e":"能＝奥深い芸能、狂言＝こっけいな劇。","id":"s5b07-085","u":"s5b07"},{"q":"自然の景色などを墨1色で描く絵","a":"水墨画","y":"すいぼくが","k":"kanji","e":"雪舟が大成した。『秋冬山水図』などが有名。","id":"s5b07-086","u":"s5b07"},{"q":"応仁の乱のころに明に渡って水墨画を学び、帰国後に京都や山口で活動して水墨画を大成した僧","a":"雪舟","y":"せっしゅう","k":"kanji","e":"周防国（山口県）の大名であった大内氏に保護された。","id":"s5b07-087","u":"s5b07"},{"q":"和歌の上の句と下の句を交互によみ合う文学","a":"連歌","y":"れんが","k":"kanji","e":"室町時代にさかんになった。","id":"s5b07-088","u":"s5b07"},{"q":"「浦島太郎」や「物くさ太郎」などの、庶民の読み物として親しまれた絵入りの物語","a":"お伽草子","y":"おとぎぞうし","k":"kanji","e":"「御伽草子」とも書く。","id":"s5b07-089","u":"s5b07"},{"q":"はじめは禅寺などで行われ、次第に庶民の間にも広まった文化を2つ答えなさい","a":"茶の湯と生け花","k":"free","e":"どちらも東山文化のころに広まった。","id":"s5b07-090","u":"s5b07"},{"q":"室町時代に人々の間に広まり、現代につながる食べ物を3つ答えなさい","a":"とうふ、こんにゃく、まんじゅう、うどんなど","k":"free","e":"しょうゆやみそも使われるようになった。衣服では麻のほか木綿が使われた。","id":"s5b07-091","u":"s5b07"},{"q":"室町時代に民衆の間に広まった、現代にも続く行事や遊びを2つ答えなさい","a":"盆踊り、はねつき、こま回し、節分、七夕など","k":"free","e":"民衆の文化が成長したことも室町文化の特色。","id":"s5b07-092","u":"s5b07"},{"q":"応仁の乱の後、守護大名を倒すなどして各地を実力で支配するようになった大名","a":"戦国大名","y":"せんごくだいみょう","k":"kanji","e":"守護大名の家臣や、村の侍（国人）などがのし上がった。","id":"s5b08-001","u":"s5b08"},{"q":"下の身分の者が、実力によって上の身分の者を倒す風潮","a":"下剋上","y":"げこくじょう","k":"kanji","e":"「剋」の字に注意。応仁の乱の後に広まった。","id":"s5b08-002","u":"s5b08"},{"q":"応仁の乱（1467年）からの約100年間の、戦国大名がたがいに争った時代","a":"戦国時代","y":"せんごくじだい","k":"kanji","e":"16世紀の末まで続いた。室町時代の後半にあたる。","id":"s5b08-003","u":"s5b08"},{"q":"戦国大名の家臣となった、村に住む侍のこと","a":"国人","y":"こくじん","k":"kanji","e":"守護大名を倒して戦国大名になる者もいた。","id":"s5b08-004","u":"s5b08"},{"q":"戦国大名が、戦乱の世を勝ちぬくために領地で力を入れたことを2つ答えなさい","a":"農業の生産を高めること（用水や堤をつくる治水）と、鉱山の開発や交通の整備による商工業の発展","k":"free","e":"「治水」「鉱山」「交通」「商工業」のどれかを使って書く。目的は軍事力を強めること。","id":"s5b08-005","u":"s5b08"},{"q":"戦国大名が、農業の生産を高めるために用水や堤をつくって力を入れたこと","a":"治水","y":"ちすい","k":"kanji","e":"川のはんらんを防ぎ、田に水を引く。信玄堤が有名。","id":"s5b08-006","u":"s5b08"},{"q":"武田信玄が、釜無川（富士川の上流）沿いに築いた堤防","a":"信玄堤","y":"しんげんづつみ","k":"kanji","e":"領地の中心の甲府盆地を水害から守るためにつくった。","id":"s5b08-007","u":"s5b08"},{"q":"戦国大名が、村の侍を家臣にして自分の城のまわりに集めたことでできた町","a":"城下町","y":"じょうかまち","k":"kanji","e":"後に豊臣秀吉は、武士と商工業者を城下町に集めた。","id":"s5b08-008","u":"s5b08"},{"q":"戦国大名が、自分の国を支配するために独自につくった法律","a":"分国法","y":"ぶんこくほう","k":"kanji","e":"家法ともいう。多くは御成敗式目の影響を受けていた。他国との縁組みや手紙のやりとりを禁じた。","alt":["家法"],"id":"s5b08-009","u":"s5b08"},{"q":"分国法の多くは、鎌倉時代のある法律の影響を受けていました。その法律は何ですか","a":"御成敗式目","k":"free","e":"1232年、北条泰時が定めた武士の法律。分国法のもとになった。","id":"s5b08-010","u":"s5b08"},{"q":"今川氏の分国法","a":"今川仮名目録","y":"いまがわかなもくろく","k":"kanji","e":"「勝手に他国の者と縁組みしてはならない」などを定めた。","id":"s5b08-011","u":"s5b08"},{"q":"武田氏の分国法","a":"甲州法度之次第","y":"こうしゅうはっとのしだい","k":"kanji","e":"「許しを得ないで他国に手紙を出してはならない」などを定めた。甲州＝甲斐国（山梨県）。","id":"s5b08-012","u":"s5b08"},{"q":"分国法で、他国との縁組みや手紙のやりとりが禁じられていたのはなぜですか","a":"自分の国の情報が他国にもれないようにするため","k":"free","e":"戦国大名は、情報がもれることをおそれた。きびしい刑罰も定めていた。","id":"s5b08-013","u":"s5b08"},{"q":"1560年ごろ、甲斐国（山梨県）を本拠地としていた戦国大名の名字","a":"武田","y":"たけだ","k":"kanji","e":"武田信玄が有名。長篠の戦いで武田勝頼が織田・徳川軍に敗れた。","id":"s5b08-014","u":"s5b08"},{"q":"1560年ごろ、関東の小田原を本拠地としていた戦国大名の名字","a":"北条","y":"ほうじょう","k":"kanji","e":"1590年、豊臣秀吉に小田原城を攻め落とされた。鎌倉時代の執権の北条氏とは別の一族。","id":"s5b08-015","u":"s5b08"},{"q":"1560年ごろ、中国地方に大きな領地をもっていた戦国大名の名字","a":"毛利","y":"もうり","k":"kanji","e":"毛利元就が有名。","id":"s5b08-016","u":"s5b08"},{"q":"1560年ごろ、越後（新潟県）を本拠地としていた戦国大名の名字","a":"上杉","y":"うえすぎ","k":"kanji","e":"上杉謙信が有名。武田信玄と川中島で戦った。","id":"s5b08-017","u":"s5b08"},{"q":"1560年ごろ、東北地方に領地をもっていた戦国大名の名字","a":"伊達","y":"だて","k":"kanji","e":"伊達政宗が有名。","id":"s5b08-018","u":"s5b08"},{"q":"1560年ごろ、駿河国（静岡県）を本拠地とし、桶狭間の戦いで織田信長に敗れた戦国大名の名字","a":"今川","y":"いまがわ","k":"kanji","e":"今川義元。分国法の「今川仮名目録」でも知られる。","id":"s5b08-019","u":"s5b08"},{"q":"1560年ごろ、九州の南部に領地をもっていた戦国大名の名字","a":"島津","y":"しまづ","k":"kanji","e":"薩摩（鹿児島県）が本拠地。","id":"s5b08-020","u":"s5b08"},{"q":"日明貿易や南蛮貿易で栄え、戦国時代には大商人たちが自ら町を運営する自治都市となっていた、大阪府の港町","a":"堺","y":"さかい","k":"kanji","e":"鉄砲の産地でもあった。町のまわりに堀をめぐらし、宣教師が「日本で堺ほど安全な町はない」と書いた。","id":"s5b08-021","u":"s5b08"},{"q":"堺とならんで、大商人が町を運営する自治都市となっていた、九州の港町","a":"博多","y":"はかた","k":"kanji","e":"現在の福岡市。日明貿易で栄えた。","id":"s5b08-022","u":"s5b08"},{"q":"堺や博多のように、大商人たちが自分たちで町を運営した都市","a":"自治都市","y":"じちとし","k":"kanji","e":"堺は堀と木戸で町を守っていた。","id":"s5b08-023","u":"s5b08"},{"q":"1543年、ポルトガル人を乗せた中国の船が流れ着き、日本に初めて鉄砲が伝えられた島","a":"種子島","y":"たねがしま","k":"kanji","e":"鹿児島県。島の領主が鉄砲を買い入れ、刀鍛冶が複製した。","id":"s5b08-024","u":"s5b08"},{"q":"1543年、日本に初めて鉄砲を伝えた人々の国","a":"ポルトガル","k":"kana","e":"キリスト教を伝えたザビエルはスペイン人。区別する。","id":"s5b08-025","u":"s5b08"},{"q":"1543年に種子島に伝えられた武器","a":"鉄砲","y":"てっぽう","k":"kanji","e":"火縄を使って火薬に点火する火縄銃。堺や国友で生産され、急速に広まった。","id":"s5b08-026","u":"s5b08"},{"q":"鉄砲が伝えられた年を答えなさい","a":"1543年","k":"free","e":"キリスト教の伝来（1549年）の6年前。","id":"s5b08-027","u":"s5b08"},{"q":"鉄砲の生産地として知られた、滋賀県の地名","a":"国友","y":"くにとも","k":"kanji","e":"堺（大阪府）とならぶ鉄砲の産地。","id":"s5b08-028","u":"s5b08"},{"q":"鉄砲隊として活躍した、軽い装備の歩兵","a":"足軽","y":"あしがる","k":"kanji","e":"左手首に火縄をつけて戦った。","id":"s5b08-029","u":"s5b08"},{"q":"当時の鉄砲が、火薬に点火するために使った細いひも","a":"火縄","y":"ひなわ","k":"kanji","e":"このしくみの鉄砲を火縄銃という。","id":"s5b08-030","u":"s5b08"},{"q":"鉄砲が戦いに使われるようになって、戦い方と城のつくりはどう変わりましたか","a":"戦い方に集団戦法が加えられ、城は堀が広く、石垣が高く、壁が厚くつくられるようになった","k":"free","e":"「集団戦法」と「堀・石垣・壁」の変化を書く。","id":"s5b08-031","u":"s5b08"},{"q":"1549年に鹿児島に来て、初めてキリスト教を日本に伝えた人物","a":"フランシスコ＝ザビエル","y":"ふらんしすこざびえる","k":"kanji","e":"スペイン人で、イエズス会の宣教師。平戸・山口・京都などで布教し、2年ほどで日本を去った。","alt":["ザビエル"],"id":"s5b08-032","u":"s5b08"},{"q":"キリスト教が日本に伝えられた年を答えなさい","a":"1549年","k":"free","e":"鉄砲（1543年）の6年後。「以後よく（1549）広まるキリスト教」。","id":"s5b08-033","u":"s5b08"},{"q":"ザビエルが最初に上陸し、キリスト教を伝えた都市","a":"鹿児島","y":"かごしま","k":"kanji","e":"その後、平戸（長崎県）・山口・京都などで布教した。","id":"s5b08-034","u":"s5b08"},{"q":"ザビエルの出身国","a":"スペイン","k":"kana","e":"鉄砲を伝えたのはポルトガル人。区別する。","id":"s5b08-035","u":"s5b08"},{"q":"ザビエルが所属していた、キリスト教の団体","a":"イエズス会","k":"kana","e":"耶蘇会ともいう。宗教を広めるために外国に派遣された人を宣教師という。","alt":["耶蘇会"],"id":"s5b08-036","u":"s5b08"},{"q":"宗教を広める（布教する）ために外国に派遣された人","a":"宣教師","y":"せんきょうし","k":"kanji","e":"各地に教会や学校・病院・孤児院をつくって布教した。","id":"s5b08-037","u":"s5b08"},{"q":"当時のキリスト教の信者のよび名","a":"キリシタン","k":"kana","e":"17世紀初めには約30万人になった。","id":"s5b08-038","u":"s5b08"},{"q":"自らキリスト教の信者になった戦国大名","a":"キリシタン大名","y":"きりしたんだいみょう","k":"kanji","e":"1582年には、4人の少年をローマ教皇のもとに派遣した（天正遣欧使節）。","id":"s5b08-039","u":"s5b08"},{"q":"1582年、九州のキリシタン大名によって、4人の少年がローマ教皇のもとに派遣されたこと","a":"天正遣欧使節","y":"てんしょうけんおうしせつ","k":"kanji","e":"「天正」は当時の元号。","id":"s5b08-040","u":"s5b08"},{"q":"当時の日本人が、ポルトガル人やスペイン人をよんだよび名","a":"南蛮人","y":"なんばんじん","k":"kanji","e":"彼らとの貿易を南蛮貿易、貿易船を南蛮船といった。","id":"s5b08-041","u":"s5b08"},{"q":"ポルトガル人やスペイン人との貿易","a":"南蛮貿易","y":"なんばんぼうえき","k":"kanji","e":"長崎や平戸などで行われた。九州の大名や、堺・長崎の商人が大きな利益をあげた。","id":"s5b08-042","u":"s5b08"},{"q":"南蛮貿易が行われたおもな港を2つ答えなさい","a":"長崎と平戸","k":"free","e":"どちらも現在の長崎県。","id":"s5b08-043","u":"s5b08"},{"q":"南蛮貿易で日本が輸入したものを2つ答えなさい","a":"鉄砲・火薬・中国産の生糸・絹織物（から2つ）","k":"free","e":"輸出は銀（多くは石見銀山で産出）。","id":"s5b08-044","u":"s5b08"},{"q":"南蛮貿易で日本がおもに輸出したものは何ですか","a":"銀","k":"free","e":"多くは石見銀山（島根県）で産出。16〜17世紀には、世界の銀の3分の1が日本産といわれる。","id":"s5b08-045","u":"s5b08"},{"q":"南蛮貿易で輸出された銀を多く産出した、島根県の銀山","a":"石見銀山","y":"いわみぎんざん","k":"kanji","e":"世界遺産にも登録されている。","id":"s5b08-046","u":"s5b08"},{"q":"このころヨーロッパ人によって日本にもたらされた作物を2つ答えなさい","a":"かぼちゃ・たばこ・すいか・とうもろこし・じゃがいも（から2つ）","k":"free","e":"地球儀・世界地図・めがねなども伝わった。","id":"s5b08-047","u":"s5b08"},{"q":"尾張国の小さな戦国大名から、武力による天下統一をめざした人物","a":"織田信長","y":"おだのぶなが","k":"kanji","e":"「天下布武」の印を使った。1582年、本能寺の変で自害した。","id":"s5b08-048","u":"s5b08"},{"q":"織田信長の本拠地だった、現在の愛知県にあった国","a":"尾張国","y":"おわりのくに","k":"kanji","e":"豊臣秀吉も尾張国の出身。","alt":["尾張"],"id":"s5b08-049","u":"s5b08"},{"q":"1560年、織田信長が駿河国（静岡県）の今川義元を破った戦い","a":"桶狭間の戦い","y":"おけはざまのたたかい","k":"kanji","e":"愛知県。信長が天下統一へ歩み出すきっかけになった。","id":"s5b08-050","u":"s5b08"},{"q":"桶狭間の戦いで織田信長に敗れた、駿河国の戦国大名","a":"今川義元","y":"いまがわよしもと","k":"kanji","e":"有力な大名だったが、小さな大名だった信長に敗れた。","id":"s5b08-051","u":"s5b08"},{"q":"織田信長とともに京都にのぼり、将軍となったが、1573年に京都から追放された室町幕府15代将軍","a":"足利義昭","y":"あしかがよしあき","k":"kanji","e":"この追放で室町幕府は滅びた。","id":"s5b08-052","u":"s5b08"},{"q":"室町幕府が滅びた年を答えなさい","a":"1573年","k":"free","e":"織田信長が将軍足利義昭を京都から追放した。","id":"s5b08-053","u":"s5b08"},{"q":"1575年、織田信長が徳川家康と手を結び、鉄砲を効果的に使って甲斐国の武田勝頼を破った戦い","a":"長篠の戦い","y":"ながしののたたかい","k":"kanji","e":"愛知県（三河国）。織田・徳川の鉄砲隊が、武田の騎馬隊を破った。","id":"s5b08-054","u":"s5b08"},{"q":"長篠の戦いで織田・徳川の連合軍に敗れた、甲斐国（山梨県）の戦国大名","a":"武田勝頼","y":"たけだかつより","k":"kanji","e":"武田信玄の子。","id":"s5b08-055","u":"s5b08"},{"q":"長篠の戦いで、織田信長と手を結んで武田軍と戦った人物","a":"徳川家康","y":"とくがわいえやす","k":"kanji","e":"後に江戸幕府を開く。","id":"s5b08-056","u":"s5b08"},{"q":"織田信長が「京都に行って、武力で天下を統一する」という意味で用いた印の文字","a":"天下布武","y":"てんかふぶ","k":"kanji","e":"「布武」＝武力をしく、という意味。","id":"s5b08-057","u":"s5b08"},{"q":"1576年、織田信長が琵琶湖の南東岸に建設を始め、天下統一の本拠地とした城","a":"安土城","y":"あづちじょう","k":"kanji","e":"滋賀県。高くそびえる天守をもつ雄大な城。安土・桃山時代の「安土」のもと。","id":"s5b08-058","u":"s5b08"},{"q":"安土城が建てられた湖の名","a":"琵琶湖","y":"びわこ","k":"kanji","e":"滋賀県。北陸地方から米などを運ぶ重要な輸送路だった。","id":"s5b08-059","u":"s5b08"},{"q":"1582年、織田信長が京都の寺で家臣の明智光秀に攻められ、自害した事件","a":"本能寺の変","y":"ほんのうじのへん","k":"kanji","e":"このあと豊臣秀吉が山崎の戦いで明智光秀を破った。","id":"s5b08-060","u":"s5b08"},{"q":"本能寺の変で、主君の織田信長を攻めた家臣","a":"明智光秀","y":"あけちみつひで","k":"kanji","e":"山崎の戦い（京都府）で豊臣秀吉に敗れた。","id":"s5b08-061","u":"s5b08"},{"q":"織田信長が安土の城下町で行った、市場の税を免除し、座の特権を廃止して商工業を自由にした政策","a":"楽市楽座","y":"らくいちらくざ","k":"kanji","e":"豊臣秀吉も受けついだ。関所の廃止とあわせて、商工業を活発にした。","id":"s5b08-062","u":"s5b08"},{"q":"織田信長が、交通を自由にして商工業を活発にするために廃止したものは何ですか","a":"関所","k":"free","e":"関所では通行税を取っていたので、人や物の流れがさまたげられていた。","id":"s5b08-063","u":"s5b08"},{"q":"織田信長がキリスト教を保護した理由を2つ答えなさい","a":"南蛮貿易をすすめるためと、敵対する仏教勢力をおさえるため","k":"free","e":"京都や安土に教会（南蛮寺）やキリスト教の学校を建てることを許した。","id":"s5b08-064","u":"s5b08"},{"q":"織田信長が京都や安土に建てることを許した、キリスト教の教会のよび名","a":"南蛮寺","y":"なんばんじ","k":"kanji","e":"キリスト教を保護したあらわれ。","id":"s5b08-065","u":"s5b08"},{"q":"織田信長が焼き討ちにした、比叡山の寺","a":"延暦寺","y":"えんりゃくじ","k":"kanji","e":"平安時代に最澄が開いた天台宗の寺。信長に敵対する仏教勢力だった。","id":"s5b08-066","u":"s5b08"},{"q":"大阪にあった一向宗の総本山で、織田信長に攻められた寺","a":"石山本願寺","y":"いしやまほんがんじ","k":"kanji","e":"各地の一向一揆を指導した。あと地に豊臣秀吉が大阪城を建てた。","id":"s5b08-067","u":"s5b08"},{"q":"織田信長の家臣から出世し、1590年に全国統一をなしとげた人物","a":"豊臣秀吉","y":"とよとみひでよし","k":"kanji","e":"尾張国の身分の低い武士の子といわれる。関白・太政大臣になった。","id":"s5b08-068","u":"s5b08"},{"q":"1582年、豊臣秀吉が明智光秀を破った戦い","a":"山崎の戦い","y":"やまざきのたたかい","k":"kanji","e":"京都府。本能寺の変の直後。","id":"s5b08-069","u":"s5b08"},{"q":"豊臣秀吉が石山本願寺のあと地に築き、全国統一の本拠地とした城","a":"大阪城","y":"おおさかじょう","k":"kanji","e":"「大坂城」とも書く。桃山文化を代表する城郭建築の一つ。","alt":["大坂城"],"id":"s5b08-070","u":"s5b08"},{"q":"1585年に豊臣秀吉がついた、朝廷の最高の役職","a":"関白","y":"かんぱく","k":"kanji","e":"翌1586年には太政大臣になった。朝廷の権威をかりて大名をおさえようとした。","id":"s5b08-071","u":"s5b08"},{"q":"1586年に豊臣秀吉がついた、朝廷の役職","a":"太政大臣","y":"だいじょうだいじん","k":"kanji","e":"1585年の関白の翌年。","id":"s5b08-072","u":"s5b08"},{"q":"豊臣秀吉が全国統一をなしとげた年と、そのとき攻め落とした城を答えなさい","a":"1590年、小田原城","k":"free","e":"北条氏の本拠地（神奈川県）。四国・九州の大名を従えた後に攻めた。","id":"s5b08-073","u":"s5b08"},{"q":"1590年に豊臣秀吉が攻め落とした、北条氏の本拠地の城","a":"小田原城","y":"おだわらじょう","k":"kanji","e":"神奈川県。これで全国統一が完成した。","id":"s5b08-074","u":"s5b08"},{"q":"土地の広さや、そこからとれる米の量などを調べること","a":"検地","y":"けんち","k":"kanji","e":"秀吉以前にも戦国大名が行っていた。秀吉の全国的な検地を太閤検地という。","id":"s5b08-075","u":"s5b08"},{"q":"1582年から豊臣秀吉が役人を派遣して村ごとに行った、全国的な規模の検地","a":"太閤検地","y":"たいこうけんち","k":"kanji","e":"年貢を確実に取るため。土地の面積・よしあし・耕作者・石高を検地帳に記録した。","id":"s5b08-076","u":"s5b08"},{"q":"「太閤」とは、どのような人のよび名ですか","a":"関白をしりぞいた後の人のよび名","k":"free","e":"豊臣秀吉が関白をゆずった後にそうよばれたので、秀吉の検地を太閤検地という。","id":"s5b08-077","u":"s5b08"},{"q":"太閤検地で、土地の面積や耕している百姓、石高などを記録した帳簿","a":"検地帳","y":"けんちちょう","k":"kanji","e":"これに記された百姓は田畑を耕す権利を認められたが、年貢を納める義務を負い、土地をはなれられなくなった。","id":"s5b08-078","u":"s5b08"},{"q":"土地の生産力を、そこからとれる米の量であらわしたもの","a":"石高","y":"こくだか","k":"kanji","e":"1石は約180Lで、重さ約150kg。太閤検地で統一されたますで100杯分。","id":"s5b08-079","u":"s5b08"},{"q":"太閤検地で統一されたものを2つ答えなさい","a":"ものさしとます","k":"free","e":"土地の面積と米の量を全国同じ基準ではかれるようにした。","id":"s5b08-080","u":"s5b08"},{"q":"太閤検地によって、百姓はどのような権利と義務をもつことになりましたか","a":"田畑を耕す権利を認められたが、年貢を納める義務を負い、土地をはなれることができなくなった","k":"free","e":"「耕作の権利」と「年貢の義務」の両方を書く。","id":"s5b08-081","u":"s5b08"},{"q":"太閤検地によって、公家や寺社の土地の権利はどうなりましたか","a":"それまでの土地の権利を失い、荘園は完全になくなった","k":"free","e":"奈良時代から続いた荘園が消えた。","id":"s5b08-082","u":"s5b08"},{"q":"1588年、豊臣秀吉が百姓から刀や鉄砲などの武器を取りあげた政策","a":"刀狩令","y":"かたながりれい","k":"kanji","e":"ねらいは一揆を防ぎ、田畑の耕作にうちこませること。大仏の釘にするという名目だった。","alt":["刀狩"],"id":"s5b08-083","u":"s5b08"},{"q":"刀狩のおもなねらいを説明しなさい","a":"百姓の一揆を防いで、田畑の耕作にうちこませること","k":"free","e":"武器をたくわえて年貢を出ししぶる者はきびしく処罰するとした。","id":"s5b08-084","u":"s5b08"},{"q":"刀狩令で、取りあげた刀は何に使うとされましたか","a":"新しくつくる大仏の釘など","k":"free","e":"「仏のめぐみで死後も救われる」と説いた。","id":"s5b08-085","u":"s5b08"},{"q":"刀狩によって、武士と百姓の身分がはっきり区別されたこと","a":"兵農分離","y":"へいのうぶんり","k":"kanji","e":"武士と商工業者は城下町に集められ、職業と身分を変えることが禁止された。身分をもとにした社会の土台ができた。","id":"s5b08-086","u":"s5b08"},{"q":"豊臣秀吉が直接支配した都市を2つ答えなさい","a":"京都・大阪・堺・博多（から2つ）","k":"free","e":"金山や銀山も支配下に置いた。","id":"s5b08-087","u":"s5b08"},{"q":"豊臣氏などがつくらせた、たての長さ約17.8cmの大きな金貨","a":"天正大判","y":"てんしょうおおばん","k":"kanji","e":"金山・銀山を支配した秀吉の力を示す。","id":"s5b08-088","u":"s5b08"},{"q":"豊臣秀吉がキリスト教の布教を禁止した年と、きっかけを答えなさい","a":"1587年。長崎がキリシタン大名によって寄進され、教会の領地となっていたことを知ったから","k":"free","e":"貿易は続けたので、禁止の効果はあまりなかった。","id":"s5b08-089","u":"s5b08"},{"q":"豊臣秀吉の布教禁止の効果があまりなかったのはなぜですか","a":"南蛮貿易は続けたから","k":"free","e":"宣教師は貿易船とともにやって来たため。","id":"s5b08-090","u":"s5b08"},{"q":"豊臣秀吉が、中国（明）を征服しようとして朝鮮に大軍を送ったこと","a":"朝鮮侵略","y":"ちょうせんしんりゃく","k":"kanji","e":"1592年の文禄の役と1597年の慶長の役。朝鮮が明への協力を断ったため。","alt":["朝鮮出兵"],"id":"s5b08-091","u":"s5b08"},{"q":"豊臣秀吉が征服しようとした、当時の中国の王朝","a":"明","y":"みん","k":"kanji","e":"室町時代には日明貿易の相手だった。","id":"s5b08-092","u":"s5b08"},{"q":"1592年に始まった、豊臣秀吉の1度目の朝鮮侵略","a":"文禄の役","y":"ぶんろくのえき","k":"kanji","e":"朝鮮の首都漢城（現在のソウル）を占領したが、朝鮮の民衆や李舜臣の水軍の抵抗にあい、明の援軍もあって休戦した。","id":"s5b08-093","u":"s5b08"},{"q":"1597年に始まった、豊臣秀吉の2度目の朝鮮侵略","a":"慶長の役","y":"けいちょうのえき","k":"kanji","e":"苦戦が続き、1598年に秀吉が病死したことをきっかけに日本軍は引きあげた。","id":"s5b08-094","u":"s5b08"},{"q":"豊臣秀吉が朝鮮に大軍を送った目的と、そのいきさつを説明しなさい","a":"中国（明）を征服するために朝鮮に協力を求めたが、朝鮮が断ったので、朝鮮を侵略した","k":"free","e":"記述問題の定番。「明の征服」「朝鮮が断った」を入れる。","id":"s5b08-095","u":"s5b08"},{"q":"豊臣秀吉が、明を征服する準備のために城を築いた、肥前国（佐賀県）の地名","a":"名護屋","y":"なごや","k":"kanji","e":"愛知県の名古屋とまぜない。","id":"s5b08-096","u":"s5b08"},{"q":"文禄の役で日本軍が占領した、朝鮮の首都（現在のソウル）","a":"漢城","y":"かんじょう","k":"kanji","e":"占領の後、はげしい抵抗にあった。","id":"s5b08-097","u":"s5b08"},{"q":"亀甲船を用いた水軍を率いて、日本の水軍を破った朝鮮の武将","a":"李舜臣","y":"りしゅんしん","k":"kanji","e":"朝鮮の英雄。「舜」の字に注意。","id":"s5b08-098","u":"s5b08"},{"q":"李舜臣の水軍が用いた、船の上を鉄板でおおった船","a":"亀甲船","y":"きっこうせん","k":"kanji","e":"日本の水軍を破った。","id":"s5b08-099","u":"s5b08"},{"q":"朝鮮侵略が終わったきっかけは何ですか","a":"1598年に豊臣秀吉が病死したこと","k":"free","e":"日本軍は全軍が朝鮮から引きあげた。","id":"s5b08-100","u":"s5b08"},{"q":"朝鮮侵略が豊臣氏に与えた影響を説明しなさい","a":"武士や百姓に重い負担となり、大名どうしが対立して、豊臣氏の支配がおとろえる原因の1つになった","k":"free","e":"朝鮮では人口が大きく減り、多くの文化財が失われた。","id":"s5b08-101","u":"s5b08"},{"q":"朝鮮侵略のとき連れてこられた陶工によって始められた、佐賀県の焼き物","a":"有田焼","y":"ありたやき","k":"kanji","e":"17世紀半ばにはヨーロッパに大量に輸出された。佐賀県の伝統的工芸品。","id":"s5b08-102","u":"s5b08"},{"q":"朝鮮から連れてこられた陶工によって西日本で始められた焼き物を、有田焼のほかに2つ答えなさい","a":"薩摩焼（鹿児島県）と萩焼（山口県）","k":"free","e":"朝鮮侵略が日本の文化に残した影響。","id":"s5b08-103","u":"s5b08"},{"q":"朝鮮侵略で日本に連れてこられた、焼き物をつくるすぐれた技術をもった人々","a":"陶工","y":"とうこう","k":"kanji","e":"西日本の各地で焼き物をつくった。","id":"s5b08-104","u":"s5b08"},{"q":"織田信長のころに始まり、豊臣秀吉のときに栄えた、大名や大商人による豪華で雄大な文化","a":"桃山文化","y":"ももやまぶんか","k":"kanji","e":"仏教の影響がうすく、南蛮文化の影響を強く受けた、活気に満ちた文化。江戸時代の初めごろまで続いた。","id":"s5b08-105","u":"s5b08"},{"q":"桃山文化の特色を、文化のにない手と性格から説明しなさい","a":"新しくおこった大名や大商人による、豪華で雄大な文化。仏教の影響がうすく、南蛮文化の影響を強く受けた","k":"free","e":"「大名・大商人」「豪華で雄大」「南蛮文化の影響」を入れる。","id":"s5b08-106","u":"s5b08"},{"q":"桃山文化が、仏教の影響がうすい一方で強く影響を受けた文化は何ですか","a":"南蛮文化","k":"free","e":"ヨーロッパ（スペイン・ポルトガル）から伝わった文化。","id":"s5b08-107","u":"s5b08"},{"q":"桃山文化を代表する、高くそびえる天守をもつ雄大な城の建築","a":"城郭建築","y":"じょうかくけんちく","k":"kanji","e":"安土城・大阪城・伏見城・姫路城など。","id":"s5b08-108","u":"s5b08"},{"q":"城の中心にそびえる、高い建物","a":"天守","y":"てんしゅ","k":"kanji","e":"桃山文化の城郭建築の特色。","id":"s5b08-109","u":"s5b08"},{"q":"現在の兵庫県にあり、世界文化遺産に登録されている桃山文化の城","a":"姫路城","y":"ひめじじょう","k":"kanji","e":"白い壁から白鷺城ともよばれる。","id":"s5b08-110","u":"s5b08"},{"q":"豊臣秀吉が全国統一の後に現在の京都市南部に建てた城。あと地に桃の木が植えられ、桃山とよばれた","a":"伏見城","y":"ふしみじょう","k":"kanji","e":"安土・桃山時代の「桃山」のもと。秀吉が隠居した後の住まいとした。","id":"s5b08-111","u":"s5b08"},{"q":"金や銀を下地にしたあざやかな色彩で、ふすまやびょうぶに描かれた絵","a":"障壁画","y":"しょうへきが","k":"kanji","e":"狩野永徳ら狩野派の人々が描いた。","id":"s5b08-112","u":"s5b08"},{"q":"桃山文化を代表する障壁画「唐獅子図屏風」を描いた画家","a":"狩野永徳","y":"かのうえいとく","k":"kanji","e":"狩野派の中心人物。","id":"s5b08-113","u":"s5b08"},{"q":"狩野永徳が描いた、代表的なびょうぶ絵","a":"唐獅子図屏風","y":"からじしずびょうぶ","k":"kanji","e":"金色の下地に2頭の獅子が描かれている。","id":"s5b08-114","u":"s5b08"},{"q":"豊臣秀吉に仕え、茶道（茶の湯）を大成した堺の大商人","a":"千利休","y":"せんのりきゅう","k":"kanji","e":"茶道の流行にともない、茶器などの陶磁器も発達した。","id":"s5b08-115","u":"s5b08"},{"q":"千利休が大成した、茶を楽しむ作法","a":"茶道","y":"さどう","k":"kanji","e":"茶の湯ともいう。","alt":["茶の湯"],"id":"s5b08-116","u":"s5b08"},{"q":"琉球から伝えられた、三味線のもとになった楽器","a":"三線","y":"さんしん","k":"kanji","e":"中国の楽器をもとにしたもの。改良されて三味線がつくられた。","id":"s5b08-117","u":"s5b08"},{"q":"三線を改良してつくられ、その音に合わせて物語を語る浄瑠璃に使われた楽器","a":"三味線","y":"しゃみせん","k":"kanji","e":"浄瑠璃が広まった。","id":"s5b08-118","u":"s5b08"},{"q":"三味線の音に合わせて物語を語る芸能","a":"浄瑠璃","y":"じょうるり","k":"kanji","e":"後の江戸時代に人形浄瑠璃として発展する。","id":"s5b08-119","u":"s5b08"},{"q":"出雲の阿国という女性によって始められた、にぎやかな踊り","a":"阿国歌舞伎","y":"おくにかぶき","k":"kanji","e":"安土・桃山時代の終わりごろ。後に歌舞伎に発展した。","alt":["かぶき踊り"],"id":"s5b08-120","u":"s5b08"},{"q":"阿国歌舞伎を始めた女性","a":"出雲の阿国","y":"いずものおくに","k":"kanji","e":"出雲（島根県）出身とされる。","alt":["阿国"],"id":"s5b08-121","u":"s5b08"},{"q":"阿国歌舞伎は、後に何に発展しましたか","a":"歌舞伎","k":"free","e":"江戸時代に町人の文化として栄える。","id":"s5b08-122","u":"s5b08"},{"q":"織田信長に関係する次のできごとを、年とあわせて答えなさい：桶狭間の戦い・室町幕府の滅亡・長篠の戦い・本能寺の変","a":"桶狭間の戦い1560年・室町幕府の滅亡1573年・長篠の戦い1575年・本能寺の変1582年","k":"free","e":"「1560桶狭間→1573幕府滅亡→1575長篠→1576安土城→1582本能寺」の順で覚える。","id":"s5b08-123","u":"s5b08"},{"q":"豊臣秀吉に関係する次のできごとを、年とあわせて答えなさい：関白になる・刀狩令・全国統一・文禄の役・慶長の役","a":"関白1585年・刀狩令1588年・全国統一1590年・文禄の役1592年・慶長の役1597年","k":"free","e":"太閤検地は1582年から。布教の禁止は1587年。","id":"s5b08-124","u":"s5b08"},{"id":"k5b01-001","u":"k5b01","q":"めずらしい石を【シュウシュウ】するのが趣味だ。","a":"収集","y":"しゅうしゅう","k":"kanji","e":"集めること。混乱をおさめる「収拾」と区別する。"},{"id":"k5b01-002","u":"k5b01","q":"さわぎの【シュウシュウ】がつかなくなる。","a":"収拾","y":"しゅうしゅう","k":"kanji","e":"混乱した状態をまとめること。集める「収集」と区別する。"},{"id":"k5b01-003","u":"k5b01","q":"大会で優勝という成果を【おさめる】。","a":"収","y":"おさめる","k":"kanji","e":"手に入れる、中に入れるときは「収める」。税金は「納める」、国は「治める」、学問は「修める」。","s":"める"},{"id":"k5b01-004","u":"k5b01","q":"世界のさまざまな【シュウキョウ】について調べる。","a":"宗教","y":"しゅうきょう","k":"kanji","e":"神や仏を信じること。その教え。"},{"id":"k5b01-005","u":"k5b01","q":"仏教には多くの【シュウハ】がある。","a":"宗派","y":"しゅうは","k":"kanji","e":"同じ宗教の中で分かれたグループ。"},{"id":"k5b01-006","u":"k5b01","q":"キリスト教に【カイシュウ】する。","a":"改宗","y":"かいしゅう","k":"kanji","e":"信じる宗教を変えること。"},{"id" "e":"ある目的のために取り付けた、しかけや機械。"},{"id":"k5b04-025","u":"k5b04","q":"プレゼントをきれいに【ホウソウ】する。","a":"包装","y":"ほうそう","k":"kanji","e":"品物を紙などで包むこと。"},{"id":"k5b04-026","u":"k5b04","q":"がけに【チソウ】がしま模様に見える。","a":"地層","y":"ちそう","k":"kanji","e":"土や岩が積み重なってできた層。"},{"id":"k5b04-027","u":"k5b04","q":"駅前に【コウソウ】ビルが立ちならぶ。","a":"高層","y":"こうそう","k":"kanji","e":"建物の階が高く重なっていること。"},{"id":"k5b04-028","u":"k5b04","q":"朝のラジオ【タイソウ】に参加する。","a":"体操","y":"たいそう","k":"kanji","e":"体をきたえるために行う運動。"},{"id":"k5b04-029","u":"k5b04","q":"説明書を読んで機械を【ソウサ】する。","a":"操作","y":"そうさ","k":"kanji","e":"機械などを動かすこと。"},{"id":"k5b04-030","u":"k5b04","q":"糸で人形を【あやつる】。","a":"操","y":"あやつる","k":"kanji","e":"思いどおりに動かす。","s":"る"},{"id":"k5b01-017","u":"k5b04","q":"飛行機を【ソウジュウ】する。","a":"操縦","y":"そうじゅう","k":"kanji","e":"乗り物などをあやつって動かすこと。"},{"q":"教会で【センレイ】を受ける。","a":"洗礼","y":"せんれい","k":"kanji","e":"キリスト教の信者になる儀式。はじめて受けるきびしい経験。","id":"k5b04-031","u":"k5b04"},{"q":"【そめもの】の工場を見学する。","a":"染め物","y":"そめもの","k":"kanji","e":"布を色でそめること。そめた品物。","id":"k5b04-032","u":"k5b04"},{"q":"シャツの【しみぬき】をする。","a":"染み抜き","y":"しみぬき","k":"kanji","e":"衣服についたよごれを取ること。「染み」はよごれ。","id":"k5b04-033","u":"k5b04"},{"q":"昔は【デンセンビョウ】で多くの人が亡くなった。","a":"伝染病","y":"でんせんびょう","k":"kanji","e":"人から人へうつる病気。","id":"k5b04-034","u":"k5b04"},{"q":"【アクセン】身につかず。","a":"悪銭","y":"あくせん","k":"kanji","e":"不正な方法で手に入れたお金。「悪銭身につかず」は、悪いことで得たお金はすぐなくなるということわざ。","id":"k5b04-035","u":"k5b04"},{"q":"店で【つりセン】を受け取る。","a":"つり銭","y":"つりせん","k":"kanji","e":"おつり。「投げ銭」「小銭」も同じ字。","id":"k5b04-036","u":"k5b04"},{"q":"強い相手に【ゼンセン】する。","a":"善戦","y":"ぜんせん","k":"kanji","e":"力を十分に出してよく戦うこと。","id":"k5b04-037","u":"k5b04"},{"q":"【よい】行いを続ける。","a":"善","y":"よい","k":"kanji","e":"道徳的に正しい。品質がすぐれているときは「良い」。","s":"い","id":"k5b04-038","u":"k5b04"},{"q":"家来が殿様に【ソウジョウ】する。","a":"奏上","y":"そうじょう","k":"kanji","e":"天皇や君主に申し上げること。","id":"k5b04-039","u":"k5b04"},{"q":"駅の【まどぐち】で切符を買う。","a":"窓口","y":"まどぐち","k":"kanji","e":"受付や、お金や品物の受けわたしをする所。","id":"k5b04-040","u":"k5b04"},{"q":"【まどべ】に花をかざる。","a":"窓辺","y":"まどべ","k":"kanji","e":"窓のそば。","id":"k5b04-041","u":"k5b04"},{"q":"【ソウイ】工夫をこらした作品。","a":"創意","y":"そうい","k":"kanji","e":"新しい考えや思いつき。","id":"k5b04-042","u":"k5b04"},{"q":"発表会の【イショウ】を作る。","a":"衣装","y":"いしょう","k":"kanji","e":"着る物。舞台で着る服。「馬子にも衣装」。","id":"k5b04-043","u":"k5b04"},{"q":"何も知らないふりを【よそおう】。","a":"装","y":"よそおう","k":"kanji","e":"身なりを整える。そのように見せかける。","s":"う","id":"k5b04-044","u":"k5b04"},{"q":"選手の【ソウ】が厚いチーム。","a":"層","y":"そう","k":"kanji","e":"重なり。「層が厚い」は人材が豊富なこと。","id":"k5b04-045","u":"k5b04"},{"q":"年齢【カイソウ】ごとに集計する。","a":"階層","y":"かいそう","k":"kanji","e":"年齢や収入などで分けた段階。","id":"k5b04-046","u":"k5b04"},{"q":"【セッソウ】のない態度をとる。","a":"節操","y":"せっそう","k":"kanji","e":"自分の考えや主義を守り通すこと。","id":"k5b04-047","u":"k5b04"},{"id":"k5b06-001","u":"k5b06","q":"買ってきた牛乳を【レイゾウコ】に入れる。","a":"冷蔵庫","y":"れいぞうこ","k":"kanji","e":"食べ物を冷やして保存する入れ物。"},{"id":"k5b06-002","u":"k5b06","q":"とれた米を倉庫に【チョゾウ】する。","a":"貯蔵","y":"ちょぞう","k":"kanji","e":"たくわえておくこと。"},{"id":"k5b06-003","u":"k5b06","q":"学校図書館の【ゾウショ】を調べる。","a":"蔵書","y":"ぞうしょ","k":"kanji","e":"持っている本。"},{"id":"k5b06-004","u":"k5b06","q":"走ったあとは【シンゾウ】がどきどきする。","a":"心臓","y":"しんぞう","k":"kanji","e":"血液を体に送り出す器官。体の器官は「臓」（にくづき）。"},{"id":"k5b06-005","u":"k5b06","q":"病院で【ナイゾウ】の検査を受ける。","a":"内臓","y":"ないぞう","k":"kanji","e":"体の中にある器官。機械に組みこむ「内蔵」と区別する。"},{"id":"k5b06-006","u":"k5b06","q":"【ゾウキ】移植の手術を行う。","a":"臓器","y":"ぞうき","k":"kanji","e":"体の中の器官。心臓・胃・じん臓など。"},{"id":"k5b06-007","u":"k5b06","q":"写真をパソコンに【ホゾン】する。","a":"保存","y":"ほぞん","k":"kanji","e":"そのままの状態でとっておくこと。"},{"id":"k5b06-008","u":"k5b06","q":"夏休みを【ゾンブン】に楽しむ。","a":"存分","y":"ぞんぶん","k":"kanji","e":"思いどおりに、十分に。"},{"id":"k5b06-009","u":"k5b06","q":"クラブ活動の【ソンゾク】が決まる。","a":"存続","y":"そんぞく","k":"kanji","e":"なくならずに続いていくこと。"},{"id":"k5b06-010","u":"k5b06","q":"わたしが【ソンケイ】する人物。","a":"尊敬","y":"そんけい","k":"kanji","e":"りっぱだと思って、うやまうこと。"},{"id":"k5b06-011","u":"k5b06","q":"相手の考えを【ソンチョウ】する。","a":"尊重","y":"そんちょう","k":"kanji","e":"大切なものとして、重んじること。"},{"id":"k5b06-012","u":"k5b06","q":"【とうとい】命を守る。","a":"尊","y":"とうとい","k":"kanji","e":"ねうちが高く、大切である。「たっとい」とも読む。","s":"い"},{"id":"k5b06-013","u":"k5b06","q":"人気選手が【インタイ】を発表する。","a":"引退","y":"いんたい","k":"kanji","e":"仕事や地位からしりぞくこと。"},{"id":"k5b06-014","u":"k5b06","q":"会長の職を【しりぞく】。","a":"退","y":"しりぞく","k":"kanji","e":"後ろへ下がる。地位や仕事をやめる。","s":"く"},{"id":"k5b06-015","u":"k5b06","q":"畑を荒らす害虫を【タイジ】する。","a":"退治","y":"たいじ","k":"kanji","e":"害をするものを、うちほろぼすこと。"},{"id":"k5b06-016","u":"k5b06","q":"自動車がゆっくり【コウタイ】する。","a":"後退","y":"こうたい","k":"kanji","e":"後ろへ下がること。反対は前進。"},{"id":"k5b06-017","u":"k5b06","q":"父は夕方六時に【キタク】する。","a":"帰宅","y":"きたく","k":"kanji","e":"自分の家に帰ること。"},{"id":"k5b06-018","u":"k5b06","q":"【ジタク】で受験勉強をする。","a":"自宅","y":"じたく","k":"kanji","e":"自分の家。"},{"id":"k5b06-019","u":"k5b06","q":"駅の近くに新しい【ジュウタク】が建つ。","a":"住宅","y":"じゅうたく","k":"kanji","e":"人が住むための家。"},{"id":"k5b06-020","u":"k5b06","q":"そうじの【タントウ】を決める。","a":"担当","y":"たんとう","k":"kanji","e":"仕事や役目を受け持つこと。"},{"id":"k5b06-021","u":"k5b06","q":"家計の【フタン】を軽くする。","a":"負担","y":"ふたん","k":"kanji","e":"引き受けること。重荷。"},{"id":"k5b06-022","u":"k5b06","q":"五年二組の【タンニン】の先生。","a":"担任","y":"たんにん","k":"kanji","e":"クラスなどを受け持つこと。"},{"id":"k5b06-023","u":"k5b06","q":"【タクハイビン】で荷物を送る。","a":"宅配便","y":"たくはいびん","k":"kanji","e":"荷物を家まで届けるしくみ。"},{"id":"k5b06-024","u":"k5b06","q":"仲間とどうくつを【タンケン】する。","a":"探検","y":"たんけん","k":"kanji","e":"知らない所に行って、実際に調べること。","alt":["探険"]},{"id":"k5b06-025","u":"k5b06","q":"落とした消しゴムを【さがす】。","a":"探","y":"さがす","k":"kanji","e":"見つけようとして、たずね求める。","s":"す"},{"id":"k5b06-026","u":"k5b06","q":"自然のしくみを【タンキュウ】する。","a":"探究","y":"たんきゅう","k":"kanji","e":"物事の本当の姿を深く研究すること（真理を探究する）。さがし求めるときは「探求」。","alt":["探求"]},{"id":"k5b06-027","u":"k5b06","q":"新しい命が【タンジョウ】する。","a":"誕生","y":"たんじょう","k":"kanji","e":"人や物が生まれること。"},{"id":"k5b06-028","u":"k5b06","q":"有名な作曲家の【セイタン】二百年を祝う。","a":"生誕","y":"せいたん","k":"kanji","e":"生まれること。"},{"id":"k5b06-029","u":"k5b06","q":"駅の【カイダン】を上る。","a":"階段","y":"かいだん","k":"kanji","e":"上り下りするための、だんだんになった通路。"},{"id":"k5b06-030","u":"k5b06","q":"連絡の【シュダン】を考える。","a":"手段","y":"しゅだん","k":"kanji","e":"目的をはたすための方法。"},{"id":"k5b06-031","u":"k5b06","q":"長い文章を【ダンラク】に分ける。","a":"段落","y":"だんらく","k":"kanji","e":"文章の中の、ひとまとまりの区切り。"},{"id":"k5b06-032","u":"k5b06","q":"練習して【カクダン】に進歩する。","a":"格段","y":"かくだん","k":"kanji","e":"ちがいがとても大きいようす。"},{"q":"道ばたのお【ジゾウ】様に手を合わせる。","a":"地蔵","y":"じぞう","k":"kanji","e":"人を救い守る仏。お地蔵様。","id":"k5b06-033","u":"k5b06"},{"q":"魚の【ゾウモツ】を取りのぞく。","a":"臓物","y":"ぞうもつ","k":"kanji","e":"はらわた。鳥や魚などの内臓。","id":"k5b06-034","u":"k5b06"},{"q":"次の試合に備えて力を【オンゾン】する。","a":"温存","y":"おんぞん","k":"kanji","e":"大切に取っておくこと。","id":"k5b06-035","u":"k5b06"},{"q":"【ソンダイ】な態度でいばる。","a":"尊大","y":"そんだい","k":"kanji","e":"えらぶっていばる様子。","id":"k5b06-036","u":"k5b06"},{"q":"先生のお【タク】にうかがう。","a":"宅","y":"たく","k":"kanji","e":"相手の家。「お宅」は相手やその家をていねいに言う言葉。","id":"k5b06-037","u":"k5b06"},{"q":"未来を【になう】子どもたち。","a":"担","y":"になう","k":"kanji","e":"引き受ける。かつぐ。","s":"う","id":"k5b06-038","u":"k5b06"},{"q":"幸せとは何かを【タンキュウ】する。","a":"探求","y":"たんきゅう","k":"kanji","e":"さがし求めること（幸福を探求する・原因を探求する）。物事の本当の姿を深く研究するときは「探究」。","id":"k5b06-039","u":"k5b06"},{"q":"金属を【タンチ】する機械。","a":"探知","y":"たんち","k":"kanji","e":"さぐって見つけ出すこと。","id":"k5b06-040","u":"k5b06"},{"q":"キリストの【コウタン】を祝う。","a":"降誕","y":"こうたん","k":"kanji","e":"神仏や聖人が生まれること。","id":"k5b06-041","u":"k5b06"},{"q":"友だちの【タンジョウビ】にプレゼントをわたす。","a":"誕生日","y":"たんじょうび","k":"kanji","e":"生まれた日。","id":"k5b06-042","u":"k5b06"},{"q":"こごえた手を火で【あたためる】。","a":"暖","y":"あたためる","k":"kanji","e":"あたたかくする。「温める」は料理や気持ち、「暖める」は空気や体に使う。","s":"める","id":"k5b07-001","u":"k5b07"},{"q":"【オンダン】な地方では、冬でも雪がほとんど降らない。","a":"温暖","y":"おんだん","k":"kanji","e":"気候があたたかくおだやかなこと。","id":"k5b07-002","u":"k5b07"},{"q":"今年は【ダントウ】で、コートを着ない日が多かった。","a":"暖冬","y":"だんとう","k":"kanji","e":"いつもの年よりあたたかい冬。","id":"k5b07-003","u":"k5b07"},{"q":"【あたたかな】日差しの中で昼寝をする。","a":"暖","y":"あたたかな","k":"kanji","e":"あたたかいこと。「暖色」「暖流」「暖房」も同じ字。","s":"かな","id":"k5b07-004","u":"k5b07"},{"q":"この古い切手には高い【カチ】がある。","a":"価値","y":"かち","k":"kanji","e":"どれほど役に立つものか、という程度。","id":"k5b07-005","u":"k5b07"},{"q":"【ネダン】を見くらべて、安いほうを買う。","a":"値段","y":"ねだん","k":"kanji","e":"商品を売り買いするときにつける金額。","id":"k5b07-006","u":"k5b07"},{"id":"k5b07-041","u":"k5b07","q":"駅前の店は、同じ野菜でも【ね】が高い。","a":"値","y":"ね","k":"kanji","e":"物の値段のこと。「値」の訓読み。「値が張る」は値段が高いこと。「値上げ」「値札」も同じ字。"},{"q":"長く使えるものは【ねうち】がある。","a":"値打","y":"ねうち","k":"kanji","e":"物の良さ、便利さの程度。「値打ち」と送る。","s":"ち","id":"k5b07-007","u":"k5b07"},{"q":"五回のテストの【ヘイキンチ】を出す。","a":"平均値","y":"へいきんち","k":"kanji","e":"いくつかの数量をならした中間的な数値。「値」は数の大きさ。","id":"k5b07-008","u":"k5b07"},{"q":"体操の選手が空中で【チュウがえり】をする。","a":"宙返","y":"ちゅうがえり","k":"kanji","e":"地面に着かずに空中で回転すること。「宙返り」と送る。","s":"り","id":"k5b07-009","u":"k5b07"},{"q":"人工衛星が【ウチュウ】から地球の写真を送る。","a":"宇宙","y":"うちゅう","k":"kanji","e":"天地のすべての物をふくむ広がり。","id":"k5b07-010","u":"k5b07"},{"q":"ボールが【チュウ】に浮いたように見えた。","a":"宙","y":"ちゅう","k":"kanji","e":"空中。「宙に舞う」「宙づり」。","id":"k5b07-011","u":"k5b07"},{"q":"犬は飼い主に【チュウジツ】な動物だ。","a":"忠実","y":"ちゅうじつ","k":"kanji","e":"まじめにまごころをつくしてつとめること。","id":"k5b07-013","u":"k5b07"},{"q":"友人の【チュウコク】を聞いて、計画を見直した。","a":"忠告","y":"ちゅうこく","k":"kanji","e":"人の悪い点をその人のために注意すること。","id":"k5b07-014","u":"k5b07"},{"q":"家来たちは主君に【チュウギ】をつくした。","a":"忠義","y":"ちゅうぎ","k":"kanji","e":"国や主君のためにまごころをつくすこと。","id":"k5b07-015","u":"k5b07"},{"q":"昔の物語には、命がけで主君を守る【チュウシン】が登場する。","a":"忠臣","y":"ちゅうしん","k":"kanji","e":"まごころをつくして主君に仕える家来。","id":"k5b07-016","u":"k5b07"},{"q":"【チョメイ】な作曲家の演奏会に行く。","a":"著名","y":"ちょめい","k":"kanji","e":"世の中によく名前が知られていること。","id":"k5b07-017","u":"k5b07"},{"q":"この本の【チョシャ】は、小学校の先生だった。","a":"著者","y":"ちょしゃ","k":"kanji","e":"その本を書きあらわした人。","id":"k5b07-018","u":"k5b07"},{"q":"長年の研究を一冊の本に【あらわす】。","a":"著","y":"あらわす","k":"kanji","e":"本などを書いて世に出す。「表す」「現す」と区別する。","s":"す","id":"k5b07-019","u":"k5b07"},{"q":"夏の間に、弟の背が【いちじるしく】のびた。","a":"著","y":"いちじるしく","k":"kanji","e":"はっきりと目立つようす。「著しい」と送る。","s":"しく","id":"k5b07-020","u":"k5b07"},{"q":"【カンチョウ】の建物が多い町に引っこした。","a":"官庁","y":"かんちょう","k":"kanji","e":"国の仕事をする役所。","id":"k5b07-021","u":"k5b07"},{"q":"【ケンチョウ】の前の広場で祭りが開かれる。","a":"県庁","y":"けんちょう","k":"kanji","e":"県の仕事を行う中心の役所。","id":"k5b07-022","u":"k5b07"},{"q":"朝八時に【トウチョウ】して仕事を始める。","a":"登庁","y":"とうちょう","k":"kanji","e":"公務員が役所に出勤すること。","id":"k5b07-023","u":"k5b07"},{"q":"【コクゼイチョウ】は、税金を集める仕事をする。","a":"国税庁","y":"こくぜいちょう","k":"kanji","e":"国の税金を集める仕事をする役所。","id":"k5b07-024","u":"k5b07"},{"q":"雲の上に山の【いただき】が見える。","a":"頂","y":"いただき","k":"kanji","e":"山や丘のてっぺん。","id":"k5b07-025","u":"k5b07"},{"q":"おみやげを【いただく】。","a":"頂","y":"いただく","k":"kanji","e":"「もらう」のけんそんした言い方。「頂き物」。","s":"く","id":"k5b07-026","u":"k5b07"},{"q":"夜明け前に【チョウジョウ】に着いた。","a":"頂上","y":"ちょうじょう","k":"kanji","e":"山のいちばん高い所。","id":"k5b07-027","u":"k5b07"},{"q":"人気が【ゼッチョウ】に達したところで引退した。","a":"絶頂","y":"ぜっちょう","k":"kanji","e":"物事の最高の状態。","id":"k5b07-028","u":"k5b07"},{"q":"【ダイチョウ】は、小腸に続く消化器官だ。","a":"大腸","y":"だいちょう","k":"kanji","e":"小腸の下にある、六〜七メートルのちょう。","id":"k5b07-029","u":"k5b07"},{"q":"食べすぎて【イチョウ】の調子が悪い。","a":"胃腸","y":"いちょう","k":"kanji","e":"胃とちょうなどの消化器官。","id":"k5b07-030","u":"k5b07"},{"q":"別れの場面に、【ダンチョウ】の思いがした。","a":"断腸","y":"だんちょう","k":"kanji","e":"はらわたがちぎれるほど悲しく苦しいこと。「断腸の思い」。","id":"k5b07-031","u":"k5b07"},{"q":"草食動物は【チョウ】が長い。","a":"腸","y":"ちょう","k":"kanji","e":"消化器の一つで胃の下に続くところ。にくづき（月）に注意。","id":"k5b07-032","u":"k5b07"},{"q":"ここらが引退の【しおどき】だと感じた。","a":"潮時","y":"しおどき","k":"kanji","e":"ちょうどよいころあい。もとは潮の満ち引きの時。","id":"k5b07-033","u":"k5b07"},{"q":"流行だからといって、世の【フウチョウ】に流されない。","a":"風潮","y":"ふうちょう","k":"kanji","e":"世の中の様子や考えの動き。","id":"k5b07-034","u":"k5b07"},{"q":"【マンチョウ】の時刻に合わせて船を出す。","a":"満潮","y":"まんちょう","k":"kanji","e":"海水が満ちて、水面が高くなること。反対は干潮。","id":"k5b07-035","u":"k5b07"},{"q":"試合は終了直前に【サイコウチョウ】に達した。","a":"最高潮","y":"さいこうちょう","k":"kanji","e":"気持ちや雰囲気が最も高まったとき。","id":"k5b07-036","u":"k5b07"},{"q":"バスの【ウンチン】が十円上がった。","a":"運賃","y":"うんちん","k":"kanji","e":"人や物を運んでもらったときにはらうお金。","id":"k5b07-037","u":"k5b07"},{"q":"労働者たちが【チンあげ】を求める。","a":"賃上","y":"ちんあげ","k":"kanji","e":"賃金を値上げすること。「賃上げ」と送る。","s":"げ","id":"k5b07-038","u":"k5b07"},{"q":"駅に近いので【やチン】が高い。","a":"家賃","y":"やちん","k":"kanji","e":"家を借りるときに家主にはらうお金。","id":"k5b07-039","u":"k5b07"},{"q":"会社から【チンギン】を受け取る。","a":"賃金","y":"ちんぎん","k":"kanji","e":"仕事をした人に対してはらうお金。","id":"k "る","id":"k5a-621","u":"k5a"},{"q":"ロケットが【ハッシャ】された。","a":"発射","y":"はっしゃ","k":"kanji","e":"弾丸やロケットなどを、うち出すこと。","id":"k5a-622","u":"k5a"},{"q":"鏡は光を【ハンシャ】する。","a":"反射","y":"はんしゃ","k":"kanji","e":"光や音がはね返ること。","id":"k5a-623","u":"k5a"},{"q":"ストーブの熱が【ホウシャ】状に広がる。","a":"放射","y":"ほうしゃ","k":"kanji","e":"一点から四方八方に出ること。","id":"k5a-624","u":"k5a"},{"q":"ごみを道に【すてる】のはやめよう。","a":"捨","y":"すてる","k":"kanji","e":"いらないものとして、投げ出す。","s":"てる","id":"k5a-625","u":"k5a"},{"q":"小数第一位を【シシャゴニュウ】する。","a":"四捨五入","y":"ししゃごにゅう","k":"kanji","e":"四以下は切り捨て、五以上は切り上げること。","id":"k5a-626","u":"k5a"},{"q":"集めた資料を【シュシャ】選択する。","a":"取捨","y":"しゅしゃ","k":"kanji","e":"必要なものを取り、いらないものを捨てること。","id":"k5a-627","u":"k5a"},{"q":"【すてみ】の覚悟で、相手にぶつかっていった。","a":"捨て身","y":"すてみ","k":"kanji","e":"自分の命や身を投げ出す覚悟で、物事にあたること。","id":"k5a-628","u":"k5a"},{"q":"【イッシャク】は、約三十センチメートルだ。","a":"一尺","y":"いっしゃく","k":"kanji","e":"昔の長さの単位。約三十センチメートル。","id":"k5a-629","u":"k5a"},{"q":"祖父は【シャクハチ】をふくのが趣味だ。","a":"尺八","y":"しゃくはち","k":"kanji","e":"竹で作った、たてに持ってふく笛。","id":"k5a-630","u":"k5a"},{"q":"この地図の【シュクシャク】は、二万五千分の一だ。","a":"縮尺","y":"しゅくしゃく","k":"kanji","e":"地図などで、実際の長さをちぢめた割合。","id":"k5a-631","u":"k5a"},{"q":"大工さんが【シャク】を使って木の長さをはかる。","a":"尺","y":"しゃく","k":"kanji","e":"昔の長さの単位。また、ものさし。","id":"k5a-632","u":"k5a"},{"q":"【わかて】の選手が大活躍した。","a":"若手","y":"わかて","k":"kanji","e":"若い人。若くて、これからのびる人。","id":"k5a-633","u":"k5a"},{"q":"五月の山は、【わかば】のみどりが美しい。","a":"若葉","y":"わかば","k":"kanji","e":"出たばかりの、やわらかい葉。","id":"k5a-634","u":"k5a"},{"q":"材料が【ジャッカン】足りない。","a":"若干","y":"じゃっかん","k":"kanji","e":"いくらか。少し。「若」を「ジャッ」と読む。","id":"k5a-635","u":"k5a"},{"q":"【わかい】うちに、いろいろなことに挑戦したい。","a":"若","y":"わかい","k":"kanji","e":"年が少ない。","s":"い","id":"k5a-636","u":"k5a"},{"q":"【カジュエン】でりんごがりをした。","a":"果樹園","y":"かじゅえん","k":"kanji","e":"果物のなる木を育てている畑。","id":"k5a-637","u":"k5a"},{"q":"卒業の記念に、校庭で【ショクジュ】する。","a":"植樹","y":"しょくじゅ","k":"kanji","e":"木を植えること。","id":"k5a-638","u":"k5a"},{"q":"山の【ジュリン】を守る活動に参加する。","a":"樹林","y":"じゅりん","k":"kanji","e":"木が多く生えている所。","id":"k5a-639","u":"k5a"},{"q":"走り高とびで、新記録を【ジュリツ】した。","a":"樹立","y":"じゅりつ","k":"kanji","e":"しっかりと打ち立てること。","id":"k5a-640","u":"k5a"},{"k":"free","q":"色がさめて、もとのあざやかさがなくなる。古くなって、みずみずしさや感動がうすれる。「何年たっても、あの日の思い出は＿＿＿＿ことがない。」","a":"色あせる","y":"いろあせる","id":"w5a-001","u":"w5a"},{"k":"free","q":"自分はすぐれていると思いこんで、いい気になる。「一度ほめられたくらいで＿＿＿＿＿のは、まだ早い。」","a":"うぬぼれる","y":"うぬぼれる","id":"w5a-002","u":"w5a"},{"k":"free","q":"わざと。また、とりわけ、特に。「今朝は＿＿＿＿冷えこみがきびしい。」","a":"ことさら","y":"ことさら","e":"「ことさらに大声を出す」のように、わざとの意味でも使う。","id":"w5a-003","u":"w5a"},{"k":"free","q":"痛みや不快な気持ちから、まゆのあたりにしわを寄せる。「にがい薬を飲んで、弟は＿＿＿＿＿＿。」","a":"顔をしかめる","y":"しかめる","id":"w5a-004","u":"w5a"},{"k":"free","q":"気持ちがだんだん強くなる。また、人や物を広く呼びかけて集める。「日がたつほど、ふるさとへの思いが＿＿。」","a":"募る","y":"つのる","e":"「参加者を募る」は、集めるの意味。","id":"w5a-005","u":"w5a"},{"k":"free","q":"行いや言葉づかいが下品で、見ていて恥ずかしい。「口に食べ物を入れたまま話すのは＿＿＿＿＿。」","a":"はしたない","y":"はしたない","id":"w5a-006","u":"w5a"},{"k":"free","q":"病気や心配ごとのせいで、やせて元気がなくなる。「長い入院で、すっかり＿＿＿＿。」","a":"やつれる","y":"やつれる","id":"w5a-007","u":"w5a"},{"k":"free","q":"もう見こみがないと判断して、あきらめて相手にしなくなる。「約束を何度も破る人は、いつか友だちに＿＿＿。」","a":"見限る","y":"みかぎる","id":"w5a-008","u":"w5a"},{"k":"free","q":"対立する二つのものが、ゆずらずにおし合いをくり返す。「二つのチームが、一点を争って＿＿＿＿＿。」","a":"せめぎあう","y":"せめぎあう","id":"w5a-009","u":"w5a"},{"k":"free","q":"体や顔が熱をもって、熱く感じる。「走ったあとで、顔が＿＿＿。」","a":"ほてる","y":"ほてる","id":"w5a-010","u":"w5a"},{"k":"free","q":"上を見る。また、人を尊敬する。教えや助けを求める。「校長先生の指示を＿＿。」","a":"仰ぐ","y":"あおぐ","e":"「空を仰ぐ」「師と仰ぐ」など、意味がいくつかある。","id":"w5a-011","u":"w5a"},{"k":"free","q":"こわくなって、気持ちがくじける。しりごみする。「相手の体の大きさに、一瞬＿＿＿。」","a":"ひるむ","y":"ひるむ","id":"w5a-012","u":"w5a"},{"k":"free","q":"はげしいいかり。「不正を見て、＿＿を感じる。」","a":"憤り","y":"いきどおり","e":"動詞は「憤る（いきどおる）」。","id":"w5a-013","u":"w5a"},{"k":"free","q":"似たものにたとえる。「人生を長い旅に＿＿＿＿＿。」","a":"なぞらえる","y":"なぞらえる","id":"w5a-014","u":"w5a"},{"k":"free","q":"とりとめがなく、中身がうすい。また、子どもっぽくて、思慮が足りない。「友だちと＿＿＿＿＿おしゃべりをして笑い合う。」","a":"たわいない","y":"たわいない","e":"「他愛ない」とも書く。","id":"w5a-015","u":"w5a"},{"k":"free","q":"どうあつかってよいか分からず、手のほどこしようがない。「おこった弟は、だれにも＿＿＿＿＿＿＿＿。」","a":"手がつけられない","y":"てがつけられない","id":"w5a-016","u":"w5a"},{"k":"free","q":"興味や関心から、自分に関係のないことにまで関わる。「人のけんかに＿＿＿＿＿＿のはよそう。」","a":"首をつっこむ","y":"くびをつっこむ","id":"w5a-017","u":"w5a"},{"k":"free","q":"同じ注意を、何度もくり返して言う様子。「宿題を先にやるようにと、母に＿＿＿＿＿＿＿＿言われた。」","a":"口を酸っぱくして","y":"くちをすっぱくして","id":"w5a-018","u":"w5a"},{"k":"free","q":"頭の回転が速く、判断がするどい。「姉は＿＿＿＿＿ので、むずかしい問題もすぐに解いてしまう。」","a":"頭が切れる","y":"あたまがきれる","id":"w5a-019","u":"w5a"},{"k":"free","q":"何かにつけて、相手を敵のようににくむ。「どうしてあの人は、ぼくを＿＿＿＿＿＿のだろう。」","a":"目の敵にする","y":"めのかたきにする","id":"w5a-020","u":"w5a"},{"k":"free","q":"聞くつもりはなかったのに、ちらりと聞く。「転校生が来るという話を＿＿＿＿＿＿。」","a":"小耳にはさむ","y":"こみみにはさむ","id":"w5a-021","u":"w5a"},{"k":"free","q":"あることをきっかけに、今まで分からなかったことが急に分かるようになる。「先生の説明を聞いて、＿＿＿＿＿＿＿＿思いがした。」","a":"目から鱗が落ちる","y":"めからうろこがおちる","e":"聖書の中の話がもとになっている。","id":"w5a-022","u":"w5a"},{"k":"free","q":"食べ物がくさりやすい。また、売れ行きがよい。「魚は＿＿＿＿ので、早めに食べよう。」","a":"足が早い","y":"あしがはやい","id":"w5a-023","u":"w5a"},{"k":"free","q":"物事がさしせまって、あわてて取りかからなければならなくなる。「しめ切りが明日にせまり、＿＿＿＿＿＿。」","a":"尻に火がつく","y":"しりにひがつく","id":"w5a-024","u":"w5a"},{"k":"free","q":"おどろいたり感心したりして、目を大きく開く。「弟の成長ぶりに＿＿＿＿＿。」","a":"目を見張る","y":"めをみはる","id":"w5a-025","u":"w5a"},{"k":"free","q":"それまでの態度や言葉を、がらりと変える。「ほめられたとたん、＿＿＿＿＿＿＿ように親切になった。」","a":"手のひらを返す","y":"てのひらをかえす","id":"w5a-026","u":"w5a"},{"k":"free","q":"相手のりっぱな行いに、感心して尊敬する気持ちになる。「毎朝ごみ拾いを続ける人には＿＿＿＿＿。」","a":"頭が下がる","y":"あたまがさがる","id":"w5a-027","u":"w5a"},{"k":"free","q":"心残りがあって、その場をはなれがたい気持ちになる。「楽しかった旅行を終えるのは、＿＿＿＿＿＿＿＿思いだった。」","a":"後ろ髪を引かれる","y":"うしろがみをひかれる","id":"w5a-028","u":"w5a"},{"k":"free","q":"小さな欠点やまちがいを取り上げて、とがめる。「そんな小さなことに＿＿＿＿＿＿＿＿必要はない。」","a":"目くじらを立てる","y":"めくじらをたてる","id":"w5a-029","u":"w5a"},{"k":"free","q":"多くのものを集めて、一つにまとめ上げたもの。長年の仕事の成果。「この作品集は、画家の人生の＿＿＿だ。」","a":"集大成","y":"しゅうたいせい","id":"w5a-030","u":"w5a"},{"k":"free","q":"中とはんぱで、いいかげんな様子。「＿＿＿な気持ちでは、この試合には勝てない。」","a":"生半可","y":"なまはんか","id":"w5a-031","u":"w5a"},{"k":"free","q":"身分の低い者が、上の者を実力でたおして、その地位をうばうこと。「戦国時代は＿＿＿の時代といわれる。」","a":"下剋上","y":"げこくじょう","e":"「下克上」とも書く。","id":"w5a-032","u":"w5a"},{"k":"free","q":"その場をごまかすための、つまらないたくらみ。「＿＿＿をしても、すぐに見やぶられる。」","a":"小細工","y":"こざいく","id":"w5a-033","u":"w5a"},{"k":"free","q":"その事がらや土地について、よく知らないこと。「この町には＿＿＿なので、道を教えてほしい。」","a":"不案内","y":"ふあんない","id":"w5a-034","u":"w5a"},{"k":"free","q":"問題にしないで、まったく考えに入れないこと。「もうけを＿＿＿して、お客さんのために安く売る。」","a":"度外視","y":"どがいし","id":"w5a-035","u":"w5a"},{"k":"free","q":"成功するか失敗するかの、ぎりぎりの分かれ目。「勝つか負けるかの＿＿＿に立たされる。」","a":"瀬戸際","y":"せとぎわ","e":"「瀬戸」は、せまい海峡のこと。","id":"w5a-036","u":"w5a"},{"k":"free","q":"物事をよくしようとする、前向きな態度である様子。「反対するだけでなく、＿＿＿な意見を出してほしい。」","a":"建設的","y":"けんせつてき","e":"反対の言葉は「破壊的」。","id":"w5a-037","u":"w5a"},{"k":"free","q":"ねらったのとは反対の、悪い結果が出ること。「むりにほめても、かえって＿＿＿になる。」","a":"逆効果","y":"ぎゃくこうか","id":"w5a-038","u":"w5a"},{"k":"free","q":"ふつうのやり方。「一筋縄ではいかない」の形で、ふつうのやり方では相手にできないという意味で使う。「あの人を説得するのは、＿＿＿ではいかない。」","a":"一筋縄","y":"ひとすじなわ","id":"w5a-039","u":"w5a"},{"k":"free","q":"言葉にできないほど、深く感動すること。「卒業式で、六年間を思い出して＿＿＿になる。」","a":"感無量","y":"かんむりょう","id":"w5a-040","u":"w5a"},{"k":"free","q":"かくしておきたいことが、世間に知れわたること。「事件が＿＿＿になり、大さわぎになった。」","a":"表沙汰","y":"おもてざた","id":"w5a-041","u":"w5a"},{"k":"free","q":"物事が終わるまでに、長い時間がかかること。「この話し合いは＿＿＿になりそうだ。」","a":"長丁場","y":"ながちょうば","id":"w5a-042","u":"w5a"},{"k":"free","q":"ほんのわずかの差で、危ないところをのがれる様子。「＿＿＿のところで、電車に間に合った。」","a":"間一髪","y":"かんいっぱつ","id":"w5a-043","u":"w5a"},{"k":"free","q":"物事が思い通りに、順調に進む様子。「入学してからの学校生活は＿＿＿＿だ。」","a":"順風満帆","y":"じゅんぷうまんぱん","e":"追い風を帆いっぱいに受けて船が進む様子から。","id":"w5a-044","u":"w5a"},{"k":"free","q":"悪者などを、一度に残らずつかまえること。「警察が、どろぼうの一味を＿＿＿＿にした。」","a":"一網打尽","y":"いちもうだじん","e":"一回の網で魚を全部とる様子から。","id":"w5a-045","u":"w5a"},{"k":"free","q":"今までだれも成しとげたり、足をふみ入れたりしたことがないこと。「＿＿＿＿の大記録を打ち立てた。」","a":"前人未踏","y":"ぜんじんみとう","id":"w5a-046","u":"w5a"},{"k":"free","q":"地震や台風、ふん火など、自然界に起こる異変や災害。「＿＿＿＿にそなえて、水や食料を用意しておく。」","a":"天変地異","y":"てんぺんちい","id":"w5a-047","u":"w5a"},{"k":"free","q":"ほかのことは考えず、一つのことに心を集中すること。「＿＿＿＿、合格に向けて勉強する。」","a":"一意専心","y":"いちいせんしん","id":"w5a-048","u":"w5a"},{"k":"free","q":"始めから終わりまで、態度や考えが変わらないこと。「かれの主張は＿＿＿＿していた。」","a":"終始一貫","y":"しゅうしいっかん","id":"w5a-049","u":"w5a"},{"k":"free","q":"自分の利益や感情をまじえず、公平に物事を行うこと。「審判は＿＿＿＿でなければならない。」","a":"公平無私","y":"こうへいむし","id":"w5a-050","u":"w5a"},{"k":"free","q":"物事の始めから終わりまでの全部。「見ていた人が、事故の＿＿＿＿を話してくれた。」","a":"一部始終","y":"いちぶしじゅう","id":"w5a-051","u":"w5a"},{"k":"free","q":"悪い評判を、新しい手がらによって消し去ること。「今度の試合で勝って、＿＿＿＿をはたす。」","a":"汚名返上","y":"おめいへんじょう","e":"「名誉挽回」も似た意味。「汚名挽回」はまちがい。","id":"w5a-052","u":"w5a"},{"k":"free","q":"二つのもののうち、どちらか一つを選ぶこと。「行くか行かないか、＿＿＿＿をせまられた。」","a":"二者択一","y":"にしゃたくいつ","id":"w5a-053","u":"w5a"},{"k":"free","q":"自分で自分に問いかけ、自分で答えを出すこと。「これでよかったのかと、＿＿＿＿をくり返す。」","a":"自問自答","y":"じもんじとう","id":"w5a-054","u":"w5a"},{"k":"free","q":"話や考えの筋道が、きちんと通っている様子。「＿＿＿＿と説明したので、みんなが納得した。」","a":"理路整然","y":"りろせいぜん","id":"w5a-055","u":"w5a"},{"k":"free","q":"油断は大きな失敗のもとになるので、気をゆるめてはいけないということ。「勝っているときこそ＿＿＿＿だ。」","a":"油断大敵","y":"ゆだんたいてき","id":"w5a-056","u":"w5a"},{"k":"free","q":"度胸があって、何事もおそれない様子。「＿＿＿＿な作戦で、強いチームに勝った。」","a":"大胆不敵","y":"だいたんふてき","id":"w5a-057","u":"w5a"},{"k":"free","q":"病気をせず、元気にくらすこと。「家族の＿＿＿＿を神社でいのる。」","a":"無病息災","y":"むびょうそくさい","id":"w5a-058","u":"w5a"},{"k":"free","q":"一つのことに心を集中して、ほかのことに気を取られない様子。「＿＿＿＿に本を読みふける。」","a":"一心不乱","y":"いっしんふらん","id":"w5a-059","u":"w5a"},{"k":"free","q":"苦しんで、手足をばたばたと動かす。また、苦しい状態からぬけ出そうとして、あせる。「水の中で＿＿＿ほど、体はしずんでしまう。」","a":"もがく","y":"もがく","id":"w5a-060","u":"w5a"},{"k":"free","q":"あとのことや、よいか悪いかをよく考えずに。「＿＿＿＿走り回ると、けがをするよ。」","a":"むやみに","y":"むやみに","id":"w5a-061","u":"w5a"},{"k":"free","q":"思い切って話を始める。「言いにくいことを、ようやく＿＿＿＿。」","a":"きりだす","y":"きりだす","e":"漢字では「切り出す」と書く。","id":"w5a-062","u":"w5a"},{"k":"free","q":"自分で直接、そのことを行う。「親方が自ら＿＿＿＿までもない、簡単な仕事だ。」","a":"手を下す","y":"てをくだす","id":"w5a-063","u":"w5a"},{"k":"free","q":"相手を自分の思うままにあやつる。「かけひきの上手な人に＿＿＿＿＿。」","a":"手玉に取る","y":"てだまにとる","id":"w5a-064","u":"w5a"},{"k":"free","q":"いかにも得意そうに、いばって歩く。「優勝したチームの選手が、＿＿＿＿＿＿ように歩いていく。」","a":"肩で風を切る","y":"かたでかぜをきる","id":"w5a-065","u":"w5a"},{"k":"free","q":"肩を高く張って、おこったようないかめしい態度をとる。「＿＿＿＿＿＿、相手をにらみつける。」","a":"肩を怒らせる","y":"かたをいからせる","id":"w5a-066","u":"w5a"},{"k":"free","q":"よく知られていて、無理を聞いてもらえるなど、特別なあつかいを受けられる。「おじは商店街に＿＿＿＿ので、いろいろ相談に乗ってもらえる。」","a":"顔が利く","y":"かおがきく","id":"w5a-067","u":"w5a"},{"k":"free","q":"人の名誉を傷つけ、恥をかかせる。「約束をやぶって、紹介してくれた先生の＿＿＿＿＿わけにはいかない。」","a":"顔をつぶす","y":"かおをつぶす","id":"w5a-068","u":"w5a"},{"k":"free","q":"不満そうな顔つきをする。「おやつが少ないと、弟が＿＿＿＿＿＿＿。」","a":"口をとがらせる","y":"くちをとがらせる","id":"w5a-069","u":"w5a"},{"k":"free","q":"多くの人が、同じことを言う様子。「みんな＿＿＿＿＿＿、「やめたほうがいい」と言った。」","a":"口をそろえて","y":"くちをそろえて","id":"w5a-070","u":"w5a"},{"k":"free","q":"わざわざ出向いて行く。「何度も図書館に＿＿＿＿、資料をさがした。」","a":"足を運ぶ","y":"あしをはこぶ","id":"w5a-071","u":"w5a"},{"k":"free","q":"にげた犯人の行方や正体が分かる。「落とした手帳から＿＿＿＿。」","a":"足がつく","y":"あしがつく","id":"w5a-072","u":"w5a"},{"k":"free","q":"うでまえを十分に見せようと、張り切る。「母が＿＿＿＿＿＿＿＿作ったごちそう。」","a":"腕によりをかける","y":"うでによりをかける","id":"w5a-073","u":"w5a"},{"k":"free","q":"心の奥まで深く感じる。「祖母の言葉のありがたさが＿＿＿＿＿＿。」","a":"骨身にしみる","y":"ほねみにしみる","id":"w5a-074","u":"w5a"},{"k":"free","q":"経験を積んで、仕事や役がらがその人にぴったり合ってくる。「三年目になり、キャプテンぶりが＿＿＿＿。」","a":"板に付く","y":"いたにつく","id":"w5a-075","u":"w5a"},{"k":"free","q":"服装を整え、気持ちを引きしめて物事に向かう。「先輩の話を、＿＿＿＿して聞く。」","a":"襟を正す","y":"えりをただす","id":"w5a-076","u":"w5a"},{"k":"free","q":"たよりになるものに任せて、すっかり安心している様子。「あの人がいれば、＿＿＿＿＿＿気持ちでいられる。」","a":"大船に乗った","y":"おおぶねにのった","id":"w5a-077","u":"w5a"},{"k":"free","q":"確かなものだと、責任をもって保証する。「先生が＿＿＿＿＿＿＿ほどの、字のうまさだ。」","a":"折り紙をつける","y":"おりがみをつける","e":"「折り紙」は、品物の値打ちを保証する書きつけのこと。","id":"w5a-078","u":"w5a"},{"k":"free","q":"よくないくわだてに加わって、手助けをする。「悪だくみの＿＿＿＿＿ことはできない。」","a":"片棒を担ぐ","y":"かたぼうをかつぐ","id":"w5a-079","u":"w5a"},{"k":"free","q":"相手の力をみとめて降参する。「あの人の知識の深さには＿＿＿＿＿＿。」","a":"かぶとをぬぐ","y":"かぶとをぬぐ","id":"w5a-080","u":"w5a"},{"k":"free","q":"まちがいが起こらないように、前もって念をおす。「時間におくれないようにと＿＿＿＿。」","a":"釘をさす","y":"くぎをさす","id":"w5a-081","u":"w5a"},{"k":"free","q":"みんなの先に立って、物事を始める。「話し合いの＿＿＿＿＿のは、いつも学級委員だ。」","a":"口火を切る","y":"くちびをきる","id":"w5a-082","u":"w5a"},{"k":"free","q":"たがいに力を出し合って、はげしく争う。「優勝をめざして、二チームが＿＿＿＿＿＿＿。」","a":"しのぎをけずる","y":"しのぎをけずる","e":"「しのぎ」は刀の、刃と背の間の高くなった部分。","id":"w5a-083","u":"w5a"},{"k":"free","q":"自分に都合の悪いことには、ふれないでおく。「自分のことは＿＿＿＿＿、人のことばかり注意する。」","a":"棚に上げる","y":"たなにあげる","id":"w5a-084","u":"w5a"},{"k":"free","q":"自分で世話をして、大切に育てる。「＿＿＿＿＿＿育てたトマトが、赤く実った。」","a":"手塩にかける","y":"てしおにかける","id":"w5a-085","u":"w5a"},{"k":"free","q":"いちばんさかんな時期や、いちばん危ない時期を過ぎる。「寒さも＿＿＿＿、春が近づいてきた。」","a":"峠をこす","y":"とうげをこす","id":"w5a-086","u":"w5a"},{"k":"free","q":"一人で二つのちがう仕事や立場をかけ持ちすること。「選手と監督の＿＿＿＿＿＿をはく。」","a":"二足のわらじ","y":"にそくのわらじ","id":"w5a-087","u":"w5a"},{"k":"free","q":"いったん始めた以上は、とちゅうでやめるわけにはいかないこと。「＿＿＿＿＿＿＿だ、最後まで手伝うよ。」","a":"乗りかかった船","y":"のりかかったふね","id":"w5a-088","u":"w5a"},{"k":"free","q":"よい経験や肩書きが加わって、値打ちが上がる。「全国大会に出たことで、チームに＿＿＿＿。」","a":"箔が付く","y":"はくがつく","id":"w5a-089","u":"w5a"},{"k":"free","q":"戦いや試合で、形勢が不利である。「後半に入って、味方の＿＿＿＿＿。」","a":"旗色が悪い","y":"はたいろがわるい","id":"w5a-090","u":"w5a"},{"k":"free","q":"多くの人の中から、特に選び出される。「代表のあいさつ役に、ぼくに＿＿＿＿＿＿＿。」","a":"白羽の矢が立つ","y":"しらはのやがたつ","e":"昔、神へのいけにえに選ばれた家の屋根に白い矢が立ったという言い伝えから。","id":"w5a-091","u":"w5a"},{"k":"free","q":"勢いのあるものに、さらに勢いを加える。多くは、さわぎを大きくする場合に使う。「言い返したのが＿＿＿＿＿＿ことになり、ますますおこらせてしまった。」","a":"火に油を注ぐ","y":"ひにあぶらをそそぐ","id":"w5a-092","u":"w5a"},{"k":"free","q":"そっと様子を見る。また、「聞く」「たずねる」「問う」のへりくだった言い方。「物かげから、こっそり様子を＿＿＿＿。」","a":"うかがう","y":"うかがう","e":"「先生のお話をうかがう」は、聞くのへりくだった言い方。","id":"w5a-093","u":"w5a"},{"k":"free","q":"心が広く、小さなことにこだわらない様子。「＿＿＿＿＿性格で、だれとでも仲よくなれる。」","a":"おおらかな","y":"おおらかな","id":"w5a-094","u":"w5a"},{"k":"free","q":"いいかげんにあつかって、きちんとやらない。「基本の練習を＿＿＿＿＿＿＿と、上達しない。」","a":"おろそかにする","y":"おろそかにする","id":"w5a-095","u":"w5a"},{"k":"free","q":"思っていた以上に。また、とりわけ、特に。「今年の夏は＿＿＿＿＿暑かった。」","a":"ことのほか","y":"ことのほか","id":"w5a-096","u":"w5a"},{"k":"free","q":"こわくなったり気が進まなかったりして、前に出るのをためらう。「高い飛びこみ台を見て、思わず＿＿＿＿＿＿。」","a":"しりごみする","y":"しりごみする","id":"w5a-097","u":"w5a"},{"k":"free","q":"話の前後の筋道が通らない。「二人の説明は、どこか＿＿＿＿＿＿＿。」","a":"辻褄が合わない","y":"つじつまがあわない","e":"「辻褄が合う」は、筋が通ること。","id":"w5a-098","u":"w5a"},{"k":"free","q":"めぐみあたえる。かざりなどを加える。また、必要な手だてをとる。「こまっている人に食べ物を＿＿＿＿。」","a":"ほどこす","y":"ほどこす","e":"「手をほどこす」「かざりをほどこす」などの使い方がある。","id":"w5a-099","u":"w5a"},{"k":"free","q":"通り過ぎるのを待つ。また、めんどうなことに関わらないで、そのままにしておく。「混んでいる電車を一本＿＿＿＿＿。」","a":"やり過ごす","y 書く","id":"w5a-169","u":"w5a"},{"k":"free","q":"心の底から深く感じる様子。また、じっと見つめる様子。「健康の大切さを＿＿＿＿感じた。」","a":"つくづく","y":"つくづく","id":"w5a-170","u":"w5a"},{"k":"free","q":"どこにでもあって、めずらしくないこと。「＿＿＿＿＿の言葉では、気持ちが伝わらない。」","a":"ありきたり","y":"ありきたり","id":"w5a-171","u":"w5a"},{"k":"free","q":"見つけるのが早い。「妹は＿＿＿＿ので、かくしたおかしをすぐに見つける。」","a":"目ざとい","y":"めざとい","id":"w5a-172","u":"w5a"},{"k":"free","q":"動きや話し方、人との関係などがなめらかでない様子。「けんかをしてから、二人の仲が＿＿＿＿＿している。」","a":"ぎくしゃく","y":"ぎくしゃく","id":"w5a-173","u":"w5a"},{"k":"free","q":"大きなショックを受けて、すっかり元気をなくす。「悲しみに＿＿＿＿＿＿＿、何もする気になれない。」","a":"うちひしがれる","y":"うちひしがれる","id":"w5a-174","u":"w5a"},{"k":"free","q":"人を集めて会や行事を開く。また、ある気持ちや感じが起こってくる。「お別れ会を＿＿。」","a":"催す","y":"もよおす","e":"「ねむ気を催す」のように、気持ちが起こる意味でも使う。","id":"w5a-175","u":"w5a"},{"k":"free","q":"ずうずうしくて、少しも悪びれない様子。「注意されても平気な顔をしている、＿＿＿＿＿＿態度。」","a":"ふてぶてしい","y":"ふてぶてしい","id":"w5a-176","u":"w5a"},{"k":"free","q":"うれしくて、動作が軽やかになる様子。「遠足の朝、弟は＿＿＿＿と出かけていった。」","a":"いそいそ","y":"いそいそ","id":"w5a-177","u":"w5a"},{"k":"free","q":"相手を立てて、自分を低くしてひかえめにふるまう。「＿＿＿＿＿言い方で、ていねいにたのむ。」","a":"へりくだる","y":"へりくだる","id":"w5a-178","u":"w5a"},{"k":"free","q":"相手がいやがることを、無理にさせる。「人にがまんを＿＿＿のはよくない。」","a":"強いる","y":"しいる","id":"w5a-179","u":"w5a"},{"k":"free","q":"手落ちや油断がないように。「遠足の準備を＿＿＿＿＿すませる。」","a":"ぬかりなく","y":"ぬかりなく","id":"w5a-180","u":"w5a"},{"k":"free","q":"あれこれ考えても決められず、こまりはてる。「＿＿＿＿、先生に相談した。」","a":"思い余る","y":"おもいあまる","id":"w5a-181","u":"w5a"},{"k":"free","q":"程度がだいたい分かっている。たいしたことはない。「子どもの力など＿＿＿＿＿。」","a":"高が知れる","y":"たかがしれる","id":"w5a-182","u":"w5a"},{"k":"free","q":"たいしたことはないと、見くびる。「簡単な相手だと＿＿＿＿＿いたら、負けてしまった。」","a":"高をくくる","y":"たかをくくる","id":"w5a-183","u":"w5a"},{"k":"free","q":"あとで自分の得になるようにと考えて、人に親切にする。「＿＿＿＿つもりで手伝ったのではない。」","a":"恩を売る","y":"おんをうる","id":"w5a-184","u":"w5a"},{"k":"free","q":"人に親切にしたことを、ありがたく思わせようとする。「手伝ってくれたのはうれしいが、＿＿＿＿＿言い方が気になる。」","a":"恩に着せる","y":"おんにきせる","id":"w5a-185","u":"w5a"},{"k":"free","q":"大事なところがぬけていて、しまりがない。「かんじんのカメラを忘れるなんて、＿＿＿＿＿いる。」","a":"間が抜ける","y":"まがぬける","id":"w5a-186","u":"w5a"},{"k":"free","q":"運が悪く、めぐり合わせがよくない。また、きまりが悪い。 "本能寺の変","1582年"],["刀狩令","1588年"],["全国統一","1590年"],["文禄の役","1592年"]],"cycle":2},{"id":"8e","title":"室町から安土・桃山へ（第7・8回）","items":[["南北朝の合一","1392年"],["応仁の乱が始まる","1467年"],["鉄砲の伝来","1543年"],["桶狭間の戦い","1560年"],["室町幕府の滅亡","1573年"],["豊臣秀吉の全国統一","1590年"]],"cycle":2}],"tips":[{"t":"世紀の数え方","r":[1,5],"b":["世紀は100年ごとのまとまり。1世紀＝1〜100年、3世紀＝201〜300年。","早わざ：西暦の上2桁に1を足すと世紀。794年→7＋1＝8世紀。1086年→10＋1＝11世紀。ただし下2桁が00の年は足さない（1000年は10世紀）。","紀元前は逆向きに数える。紀元前1世紀＝紀元前100〜1年。弥生時代（紀元前4世紀〜紀元後3世紀）は紀元前と紀元後をまたぐので約700年間。"]},{"t":"打製石器・磨製石器・骨角器","r":[1],"b":["打製石器＝石を打ち欠いただけ→旧石器時代。","磨製石器＝石をみがいた→縄文時代から。","骨角器＝動物の骨や角のつりばり→縄文時代。","字で覚える：「打」つ、「磨」く、「骨」と「角」。"]},{"t":"土偶（縄文）と埴輪（古墳）","r":[1,2],"b":["土偶：縄文時代。女性の形の土人形。魔よけ・安産・豊作を祈る。","埴輪：古墳時代。古墳のまわりに並べた素焼き。円筒・人・馬・家。","写真問題で出る。「どぐう＝じょうもん」「はにわ＝こふん」と声に出して覚える。"]},{"t":"3つの土器：縄文・弥生・須恵器","r":[1,2],"b":["縄文土器：厚くてもろい。縄目の文様。低温で焼く。","弥生土器：うすくてかたい。文様が少ない。赤茶色。","須恵器：古墳時代に渡来人が伝えた。のぼりがまで高温。かたくて灰色、水もれしない。"]},{"t":"鉄器と青銅器の使い分け","r":[1],"b":["鉄器：かたい→武器・工具（木の農具をつくる）。数が少なく貴重。","青銅器：やわらかい→祭器（銅剣・銅鉾・銅鐸・銅鏡）。豊作を祈る道具。","「鉄は仕事、青銅はお祈り」。"]},{"t":"中国の歴史書は「数字」で見分ける","r":[1,5],"b":["『漢書』地理志：紀元前1世紀。倭は100あまりの小国。","『後漢書』東夷伝：1世紀半ば。奴国の王に金印（漢委奴国王）。","『魏志』倭人伝：3世紀。邪馬台国の卑弥呼、30あまりの国、親魏倭王の称号と銅鏡。","『宋書』倭国伝：5世紀。倭の五王（武＝ワカタケル大王）。","100→30と国がまとまっていく流れ。金印は奴国、称号と銅鏡は卑弥呼。"]},{"t":"稲荷山（埼玉・鉄剣）と江田船山（熊本・鉄刀）","r":[2],"b":["どちらも「ワカタケル大王」の名がある。","埼玉県の稲荷山古墳＝鉄剣。熊本県の江田船山古墳＝鉄刀。","関東と九州の両方から同じ大王の名→5世紀後半のヤマト政権の支配は九州中部から関東まで（記述でよく出る）。"]},{"t":"冠位十二階（603）と憲法十七条（604）","r":[2],"b":["冠位十二階：役人の「位」。家柄でなく能力で。冠の色で12段階。","憲法十七条：役人の「心がまえ」。和をとうとぶ・仏教をうやまう・天皇の命令に従う。","1年ちがい。「位が先、心がまえが後」。今の憲法とは意味がちがう。"]},{"t":"天智・天武・持統はどういう関係？","r":[2],"b":["天智天皇＝中大兄皇子。大化の改新→白村江の戦い（663）→大津に都→即位。初めての全国的な戸籍。","天武天皇＝天智の弟。壬申の乱（672）で天智の息子に勝って即位。都を飛鳥にもどす。富本銭。","持統天皇＝天武の皇后。藤原京（694）を築いた。","順番：天智→（壬申の乱）→天武→持統。"]},{"t":"律と令／二官八省／国司・郡司・里長","r":[3],"b":["律＝刑罰のきまり、令＝政治のしくみのきまり。順番も「律令」。","中央：二官（神祇官・太政官）と八省。太政官が政策を決め、八省が実行。","地方：国（国司＝都から派遣された貴族）→郡（郡司＝その土地の豪族）→里（里長＝税の取り立て）。","九州には大宰府。"]},{"t":"租・調・庸・雑徭・衛士・防人","r":[3],"b":["租：口分田の稲、収穫の約3％を地方に納める。女子も。","調：地方の特産物を都に納める。","庸：都で10日働くかわりに布を都に納める。","雑徭：国司のもとで年60日以内の労働。","衛士：1年間、都の守り。防人：3年間、九州の守り（おもに関東の人）。","「租はイネ、調はトクサンブツ、庸はヌノ」。調と庸は都まで自分で運ぶので負担が重かった。"]},{"t":"「大」宰府と「太」政官・「太」政大臣","r":[3,4],"b":["大宰府（だざいふ）＝九州の役所→「大」。","太政官（だいじょうかん）＝中央の役所、太政大臣（だいじょうだいじん）＝最高の役職→「太」。","漢字1字で失点しやすい。声に出して「だざいふはダイ、だいじょうはタイ」。"]},{"t":"三世一身の法（723）と墾田永年私財法（743）","r":[3],"b":["三世一身：新しく水路をつくって開墾すれば3代まで私有OK。効果が弱かった。","墾田永年私財法：開墾した田は永久に私有OK。聖武天皇のとき。","結果：貴族や寺社が農民を使って土地を広げ→荘園ができる→公地公民がくずれる。","「三世（3代）→永年（永久）」、20年後。"]},{"t":"奈良時代の4つの書物","r":[3],"b":["古事記（712）：歴史書。神話から。","風土記（713）：各国の産物・地名の由来。","日本書紀（720）：歴史書。正式。","万葉集（奈良時代後半）：和歌集。約4500首。万葉がな。","覚え方：712・713・720の順。「古事記が先、日本書紀が後」。"]},{"t":"摂政・関白・院政・平氏の政治","r":[2,4],"b":["摂政：天皇が幼い・女性のときにかわって政治。聖徳太子（推古天皇）、藤原道長。","関白：天皇が成人した後にたすける。藤原氏が独占。","摂関政治（9世紀後半〜11世紀）→院政（1086年白河上皇）→平氏の政治（1167年平清盛が太政大臣）の順。","「幼いときは摂政、大人になったら関白」。"]},{"t":"最澄と空海","r":[4],"b":["最澄：天台宗。比叡山延暦寺（滋賀県）。","空海：真言宗。高野山金剛峯寺（和歌山県）。","どちらも9世紀初め、唐に留学。","「さいちょう・てんだい・ひえいざん」「くうかい・しんごん・こうやさん」。空也（念仏・浄土教）と混同しない。"]},{"t":"藤原がつく人物は5人いる","r":[2,3,4],"b":["藤原鎌足（中臣鎌足）：大化の改新。藤原氏の祖。","藤原不比等：鎌足の子。光明皇后の父。","藤原道長・頼通：摂関政治の全盛。","藤原純友：伊予国の元役人。939年に瀬戸内海で反乱を起こした側。","藤原元命：尾張国の国司。悪政を農民に訴えられた。","純友と元命は藤原氏の本流とは別。「純友は海賊、元命は悪い国司」。"]},{"t":"平将門と藤原純友（939年）","r":[4],"b":["平将門：下総国（千葉・茨城）の豪族。関東で「新皇」と名のる。","藤原純友：伊予国（愛媛）の元役人。瀬戸内海の海賊を率いる。","同じ939年。どちらも武士の力で鎮圧され、武士の力が認められた。"]},{"t":"保元の乱（1156）と平治の乱（1159）","r":[4],"b":["保元の乱：上皇方 vs 天皇方。天皇方（平清盛・源義朝）が勝つ。","平治の乱：平清盛 vs 源義朝。清盛が勝つ→平氏の時代。","3年差。「保元で天皇が勝ち、平治で平氏が勝つ」。"]},{"t":"不輸の権と不入の権","r":[4],"b":["不輸の権：税を納めなくてよい権利（輸＝運ぶ）。","不入の権：国司の役人を立ち入らせない権利（入＝入る）。","この権利をもつ荘園が増えて、国の収入が減った。"]},{"t":"校倉造と寝殿造","r":[3,4],"b":["校倉造（あぜくらづくり）：正倉院。三角柱の木材を組む。奈良時代。","寝殿造（しんでんづくり）：貴族の屋敷。建物を渡り廊下でつなぐ。平安時代。","「あぜくら＝そうこ、しんでん＝やしき」。"]},{"t":"都の移りかわりと天皇","r":[2,3,4,5],"b":["飛鳥（推古天皇のころ）→藤原京（持統・694）→平城京（元明・710）→長岡京（桓武・784）→平安京（桓武・794）。","大津（天智・白村江の後）は一時的。","平城京と平安京はどちらも唐の長安がモデル、碁盤の目。"]},{"t":"文化の順番と代表するもの","r":[2,3,4,5],"b":["飛鳥文化（7世紀初め）：法隆寺。日本最初の仏教文化。","白鳳文化（7世紀後半）：高松塚古墳の壁画。唐の初期の影響。","天平文化（8世紀）：東大寺・正倉院・古事記・万葉集。唐と仏教の影響、貴族中心。","国風文化（9世紀後半〜）：かな文字・源氏物語・枕草子・寝殿造・大和絵。","浄土教（10世紀〜）：平等院鳳凰堂・中尊寺金色堂。"]},{"t":"この範囲の世界文化遺産","r":[1,2,3,4,5],"b":["三内丸山遺跡（北海道・北東北の縄文遺跡群）","沖ノ島（神宿る島）","法隆寺・東大寺・平等院鳳凰堂（奈良・京都）","中尊寺金色堂（平泉）","厳島神社（広島）"]},{"t":"守護と地頭","r":[6],"b":["守護＝国ごとに置く。軍事・警察、御家人の取りしまり。","地頭＝荘園などに置く。土地の管理、年貢の取り立て。","覚え方：守護は国を「守」る、地頭は土「地」の頭。","どちらも1185年。征夷大将軍（1192年）より前。"]},{"t":"侍所・政所・問注所","r":[6],"b":["侍所＝御家人の取りしまり、軍事。","政所＝政治一般（はじめは公文所）。読みは「まんどころ」。","問注所＝裁判。","覚え方：「侍」は武士、「政」は政治、「問」はうったえを問いただす。"]},{"t":"御恩と奉公","r":[6],"b":["御恩＝将軍から御家人へ。領地を認める、新しい領地をあたえる。","奉公＝御家人から将軍へ。京都や鎌倉の警備、命がけで戦う。","この関係を封建制度という。キーワードは「土地をなかだちとした」。","元寇では新しい土地が手に入らず、御恩が出せなかった→御家人の不満。"]},{"t":"3人の執権：義時・泰時・時宗","r":[6],"b":["北条義時＝承久の乱（1221年）。","北条泰時＝御成敗式目（1232年）。","北条時宗＝元寇（1274年・1281年）。","覚え方：よし（義時）→やす（泰時）→とき（時宗）の順。"]},{"t":"承久の乱の「前」と「後」","r":[6],"b":["前：幕府の力はおもに東国。西国は朝廷の力が強かった。","後：京都に六波羅探題を置き、朝廷を監視。","後：上皇方の領地を取りあげ、新たに地頭を置いた。","結果：幕府の支配が全国におよんだ。"]},{"t":"文永の役と弘安の役","r":[6],"b":["文永の役（1274年）＝1回目。約3万。集団戦法と火薬の兵器に苦戦。","弘安の役（1281年）＝2回目。約14万。石塁で上陸をふせぎ、暴風雨で元軍が引きあげた。","石塁は文永の役の「後」につくった。","どちらも執権は北条時宗、元の皇帝はフビライ＝ハン。"]},{"t":"二毛作と二期作","r":[6],"b":["二毛作＝同じ田畑で1年に2種類（米のあとに麦）。鎌倉時代に西日本で広まった。","二期作＝同じ作物（米）を1年に2回つくる。","覚え方：「毛」は作物の種類、「期」は時期。"]},{"t":"鎌倉仏教：開いた人と宗派","r":[6],"b":["法然＝浄土宗（南無阿弥陀仏ととなえる）。","親鸞＝浄土真宗（一向宗）。法然の弟子。","一遍＝時宗（踊り念仏）。","日蓮＝日蓮宗（法華宗）。題目「南無妙法蓮華経」。","栄西＝臨済宗、道元＝曹洞宗。この2つが禅宗（座禅）。","念仏は「南無阿弥陀仏」、題目は「南無妙法蓮華経」。まぜない。"]},{"t":"鎌倉時代の文学：作品と人","r":[6],"b":["『新古今和歌集』＝藤原定家ら（後鳥羽上皇の命令）。","『平家物語』＝軍記物。琵琶法師が語り伝えた。","『方丈記』＝鴨長明の随筆。","『徒然草』＝兼好法師の随筆。","平安時代の『古今和歌集』（紀貫之）・『枕草子』（清少納言）とまぜない。"]},{"t":"鎌倉幕府と室町幕府のしくみ","r":[7],"b":["将軍をたすける役職：鎌倉＝執権（北条氏）、室町＝管領（細川氏など有力な守護大名）。","地方：鎌倉＝守護・地頭と六波羅探題（京都）、室町＝守護・地頭と鎌倉府（関東）。","侍所・政所・問注所は、どちらの幕府にもある。"]},{"t":"3人の足利将軍：尊氏・義満・義政","r":[7],"b":["尊氏（初代）＝1338年に征夷大将軍。室町幕府を開く。","義満（3代）＝南北朝の合一（1392年）、日明貿易、金閣（北山文化）。全盛期。","義政（8代）＝応仁の乱（1467年）、銀閣（東山文化）。おとろえ。","「3代＝金閣＝北山」「8代＝銀閣＝東山」とセットで覚える。"]},{"t":"金閣と銀閣","r":[7],"b":["金閣＝義満、北山、1397年、鹿苑寺。金箔がはられている。","銀閣＝義政、東山、1489年、慈照寺。2階建てで、1階は書院造風。","書院造の部屋は、同じ慈照寺の東求堂にある。"]},{"t":"室町時代の3つの一揆","r":[7],"b":["正長の土一揆（1428年）＝近江国（滋賀県）の馬借や農民。徳政令を求めた。","山城の国一揆（1485年）＝山城国（京都府）の国人と農民。守護大名を追放し8年間自治。","加賀の一向一揆（1488年）＝加賀国（石川県）の一向宗（浄土真宗）の信者。守護大名を滅ぼし約100年間支配。","順番は「正長→山城→加賀」。応仁の乱（1467年）は正長と山城の間。"]},{"t":"徳政令：鎌倉と室町のちがい","r":[7],"b":["鎌倉時代の永仁の徳政令（1297年）＝幕府が、生活に苦しむ御家人を救うために出した。","室町時代の徳政令＝農民たちが土一揆を起こして幕府に要求した。","どちらも「借金を取り消す」法令。出したのが幕府、求めたのが農民、というちがい。"]},{"t":"日明貿易の輸入品と輸出品","r":[7],"b":["輸入（明→日本）＝銅銭（明銭・永楽通宝）、陶磁器、絹織物。","輸出（日本→明）＝銅、硫黄、刀剣、扇。","朝鮮からの輸入＝木綿、お経、にんじん。","合い札の勘合は、倭寇と貿易船を区別するため。"]},{"t":"室町時代の特産物","r":[7],"b":["農産物：紀伊（和歌山）のみかん、甲斐（山梨）のぶどう、宇治（京都）の茶、三河（愛知）の綿花。","手工業：西陣（京都）の絹織物、美濃（岐阜）の和紙、瀬戸（愛知）の焼き物。","「国名＝現在の県」をセットで覚える。"]},{"t":"鎌倉と室町の商業のちがい","r":[7],"b":["定期市：鎌倉＝月3回、室町＝月6回のところも。","卸売業：鎌倉＝問（問丸）、室町＝問屋に発達。","金貸し：室町＝土倉と酒屋。運送：馬借。","座は平安時代後期にでき、室町時代に数や種類が増えた。"]},{"t":"能と狂言","r":[7],"b":["能＝猿楽や田楽をもとに、観阿弥・世阿弥父子が大成。奥深い芸能。","狂言＝能の幕間に演じるこっけいな劇。社会を風刺し、当時の話しことばを使う。","保護したのは足利義満。"]},{"t":"守護と守護大名","r":[7],"b":["守護（鎌倉時代）＝国ごとに置かれた、軍事・警察の役職。","守護大名（室町時代）＝任命された国を自分の領地のように支配するようになった守護。","応仁の乱の後、守護大名の力が強まり、将軍の力はおとろえた。"]},{"t":"鉄砲とキリスト教：伝えた人と年","r":[8],"b":["鉄砲＝1543年、ポルトガル人、種子島（鹿児島県）。","キリスト教＝1549年、スペイン人のフランシスコ＝ザビエル（イエズス会の宣教師）、鹿児島。","「ポルトガル＝鉄砲」「スペイン＝ザビエル」とセットで覚える。どちらも南蛮人。"]},{"t":"南蛮貿易の輸入品と輸出品","r":[8],"b":["輸入＝鉄砲・火薬・中国産の生糸・絹織物。","輸出＝銀（石見銀山など。世界の銀の3分の1が日本産）。","港は長崎と平戸（長崎県）。かぼちゃ・たばこ・じゃがいもなどの作物も伝わった。","日明貿易（第7回）の輸入は銅銭・陶磁器・絹織物、輸出は銅・硫黄・刀剣。まぜない。"]},{"t":"織田信長の4つの戦いと事件","r":[8],"b":["1560年 桶狭間の戦い（愛知県）＝今川義元を破る。","1573年 室町幕府の滅亡＝15代将軍足利義昭を追放。","1575年 長篠の戦い（愛知県）＝徳川家康と組み、鉄砲で武田勝頼を破る。","1582年 本能寺の変（京都）＝家臣の明智光秀に攻められ自害。","安土城（滋賀県・琵琶湖の南東岸）は1576年に建設開始。"]},{"t":"信長の政策と秀吉の政策","r":[8],"b":["信長＝楽市楽座（市場の税の免除・座の特権の廃止）、関所の廃止、キリスト教の保護、延暦寺の焼き討ち・石山本願寺攻め。","秀吉＝太閤検地、刀狩令（兵農分離）、楽市楽座と関所の廃止を受けつぎ道路も整備、金山・銀山と京都・大阪・堺・博多を直接支配、キリスト教の布教を禁止、朝鮮侵略。","キリスト教：信長は保護、秀吉は保護→1587年に布教禁止（貿易は続けた）。"]},{"t":"太閤検地と刀狩令","r":[8],"b":["太閤検地（1582年〜）＝土地の面積・よしあし・耕作者・石高を検地帳に記録。ものさしとますを統一。","結果＝百姓は耕作の権利＋年貢の義務（土地をはなれられない）、荘園は完全になくなる。","刀狩令（1588年）＝百姓から刀や鉄砲を取りあげる。ねらいは一揆を防ぎ耕作に専念させること。名目は大仏の釘。","2つあわせて、武士と百姓の身分がはっきり分かれた＝兵農分離。"]},{"t":"石高とは","r":[8],"b":["土地の生産力を、とれる米の量であらわしたもの。","1石＝ます100杯分＝約180L＝約150kg。","これ以後、大名の領地の大きさも「○万石」であらわすようになる。"]},{"t":"朝鮮侵略：文禄の役と慶長の役","r":[8],"b":["目的＝明の征服。朝鮮に協力を求めて断られ、1592年（文禄の役）と1597年（慶長の役）の2度出兵。","拠点＝肥前国（佐賀県）の名護屋。漢城（ソウル）を占領するが、李舜臣の水軍（亀甲船）と明の援軍に苦戦。","1598年に秀吉が病死して引きあげた。影響＝豊臣氏の力がおとろえる。有田焼・薩摩焼・萩焼が始まる。","鎌倉時代の文永の役（1274年）・弘安の役（1281年）は元が攻めてきた戦い。名前が似ているので区別。"]},{"t":"秀吉の全国統一の順番","r":[8],"b":["1582年 山崎の戦い（明智光秀を破る）→大阪城を築く。","1585年 関白→1586年 太政大臣。朝廷の権威を利用。","四国・九州の大名を従える→1590年 小田原の北条氏を滅ぼして全国統一。"]},{"t":"桃山文化の人物とことがら","r":[8],"b":["城郭建築＝安土城・大阪城・伏見城・姫路城（兵庫県・世界文化遺産）。天守が特色。","狩野永徳＝障壁画（ふすま絵・びょうぶ絵）、「唐獅子図屏風」。","千利休＝茶道（茶の湯）を大成。堺の大商人。","出雲の阿国＝阿国歌舞伎→歌舞伎へ。三線（琉球）→三味線→浄瑠璃。","性格＝大名・大商人による豪華で雄大。仏教の影響うすく、南蛮文化の影響が強い。"]},{"t":"安土・桃山という時代の名前","r":[8],"b":["安土＝織田信長の安土城（滋賀県、琵琶湖のほとり）。","桃山＝豊臣秀吉の伏見城のあと地に桃の木が植えられたことから。","政治の中心地が時代の名前になっているのは、奈良・鎌倉などと同じ。"]},{"t":"戦国大名の支配のしかた","r":[8],"b":["分国法（家法）で領国を支配。例：今川仮名目録（今川氏）、甲州法度之次第（武田氏）。御成敗式目の影響。","家臣を城下に集めて城下町をつくる。治水（信玄堤）、鉱山開発、交通整備で国を豊かにする。","自治都市の堺・博多は、大商人が町を運営した。"]}],"cardIds":["w5a-001","w5a-002","w5a-003","w5a-004","w5a-005","w5a-006","w5a-007","w5a-008","w5a-009","w5a-010","w5a-011","w5a-012","w5a-013","w5a-014","w5a-015","w5a-016","w5a-017","w5a-018","w5a-019","w5a-020","w5a-021","w5a-022","w5a-023","w5a-024","w5a-025","w5a-026","w5a-027","w5a-028","w5a-029","w5a-030","w5a-031","w5a-032","w5a-033","w5a-034","w5a-035","w5a-036","w5a-037","w5a-038","w5a-039","w5a-040","w5a-041","w5a-042","w5a-043","w5a-044","w5a-045","w5a-046","w5a-047","w5a-048","w5a-049","w5a-050","w5a-051","w5a-052","w5a-053","w5a-054","w5a-055","w5a-056","w5a-057","w5a-058","w5a-059","w5a-060","w5a-061","w5a-062","w5a-063","w5a-064","w5a-065","w5a-066","w5a-067","w5a-068","w5a-069","w5a-070","w5a-071","w5a-072","w5a-073","w5a-074","w5a-075","w5a-076","w5a-077","w5a-078","w5a-079","w5a-080","w5a-081","w5a-082","w5a-083","w5a-084","w5a-085","w5a-086","w5a-087","w5a-088","w5a-089","w5a-090","w5a-091","w5a-092","w5a-093","w5a-094","w5a-095","w5a-096","w5a-097","w5a-098","w5a-099","w5a-100","w5a-101","w5a-102","w5a-103","w5a-104","w5a-105","w5a-106",
