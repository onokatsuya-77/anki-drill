<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>暗記ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --bg2:#F1F3F6; --bg3:#E6E9EE; --ink:#1A2230; --ink2:#5E6875; --line:#D3D9E2;
  --ai:#22497A; --ai-ink:#FFFFFF; --ai-soft:#E3ECF7;
  --shu:#C2312B; --shu-ink:#FFFFFF; --shu-soft:#FBE8E6;
  --midori:#2B7A4B; --midori-ink:#FFFFFF; --midori-soft:#E1F1E7;
  --ki:#9A5E0A; --ki-soft:#FBF0D9;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
    --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
    --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
    --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
    --ki:#E7B562; --ki-soft:#3A2D14;
  }
}
:root[data-theme="dark"]{
  --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
  --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
  --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
  --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
  --ki:#E7B562; --ki-soft:#3A2D14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
p{margin:0}
#app{max-width:680px;margin:0 auto;padding:0 14px 60px;}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line);}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.top h1{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.top .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);margin-top:1px}
.counts{display:inline-flex;gap:10px}
.counts b{color:var(--ink);font-weight:700}
.counts .mk b{color:var(--shu)}
.counts .un b{color:var(--ai)}
@media (max-width:400px){.tabs button{font-size:.82rem}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:-1px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 8px;font-size:.9rem;white-space:nowrap;color:var(--ink2);cursor:pointer;font-weight:700}
.tabs button.on{color:var(--ai);border-bottom-color:var(--ai)}
.tabs button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
main{padding-top:16px}
.tab{display:none}
.tab.on{display:block}

.panel{background:var(--bg2);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.panel h2{font-size:1.02rem;margin-bottom:8px}
.lbl{font-size:.85rem;color:var(--ink2);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer}
.chip.on{border-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:700}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 16px;font-size:1rem;cursor:pointer;min-height:46px;font-weight:700}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.ok{background:var(--midori);border-color:var(--midori);color:var(--midori-ink)}
.btn.ng{background:var(--shu);border-color:var(--shu);color:var(--shu-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:12px}
.mt2{margin-top:20px}
.muted{color:var(--ink2);font-size:.88rem}
.small{font-size:.85rem}

/* quiz card */
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;min-height:340px;display:flex;flex-direction:column}
.card .meta{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:.85rem}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;background:var(--bg3);color:var(--ink2);font-weight:700}
.tag.r1{background:#E9EEDF;color:#4A5D1E}.tag.r2{background:#EBE4F2;color:#5A3F80}.tag.r3{background:#FDEBD3;color:#8A4B06}.tag.r4{background:#DDEAF6;color:#1E4E7A}.tag.r5{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag.r1,:root[data-theme="dark"] .tag.r2,:root[data-theme="dark"] .tag.r3,:root[data-theme="dark"] .tag.r4,:root[data-theme="dark"] .tag.r5{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.r1,:root:not([data-theme="light"]) .tag.r2,:root:not([data-theme="light"]) .tag.r3,:root:not([data-theme="light"]) .tag.r4,:root:not([data-theme="light"]) .tag.r5{background:var(--bg3);color:var(--ink2)}}
.q{font-size:1.18rem;font-weight:700;line-height:1.55;margin:14px 0 6px;flex:0 0 auto}
.hint{color:var(--ink2);font-size:.88rem}
.ansarea{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;margin:14px 0}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.box{width:2.1em;height:2.1em;border:1.5px solid var(--ink2);border-radius:3px;display:grid;place-items:center;font-family:var(--serif);font-size:1.55rem;font-weight:800;line-height:1;color:var(--ai);position:relative;background:var(--bg)}
.box::after{content:"";position:absolute;inset:0;border:1px dashed var(--line);margin:3px;border-radius:2px;opacity:.7}
.box span{opacity:0;transition:opacity .18s}
.card.revealed .box span{opacity:1}
.box.suffix{border:0;width:auto;height:auto;font-size:1.25rem;color:var(--ink);font-family:var(--sans);font-weight:700}
.box.suffix::after{display:none}
.answer{font-family:var(--serif);font-size:1.4rem;font-weight:800;line-height:1.35;color:var(--ai);display:none}
.card.revealed .answer{display:block}
.note{display:none;color:var(--ink2);font-size:.92rem;margin-top:10px;padding-left:10px;border-left:3px solid var(--line)}
.card.revealed .note{display:block}
.alt{display:none;font-size:.88rem;color:var(--ink2);margin-top:4px}
.card.revealed .alt{display:block}
.yomi{display:none;font-size:.9rem;color:var(--ink2);letter-spacing:.06em;margin-bottom:4px}
.card.revealed .yomi{display:block}
.expl{display:none;width:100%;margin-top:12px;padding:10px 12px;background:var(--bg2);border-left:3px solid var(--ai);border-radius:0 8px 8px 0;font-size:.92rem;line-height:1.6}
.card.revealed .expl{display:block}
.expl-t{font-size:.72rem;font-weight:700;color:var(--ai);letter-spacing:.1em;margin-bottom:3px}
.expl p + p{margin-top:4px}
.expl .pt{font-weight:700}
.expl .pt::before{content:"★ ";color:var(--ki)}
.badge.n.first{background:var(--ki-soft);color:var(--ki)}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark .btn{min-height:56px;font-size:1.08rem}
.prog{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--ai);width:0}
@media (prefers-reduced-motion:reduce){.box span{transition:none}}

/* next steps / progress */
.next h2{margin-bottom:6px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ai);border-radius:var(--r);padding:11px 14px;cursor:pointer;line-height:1.4}
.step:first-child{background:var(--ai-soft)}
.step b{font-size:1.02rem}
.step-n{font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--ai);min-width:1.2em}
.step .go{margin-left:auto;color:var(--ai);font-size:.9rem}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.prow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem}
.prow-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pbar{position:relative;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-top:4px}
.pbar i{position:absolute;left:0;top:0;height:100%;display:block}
.pbar i.d{background:var(--ai)}
.pbar i.m{background:var(--shu)}
.red{color:var(--shu)}
.btn.sm[disabled]{opacity:.4}

/* tips */
.tip h2{font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tip .tags .tag{font-size:.7rem}
.tipb{margin:8px 0 0;padding-left:1.3em;font-size:.95rem;line-height:1.7}
.tipb li + li{margin-top:4px}
.tipb li.key{font-weight:700}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.list li:first-child{border-top:0}
.list .num{color:var(--ink2);font-size:.85rem;min-width:1.8em;padding-top:2px}
.list .body{flex:1}
.list .qq{font-size:.95rem}
.list .aa{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.08rem}
.yomi-in{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:.04em}
.list .body .small.muted{margin-top:2px;line-height:1.5}
.list .st{font-size:.8rem;color:var(--ink2);white-space:nowrap;padding-top:3px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700}
.badge.w{background:var(--shu-soft);color:var(--shu)}
.badge.c{background:var(--midori-soft);color:var(--midori)}
.badge.n{background:var(--bg3);color:var(--ink2)}
.setbtn{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setbtn + .setbtn{margin-top:8px}
.setbtn b{font-size:1rem}
.setbtn .muted{font-size:.8rem}

/* order */
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:44px;border:1.5px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.slot.filled{border-style:solid;border-color:var(--ai);background:var(--ai-soft)}
.slot .n{font-family:var(--serif);font-weight:800;color:var(--ink2);min-width:1.4em}
.slot.filled .n{color:var(--ai)}
.slot .y{margin-left:auto;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.slot.right{border-style:solid;border-color:var(--midori);background:var(--midori-soft)}
.slot.wrong{border-style:solid;border-color:var(--shu);background:var(--shu-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .btn{font-weight:400;font-size:.98rem}

/* mock */
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--headH,96px));z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.05em}
.timer.warn{color:var(--ki)}
.timer.over{color:var(--shu)}
.mq{padding:14px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}
.mq .qt{font-weight:700;margin-bottom:8px}
.mq .qn{font-family:var(--serif);font-weight:800;color:var(--ink2);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--bg);text-align:left;font-size:.98rem;line-height:1.5}
.opt.on{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--midori);background:var(--midori-soft)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.opt .k{font-weight:700;min-width:1.4em}
.daimon{font-family:var(--serif);font-weight:800;font-size:1.1rem;margin:22px 0 4px;color:var(--ink)}
.write{border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--ink2);font-size:.92rem;background:var(--bg)}
.gradeans{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.15rem}
.self{display:flex;gap:8px;margin-top:8px}
.score{font-family:var(--serif);font-weight:800;font-size:2.4rem;color:var(--ai);line-height:1.1}
.score small{font-size:1rem;color:var(--ink2);font-family:var(--sans);font-weight:400}

/* notes */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:800;line-height:1.1}
.stat.w b{color:var(--shu)}
.stat span{font-size:.78rem;color:var(--ink2)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
input[type=search]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.empty{padding:22px 10px;text-align:center;color:var(--ink2);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* ---- 新アプリで足した見た目 ---- */
:root{--ki-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ki-ink:#2A1C02}}
:root[data-theme="dark"]{--ki-ink:#2A1C02}
#sess{display:none}
#sess.on{display:block}
.tag.r6{background:#F8E1DC;color:#8A2A20}.tag.r7{background:#DDF0EA;color:#1F5E52}.tag.r8{background:#F3E9C9;color:#6E5206}.tag.r9{background:#E6E3F5;color:#45368A}.tag.r10{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:var(--bg3);color:var(--ink2)}}
.mark3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mark3 .btn{min-height:64px;font-size:1.25rem;flex-direction:column;gap:1px;line-height:1.15;padding:8px 4px}
.mark3 .btn small{font-size:.74rem;font-weight:700}
.btn.tri{background:var(--ki);border-color:var(--ki);color:var(--ki-ink)}
.sep{font-family:var(--serif);font-size:1.3rem;font-weight:800;color:var(--ink2)}
.banner{background:var(--midori-soft);color:var(--midori);border-radius:var(--r);padding:10px 14px;font-weight:700;margin-bottom:12px;font-size:.95rem}
.banner.warn{background:var(--shu-soft);color:var(--shu)}
.kprompt{font-family:var(--serif);font-size:1.7rem;font-weight:800;letter-spacing:.06em;margin:14px 0 2px}
.q.sub{font-size:.98rem;font-weight:400;color:var(--ink2);margin-top:10px}
.stat.tri b{color:var(--ki)}
.stat.ok b{color:var(--midori)}
.badge.t{background:var(--ki-soft);color:var(--ki)}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stgc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center}
.stgc b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:800;line-height:1.2}
.stgc span{font-size:.68rem;color:var(--ink2);white-space:nowrap}
input[type=date]{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
#nFound .list li{align-items:center}
.list .num{font-weight:700}

</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="top">
      <div class="brand">
        <h1>暗記ドリル</h1>
        <div class="meta"><span class="range" id="hdRange"></span><span class="counts"><span class="un">新しい語 <b id="cntNew">0</b></span><span class="mk">復習 <b id="cntDue">0</b></span><span>今日 <b id="cntToday">0</b>問</span></span></div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="home" class="on">きょう</button>
      <button role="tab" data-tab="units">回べつ</button>
      <button role="tab" data-tab="order">並べかえ</button>
      <button role="tab" data-tab="notes">ノート</button>
      <button role="tab" data-tab="tips">解説</button>
    </nav>
  </div>
  <main>
    <section id="tab-home" class="tab on"></section>
    <section id="tab-units" class="tab"></section>
    <section id="tab-order" class="tab"></section>
    <section id="tab-notes" class="tab"></section>
    <section id="tab-tips" class="tab"></section>
    <section id="sess"></section>
  </main>
</div>
<script>
// 問題データ。番号（id）は固定で、あとから語を足しても変えない。
// k: kanji=漢字で書く / kana=カタカナ / free=文で答える　y: 読み　s: 解答らんの続き　n: ポイント　e: 解説　alt: 別解
const CONTENT = {"units":[{"id":"s5b01","sub":"社会","vol":"5年下","round":1,"name":"第1回 旧石器・縄文・弥生","short":"第1回","cycle":1},{"id":"s5b02","sub":"社会","vol":"5年下","round":2,"name":"第2回 古墳・飛鳥","short":"第2回","cycle":1},{"id":"s5b03","sub":"社会","vol":"5年下","round":3,"name":"第3回 奈良","short":"第3回","cycle":1},{"id":"s5b04","sub":"社会","vol":"5年下","round":4,"name":"第4回 平安","short":"第4回","cycle":1},{"id":"s5b05","sub":"社会","vol":"5年下","round":5,"name":"第5回 総合（第1〜4回の横断）","short":"第5回","cycle":1},{"id":"s5b06","sub":"社会","vol":"5年下","round":6,"name":"第6回 鎌倉","short":"第6回","cycle":2}],"cycles":[{"id":1,"name":"第1〜5回"},{"id":2,"name":"第6〜10回"}],"items":[{"id":"s5b01-001","u":"s5b01","q":"数万年前、日本列島が大陸と陸続きだったころ、ナウマン象などの化石が発掘された長野県の湖","a":"野尻湖","y":"のじりこ","k":"kanji","e":"長野県。ナウマン象やオオツノジカの化石が見つかった。旧石器時代は日本が大陸と陸続きで、象が歩いて来られた。"},{"id":"s5b01-002","u":"s5b01","q":"石を打ち欠いただけの、旧石器時代の道具","a":"打製石器","y":"だせいせっき","k":"kanji","e":"「打」＝打ち欠く。石をたたいて割っただけの石器。みがいた磨製石器（縄文時代）と区別する。"},{"id":"s5b01-003","u":"s5b01","q":"1946年、相沢忠洋が打製石器を発見し、日本にも旧石器時代があったことを明らかにした群馬県の遺跡","a":"岩宿","y":"いわじゅく","s":"遺跡","k":"kanji","e":"相沢忠洋が関東ローム層から黒曜石の打製石器を見つけた。これで「日本にも旧石器時代があった」とわかった。「岩宿＝群馬」をセットで。"},{"id":"s5b01-004","u":"s5b01","q":"岩宿遺跡がある都道府県","a":"群馬県","y":"ぐんまけん","k":"kanji","e":"岩宿遺跡は群馬県みどり市。長野県（野尻湖）と混同しやすい。"},{"id":"s5b01-005","u":"s5b01","q":"旧石器時代の人々は、狩りや木の実の採集をしながらどのようにくらしていたか","a":"移住しながらくらしていた","k":"free","e":"食べ物をさがして移動する生活。定住が始まるのは縄文時代（竪穴住居）から。"},{"id":"s5b01-006","u":"s5b01","q":"約1万年前、地球の気候があたたかくなり、氷河がとけて起こったこと","a":"海面が上昇し、今のような日本列島ができた","k":"free","e":"氷河がとけて海面が上がり、大陸とはなれて島になった。これが縄文時代の始まりごろ。"},{"id":"s5b01-007","u":"s5b01","q":"縄目の文様がつけられた土器","a":"縄文土器","y":"じょうもんどき","k":"kanji","e":"縄をころがした文様がある。厚くてもろい。土器で煮たきができ、どんぐりなども食べられるようになった。"},{"id":"s5b01-008","u":"s5b01","q":"縄文時代はどのくらい続いたか","a":"1万年以上","k":"free","e":"約1万数千年前から紀元前4世紀ごろまで。旧石器時代は「数万年前」、縄文時代は「約1万年」と桁で覚える。"},{"id":"s5b01-009","u":"s5b01","q":"地面を掘り下げて柱を立て、屋根をかけた縄文時代の住居","a":"竪穴住居","y":"たてあなじゅうきょ","k":"kanji","e":"地面を掘り下げ（＝竪穴）、柱を立てて草の屋根をかける。縄文時代に始まり、奈良時代の農民もまだ住んでいた。"},{"id":"s5b01-010","u":"s5b01","q":"石をみがいてつくった石器","a":"磨製石器","y":"ませいせっき","k":"kanji","e":"「磨」＝みがく。石をみがいて形を整えた。縄文時代から。旧石器時代の打製石器とセットで区別。"},{"id":"s5b01-011","u":"s5b01","q":"動物の骨や角でつくった、つりばりなどの道具","a":"骨角器","y":"こっかくき","k":"kanji","e":"動物の骨や角でつくったつりばりや矢じり。「骨」と「角」の字を思い出せば書ける。"},{"id":"s5b01-012","u":"s5b01","q":"たくさんの貝がらが積み上げられた縄文時代の遺跡","a":"貝塚","y":"かいづか","k":"kanji","n":"全国に約3000か所","e":"貝がらのごみ捨て場。骨や土器も出てきて当時のくらしがわかる。内陸で見つかるのは、当時の海面が今より高かったから（当時の海岸線がわかる）。"},{"id":"s5b01-013","u":"s5b01","q":"明治時代にアメリカ人のモースが発見した東京都の貝塚","a":"大森貝塚","y":"おおもりかいづか","k":"kanji","e":"東京都。モースが列車の窓から見つけた。「大森＝モース＝東京」をセットで。"},{"id":"s5b01-014","u":"s5b01","q":"大森貝塚を発見したアメリカ人","a":"モース","k":"kana","e":"アメリカ人の動物学者。大森貝塚の発掘が日本の考古学の手本になった。"},{"id":"s5b01-015","u":"s5b01","q":"魔よけや安産・豊かな収穫を祈るためにつくられた、おもに女性をかたどった土の人形","a":"土偶","y":"どぐう","k":"kanji","e":"縄文時代。おもに女性の形で、魔よけ・安産・豊作を祈った。古墳時代の埴輪と混同しやすい。土偶＝縄文、埴輪＝古墳。"},{"id":"s5b01-016","u":"s5b01","q":"青森市にある、最大500人をこえる人がくらした縄文時代の大規模な集落跡","a":"三内丸山","y":"さんないまるやま","s":"遺跡","k":"kanji","n":"約1500年間続いた。世界文化遺産","e":"青森県。遠くの黒曜石やひすいも出土し、遠い地域と交流していたことがわかる。"},{"id":"s5b01-017","u":"s5b01","q":"縄文時代、足りないものをおぎなった交換の方法","a":"物々交換","y":"ぶつぶつこうかん","k":"kanji","e":"お金がない時代、品物と品物をとりかえた。黒曜石やひすいが遠くまで運ばれたのはこのため。"},{"id":"s5b01-018","u":"s5b01","q":"縄文時代の社会にほとんどなかったもの（住居や墓に差がないことからわかる）","a":"貧富の差・身分のちがい","k":"free","e":"住居の大きさや墓に差がないから。差が生まれるのは弥生時代に稲作が始まってから。"},{"id":"s5b01-019","u":"s5b01","q":"縄文時代の終わりごろ、中国や朝鮮半島から伝わった2つのもの","a":"稲作と金属器（鉄器・青銅器）","k":"free","e":"九州北部に伝わった。弥生時代の2大特色。"},{"id":"s5b01-020","u":"s5b01","q":"縄文土器と比べた弥生土器の特徴","a":"うすくてかたく、文様が少ない","k":"free","n":"東京都文京区弥生で初めて発見","e":"縄文土器は厚くてもろい、弥生土器はうすくてかたい。"},{"id":"s5b01-021","u":"s5b01","q":"弥生時代は紀元前4世紀ごろから紀元後3世紀ごろまで、約何年間続いたか","a":"約700年間","k":"free","e":"紀元前4世紀（前400〜前301年）から紀元後3世紀（201〜300年）まで。紀元前と後をまたぐので約700年。"},{"id":"s5b01-022","u":"s5b01","q":"稲作が紀元前2世紀ごろに達した、本州北端の県","a":"青森県","y":"あおもりけん","k":"kanji","e":"稲作は九州北部から始まり、本州の北のはしまで広がった。"},{"id":"s5b01-023","u":"s5b01","q":"弥生時代に、まだ稲作が行われていなかった2つの地域","a":"北海道と沖縄","k":"free","e":"寒い北海道と、暑い沖縄には広まらず、狩りや漁の生活が続いた。"},{"id":"s5b01-024","u":"s5b01","q":"田を耕すために使った木製の農具（2つ）","a":"すき・くわ","k":"free","e":"木でつくった。すきは土を掘り起こす、くわは土をたがやす。鉄の農具が広まるのは古墳時代（渡来人）。"},{"id":"s5b01-025","u":"s5b01","q":"ぬかるんだ田で足がしずまないようにはいたもの","a":"田げた","k":"free","e":"大きな板を足にひもでくくりつけた。"},{"id":"s5b01-026","u":"s5b01","q":"稲の穂をつみとるために使われた石器","a":"石包丁","y":"いしぼうちょう","k":"kanji","e":"稲の穂だけをつみとる石の道具。穴にひもを通して指にかけた。「稲刈り＝石包丁」。"},{"id":"s5b01-027","u":"s5b01","q":"収穫した稲をたくわえた、ねずみ返しのある建物","a":"高床倉庫","y":"たかゆかそうこ","k":"kanji","e":"床を高くして湿気とねずみを防ぐ。柱についた板が「ねずみ返し」。"},{"id":"s5b01-028","u":"s5b01","q":"収穫した稲の脱穀に使った木の道具（2つ）","a":"うすときね","k":"free","e":"うすに入れた稲をきねでついて、もみがらを取る＝脱穀。"},{"id":"s5b01-029","u":"s5b01","q":"弥生時代、武器や工具（木の農具をつくる道具）として使われた金属器","a":"鉄器","y":"てっき","k":"kanji","e":"じょうぶで武器や工具に使った。数が少なく貴重で、石器もまだ使われた。祭りに使う青銅器と役割を分けて覚える。"},{"id":"s5b01-030","u":"s5b01","q":"銅剣・銅鉾・銅鐸・銅鏡などの青銅器は、おもに何として使われたか","a":"祭器（豊作などを神々に祈る道具）","k":"free","e":"青銅はやわらかいので実用の武器に向かず、祭りの道具になった。"},{"id":"s5b01-031","u":"s5b01","q":"人々の生活のようすが描かれたものもある、つりがね形の青銅器","a":"銅鐸","y":"どうたく","k":"kanji","e":"表面に狩りや脱穀の絵が描かれたものがあり、当時のようすがわかる。"},{"id":"s5b01-032","u":"s5b01","q":"福岡県にある、弥生時代の集落や水田のあとが残る遺跡","a":"板付","y":"いたづけ","s":"遺跡","k":"kanji","e":"福岡県。日本最古級の水田あと。稲作が九州北部から広まった証拠。"},{"id":"s5b01-033","u":"s5b01","q":"静岡市にある、弥生時代の水田のあとが残る遺跡","a":"登呂","y":"とろ","s":"遺跡","k":"kanji","e":"静岡県静岡市。水田・住居・高床倉庫のあとが残る。"},{"id":"s5b01-034","u":"s5b01","q":"敵の侵入に備えて、まわりに濠をめぐらせた集落","a":"環濠集落","y":"かんごうしゅうらく","k":"kanji","e":"「濠」＝ほり。戦いに備えて村のまわりに濠をめぐらせた。稲作が広まって争いが起きた証拠。"},{"id":"s5b01-035","u":"s5b01","q":"佐賀県にある、日本最大級の環濠集落の遺跡","a":"吉野ヶ里","y":"よしのがり","s":"遺跡","k":"kanji","n":"2重の濠。かめ棺が3000以上","e":"佐賀県。物見やぐらや大きな建物のあともあり、「くに」の中心だったと考えられる。"},{"id":"s5b01-036","u":"s5b01","q":"稲作が広まると、人々の間に生まれたもの","a":"貧富の差・身分の差","k":"free","e":"米のたくわえの多い少ないで差がつき、指導者（王）が現れた。"},{"id":"s5b01-037","u":"s5b01","q":"弥生時代に争いが起きた原因","a":"土地や水、たくわえた米をめぐって","k":"free","e":"稲作に必要な土地や水、たくわえた米をめぐる争い。だから環濠集落や大きなやじり（武器）が生まれた。"},{"id":"s5b01-038","u":"s5b01","q":"縄文時代と比べた、弥生時代のやじりの特徴","a":"大きくて重い（戦いの武器になった）","k":"free","e":"縄文のやじりは小さく軽い（狩り用）。弥生後半は大きく重い（人との戦い用）。矢が狩りの道具から戦いの武器に変わった。"},{"id":"s5b01-039","u":"s5b01","q":"有力なむらの指導者がいくつかのむらをまとめ、小さなくにをつくった。その指導者は何とよばれたか","a":"王","y":"おう","k":"kanji","e":"むら→くに。指導者が「王」になり、古墳時代には「豪族」とよばれる。"},{"id":"s5b01-040","u":"s5b01","q":"紀元前1世紀ごろ、倭は100あまりの小国に分かれていたと記した中国の歴史書","a":"『漢書』地理志","y":"かんじょちりし","k":"kanji","e":"「紀元前1世紀・100あまりの小国・楽浪郡」がキーワード。"},{"id":"s5b01-041","u":"s5b01","q":"1世紀の中ごろ、倭の奴国の王の使いに漢の皇帝が金印を授けたと記した歴史書","a":"『後漢書』東夷伝","y":"ごかんじょとういでん","k":"kanji","e":"「1世紀半ば・奴国・金印」がキーワード。"},{"id":"s5b01-042","u":"s5b01","q":"金印にきざまれた5つの文字","a":"漢委奴国王","y":"かんのわのなのこくおう","k":"kanji","e":"「委」は倭（わ）と同じ。5字とも書けるように。"},{"id":"s5b01-043","u":"s5b01","q":"金印が江戸時代（18世紀の終わりごろ）に発見された福岡県の島","a":"志賀島","y":"しかのしま","k":"kanji","e":"福岡県の博多湾にある島。江戸時代に農民が見つけた。奴国は福岡市あたり。"},{"id":"s5b01-044","u":"s5b01","q":"奴国があったと考えられる現在の場所","a":"福岡市のあたり","k":"free","e":"金印が出た志賀島も福岡県。"},{"id":"s5b01-045","u":"s5b01","q":"3世紀、邪馬台国の女王が30あまりの小国を従えていたと記した歴史書","a":"『魏志』倭人伝","y":"ぎしわじんでん","k":"kanji","e":"「3世紀・邪馬台国・卑弥呼・30あまりの国」がキーワード。魏は三国時代の国。"},{"id":"s5b01-046","u":"s5b01","q":"邪馬台国の女王","a":"卑弥呼","y":"ひみこ","k":"kanji","e":"魏に使いを送り「親魏倭王」の称号と銅鏡をもらった。"},{"id":"s5b01-047","u":"s5b01","q":"卑弥呼が魏の皇帝から授けられた称号","a":"親魏倭王","y":"しんぎわおう","k":"kanji","n":"銅鏡も授けられた","e":"「魏と親しい倭の王」という意味の称号。金印ではなく「称号と銅鏡」。奴国の金印と混同しない。"},{"id":"s5b01-048","u":"s5b01","q":"卑弥呼が国を治めた方法","a":"まじない","k":"free","e":"神につかえ、まじないで人々を治め、弟が政治を助けた。"},{"id":"s5b01-049","u":"s5b01","q":"邪馬台国の位置についての2つの説","a":"九州北部説と大和（奈良県）説","k":"free","e":"まだ決まっていない。"},{"id":"s5b02-001","u":"s5b02","q":"3世紀後半〜7世紀ごろ、大王や豪族がつくった大きな墓","a":"古墳","y":"こふん","k":"kanji","e":"土を高くもり上げた墓。大きさで力の強さを示した。"},{"id":"s5b02-002","u":"s5b02","q":"四角形と円形を組み合わせた形の古墳","a":"前方後円墳","y":"ぜんぽうこうえんふん","k":"kanji","n":"「漢字4字」と聞かれたら前方後円","e":"「前が四角（方）、後ろが円」という形。かぎ穴の形。"},{"id":"s5b02-003","u":"s5b02","q":"大阪府堺市にある日本最大の古墳","a":"大仙古墳","y":"だいせんこふん","k":"kanji","alt":["仁徳陵古墳"],"e":"全長486mで日本最大。仁徳天皇の墓とされ「仁 ,{"id":"s5b06-023","u":"s5b06","q":"1221年、朝廷の勢力を回復しようと、北条義時を討てと命令した上皇","a":"後鳥羽上皇","y":"ごとばじょうこう","k":"kanji","e":"承久の乱で敗れ、隠岐（島根県）に流された。『新古今和歌集』をつくらせた人でもある。"},{"id":"s5b06-024","u":"s5b06","q":"1221年、後鳥羽上皇が幕府をたおそうとして敗れた戦い","a":"承久","y":"じょうきゅう","k":"kanji","e":"源氏の将軍が絶えたのをきっかけに起こった。幕府が勝ち、支配が全国に広がった。","s":"の乱"},{"id":"s5b06-025","u":"s5b06","q":"承久の乱のときの執権","a":"北条義時","y":"ほうじょうよしとき","k":"kanji","e":"義時＝承久の乱（1221年）、泰時＝御成敗式目（1232年）、時宗＝元寇。3人の執権を区別する。"},{"id":"s5b06-026","u":"s5b06","q":"承久の乱の後、後鳥羽上皇が流された場所","a":"隠岐","y":"おき","k":"kanji","e":"現在の島根県の島。"},{"id":"s5b06-027","u":"s5b06","q":"承久の乱の後、朝廷の監視と西国の御家人の取りしまりのために京都に置かれた役所","a":"六波羅探題","y":"ろくはらたんだい","k":"kanji","e":"「京都」「朝廷の監視」がキーワード。"},{"id":"s5b06-028","u":"s5b06","q":"承久の乱の後、幕府の支配はどのように変わったか","a":"上皇方の領地を取りあげて新たに地頭を置き、幕府の支配が西国をふくむ全国におよぶようになった","k":"free","e":"六波羅探題を置いたこととあわせて答えられるようにする。記述でねらわれやすい。"},{"id":"s5b06-029","u":"s5b06","q":"1232年に定められた、武士がつくった最初の法律","a":"御成敗式目","y":"ごせいばいしきもく","k":"kanji","e":"武家社会のしきたりをもとにつくられ、政治や裁判のよりどころになった。後の武家法の手本。","alt":["貞永式目"]},{"id":"s5b06-030","u":"s5b06","q":"御成敗式目を定めた執権","a":"北条泰時","y":"ほうじょうやすとき","k":"kanji","e":"承久の乱の後、地頭と荘園領主の土地をめぐる争いが増えたことから定めた。"},{"id":"s5b06-031","u":"s5b06","q":"13世紀の初め、遊牧民の部族をまとめてモンゴル帝国をつくった人物","a":"チンギス＝ハン","k":"kana","e":"子孫が領土を広げ、ユーラシア大陸の東西にまたがる大帝国になった。フビライはその孫。"},{"id":"s5b06-032","u":"s5b06","q":"チンギス＝ハンの孫で、中国を支配し、日本に従うように求めた皇帝","a":"フビライ＝ハン","k":"kana","e":"国名を元とした。日本にたびたび使いを送ったが、執権の北条時宗は求めに応じなかった。"},{"id":"s5b06-033","u":"s5b06","q":"フビライ＝ハンが、モンゴル高原から中国にかけての地域につけた国名","a":"元","y":"げん","k":"kanji","e":"1271年。フビライの死後におとろえ、14世紀後半には中国で明が成立した。"},{"id":"s5b06-034","u":"s5b06","q":"元に従えられ、元寇のときに兵を出した朝鮮半島の王朝","a":"高麗","y":"こうらい","k":"kanji","e":"新羅の後、10世紀前半に朝鮮半島を統一した。約30年モンゴル軍に抵抗したが、元に降伏した。"},{"id":"s5b06-035","u":"s5b06","q":"元の求めに応じなかった、元寇のときの執権","a":"北条時宗","y":"ほうじょうときむね","k":"kanji","e":"文永の役・弘安の役の2度とも時宗が執権。"},{"id":"s5b06-036","u":"s5b06","q":"1274年、元軍が博多湾沿岸に攻めてきた戦い","a":"文永","y":"ぶんえい","k":"kanji","e":"約3万の元軍。日本の武士は集団戦法と火薬の兵器に苦戦した。1回目＝文永、2回目＝弘安。","s":"の役"},{"id":"s5b06-037","u":"s5b06","q":"1281年、元軍が再び九州北部に攻めてきた戦い","a":"弘安","y":"こうあん","k":"kanji","e":"約14万の大軍。石塁と武士の抵抗で上陸できず、暴風雨にあって引きあげた。","s":"の役"},{"id":"s5b06-038","u":"s5b06","q":"2度にわたる元軍の襲来をまとめて何というか","a":"元寇","y":"げんこう","k":"kanji","e":"「寇」は外から攻めてくる敵の意味。当時は「蒙古襲来」とよんだ。","alt":["蒙古襲来"]},{"id":"s5b06-039","u":"s5b06","q":"文永の役で、日本の武士が苦戦した元軍の戦い方と兵器は何か","a":"集団戦法と、火薬を使った兵器（てつはう）","k":"free","e":"日本の武士は一騎うちが中心だった。『蒙古襲来絵詞』（竹崎季長）に戦いのようすがえがかれている。"},{"id":"s5b06-040","u":"s5b06","q":"文永の役の後、元の襲来に備えて博多湾沿岸に築かれた石垣","a":"石塁","y":"せきるい","k":"kanji","e":"弘安の役では、この石塁にはばまれて元軍は上陸できなかった。今も福岡県に残る。","alt":["防塁"]},{"id":"s5b06-041","u":"s5b06","q":"元軍が攻めてきた、九州北部の湾","a":"博多","y":"はかた","k":"kanji","e":"現在の福岡県。地図で場所を確かめておく。","s":"湾"},{"id":"s5b06-042","u":"s5b06","q":"元寇の後、御家人が幕府に不満をもつようになったのはなぜか","a":"新しい土地を得た戦いではなかったので、十分なほうび（領地）をもらえなかったから","k":"free","e":"御恩（領地）と奉公（戦い）のつりあいがくずれた。多くの費用を使い、命がけで戦ったのにほうびがなかった。"},{"id":"s5b06-043","u":"s5b06","q":"生活に苦しむ御家人を救うために幕府が出した、借金の取り消しを命じる法令","a":"徳政令","y":"とくせいれい","k":"kanji","e":"1297年の永仁の徳政令が最初。効果はあがらず、かえって幕府は信用を失った。"},{"id":"s5b06-044","u":"s5b06","q":"フビライに仕え、日本を「ジパング」としてヨーロッパに紹介したイタリアの商人","a":"マルコ＝ポーロ","k":"kana","e":"見聞きしたことを『世界の記述（東方見聞録）』に残した。"},{"id":"s5b06-045","u":"s5b06","q":"鎌倉時代の農民が苦しんだ「2重の負担」とは何か","a":"荘園領主と地頭の両方から、税や労働を課されたこと","k":"free","e":"地頭の乱暴を荘園領主にうったえたり、村からいっせいに逃げたりして抵抗する農民もいた。"},{"id":"s5b06-046","u":"s5b06","q":"稲をかりとった後に麦をつくるように、同じ田畑で1年に2種類の作物をつくること","a":"二毛作","y":"にもうさく","k":"kanji","e":"鎌倉時代に西日本で広まった。同じ作物を年2回つくる二期作と区別する。"},{"id":"s5b06-047","u":"s5b06","q":"鎌倉時代に進んだ農業の技術を2つ答えなさい","a":"牛や馬を使って耕すこと、草や木の灰を肥料にすること","k":"free","e":"西日本ではおもに牛、東日本では馬を使った。生産が高まり、定期市が開かれるもとになった。"},{"id":"s5b06-048","u":"s5b06","q":"交通の便のよいところなどで、月に3回、決まった日に開かれた市","a":"定期市","y":"ていきいち","k":"kanji","e":"四日市・五日市などの地名は、定期市がたった日に由来する。"},{"id":"s5b06-049","u":"s5b06","q":"年貢などを保管したり運んだりした運送業者","a":"問","y":"とい","k":"kanji","e":"問丸ともいう。交通の便のよい港などに現れた。","alt":["問丸"]},{"id":"s5b06-050","u":"s5b06","q":"商工業者がつくった同業者の組合","a":"座","y":"ざ","k":"kanji","e":"営業を独占しようとした。"},{"id":"s5b06-051","u":"s5b06","q":"定期市の取り引きで使われた、中国から輸入された銅銭","a":"宋銭","y":"そうせん","k":"kanji","e":"朝廷も鎌倉幕府もお金を発行しなかったので、日宋貿易で入ってきた宋のお金を使った。"},{"id":"s5b06-052","u":"s5b06","q":"「南無阿弥陀仏」ととなえれば極楽に生まれ変われると説いた、浄土宗の開祖","a":"法然","y":"ほうねん","k":"kanji","e":"浄土宗＝法然、浄土真宗＝親鸞（法然の弟子）。"},{"id":"s5b06-053","u":"s5b06","q":"阿弥陀仏を信じさえすれば救われ、悪人にこそ救われる道があると説いた僧","a":"親鸞","y":"しんらん","k":"kanji","e":"法然の弟子。「鸞」は字がむずかしいので、何度も書いて覚える。"},{"id":"s5b06-054","u":"s5b06","q":"親鸞が開いた仏教の宗派","a":"浄土真宗","y":"じょうどしんしゅう","k":"kanji","e":"一向宗ともいう。法然の浄土宗と「真」の字で区別する。","alt":["一向宗"]},{"id":"s5b06-055","u":"s5b06","q":"諸国を歩いて踊り念仏を広めた、時宗の開祖","a":"一遍","y":"いっぺん","k":"kanji","e":"『一遍上人絵伝』には、武士の館や定期市のようすがえがかれている。"},{"id":"s5b06-056","u":"s5b06","q":"「南無妙法蓮華経」の題目をとなえれば救われると説いた僧","a":"日蓮","y":"にちれん","k":"kanji","e":"法華経が正しいと説き、日蓮宗（法華宗）を開いた。念仏（南無阿弥陀仏）と題目を区別する。"},{"id":"s5b06-057","u":"s5b06","q":"宋から臨済宗を伝えた僧","a":"栄西","y":"えいさい","k":"kanji","e":"「ようさい」とも読む。茶の効用についての書物を書いたことでも知られる。"},{"id":"s5b06-058","u":"s5b06","q":"栄西が宋から伝え、幕府の保護を受けた禅宗","a":"臨済宗","y":"りんざいしゅう","k":"kanji","e":"鎌倉幕府や、それに続く室町幕府の保護を受けた。"},{"id":"s5b06-059","u":"s5b06","q":"宋から曹洞宗を伝えた僧","a":"道元","y":"どうげん","k":"kanji","e":"栄西＝臨済宗、道元＝曹洞宗。どちらも禅宗。"},{"id":"s5b06-060","u":"s5b06","q":"座禅によって悟りを得ることを重んじる仏教をまとめて何というか","a":"禅宗","y":"ぜんしゅう","k":"kanji","e":"臨済宗と曹洞宗。武士の気風にあっていた。"},{"id":"s5b06-061","u":"s5b06","q":"鎌倉時代の新しい仏教が、武士や民衆に広まったのはなぜか","a":"教えがわかりやすく、実行しやすかったから","k":"free","e":"戦乱やききんで不安を強めた人々が、心のよりどころを仏教に求めていた。"},{"id":"s5b06-062","u":"s5b06","q":"宋から伝えられた建築様式でつくられた、奈良の寺の門","a":"東大寺南大門","y":"とうだいじなんだいもん","k":"kanji","e":"高さ約26m。左右に金剛力士像が置かれている。"},{"id":"s5b06-063","u":"s5b06","q":"東大寺南大門に置かれている、力強い写実的な彫刻","a":"金剛力士像","y":"こんごうりきしぞう","k":"kanji","e":"運慶・快慶らの作。高さ約8m。"},{"id":"s5b06-064","u":"s5b06","q":"金剛力士像をつくった仏師を2人答えなさい","a":"運慶・快慶","y":"うんけい・かいけい","k":"kanji","e":"鎌倉文化の彫刻は、力強く写実的。"},{"id":"s5b06-065","u":"s5b06","q":"後鳥羽上皇の命令で、藤原定家らが編集した歌集","a":"『新古今和歌集』","y":"しんこきんわかしゅう","k":"kanji","e":"『万葉集』（奈良）→『古今和歌集』（平安・紀貫之）→『新古今和歌集』（鎌倉・藤原定家）。"},{"id":"s5b06-066","u":"s5b06","q":"『新古今和歌集』を編集した中心人物","a":"藤原定家","y":"ふじわらのさだいえ","k":"kanji","e":"「ていか」とも読む。"},{"id":"s5b06-067","u":"s5b06","q":"琵琶法師によって語り伝えられた、平氏の盛衰をえがいた軍記物","a":"『平家物語』","y":"へいけものがたり","k":"kanji","e":"語りで伝えたので、文字を読めない多くの人にも喜ばれた。"},{"id":"s5b06-068","u":"s5b06","q":"鴨長明が書いた随筆","a":"『方丈記』","y":"ほうじょうき","k":"kanji","e":"『枕草子』（清少納言・平安）、『方丈記』（鴨長明）、『徒然草』（兼好法師）が三大随筆。"},{"id":"s5b06-069","u":"s5b06","q":"兼好法師が書いた随筆","a":"『徒然草』","y":"つれづれぐさ","k":"kanji","e":"1330年ごろ。読みは「つれづれぐさ」。"},{"id":"s5b06-070","u":"s5b06","q":"鎌倉文化の特色を答えなさい","a":"武士や僧などによる、素朴で力強い文化","k":"free","e":"平安時代の国風文化（貴族による、はなやかな文化）とくらべる。"}],"sets":[{"id":"A","title":"飛鳥時代のはじまり（推古天皇のころ）","items":[["推古天皇が即位する","593年"],["冠位十二階が定められる","603年"],["憲法十七条が定められる","604年"],["小野妹子が遣隋使として隋にわたる","607年"],["中国で唐がおこる","618年"],["大化の改新が始まる","645年"]],"cycle":1},{"id":"B","title":"大化の改新から平城京まで","items":[["大化の改新（蘇我氏を滅ぼす）","645年"],["白村江の戦い","663年"],["壬申の乱","672年"],["藤原京に都を移す","694年"],["大宝律令が定められる","701年"],["平城京に都を移す","710年"]],"cycle":1},{"id":"C","title":"奈良時代のできごと","items":[["和同開珎がつくられる","708年"],["『古事記』が完成する","712年"],["『日本書紀』が完成する","720年"],["三世一身の法","723年"],["国分寺・国分尼寺を建てる命令","741年"],["墾田永年私財法","743年"],["東大寺の大仏が完成する","752年"],["鑑真が来日する","754年"]],"cycle":1},{"id":"D","title":"平安時代の前半","items":[["長岡京に都を移す","784年"],["平安京に都を移す","794年"],["最澄・空海が新しい仏教を伝える","9世紀初め"],["遣唐使が停止される","894年"],["平将門の乱・藤原純友の乱","939年"],["藤原道長が摂政になる","1016年"]],"cycle":1},{"id":"E","title":"平安時代の後半","items":[["藤原道長が摂政になる","1016年"],["平等院鳳凰堂が建てられる","1053年"],["白河上皇が院政を始める","1086年"],["保元の乱","1156年"],["平治の乱","1159年"],["平清盛が太政大臣になる","1167年"]],"cycle":1},{"id":"F","title":"原始から古墳時代へ","items":[["岩宿遺跡のころ（打製石器を使い、移住）","数万年前"],["縄文土器がつくられ始める","約1万数千年前"],["稲作と金属器が伝わる","縄文時代の終わり"],["奴国の王が金印を授けられる","1世紀半ば"],["卑弥呼が魏に使いを送る","3世紀"],["前方後円墳がつくられ始める","3世紀後半"],["ワカタケル大王のころ","5世紀後半"]],"cycle":1},{"id":"G","title":"天皇の順番","items":[["推古天皇（聖徳太子が摂政）","593年〜"],["天智天皇（中大兄皇子）","7世紀後半"],["天武天皇（壬申の乱に勝つ）","672年〜"],["持統天皇（藤原京）","694年"],["元明天皇（平城京）","710年"],["聖武天皇（大仏）","8世紀前半"],["桓武天皇（平安京）","794年"],["白河天皇→上皇（院政）","1086年"]],"cycle":1},{"id":"H","title":"都の移りかわり","items":[["飛鳥（推古天皇のころ）","6世紀末〜"],["藤原京","694年"],["平城京","710年"],["長岡京","784年"],["平安京","794年"]],"cycle":1},{"id":"I","title":"文化の順番","items":[["縄文文化","縄文時代"],["弥生文化","弥生時代"],["古墳文化","古墳時代"],["飛鳥文化（法隆寺）","7世紀初め"],["白鳳文化（高松塚古墳）","7世紀後半"],["天平文化（正倉院）","8世紀"],["国風文化（かな文字）","9世紀後半〜"]],"cycle":1},{"id":"J","title":"中国の王朝と日本のかかわり","items":[["漢（奴国の王に金印）","1世紀"],["魏（卑弥呼が使いを送る）","3世紀"],["隋（遣隋使）","7世紀初め"],["唐（遣唐使・大宝律令・平城京）","7〜9世紀"],["宋（日宋貿易）","12世紀"]],"cycle":1},{"id":"K","title":"土地のきまりの流れ","items":[["公地公民（改新の詔）","646年"],["班田収授の法（大宝律令）","701年"],["三世一身の法","723年"],["墾田永年私財法","743年"],["荘園の寄進が広がる（不輸・不入の権）","10世紀〜"]],"cycle":1},{"id":"L","title":"仏教の流れ","items":[["仏教が百済から公に伝わる","538年"],["飛鳥文化（法隆寺）","7世紀初め"],["国分寺・東大寺の大仏","741・743年"],["鑑真が来日し唐招提寺を開く","754年〜"],["最澄・空海が天台宗・真言宗を伝える","9世紀初め"],["浄土教が広まり平等院鳳凰堂が建つ","1053年"]],"cycle":1},{"id":"M","title":"人物の活躍した順","items":[["桓武天皇","794年"],["菅原道真","894年"],["藤原純友","939年"],["藤原道長","1016年"],["白河上皇","1086年"],["平清盛","1167年"]],"cycle":1},{"id":"N","title":"中国の歴史書の順番","items":[["『漢書』地理志（100あまりの小国）","紀元前1世紀のようす"],["『後漢書』東夷伝（奴国の金印）","1世紀のようす"],["『魏志』倭人伝（卑弥呼）","3世紀のようす"],["『宋書』倭国伝（倭の五王）","5世紀のようす"]],"cycle":1},{"id":"6a","title":"源平の争いから鎌倉幕府の成立へ","items":[["源頼朝が伊豆で兵をあげる","1180年"],["一ノ谷の戦い","1184年"],["壇ノ浦の戦いで平氏が滅びる","1185年3月"],["守護と地頭が置かれる","1185年11月"],["源頼朝が征夷大将軍になる","1192年"]],"cycle":2},{"id":"6b","title":"執権政治の流れ","items":[["源頼朝が征夷大将軍になる","1192年"],["北条義時が執権になる","1205年"],["源実朝が殺され、源氏の将軍が絶える","1219年"],["承久の乱","1221年"],["御成敗式目が定められる","1232年"]],"cycle":2},{"id":"6c","title":"元寇と幕府のおとろえ","items":[["チンギス＝ハンがモンゴル帝国をつくる","13世紀初め"],["フビライ＝ハンが国名を元とする","1271年"],["文永の役","1274年"],["弘安の役","1281年"],["永仁の徳政令","1297年"],["鎌倉幕府が滅びる","1333年"]],"cycle":2},{"id":"6d","title":"鎌倉文化と新しい仏教","items":[["栄西が臨済宗を伝える","1191年"],["東大寺南大門の金剛力士像がつくられる","1203年"],["『新古今和歌集』が編集される","1205年"],["親鸞が浄土真宗を開く","1224年"],["道元が曹洞宗を伝える","1227年"],["日蓮が日蓮宗を開く","1253年"]],"cycle":2},{"id":"6e","title":"3人の執権とできごと","items":[["北条義時（承久の乱）","1221年"],["北条泰時（御成敗式目）","1232年"],["北条時宗（文永の役）","1274年"],["北条時宗（弘安の役）","1281年"]],"cycle":2}],"tips":[{"t":"世紀の数え方","r":[1,5],"b":["世紀は100年ごとのまとまり。1世紀＝1〜100年、3世紀＝201〜300年。","早わざ：西暦の上2桁に1を足すと世紀。794年→7＋1＝8世紀。1086年→10＋1＝11世紀。ただし下2桁が00の年は足さない（1000年は10世紀）。","紀元前は逆向きに数える。紀元前1世紀＝紀元前100〜1年。弥生時代（紀元前4世紀〜紀元後3世紀）は紀元前と紀元後をまたぐので約700年間。"]},{"t":"打製石器・磨製石器・骨角器","r":[1],"b":["打製石器＝石を打ち欠いただけ→旧石器時代。","磨製石器＝石をみがいた→縄文時代から。","骨角器＝動物の骨や角のつりばり→縄文時代。","字で覚える：「打」つ、「磨」く、「骨」と「角」。"]},{"t":"土偶（縄文）と埴輪（古墳）","r":[1,2],"b":["土偶：縄文時代。女性の形の土人形。魔よけ・安産・豊作を祈る。","埴輪：古墳時代。古墳のまわりに並べた素焼き。円筒・人・馬・家。","写真問題で出る。「どぐう＝じょうもん」「はにわ＝こふん」と声に出して覚える。"]},{"t":"3つの土器：縄文・弥生・須恵器","r":[1,2],"b":["縄文土器：厚くてもろい。縄目の文様。低温で焼く。","弥生土器：うすくてかたい。文様が少ない。赤茶色。","須恵器：古墳時代に渡来人が伝えた。のぼりがまで高温。かたくて灰色、水もれしない。"]},{"t":"鉄器と青銅器の使い分け","r":[1],"b":["鉄器：かたい→武器・工具（木の農具をつくる）。数が少なく貴重。","青銅器：やわらかい→祭器（銅剣・銅鉾・銅鐸・銅鏡）。豊作を祈る道具。","「鉄は仕事、青銅はお祈り」。"]},{"t":"中国の歴史書は「数字」で見分ける","r":[1,5],"b":["『漢書』地理志：紀元前1世紀。倭は100あまりの小国。","『後漢書』東夷伝：1世紀半ば。奴国の王に金印（漢委奴国王）。","『魏志』倭人伝：3世紀。邪馬台国の卑弥呼、30あまりの国、親魏倭王の称号と銅鏡。","『宋書』倭国伝：5世紀。倭の五王（武＝ワカタケル大王）。","100→30と国がまとまっていく流れ。金印は奴国、称号と銅鏡は卑弥呼。"]},{"t":"稲荷山（埼玉・鉄剣）と江田船山（熊本・鉄刀）","r":[2],"b":["どちらも「ワカタケル大王」の名がある。","埼玉県の稲荷山古墳＝鉄剣。熊本県の江田船山古墳＝鉄刀。","関東と九州の両方から同じ大王の名→5世紀後半のヤマト政権の支配は九州中部から関東まで（記述でよく出る）。"]},{"t":"冠位十二階（603）と憲法十七条（604）","r":[2],"b":["冠位十二階：役人の「位」。家柄でなく能力で。冠の色で12段階。","憲法十七条：役人の「心がまえ」。和をとうとぶ・仏教をうやまう・天皇の命令に従う。","1年ちがい。「位が先、心がまえが後」。今の憲法とは意味がちがう。"]},{"t":"天智・天武・持統はどういう関係？","r":[2],"b":["天智天皇＝中大兄皇子。大化の改新→白村江の戦い（663）→大津に都→即位。初めての全国的な戸籍。","天武天皇＝天智の弟。壬申の乱（672）で天智の息子に勝って即位。都を飛鳥にもどす。富本銭。","持統天皇＝天武の皇后。藤原京（694）を築いた。","順番：天智→（壬申の乱）→天武→持統。"]},{"t":"律と令／二官八省／国司・郡司・里長","r":[3],"b":["律＝刑罰のきまり、令＝政治のしくみのきまり。順番も「律令」。","中央：二官（神祇官・太政官）と八省。太政官が政策を決め、八省が実行。","地方：国（国司＝都から派遣された貴族）→郡（郡司＝その土地の豪族）→里（里長＝税の取り立て）。","九州には大宰府。"]},{"t":"租・調・庸・雑徭・衛士・防人","r":[3],"b":["租：口分田の稲、収穫の約3％を地方に納める。女子も。","調：地方の特産物を都に納める。","庸：都で10日働くかわりに布を都に納める。","雑徭：国司のもとで年60日以内の労働。","衛士：1年間、都の守り。防人：3年間、九州の守り（おもに関東の人）。","「租はイネ、調はトクサンブツ、庸はヌノ」。調と庸は都まで自分で運ぶので負担が重かった。"]},{"t":"「大」宰府と「太」政官・「太」政大臣","r":[3,4],"b":["大宰府（だざいふ）＝九州の役所→「大」。","太政官（だいじょうかん）＝中央の役所、太政大臣（だいじょうだいじん）＝最高の役職→「太」。","漢字1字で失点しやすい。声に出して「だざいふはダイ、だいじょうはタイ」。"]},{"t":"三世一身の法（723）と墾田永年私財法（743）","r":[3],"b":["三世一身：新しく水路をつくって開墾すれば3代まで私有OK。効果が弱かった。","墾田永年私財法：開墾した田は永久に私有OK。聖武天皇のとき。","結果：貴族や寺社が農民を使って土地を広げ→荘園ができる→公地公民がくずれる。","「三世（3代）→永年（永久）」、20年後。"]},{"t":"奈良時代の4つの書物","r":[3],"b":["古事記（712）：歴史書。神話から。","風土記（713）：各国の産物・地名の由来。","日本書紀（720）：歴史書。正式。","万葉集（奈良時代後半）：和歌集。約4500首。万葉がな。","覚え方：712・713・720の順。「古事記が先、日本書紀が後」。"]},{"t":"摂政・関白・院政・平氏の政治","r":[2,4],"b":["摂政：天皇が幼い・女性のときにかわって政治。聖徳太子（推古天皇）、藤原道長。","関白：天皇が成人した後にたすける。藤原氏が独占。","摂関政治（9世紀後半〜11世紀）→院政（1086年白河上皇）→平氏の政治（1167年平清盛が太政大臣）の順。","「幼いときは摂政、大人になったら関白」。"]},{"t":"最澄と空海","r":[4],"b":["最澄：天台宗。比叡山延暦寺（滋賀県）。","空海：真言宗。高野山金剛峯寺（和歌山県）。","どちらも9世紀初め、唐に留学。","「さいちょう・てんだい・ひえいざん」「くうかい・しんごん・こうやさん」。空也（念仏・浄土教）と混同しない。"]},{"t":"藤原がつく人物は5人いる","r":[2,3,4],"b":["藤原鎌足（中臣鎌足）：大化の改新。藤原氏の祖。","藤原不比等：鎌足の子。光明皇后の父。","藤原道長・頼通：摂関政治の全盛。","藤原純友：伊予国の元役人。939年に瀬戸内海で反乱を起こした側。","藤原元命：尾張国の国司。悪政を農民に訴えられた。","純友と元命は藤原氏の本流とは別。「純友は海賊、元命は悪い国司」。"]},{"t":"平将門と藤原純友（939年）","r":[4],"b":["平将門：下総国（千葉・茨城）の豪族。関東で「新皇」と名のる。","藤原純友：伊予国（愛媛）の元役人。瀬戸内海の海賊を率いる。","同じ939年。どちらも武士の力で鎮圧され、武士の力が認められた。"]},{"t":"保元の乱（1156）と平治の乱（1159）","r":[4],"b":["保元の乱：上皇方 vs 天皇方。天皇方（平清盛・源義朝）が勝つ。","平治の乱：平清盛 vs 源義朝。清盛が勝つ→平氏の時代。","3年差。「保元で天皇が勝ち、平治で平氏が勝つ」。"]},{"t":"不輸の権と不入の権","r":[4],"b":["不輸の権：税を納めなくてよい権利（輸＝運ぶ）。","不入の権：国司の役人を立ち入らせない権利（入＝入る）。","この権利をもつ荘園が増えて、国の収入が減った。"]},{"t":"校倉造と寝殿造","r":[3,4],"b":["校倉造（あぜくらづくり）：正倉院。三角柱の木材を組む。奈良時代。","寝殿造（しんでんづくり）：貴族の屋敷。建物を渡り廊下でつなぐ。平安時代。","「あぜくら＝そうこ、しんでん＝やしき」。"]},{"t":"都の移りかわりと天皇","r":[2,3,4,5],"b":["飛鳥（推古天皇のころ）→藤原京（持統・694）→平城京（元明・710）→長岡京（桓武・784）→平安京（桓武・794）。","大津（天智・白村江の後）は一時的。","平城京と平安京はどちらも唐の長安がモデル、碁盤の目。"]},{"t":"文化の順番と代表するもの","r":[2,3,4,5],"b":["飛鳥文化（7世紀初め）：法隆寺。日本最初の仏教文化。","白鳳文化（7世紀後半）：高松塚古墳の壁画。唐の初期の影響。","天平文化（8世紀）：東大寺・正倉院・古事記・万葉集。唐と仏教の影響、貴族中心。","国風文化（9世紀後半〜）：かな文字・源氏物語・枕草子・寝殿造・大和絵。","浄土教（10世紀〜）：平等院鳳凰堂・中尊寺金色堂。"]},{"t":"この範囲の世界文化遺産","r":[1,2,3,4,5],"b":["三内丸山遺跡（北海道・北東北の縄文遺跡群）","沖ノ島（神宿る島）","法隆寺・東大寺・平等院鳳凰堂（奈良・京都）","中尊寺金色堂（平泉）","厳島神社（広島）"]},{"t":"守護と地頭","r":[6],"b":["守護＝国ごとに置く。軍事・警察、御家人の取りしまり。","地頭＝荘園などに置く。土地の管理、年貢の取り立て。","覚え方：守護は国を「守」る、地頭は土「地」の頭。","どちらも1185年。征夷大将軍（1192年）より前。"]},{"t":"侍所・政所・問注所","r":[6],"b":["侍所＝御家人の取りしまり、軍事。","政所＝政治一般（はじめは公文所）。読みは「まんどころ」。","問注所＝裁判。","覚え方：「侍」は武士、「政」は政治、「問」はうったえを問いただす。"]},{"t":"御恩と奉公","r":[6],"b":["御恩＝将軍から御家人へ。領地を認める、新しい領地をあたえる。","奉公＝御家人から将軍へ。京都や鎌倉の警備、命がけで戦う。","この関係を封建制度という。キーワードは「土地をなかだちとした」。","元寇では新しい土地が手に入らず、御恩が出せなかった→御家人の不満。"]},{"t":"3人の執権：義時・泰時・時宗","r":[6],"b":["北条義時＝承久の乱（1221年）。","北条泰時＝御成敗式目（1232年）。","北条時宗＝元寇（1274年・1281年）。","覚え方：よし（義時）→やす（泰時）→とき（時宗）の順。"]},{"t":"承久の乱の「前」と「後」","r":[6],"b":["前：幕府の力はおもに東国。西国は朝廷の力が強かった。","後：京都に六波羅探題を置き、朝廷を監視。","後：上皇方の領地を取りあげ、新たに地頭を置いた。","結果：幕府の支配が全国におよんだ。"]},{"t":"文永の役と弘安の役","r":[6],"b":["文永の役（1274年）＝1回目。約3万。集団戦法と火薬の兵器に苦戦。","弘安の役（1281年）＝2回目。約14万。石塁で上陸をふせぎ、暴風雨で元軍が引きあげた。","石塁は文永の役の「後」につくった。","どちらも執権は北条時宗、元の皇帝はフビライ＝ハン。"]},{"t":"二毛作と二期作","r":[6],"b":["二毛作＝同じ田畑で1年に2種類（米のあとに麦）。鎌倉時代に西日本で広まった。","二期作＝同じ作物（米）を1年に2回つくる。","覚え方：「毛」は作物の種類、「期」は時期。"]},{"t":"鎌倉仏教：開いた人と宗派","r":[6],"b":["法然＝浄土宗（南無阿弥陀仏ととなえる）。","親鸞＝浄土真宗（一向宗）。法然の弟子。","一遍＝時宗（踊り念仏）。","日蓮＝日蓮宗（法華宗）。題目「南無妙法蓮華経」。","栄西＝臨済宗、道元＝曹洞宗。この2つが禅宗（座禅）。","念仏は「南無阿弥陀仏」、題目は「南無妙法蓮華経」。まぜない。"]},{"t":"鎌倉時代の文学：作品と人","r":[6],"b":["『新古今和歌集』＝藤原定家ら（後鳥羽上皇の命令）。","『平家物語』＝軍記物。琵琶法師が語り伝えた。","『方丈記』＝鴨長明の随筆。","『徒然草』＝兼好法師の随筆。","平安時代の『古今和歌集』（紀貫之）・『枕草子』（清少納言）とまぜない。"]}]};
</script>

function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.log)){S.log=o.log;S.cfg=o.cfg||{};S.meta=o.meta||{};}}}catch(e){storageOk=false;}}
function save(){try{if(S.log.length>20000)S.log=S.log.slice(-20000);localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}}
function mapLegacyId(id){const m=/^q([1-5])-(\d\d)$/.exec(id);return m?("s5b0"+m[1]+"-0"+m[2]):id;}
function mergeEntries(list,legacy){const seen=new Set(S.log.map(a=>a[0]+"|"+a[2]));let added=0;
  list.forEach(a=>{if(!Array.isArray(a)||a.length<3)return;let id=String(a[0]);const t=Number(a[2]);if(!t||!isFinite(t))return;let g;
    if(legacy){id=mapLegacyId(id);g=a[1]?2:0;}else{g=Number(a[1]);g=g===2?2:(g===1?1:0);}
    const k=id+"|"+t;if(seen.has(k))return;seen.add(k);S.log.push([id,g,t,String(a[3]||"")]);added++;});
  if(added)S.log.sort((x,y)=>x[2]-y[2]);return added;}
function importLegacy(){try{const raw=localStorage.getItem(OLD_KEY);if(!raw)return 0;const o=JSON.parse(raw);if(!o||!Array.isArray(o.attempts))return 0;return mergeEntries(o.attempts,true);}catch(e){return 0;}}

/* ---------- 復習の段階（履歴から毎回計算し直す） ---------- */
let ST={};
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.getTime();}
function todayStart(){return dayStart(Date.now());}
function applyEntry(a){const iv=cfg("iv");const id=a[0],g=a[1],t=a[2];let s=ST[id];
  if(!s)s=ST[id]={stage:0,due:0,c:0,w:0,k:0,kp:0,seq:[],lastT:0};
  if(g===2){s.c++;if(s.stage===0||t>=s.due){s.stage=Math.min(s.stage+1,iv.length);s.due=addDays(dayStart(t),iv[s.stage-1]);}if(s.kp>0)s.kp--;}
  else{s.w++;if(g===1){s.k++;s.kp=2;}s.stage=1;s.due=addDays(dayStart(t),iv[0]);}
  s.seq.push(g);if(s.seq.length>6)s.seq.shift();s.lastT=t;}
function rebuild(){ST={};for(const a of S.log)applyEntry(a);}
function record(id,g,src){const a=[id,g,Date.now(),src||""];S.log.push(a);applyEntry(a);save();updateCounts();}
function isMarked(s){if(!s||s.w===0)return false;const n=s.seq.length;return !(n>=2&&s.seq[n-1]===2&&s.seq[n-2]===2);}
function isKanjiPending(s){return !!s&&s.kp>0;}

/* ---------- きょうの出題 ---------- */
function curUnit(){return UNIT[cfg("unit")];}
function rangeUnits(){const c=curUnit().cycle;return UNITS.filter(u=>u.cycle===c);}
function newList(){const u=cfg("unit");return ITEMS.filter(it=>it.u===u&&!ST[it.id]);}
function dueList(){const ts=todayStart();return ITEMS.filter(it=>{const s=ST[it.id];return s&&s.due<=ts;}).sort((a,b)=>{const x=ST[a.id],y=ST[b.id];return x.stage-y.stage||(isMarked(y)-isMarked(x))||x.due-y.due;});}
function weakList(){const us=new Set(rangeUnits().map(u=>u.id));return ITEMS.filter(it=>us.has(it.u)&&isMarked(ST[it.id])).sort((a,b)=>ST[b.id].w-ST[a.id].w||ST[a.id].lastT-ST[b.id].lastT);}
function kanjiList(){return ITEMS.filter(it=>isKanjiPending(ST[it.id])).sort((a,b)=>ST[b.id].k-ST[a.id].k);}
function todayEntries(){const ts=todayStart();return S.log.filter(a=>a[2]>=ts);}
function reviewsToday(){const set=new Set();todayEntries().forEach(a=>{if(a[3]==="review")set.add(a[0]);});return set.size;}
let extraToday=0,extraDay=0;
function reviewQuota(){if(extraDay!==todayStart()){extraDay=todayStart();extraToday=0;}return Math.max(0,cfg("cap")+extraToday-reviewsToday());}
function daysToTest(){const d=cfg("testDate");if(!d)return null;const t=new Date(d+"T00:00:00").getTime();if(!isFinite(t))return null;return Math.round((t-todayStart())/DAY);}
function isPreTest(){const n=daysToTest();return n!=null&&n>=0&&n<=7;}

/* ---------- helpers ---------- */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function tag(r){return '<span class="tag r'+r+'">'+esc(ROUND_SHORT[r]||("第"+r+"回"))+'</span>';}
function utag(it){return tag(UNIT[it.u].round);}
const fullAns=it=>it.a+(it.s||"");
const bare=it=>it.a.replace(/[『』「」＝・]/g,"");
function hintText(it){const n=bare(it).length;
  if(it.k==="kanji"){const all=/^[\u3400-\u9FFF々]+$/.test(bare(it));return (all?"漢字"+n+"字":n+"字（漢字で書く）")+(it.s?"＋「"+esc(it.s)+"」":"");}
  if(it.k==="kana")return "カタカナ"+n+"字"+(it.s?"＋「"+esc(it.s)+"」":"");
  return "ことばで答える";}
function boxesHtml(it){if(it.k!=="kanji"&&it.k!=="kana")return "";let h='<div class="boxes">';
  it.a.replace(/[『』「」]/g,"").split("").forEach(c=>{if(c==="＝"||c==="・")h+='<span class="sep">'+esc(c)+'</span>';else h+='<span class="box"><span>'+esc(c)+'</span></span>';});
  if(it.s)h+='<span class="box suffix">'+esc(it.s)+'</span>';return h+'</div>';}
function explHtml(it){const parts=[];if(it.n)parts.push('<p class="pt">'+esc(it.n)+'</p>');if(it.e)parts.push('<p>'+esc(it.e)+'</p>');if(!parts.length)return "";return '<div class="expl"><div class="expl-t">解説</div>'+parts.join("")+'</div>';}
function scrollTop(){window.scrollTo({top:0,behavior:"auto"});}
function bar(done,total,marked){const pd=total?Math.round(done/total*100):0;const pm=total?Math.round(marked/total*100):0;return '<div class="pbar"><i class="d" style="width:'+pd+'%"></i><i class="m" style="width:'+pm+'%"></i></div>';}
function unitProgress(u){const list=ITEMS.filter(it=>it.u===u.id);let done=0,marked=0,solid=0;list.forEach(it=>{const s=ST[it.id];if(s){done++;if(isMarked(s))marked++;if(s.stage>=3)solid++;}});return {u,total:list.length,done,un:list.length-done,marked,solid};}
function fmtDate(t){const d=new Date(t);return (d.getMonth()+1)+"月"+d.getDate()+"日";}

/* ---------- view state ---------- */
const view={tab:"home",sess:null,order:{mode:"list"},tips:{r:0},notes:{q:"",msg:""},banner:""};
document.querySelectorAll(".tabs button").forEach(b=>{b.addEventListener("click",()=>{switchTab(b.dataset.tab);});});
function switchTab(t){view.tab=t;view.sess=null;if(t==="order")view.order.mode="list";
  document.querySelectorAll(".tabs button").forEach(b=>{const on=b.dataset.tab===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on?"true":"false");});
  scrollTop();render();}
function render(){const inSess=!!view.sess;
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",!inSess&&s.id==="tab-"+view.tab));
  $("#sess").classList.toggle("on",inSess);
  updateCounts();
  if(inSess){renderSess();return;}
  if(view.tab==="home")renderHome();else if(view.tab==="units")renderUnits();else if(view.tab==="order")renderOrder();else if(view.tab==="tips")renderTips();else renderNotes();}
function updateCounts(){const u=curUnit();$("#hdRange").textContent=u.sub+" "+u.vol+" "+u.short;
  $("#cntNew").textContent=newList().length;$("#cntDue").textContent=dueList().length;
  $("#cntToday").textContent=todayEntries().filter(a=>ITEM[a[0]]).length;}

/* ======================================================
   きょう
====================================================== */
function todaySteps(){const steps=[];const u=curUnit();const chunk=cfg("chunk");
  const ts0=todayStart();const fresh=l=>l.filter(it=>ST[it.id].lastT<ts0);
  const nw=newList(),due=dueList(),weak=fresh(weakList()),quota=reviewQuota();
  const sNew=nw.length?{label:u.short+"の新しい語を "+Math.min(chunk,nw.length)+"語",sub:"のこり"+nw.length+"語。教科書の順に出る",
    act:()=>startSession(newList().slice(0,chunk).map(it=>it.id),{src:"new",title:u.short+"の新しい語"})}:null;
  let sRev=null;
  if(due.length&&quota>0){const n=Math.min(due.length,quota,chunk);
    sRev={label:"今日の復習 "+n+"語",sub:due.length>n?("復習待ちは"+due.length+"語。1日"+cfg("cap")+"語まで、少しずつ進める"):"前に解いた語を、忘れるころにもう一度",
      act:()=>startSession(dueList().slice(0,Math.min(reviewQuota(),chunk)).map(it=>it.id),{src:"review",title:"今日の復習"})};}
  const sWeak=weak.length?{label:"組分け範囲の弱点 "+Math.min(weak.length,chunk)+"語",sub:"印つき"+weak.length+"語から、まちがいの多い順",
    act:()=>startSession(fresh(weakList()).slice(0,chunk).map(it=>it.id),{src:"weak",title:"組分け範囲の弱点"})}:null;
  (isPreTest()?[sWeak,sRev,sNew]:[sNew,sRev,sWeak]).forEach(s=>{if(s)steps.push(s);});
  return {steps,due,quota,nw,weak};}
function renderHome(){const el=$("#tab-home");const t=todaySteps();const u=curUnit();const p=unitProgress(u);const dt=daysToTest();
  let h="";
  if(!storageOk)h+='<div class="banner warn">この端末では記録を保存できません。ブラウザの設定（プライベートモードなど）を確かめてください。</div>';
  if(view.banner){h+='<div class="banner">'+esc(view.banner)+'</div>';}
  h+='<div class="panel next"><h2>きょうやること</h2>';
  if(isPreTest())h+='<p class="muted" style="margin-bottom:8px">組分けテストまで <b class="red">あと'+dt+'日</b>。弱点を先に出します。</p>';
  if(t.steps.length){h+='<div class="steps">'+t.steps.map((s,i)=>'<button class="step" data-step="'+i+'"><span class="step-n">'+(i+1)+'</span><span><b>'+esc(s.label)+'</b><br><span class="muted small">'+esc(s.sub)+'</span></span><span class="go">▶</span></button>').join("")+'</div>';}
  else{h+='<p><b>今日の分はおわり。</b></p><p class="muted mt">'+(t.due.length?"復習待ちの"+t.due.length+"語は、明日からまた出ます。":"新しい語も復習もありません。並べかえや漢字の練習ができます。")+'</p>';}
  if(t.due.length&&t.quota===0)h+='<div class="row mt"><span class="muted small">今日の復習（'+cfg("cap")+'語）は終わりました。のこり'+t.due.length+'語</span><button class="btn sm" id="hMore">あと10語やる</button></div>';
  h+='</div>';
  h+='<div class="panel mt"><h2>'+esc(u.name)+'</h2><div class="prow-h"><span class="muted small">解答済み '+p.done+' / '+p.total+'語</span><span class="muted small">印つき <b class="'+(p.marked?"red":"")+'">'+p.marked+'</b></span></div>'+bar(p.done,p.total,p.marked)
    +(dt!=null&&dt>=0?'<p class="muted small mt">組分けテストまで あと'+dt+'日</p>':'')+'</div>';
  const kj=kanjiList().length;const setsCur=SETS.filter(s=>s.cycle===u.cycle);const setsUn=setsCur.filter(s=>!ST["o:"+s.id]).length;
  h+='<div class="panel mt"><h2>ほかの練習</h2><div class="row">'
    +'<button class="btn" id="hKanji"'+(kj?"":" disabled")+'>漢字の練習（'+kj+'語）</button>'
    +'<button class="btn" id="hOrder">並べかえ'+(setsUn?"（まだ"+setsUn+"セット）":"")+'</button></div>'
    +'<p class="muted small mt">問題を見て、答えを<b>紙に漢字で書いてから</b>「答えを見る」。漢字だけまちがえたら△にする。</p></div>';
  el.innerHTML=h;
  el.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{view.banner="";t.steps[Number(b.dataset.step)].act();}));
  const more=$("#hMore");if(more)more.addEventListener("click",()=>{extraToday+=10;renderHome();});
  $("#hKanji").addEventListener("click",startKanji);
  $("#hOrder").addEventListener("click",()=>switchTab("order"));}
function startKanji(){const ids=kanjiList().slice(0,cfg("chunk")).map(it=>it.id);startSession(ids,{src:"kanji",title:"漢字の練習",kanji:true});}

/* ======================================================
   出題（共通）
====================================================== */
function startSession(ids,opt){if(!ids.length)return;view.sess={queue:ids.slice(),i:0,revealed:false,results:[],src:opt.src,title:opt.title,kanji:!!opt.kanji,done:false};scrollTop();render();}
function endSession(){view.sess=null;scrollTop();render();}
function renderSess(){const q=view.sess;if(q.done){renderSessDone();return;}
  const el=$("#sess");const it=ITEM[q.queue[q.i]];const s=ST[it.id];const left=q.queue.length-q.i;
  const three=it.k==="kanji"&&!q.kanji;
  let marks;
  if(q.kanji)marks='<div class="mark"><button class="btn tri" data-g="1">△ まだ書けない</button><button class="btn ok" data-g="2">○ 書けた</button></div>';
  else if(three)marks='<div class="mark3"><button class="btn ng" data-g="0">×<small>わからない</small></button><button class="btn tri" data-g="1">△<small>漢字ミス</small></button><button class="btn ok" data-g="2">○<small>書けた</small></button></div>';
  else marks='<div class="mark"><button class="btn ng" data-g="0">× まちがえた</button><button class="btn ok" data-g="2">○ できた</button></div>';
  const badges=s?((s.w?' <span class="badge w">×'+s.w+'</span>':"")+(s.c?' <span class="badge c">○'+s.c+'</span>':"")):' <span class="badge n">はじめて</span>';
  el.innerHTML='<div class="row between" style="margin-bottom:8px"><b>'+esc(q.title)+'</b><button class="btn ghost sm" id="qQuit">やめる</button></div>'
  +'<div class="prog"><i style="width:'+Math.round(q.i/q.queue.length*100)+'%"></i></div>'
  +'<div class="card'+(q.revealed?" revealed":"")+'" id="qCard">'
  +'<div class="meta"><span>'+utag(it)+badges+'</span><span>'+(q.i+1)+' / '+q.queue.length+'　<span class="muted">あと'+left+'</span></span></div>'
  +(q.kanji&&it.y?'<div class="kprompt">'+esc(it.y)+'</div><div class="hint">を漢字で書く　'+hintText(it)+'</div><div class="q sub">'+esc(it.q)+'</div>'
    :'<div class="q">'+esc(it.q)+'</div><div class="hint">'+hintText(it)+'</div>')
  +'<div class="ansarea">'+(it.y&&!q.kanji?'<div class="yomi">'+esc(it.y)+'</div>':"")+boxesHtml(it)+(it.k==="kanji"||it.k==="kana"?"":'<div class="answer">'+esc(fullAns(it))+'</div>')
  +(it.alt?'<div class="alt">別解：'+esc(it.alt.join("／"))+'</div>':"")
  +explHtml(it)+'</div>'
  +(q.revealed?marks:'<button class="btn primary wide" id="qReveal">答えを見る</button>')
  +'</div>';
  const rv=$("#qReveal");if(rv)rv.addEventListener("click",()=>{q.revealed=true;renderSess();});
  el.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>mark(Number(b.dataset.g))));
  $("#qQuit").addEventListener("click",()=>{if(q.results.length){q.done=true;scrollTop();renderSess();}else endSession();});}
function mark(g){const q=view.sess;const id=q.queue[q.i];record(id,g,q.src);q.results.push({id,g});q.i++;q.revealed=false;if(q.i>=q.queue.length)q.done=true;scrollTop();renderSess();}
function renderSessDone(){const q=view.sess;const el=$("#sess");const n=q.results.length;
  const ok=q.results.filter(r=>r.g===2).length,tri=q.results.filter(r=>r.g===1).length,ng=q.results.filter(r=>r.g===0).length;
  const missed=q.results.filter(r=>r.g<2);
  let h='<div class="panel"><h2>'+esc(q.title)+'　おわり</h2><div class="stats mt"><div class="stat ok"><b>'+ok+'</b><span>○ できた</span></div><div class="stat tri"><b>'+tri+'</b><span>△ 漢字ミス</span></div><div class="stat w"><b>'+ng+'</b><span>× まちがい</span></div></div>';
  if(missed.length){h+='<p class="muted">△と×の語は、明日もう一度出ます。答えを声に出して読んでおこう。</p><ul class="list mt">'+missed.map((r,i)=>{const it=ITEM[r.id];return '<li><span class="num">'+(r.g===1?"△":"×")+'</span><div class="body"><div class="qq">'+esc(it.q)+'</div><div class="aa">'+esc(fullAns(it))+(it.y?' <span class="yomi-in">'+esc(it.y)+'</span>':"")+'</div></div></li>';}).join("")+'</ul>';}
  else h+='<p><b>'+n+'問ぜんぶ○。</b></p>';
  h+='<div class="row mt2">'+(missed.length?'<button class="btn primary" id="dRetry">△と×の'+missed.length+'語をもう一度</button>':"")+'<button class="btn'+(missed.length?"":" primary")+'" id="dHome">きょうの画面へ</button></div></div>';
  el.innerHTML=h;
  const rt=$("#dRetry");if(rt)rt.addEventListener("click",()=>startSession(shuffle(missed.map(r=>r.id)),{src:q.src,title:q.title,kanji:q.kanji}));
  $("#dHome").addEventListener("click",()=>{view.sess=null;switchTab("home");});}

    +'<div class="prow-f"><span class="small">未回答 <b>'+p.un+'</b>　印つき <b class="'+(p.marked?"red":"")+'">'+p.marked+'</b>　定着 <b>'+p.solid+'</b></span><span class="row" style="gap:6px">'
    +'<button class="btn sm" data-un="'+p.u.id+'"'+(p.un?"":" disabled")+'>未回答</button><button class="btn sm" data-mk="'+p.u.id+'"'+(p.marked?"":" disabled")+'>印つき</button><button class="btn sm" data-all="'+p.u.id+'">20問</button></span></div></div>').join("")
  +'</div><p class="muted small mt">青＝解答済み、赤＝いま印がついている語。「定着」は、間をあけて3回以上つづけて○になった語。</p></div>';
  const chunk=cfg("chunk");
  el.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{const u=b.dataset.un;startSession(ITEMS.filter(it=>it.u===u&&!ST[it.id]).slice(0,chunk).map(it=>it.id),{src:"new",title:UNIT[u].short+"の未回答"});}));
  el.querySelectorAll("[data-mk]").forEach(b=>b.addEventListener("click",()=>{const u=b.dataset.mk;startSession(shuffle(ITEMS.filter(it=>it.u===u&&isMarked(ST[it.id]))).slice(0,chunk).map(it=>it.id),{src:"weak",title:UNIT[u].short+"の印つき"});}));
  el.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{const u=b.dataset.all;startSession(shuffle(ITEMS.filter(it=>it.u===u)).slice(0,chunk).map(it=>it.id),{src:"free",title:UNIT[u].short+"から20問"});}));}

/* ======================================================
   並べかえ

function setBadge(s){const st=ST["o:"+s.id];if(!st)return '<span class="badge n">まだ</span>';let b=st.seq[st.seq.length-1]===2?'<span class="badge c">前回○</span>':'<span class="badge w">前回×</span>';if(st.w)b+=' <span class="badge w">×'+st.w+'</span>';return b;}
function renderOrder(){const el=$("#tab-order");const o=view.order;
  if(o.mode==="list"){const cur=curUnit().cycle;const cycles=CYCLES.slice().sort((a,b)=>(b.id===cur)-(a.id===cur)||b.id-a.id);
    el.innerHTML='<div class="panel"><h2>並べかえドリル</h2><p class="muted">カードを古い順にタップして、順番をつくる。年号はかくれている。</p></div>'
    +cycles.map(c=>{const list=SETS.filter(s=>s.cycle===c.id);if(!list.length)return "";return '<div class="panel mt"><h2>'+esc(c.name)+'　<span class="muted small">'+list.length+'セット</span></h2><div class="mt">'+list.map(s=>'<button class="setbtn" data-set="'+s.id+'"><span><b>'+esc(s.title)+'</b><br><span class="muted">'+s.items.length+'項目</span></span><span>'+setBadge(s)+'</span></button>').join("")+'</div></div>';}).join("");
    el.querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>startOrder(b.dataset.set)));return;}
  if(o.mode==="run")renderOrderRun();else renderOrderResult();}
function startOrder(id){const s=SET[id];view.order.mode="run";view.order.set=id;view.order.pool=shuffle(s.items.map((it,i)=>i));view.order.picked=[];scrollTop();renderOrder();}
function renderOrderRun(){const el=$("#tab-order");const o=view.order;const s=SET[o.set];const remaining=o.pool.filter(i=>!o.picked.includes(i));
  el.innerHTML='<div class="panel"><div class="row between"><h2>'+esc(s.title)+'</h2><button class="btn ghost sm" id="oBack">一覧へ</button></div><p class="muted">古いものから順にタップ</p>'
  +'<div class="slots mt">'+s.items.map((it,i)=>{const p=o.picked[i];return '<div class="slot'+(p==null?"":" filled")+'"><span class="n">'+(i+1)+'</span><span>'+(p==null?"":esc(s.items[p][0]))+'</span></div>';}).join("")+'</div>'
  +'<div class="pool">'+remaining.map(i=>'<button class="btn" data-pick="'+i+'">'+esc(s.items[i][0])+'</button>').join("")+'</div>'
  +'<div class="row mt2"><button class="btn primary" id="oCheck"'+(remaining.length?" disabled":"")+'>答え合わせ</button><button class="btn" id="oUndo"'+(o.picked.length?"":" disabled")+'>ひとつ戻す</button><button class="btn ghost" id="oReset">最初から</button></div></div>';
  el.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{o.picked.push(Number(b.dataset.pick));renderOrderRun();}));
  $("#oUndo").addEventListener("click",()=>{o.picked.pop();renderOrderRun();});
  $("#oReset").addEventListener("click",()=>{o.picked=[];renderOrderRun();});
  $("#oBack").addEventListener("click",()=>{o.mode="list";renderOrder();});
  $("#oCheck").addEventListener("click",()=>{const ok=o.picked.every((p,i)=>p===i);record("o:"+s.id,ok?2:0,"order");o.mode="result";o.ok=ok;scrollTop();renderOrder();});}
function renderOrderResult(){const el=$("#tab-order");const o=view.order;const s=SET[o.set];
  el.innerHTML='<div class="panel"><h2>'+esc(s.title)+'</h2><p class="mt"><b>'+(o.ok?"正解。":"まちがい。")+'</b>'+(o.ok?"":"正しい順と年号を声に出して読もう。")+'</p>'
  +'<div class="slots mt">'+s.items.map((it,i)=>{const p=o.picked[i];const right=p===i;return '<div class="slot '+(right?"right":"wrong")+'"><span class="n">'+(i+1)+'</span><span>'+esc(it[0])+(right?"":'<br><span class="small" style="color:var(--shu)">あなた：'+esc(s.items[p][0])+'</span>')+'</span><span class="y">'+esc(it[1])+'</span></div>';}).join("")+'</div>'
  +'<div class="row mt2"><button class="btn primary" id="oAgain">もう一度</button><button class="btn" id="oList">べつのセット</button></div></div>';
  $("#oAgain").addEventListener("click",()=>startOrder(o.set));$("#oList").addEventListener("click",()=>{o.mode="list";renderOrder();});}

/* ======================================================
   解説（つまずきポイント）
====================================================== */
function renderTips(){const el=$("#tab-tips");const f=view.tips.r;const list=TIPS.filter(t=>!f||t.r.includes(f)).slice().sort((a,b)=>Math.max.apply(null,b.r)-Math.max.apply(null,a.r));
  el.innerHTML='<div class="panel"><h2>つまずきポイント</h2><p class="muted small">似ていて混ざりやすいものを、ならべて見くらべる。×がついた語の近くにあるポイントを読むと効く。</p><div class="chips mt"><button class="chip'+(f===0?" on":"")+'" data-tr="0">すべて</button>'+UNITS.slice().reverse().map(u=>'<button class="chip'+(f===u.round?" on":"")+'" data-tr="'+u.round+'">'+esc(u.short)+'</button>').join("")+'</div></div>'
  +list.map(t=>'<div class="panel mt tip"><h2>'+esc(t.t)+'　<span class="tags">'+t.r.map(tag).join(" ")+'</span></h2><ul class="tipb">'+t.b.map(l=>'<li'+(/^(「|覚え方|早わざ)/.test(l)?' class="key"':"")+'>'+esc(l)+'</li>').join("")+'</ul></div>').join("");
  el.querySelectorAll("[data-tr]").forEach(b=>b.addEventListener("click",()=>{view.tips.r=Number(b.dataset.tr);renderTips();}));}

/* ======================================================
   ノート（弱点・設定・保存）
====================================================== */
function itemRow(it,i){const s=ST[it.id]||{w:0,c:0,k:0};return '<li><span class="num">'+(i+1)+'</span><div class="body"><div class="qq">'+utag(it)+' '+esc(it.q)+'</div><div class="aa">'+esc(fullAns(it))+(it.y?' <span class="yomi-in">'+esc(it.y)+'</span>':"")+'</div></div><span class="st">'+(s.w?'<span class="badge w">×'+s.w+'</span>':"")+(s.k?' <span class="badge t">△'+s.k+'</span>':"")+(s.c?' <span class="badge c">○'+s.c+'</span>':"")+'</span></li>';}
function exportText(){return JSON.stringify({app:"gakushu",schema:1,ver:APP_VER,exportedAt:new Date().toISOString(),log:S.log,cfg:S.cfg});}
function renderNotes(){const el=$("#tab-notes");const nt=view.notes;
  const done=ITEMS.filter(it=>ST[it.id]).length;const marked=ITEMS.filter(it=>isMarked(ST[it.id])).sort((a,b)=>ST[b.id].w-ST[a.id].w||ST[b.id].lastT-ST[a.id].lastT);const kj=kanjiList();
  const ts=todayStart();let dueT=0,due1=0,due7=0;const stages=cfg("iv").map(()=>0);
  ITEMS.forEach(it=>{const s=ST[it.id];if(!s)return;stages[s.stage-1]++;if(s.due<=ts)dueT++;else if(s.due<=addDays(ts,1))due1++;else if(s.due<=addDays(ts,7))due7++;});
  const iv=cfg("iv");const cap=cfg("cap");const le=S.meta.lastExport;
  let h='<div class="stats"><div class="stat"><b>'+done+'</b><span>解答済み / '+ITEMS.length+'語</span></div><div class="stat w"><b>'+marked.length+'</b><span>印つき</span></div><div class="stat tri"><b>'+kj.length+'</b><span>漢字ミス</span></div></div>';
  h+='<div class="panel"><h2>復習の予定</h2><p class="small">今日まで <b>'+dueT+'</b>語　明日 <b>'+due1+'</b>語　7日以内 <b>'+due7+'</b>語</p>'
    +'<div class="stg mt">'+iv.map((d,i)=>'<div class="stgc"><b>'+stages[i]+'</b><span>'+d+'日後</span></div>').join("")+'</div>'
    +'<p class="muted small mt">○になるたびに右へ進み、次に出るまでの間があく。△や×は左はし（1日後）にもどる。</p></div>';
  h+='<div class="panel mt"><div class="row between"><h2>漢字ミスの語　<span class="muted small">'+kj.length+'語</span></h2><button class="btn sm primary" id="nKanji"'+(kj.length?"":" disabled")+'>漢字を練習する</button></div>'
    +(kj.length?'<ul class="list">'+kj.slice(0,30).map(itemRow).join("")+'</ul>'+(kj.length>30?'<p class="muted small">ほか'+(kj.length-30)+'語</p>':""):'<div class="empty">△をつけた語がここにたまります。2回つづけて○になると消えます。</div>')+'</div>';
  h+='<div class="panel mt"><h2>印つきの語　<span class="muted small">'+marked.length+'語</span></h2>'
    +(marked.length?'<ul class="list">'+marked.slice(0,30).map(itemRow).join("")+'</ul>'+(marked.length>30?'<p class="muted small">ほか'+(marked.length-30)+'語</p>':""):'<div class="empty">まちがえた語がここにたまります。2回つづけて○になると消えます。</div>')+'</div>';
  h+='<div class="panel mt"><h2>紙のテストでまちがえた語に印をつける</h2><input type="search" id="nSearch" placeholder="語句や読みで さがす（例：しゅご）" value="'+esc(nt.q)+'"><div id="nFound"></div></div>';
  h+='<div class="panel mt"><h2>設定</h2><div class="lbl">今週の回（新しい語を出す回）</div><div class="chips">'+UNITS.slice().reverse().map(u=>'<button class="chip'+(u.id===cfg("unit")?" on":"")+'" data-unit="'+u.id+'">'+esc(u.short)+'</button>').join("")+'</div>'
    +'<div class="lbl">1日の復習の上限</div><div class="chips">'+[20,30,40].map(n=>'<button class="chip'+(cap===n?" on":"")+'" data-cap="'+n+'">'+n+'語</button>').join("")+'</div>'
    +'<div class="lbl">次の組分けテストの日（7日前から弱点を先に出す）</div><input type="date" id="nTest" value="'+esc(cfg("testDate"))+'"></div>';
  h+='<div class="panel mt"><h2>記録の保存・読み込み</h2><p class="muted small">記録はこの端末のブラウザの中だけにあります。週に1回、「記録をコピー」して保管してください。'+(le?"前回のコピー："+fmtDate(le):"まだコピーしていません")+'</p>'
    +'<div class="row mt"><button class="btn sm primary" id="nCopy">記録をコピー</button><span class="muted small" id="nCopyMsg"></span></div><textarea id="nOut" class="mt" readonly aria-label="記録の文字"></textarea>'
    +'<div class="lbl">ほかの端末や、前のドリルの記録を読み込む</div><textarea id="nIn" placeholder="コピーした記録の文字を、ここに貼りつける" aria-label="読み込む記録"></textarea>'
    +'<div class="row mt"><button class="btn sm" id="nLoad">読み込んで合わせる</button><span class="muted small" id="nLoadMsg">'+esc(nt.msg)+'</span></div></div>';
  h+='<p class="muted small mt" style="text-align:center">暗記ドリル '+APP_VER+'　記録 '+S.log.length+'件</p>';
  el.innerHTML=h;nt.msg="";
  $("#nKanji").addEventListener("click",startKanji);
  el.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>{setCfg("unit",b.dataset.unit);render();}));
  el.querySelectorAll("[data-cap]").forEach(b=>b.addEventListener("click",()=>{setCfg("cap",Number(b.dataset.cap));render();}));
  $("#nTest").addEventListener("change",e=>{setCfg("testDate",e.target.value||"");updateCounts();});
  $("#nOut").value=exportText();
  $("#nCopy").addEventListener("click",()=>{const ta=$("#nOut");const done=()=>{S.meta.lastExport=Date.now();save();$("#nCopyMsg").textContent="コピーしました。メモやメールに貼りつけて保管してください。";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select();$("#nCopyMsg").textContent="下の文字をすべて選んで、コピーしてください。";});}
    else{ta.focus();ta.select();try{document.execCommand("copy");done();}catch(e){$("#nCopyMsg").textContent="下の文字をすべて選んで、コピーしてください。";}}});
  $("#nLoad").addEventListener("click",()=>{const raw=$("#nIn").value.trim();if(!raw){$("#nLoadMsg").textContent="記録の文字を貼りつけてください。";return;}
    let o;try{o=JSON.parse(raw);}catch(e){$("#nLoadMsg").textContent="読み込めません。文字が途中で切れていないか確かめてください。";return;}
    let added=0;if(o&&Array.isArray(o.log))added=mergeEntries(o.log,false);else if(o&&Array.isArray(o.attempts))added=mergeEntries(o.attempts,true);else{$("#nLoadMsg").textContent="このドリルの記録ではありません。";return;}
    rebuild();save();nt.msg=added?(added+"件の記録を読み込みました。"):"新しい記録はありませんでした（すでに読み込み済み）。";render();});
  const search=$("#nSearch");const found=$("#nFound");
  function showFound(){const q=search.value.trim();nt.q=q;if(!q){found.innerHTML="";return;}
    const list=ITEMS.filter(it=>it.a.indexOf(q)>=0||(it.y&&it.y.indexOf(q)>=0)||it.q.indexOf(q)>=0).slice(0,12);
    found.innerHTML=list.length?'<ul class="list">'+list.map(it=>'<li><div class="body"><div class="qq">'+utag(it)+' '+esc(it.q)+'</div><div class="aa">'+esc(fullAns(it))+(it.y?' <span class="yomi-in">'+esc(it.y)+'</span>':"")+'</div></div><button class="btn sm" data-mark="'+it.id+'">'+(isMarked(ST[it.id])?"印あり":"印をつける")+'</button></li>').join("")+'</ul>':'<div class="empty">見つかりません。</div>';
    found.querySelectorAll("[data-mark]").forEach(b=>b.addEventListener("click",()=>{record(b.dataset.mark,0,"manual");b.textContent="印をつけた";b.disabled=true;}));}
  search.addEventListener("input",showFound);showFound();}

/* ---------- init ---------- */
(function(){try{localStorage.setItem("gakushu-test","1");localStorage.removeItem("gakushu-test");}catch(e){storageOk=false;}})();
load();
const firstRun=!S.meta.startedAt;
const addedOld=importLegacy();
if(firstRun)S.meta.startedAt=Date.now();
if(addedOld){S.meta.legacyCount=(S.meta.legacyCount||0)+addedOld;view.banner="前の「社会 暗記ドリル」の記録 "+addedOld+"件を読み込みました。第1〜5回の語も、復習として少しずつ出ます。";}
if(addedOld||firstRun)save();
rebuild();
render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!view.sess)render();});
window.__drill={get S(){return S;},get ST(){return ST;},rebuild,applyEntry,newList,dueList,weakList,kanjiList,mergeEntries,exportText,cfg,reviewQuota};
})();

</script>
</body>
</html>
