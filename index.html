<script>
(function(){
"use strict";
const APP_VER="1.18.0";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=86400000;

/* ---------- content index ---------- */
const UNITS=CONTENT.units, ALL_ITEMS=CONTENT.items, SETS=CONTENT.sets, TIPS=CONTENT.tips, CYCLES=CONTENT.cycles, TESTS=CONTENT.tests||[];
const UNIT={};UNITS.forEach(u=>UNIT[u.id]=u);
const CARD_IDS=new Set(CONTENT.cardIds||[]); // 塾の暗記カードがある語
let ITEMS=ALL_ITEMS;const ITEM={};ALL_ITEMS.forEach(it=>ITEM[it.id]=it); // ITEM は全語（出題中の語を見失わないため）、ITEMS は設定で絞った語
const SET={};SETS.forEach(s=>SET[s.id]=s);
const ROUND_SHORT={};UNITS.forEach(u=>ROUND_SHORT[u.round]=u.short);
const ROUNDS=Array.from(new Set(UNITS.filter(u=>!u.past).map(u=>u.round))).sort((a,b)=>a-b); // 前の巻（past）は回の一覧に入れない
const PAST_UNITS=UNITS.filter(u=>!!u.past);
const SUBS=["社会","漢字","ことば"].filter(x=>UNITS.some(u=>u.sub===x));

/* ---------- storage ---------- */
const KEY="gakushu-v1";            // このアプリの記録
const OLD_KEY="shakai5b-drill-v1"; // 旧「社会 暗記ドリル」の記録（同じアドレスの下なら読める）
const SUB_CHUNK={"社会":20,"漢字":20};
const DEF={round:ROUNDS[ROUNDS.length-1],cap:60,chunk:20,back:10,goalNew:20,rest:2,rndS:false,rndK:true,rndW:false,cardOn:true,wordCardOnly:true,wtDow:6,sound:true,testDate:"",iv:[1,3,7,14,30,60,120]};
let S={schema:1,log:[],cfg:{},meta:{},days:{},badges:{},tests:[]}; // log: [id, g(2=○,1=△,0=×), t(ms), src]
let storageOk=true;
var CAP_FROM=Date.UTC(2026,9,21,5,0);
function cfg(k){const v=S.cfg?S.cfg[k]:null;
  if(k==="cap"&&v!=null&&((S.meta.cfgT||{}).cap||0)<CAP_FROM)return DEF.cap;   // 10/21 より前に選んだ上限は使わず、目安60語にする
  if(k==="round"){if(v!=null&&ROUNDS.includes(Number(v)))return Number(v);const u=S.cfg?S.cfg.unit:null;if(u&&UNIT[u])return UNIT[u].round;return DEF.round;}
  return v==null?DEF[k]:v;}
function setCfg(k,v){S.cfg[k]=v;(S.meta.cfgT=S.meta.cfgT||{})[k]=Date.now();save();}
/* ことばの語：当面は塾の暗記カードがある語だけを出す（設定で「すべての語」にもできる） */
function applyItemFilter(){const only=!!cfg("wordCardOnly");ITEMS=only?ALL_ITEMS.filter(it=>UNIT[it.u].sub!=="ことば"||CARD_IDS.has(it.id)):ALL_ITEMS;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.log)){S.log=o.log;S.cfg=o.cfg||{};S.meta=o.meta||{};S.days=o.days||{};S.badges=o.badges||{};S.tests=Array.isArray(o.tests)?o.tests:[];}}}catch(e){storageOk=false;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}syncSoon();}
function mapLegacyId(id){const m=/^q([1-5])-(\d\d)$/.exec(id);return m?("s5b0"+m[1]+"-0"+m[2]):id;}
function mergeEntries(list,legacy){const seen=new Set(S.log.map(a=>a[0]+"|"+a[2]));let added=0;
  list.forEach(a=>{if(!Array.isArray(a)||a.length<3)return;let id=String(a[0]);const t=Number(a[2]);if(!t||!isFinite(t))return;let g;
    if(legacy){id=mapLegacyId(id);g=a[1]?2:0;}else{g=Number(a[1]);g=g===2?2:(g===1?1:0);}
    const k=id+"|"+t;if(seen.has(k))return;seen.add(k);S.log.push([id,g,t,String(a[3]||"")]);added++;});
  if(added)S.log.sort((x,y)=>x[2]-y[2]);return added;}
function importLegacy(){try{const raw=localStorage.getItem(OLD_KEY);if(!raw)return 0;const o=JSON.parse(raw);if(!o||!Array.isArray(o.attempts))return 0;return mergeEntries(o.attempts,true);}catch(e){return 0;}}

let ST={};
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.getTime();}
function todayStart(){return dayStart(Date.now());}
function applyEntry(a){if(lapCache)lapCache.k="";if(smpCache)smpCache.k="";const iv=cfg("iv");const id=a[0],g=a[1],t=a[2];let s=ST[id];const first=!s;
  if(!s)s=ST[id]={stage:0,due:0,c:0,w:0,k:0,kp:0,seq:[],lastT:0,firstT:t,firstSrc:a[3]||"",maxStage:0,clr:0,kclr:0,g0:g,hof:0};
  const wasMarked=isMarked(s),wasKp=s.kp>0;
  /* 前の範囲（復習・積み上げで初めて出た語）は習った語なので、初めて○なら次は7日後から */
  const pastFirst=first&&(a[3]==="review"||a[3]==="back");
  /* 社会の1周目は浅く解くので、×・△でも印にしない */
  const it0=ITEM[id],soft=first&&(a[3]==="lap1"||(a[3]==="new"&&t>=SOFT_FROM&&!!it0&&!!UNIT[it0.u]&&UNIT[it0.u].sub==="社会"));
  if(g===2){s.c++;
    if(pastFirst){s.stage=Math.min(3,iv.length);s.due=addDays(dayStart(t),iv[s.stage-1]);}
    else if(s.stage===0||t>=s.due){const late=s.stage>0?(dayStart(t)-s.due)/DAY:0;
      s.stage=Math.min(s.stage+((s.stage>0&&late>=iv[s.stage-1])?2:1),iv.length);s.due=addDays(dayStart(t),iv[s.stage-1]);
      if(s.stage>=iv.length)s.hof=1;}   // 60日あけて○で殿堂入り
    if(s.kp>0)s.kp--;}
  else{if(!soft)s.w++;if(g===1){s.k++;s.kp=2;}s.stage=1;s.hof=0;s.due=addDays(dayStart(t),iv[0]);}
  s.seq.push(g);if(s.seq.length>6)s.seq.shift();s.lastT=t;
  if(s.stage>s.maxStage)s.maxStage=s.stage;if(wasMarked&&!isMarked(s))s.clr=1;if(wasKp&&s.kp===0)s.kclr=1;}
function rebuild(){applyItemFilter();ST={};for(const a of S.log)applyEntry(a);}
function record(id,g,src){const a=[id,g,Date.now(),src||""];S.log.push(a);applyEntry(a);checkBadges();save();updateCounts();}
var SOFT_FROM=Date.UTC(2026,9,20,15,0);   // 社会の1周目の×を印にしないのは、10/21から
function isHof(s){return !!s&&!!s.hof;}
function isMarked(s){if(!s||s.w===0)return false;const n=s.seq.length;return !(n>=2&&s.seq[n-1]===2&&s.seq[n-2]===2);}
function isKanjiPending(s){return !!s&&s.kp>0;}

/* ---------- きょうの出題 ---------- */
function curRound(){return cfg("round");}
function curUnits(){const r=curRound();return UNITS.filter(u=>u.round===r);}
function curVol(){const l=curUnits();return (l[0]||UNITS.find(u=>!u.past)||UNITS[0]).vol;}
function curCycle(){const l=curUnits();if(l.length)return l[0].cycle;const c=UNITS.filter(u=>!u.past);return (c[c.length-1]||UNITS[0]).cycle;}
function rangeUnits(){const t=nextTest();if(t&&t.days<=7){if(t.cycle===0)return UNITS.slice();if(t.cycle>0){const l=UNITS.filter(u=>u.cycle===t.cycle);if(l.length)return l;}}
  const c=curCycle();return UNITS.filter(u=>u.cycle===c);}
function newList(sub){const r=curRound();return ITEMS.filter(it=>{const u=UNIT[it.u];return u.round===r&&(!sub||u.sub===sub)&&!ST[it.id];});}
/* 前の範囲（前の回と前の巻）のまだ解いていない語。近い回から順：第7回→…→第1回→5年上→4年下→4年上 */
function backOrder(u){const r=curRound();return u.past?(1000-u.round):(r-u.round);}
/* 抜き取り確認（4年の漢字）。回ごとに：untested＝抜き取りの語がまだ／pass＝9割以上○（残りは出さない）／fail＝全部出す */
var smpCache={k:""};
function smpStatus(){if(smpCache.k==="ok")return smpCache.m;const g={};
  ITEMS.forEach(it=>{if(!it.smp)return;const key=it.u+":"+it.r;const x=g[key]=g[key]||{n:0,done:0,ok:0};x.n++;const s=ST[it.id];if(s){x.done++;if(s.g0===2)x.ok++;}});
  const m={};Object.keys(g).forEach(k=>{const x=g[k];m[k]=x.done<x.n?"untested":(x.ok>=Math.ceil(x.n*0.9)?"pass":"fail");});
  smpCache={k:"ok",m};return m;}
function smpVisible(it){if(it.r==null||!UNIT[it.u]||!UNIT[it.u].smp)return true;const st=smpStatus()[it.u+":"+it.r]||"untested";return st==="fail"||(st==="untested"&&!!it.smp);}
function smpHidden(it){return !ST[it.id]&&!smpVisible(it)&&smpStatus()[it.u+":"+it.r]==="pass";}
/* 前の範囲で、まだ解いていない語（教科ごと）。近い回から順 */
function pastPool(sub){const r=curRound();const sq=x=>Number(x.id.slice(-3));
  return ITEMS.filter(it=>{const u=UNIT[it.u];return u.round<r&&(!sub||u.sub===sub)&&!ST[it.id]&&smpVisible(it);}).sort((a,b)=>backOrder(UNIT[a.u])-backOrder(UNIT[b.u])||sq(a)-sq(b));}
function backlogList(){const r=curRound();const so=x=>SUBS.indexOf(UNIT[x.u].sub);const sq=x=>Number(x.id.slice(-3));return ITEMS.filter(it=>UNIT[it.u].round<r&&!ST[it.id]&&smpVisible(it)).sort((a,b)=>backOrder(UNIT[a.u])-backOrder(UNIT[b.u])||sq(a)-sq(b)||so(a)-so(b));}
/* のこりの内わけ：「第1〜7回 257・5年上 640」のように、いまの巻は回の範囲でまとめ、前の巻は巻ごと */
function backBreak(l){const cur={n:0,lo:Infinity,hi:-Infinity};const past=new Map();l.forEach(it=>{const u=UNIT[it.u];if(u.past)past.set(u.id,(past.get(u.id)||0)+1);else{cur.n++;cur.lo=Math.min(cur.lo,u.round);cur.hi=Math.max(cur.hi,u.round);}});
  const p=[];if(cur.n)p.push((cur.lo===cur.hi?"第"+cur.lo+"回":"第"+cur.lo+"〜"+cur.hi+"回")+" "+cur.n);Array.from(past.keys()).sort((a,b)=>backOrder(UNIT[a])-backOrder(UNIT[b])).forEach(k=>p.push(UNIT[k].short+" "+past.get(k)));return p.join("・");}
/* いまの回のことばは、毎日カード全部を1回ずつやる（復習・弱点には入れない） */
function inDeck(it){const u=UNIT[it.u];return u.sub==="ことば"&&u.round===curRound();}
function deckList(){return ITEMS.filter(inDeck);}
/* 社会のいまの回は「1日で1周」：1周目のあとは、毎日「まだ危ない語」だけ1周。週テストの前日は全部をもう1周 */
const LAP_SUB="社会",LAP_CHUNK=20;
function inLap(it){const u=UNIT[it.u];return !!u&&u.sub===LAP_SUB&&!u.past&&u.round===curRound();}
function lapItems(){return ITEMS.filter(inLap);}
const WDAY="日月火水木金土";
function isLapEve(t){return new Date(t||Date.now()).getDay()===(Number(cfg("wtDow"))+6)%7;}   // 週テストの前日
/* 2日以上にまたがって○が続いている語（その週の周回から外す） */
var lapCache={k:""};
function lapSafe(){const k=S.log.length+"|"+dayKey(Date.now())+"|"+curRound()+"|"+ITEMS.length;if(lapCache.k===k)return lapCache.set;
  const ids=new Set(lapItems().map(it=>it.id));const hist={};
  S.log.forEach(a=>{if(ids.has(a[0]))(hist[a[0]]=hist[a[0]]||[]).push(a);});
  const set=new Set();Object.keys(hist).forEach(id=>{const l=hist[id].sort((x,y)=>x[2]-y[2]);const days=new Set();
    for(let i=l.length-1;i>=0;i--){if(l[i][1]!==2)break;days.add(dayKey(l[i][2]));}if(days.size>=2)set.add(id);});
  lapCache={k,set};return set;}
/* 周回にふくまれている語（復習・弱点の段には出さない） */
function lapCovers(it){return inLap(it)&&(isLapEve()||!lapSafe().has(it.id));}
/* 積み上げ：前の範囲から、教科を順に（社会→漢字→ことば→…）。前の範囲がなくなったら印つきの語 */
function stackToday(){const seen=new Set();todayEntries().forEach(a=>{if(a[3]==="back"&&ITEM[a[0]])seen.add(a[0]);});return seen.size;}
function stackPool(){const ts=todayStart();const pools=SUBS.map(sub=>pastPool(sub));const out=[];let k=0,more=true;
  while(more){more=false;pools.forEach(p=>{if(k<p.length){out.push(p[k]);more=true;}});k++;}
  if(out.length)return {list:out,kind:"past",pools};
  return {list:ITEMS.filter(it=>{const s=ST[it.id];return isMarked(s)&&!s.hof&&s.lastT<ts&&!inDeck(it)&&!lapCovers(it);}),kind:"weak",pools};}
function stackOpen(rg){rg=rg||rings();return rg[0].done>=rg[0].goal&&rg[1].done>=rg[1].goal;}
function startStack(){const sp=stackPool();if(!sp.list.length)return;startSession(sp.list.slice(0,cfg("chunk")).map(it=>it.id),{src:"back",title:"積み上げ",stack:true});}
function lapState(){const ts=todayStart();const L=lapItems();const eve=isLapEve();const safe=lapSafe();
  const first=L.filter(it=>!ST[it.id]);
  const daily=L.filter(it=>{const s=ST[it.id];return s&&s.lastT<ts&&(eve||!safe.has(it.id));});
  return {L,first,daily,eve,safe:L.filter(it=>safe.has(it.id)).length};}
function lapTitle(kind){const rs="第"+curRound()+"回";return LAP_SUB+" "+rs+(kind==="first"?" 1周目":(isLapEve()?" 週テスト前日の1周":" きょうの1周"));}
function startLap(kind){const lp=lapState();const l=kind==="first"?lp.first:lp.daily;if(!l.length){view.sess=null;switchTab("home");return;}
  startSession(arrange(l).slice(0,LAP_CHUNK).map(it=>it.id),{src:kind==="first"?"lap1":"lap",title:lapTitle(kind),lap:kind});}
function deckLeft(){const ts=todayStart();return deckList().filter(it=>{const s=ST[it.id];return !s||s.lastT<ts;});}
function dueList(){const ts=todayStart();const iv=cfg("iv");const lr=s=>(ts-s.due)/DAY/iv[Math.max(0,s.stage-1)];
  return ITEMS.filter(it=>{const s=ST[it.id];return s&&!s.hof&&s.due<=ts&&!inDeck(it)&&!lapCovers(it);}).sort((a,b)=>{const x=ST[a.id],y=ST[b.id];return lr(y)-lr(x)||(isMarked(y)-isMarked(x))||x.due-y.due;});}
function weakList(){const us=new Set(rangeUnits().map(u=>u.id));return ITEMS.filter(it=>us.has(it.u)&&isMarked(ST[it.id])&&!ST[it.id].hof&&!inDeck(it)&&!lapCovers(it)).sort((a,b)=>ST[b.id].w-ST[a.id].w||ST[a.id].lastT-ST[b.id].lastT);}
function kanjiList(){return ITEMS.filter(it=>isKanjiPending(ST[it.id])).sort((a,b)=>ST[b.id].k-ST[a.id].k);}
function todayMissed(){const ts=todayStart();const m={},out=[];
  S.log.forEach(a=>{if(a[2]<ts||!ITEM[a[0]])return;let x=m[a[0]];
    if(a[1]<2){if(!x){x=m[a[0]]={id:a[0],x:0,t:0,last:a[1]};out.push(x);}if(a[1]===0)x.x++;else x.t++;}
    if(x)x.last=a[1];});return out;}
function todayEntries(){const ts=todayStart();return S.log.filter(a=>a[2]>=ts);}
/* きょうの復習の計画：1日の目安（cap）を教科ごとに等分し、足りない教科の分はほかの教科へ。予定の語を先に、空いた分を前の範囲でうめる */
function reviewDoneBySub(){const seen=new Set(),c={};todayEntries().forEach(a=>{if(a[3]!=="review"||!ITEM[a[0]]||seen.has(a[0]))return;seen.add(a[0]);const sub=UNIT[ITEM[a[0]].u].sub;c[sub]=(c[sub]||0)+1;});return c;}
function reviewPlan(){reviewQuota();const total=cfg("cap")+extraToday;const done=reviewDoneBySub();const due=dueList();const per={};
  SUBS.forEach(sub=>{const d=due.filter(it=>UNIT[it.u].sub===sub);const p=pastPool(sub);per[sub]={due:d,pool:p,done:done[sub]||0,alloc:0};});
  let rest=total,open=SUBS.filter(sub=>per[sub].done+per[sub].due.length+per[sub].pool.length>0);
  while(rest>0&&open.length){const share=Math.max(1,Math.floor(rest/open.length));let used=0;const next=[];
    open.forEach(sub=>{const x=per[sub];const need=x.done+x.due.length+x.pool.length-x.alloc;const g=Math.min(share,need,rest-used);if(g>0){x.alloc+=g;used+=g;}if(x.alloc<x.done+x.due.length+x.pool.length)next.push(sub);});
    rest-=used;if(!used)break;open=next;}
  SUBS.forEach(sub=>{const x=per[sub];x.left=Math.max(0,x.alloc-x.done);x.queue=x.due.concat(x.pool).slice(0,x.left);});
  return {total,per};}
function reviewsToday(){const set=new Set();todayEntries().forEach(a=>{if(a[3]==="review")set.add(a[0]);});return set.size;}
let extraToday=0,extraDay=0;
function reviewQuota(){if(extraDay!==todayStart()){extraDay=todayStart();extraToday=0;}return Math.max(0,cfg("cap")+extraToday-reviewsToday());}
function testList(){const list=TESTS.map(t=>({date:t.date,name:t.name,cycle:t.cycle}));const c=cfg("testDate");
  if(c&&!list.some(t=>t.date===c))list.push({date:c,name:"テスト",cycle:-1});
  const ts=todayStart();return list.map(t=>{const ms=new Date(t.date+"T00:00:00").getTime();return Object.assign(t,{ms,days:Math.round((ms-ts)/DAY)});}).filter(t=>isFinite(t.ms)).sort((a,b)=>a.ms-b.ms);}
function nextTest(){return testList().find(t=>t.days>=0)||null;}
function daysToTest(){const t=nextTest();return t?t.days:null;}
function isPreTest(){const n=daysToTest();return n!=null&&n<=7;}
function testDateText(t){const d=new Date(t.ms);return (d.getMonth()+1)+"月"+d.getDate()+"日";}

/* ---------- helpers ---------- */
const RND_KEY={"社会":"rndS","漢字":"rndK","ことば":"rndW"};
function isRnd(it){const u=UNIT[it.u];return !!(u&&cfg(RND_KEY[u.sub]));}
/* 「ばらばら」の教科の語だけを、その語どうしの位置で入れかえる。社会など「教科書の順」の語は動かさない。
   grp を渡すと、同じ組（例：同じ回）の中だけで入れかえる */
function arrange(list,grp){const g={};list.forEach((it,i)=>{if(!isRnd(it))return;const k=grp?grp(it):"";(g[k]=g[k]||[]).push(i);});
  const out=list.slice();Object.keys(g).forEach(k=>{const pos=g[k];const sh=shuffle(pos.map(p=>list[p]));pos.forEach((p,n)=>{out[p]=sh[n];});});return out;}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function tag(r){return '<span class="tag r'+r+'">'+esc(ROUND_SHORT[r]||("第"+r+"回"))+'</span>';}
function utag(it){const u=UNIT[it.u];return '<span class="tag r'+u.round+'">'+esc(u.sub+" "+u.short)+'</span>';}
const fullAns=it=>it.a+(it.s||"");
const bare=it=>it.a.replace(/[『』「」＝・]/g,"");
/* 国語の漢字：字数も送りがなも見せず、1つの長いわくに書かせる（社会は字数のマスのまま） */
const isKokugoKanji=it=>it.k==="kanji"&&!!UNIT[it.u]&&UNIT[it.u].sub!=="社会";
function hintText(it){if(it.h)return esc(it.h);const n=bare(it).length;
  if(isKokugoKanji(it))return "漢字に直す。送りがなが必要なら、送りがなもひらがなで書く";
  if(it.k==="kanji"){const all=/^[\u3400-\u9FFF々]+$/.test(bare(it));return (all?"漢字"+n+"字":n+"字（漢字で書く）")+(it.s?"＋「"+esc(it.s)+"」":"");}
  if(it.k==="kana")return "カタカナ"+n+"字"+(it.s?"＋「"+esc(it.s)+"」":"");
  return UNIT[it.u].sub==="ことば"?"ことばを答える（ひらがなでもよい）":"ことばで答える";}
function boxesHtml(it){if(it.k!=="kanji"&&it.k!=="kana")return "";
  if(isKokugoKanji(it))return '<div class="boxes"><span class="wbox"><span>'+esc(fullAns(it))+'</span></span></div>';
  let h='<div class="boxes">';
  it.a.replace(/[『』「」]/g,"").split("").forEach(c=>{if(c==="＝"||c==="・")h+='<span class="sep">'+esc(c)+'</span>';else h+='<span class="box"><span>'+esc(c)+'</span></span>';});
  if(it.s)h+='<span class="box suffix">'+esc(it.s)+'</span>';return h+'</div>';}
function explHtml(it){const parts=[];if(it.n)parts.push('<p class="pt">'+esc(it.n)+'</p>');if(it.e)parts.push('<p>'+esc(it.e)+'</p>');if(!parts.length)return "";return '<div class="expl"><div class="expl-t">解説</div>'+parts.join("")+'</div>';}
function scrollTop(){window.scrollTo({top:0,behavior:"auto"});}
function bar(done,total,marked){const pd=total?Math.round(done/total*100):0;const pm=total?Math.round(marked/total*100):0;return '<div class="pbar"><i class="d" style="width:'+pd+'%"></i><i class="m" style="width:'+pm+'%"></i></div>';}
function unitProgress(u){const list=ITEMS.filter(it=>it.u===u.id);let done=0,marked=0,solid=0,hof=0,skip=0;list.forEach(it=>{const s=ST[it.id];if(s){done++;if(isMarked(s))marked++;if(s.stage>=3)solid++;if(s.hof)hof++;}else if(u.smp&&smpHidden(it))skip++;});return {u,total:list.length,done,un:list.length-done,marked,solid,hof,skip};}
function fmtDate(t){const d=new Date(t);return (d.getMonth()+1)+"月"+d.getDate()+"日";}

/* ======================================================
   きょう
====================================================== */
function todaySteps(){const steps=[];const chunk=cfg("chunk");const rs="第"+curRound()+"回";
  const ts0=todayStart();const fresh=l=>l.filter(it=>ST[it.id].lastT<ts0);const bySub=(l,sub)=>l.filter(it=>UNIT[it.u].sub===sub);
  const nw=newList(),due=dueList(),weak=fresh(weakList()),quota=reviewQuota(),back=backlogList(),rp=reviewPlan();

  if(lp.first.length)sLap.push({label:LAP_SUB+" "+rs+" 1周目　のこり"+lp.first.length+"語",sub:"全"+lp.L.length+"語を、きょうのうちに1周する。20語ごとに「続ける」で先へ。"+(cfg(RND_KEY[LAP_SUB])?"順番はばらばらに出る":"教科書の順に出る"),act:()=>startLap("first")});

  const sNew=sLap.concat(SUBS.filter(sub=>sub!=="ことば"&&sub!==LAP_SUB).map(sub=>{const l=newList(sub);if(!l.length)return null;const n=SUB_CHUNK[sub]||chunk;
    return {label:sub+" "+rs+"の新しい語を "+Math.min(n,l.length)+"語",sub:"のこり"+l.length+"語。"+(cfg(RND_KEY[sub])?"順番はばらばらに出る":"教科書の順に出る"),
      act:()=>startSession(arrange(newList(sub)).slice(0,n).map(it=>it.id),{src:"new",title:sub+" "+rs+"の新しい語"})};}).filter(Boolean));
  // ことば：いまの回のカードを、毎日全部1回ずつ
  const dk=deckList(),dkLeft=deckLeft();
  const sDeck=dkLeft.length?{label:"ことば "+rs+"のカード "+dkLeft.length+"語",
    sub:(dkLeft.length<dk.length?"全"+dk.length+"語のうち、今日まだ解いていない語。":"毎日、"+rs+"のカード全部を1回ずつ。")+(cfg("rndW")?"順番はばらばらに出る":"カードの順に出る"),
    act:()=>startSession(arrange(deckLeft()).map(it=>it.id),{src:"deck",title:"ことば "+rs+"のカード"})}:null;

  const sRev=SUBS.map(sub=>{const x=rp.per[sub];if(!x.left||!x.queue.length)return null;const q=x.queue.slice(0,chunk);const a=q.filter(it=>!!ST[it.id]).length,b=q.length-a;

  const sWeak=SUBS.map(sub=>{const l=bySub(weak,sub);if(!l.length||!isPreTest())return null;   // 弱点の段は、テストの直前7日だけ

      act:()=>startSession(arrange(bySub(fresh(weakList()),sub).slice(0,chunk)).map(it=>it.id),{src:"weak",title:wName+"（"+sub+"）"})};}).filter(Boolean);

  (isPreTest()?sWeak.concat(sRev,sNew,[sDeck],sBack):sNew.concat([sDeck],sRev,sWeak,sBack)).forEach(s=>{if(s)steps.push(s);});
  return {steps,due,quota,nw,weak,back,rp,deck:dk,deckLeft:dkLeft};}

/* ======================================================
   バッジ（記録から自動で判定する。ポイントはつけない）
====================================================== */
const PAST_MIN=20;  // バッジを入れる前の日は、この数以上解いた日を「輪がそろった日」とみなす
const pad2=n=>String(n).padStart(2,"0");
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function keyMs(k){return new Date(k+"T00:00:00").getTime();}
function mdText(k){const p=k.split("-");return Number(p[1])+"月"+Number(p[2])+"日";}
function isAns(a){return !!ITEM[a[0]]&&a[3]!=="manual";}

/* きょうの3つの輪 */
function rings(){const ts=todayStart();const r=curRound();let nDone=0;
  ITEMS.forEach(it=>{const s=ST[it.id];if(!s||s.firstT<ts||s.firstSrc==="manual")return;const ur=UNIT[it.u].round;if(ur===r)nDone++;});
  const nGoal=Math.min(cfg("goalNew"),nDone+newList().length);
  const rp=reviewPlan();let rDone=0,rAll=0;SUBS.forEach(sub=>{rDone+=rp.per[sub].done;rAll+=rp.per[sub].alloc;});const rGoal=Math.min(rp.total,Math.max(rAll,rDone));
  const bDone=stackToday();const bAvail=stackPool().list.length;const bGoal=Math.min(cfg("back"),bDone+bAvail);const bLabel="自分で";
  return [{k:"new",c:"ai",label:"新しい語",done:nDone,goal:nGoal},{k:"rev",c:"midori",label:"復習",done:rDone,goal:rGoal},{k:"back",c:"ki",label:"積み上げ",sub:bLabel,done:bDone,goal:bGoal}];}
function ringsClosed(rg){return rg.every(x=>x.done>=x.goal)&&todayEntries().some(isAns);}
function ringsSvg(rg,size){const R=[42,31,20];let h='<svg class="rings" viewBox="0 0 100 100" width="'+size+'" height="'+size+'" role="img" aria-label="'+esc(rg.map(x=>x.label+" "+x.done+"／"+x.goal).join("、"))+'">';
  rg.forEach((x,i)=>{const c=2*Math.PI*R[i];const f=x.goal?Math.min(1,x.done/x.goal):1;
    h+='<circle class="trk" cx="50" cy="50" r="'+R[i]+'"/>';
    if(f>0)h+='<circle class="p r-'+x.c+(x.goal?"":" none")+'" cx="50" cy="50" r="'+R[i]+'" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'"/>';});
  return h+'</svg>';}
function ringsList(rg){return '<div class="ringlist">'+rg.map(x=>'<div><i class="dot '+x.c+'"></i>'+esc(x.label)+'　'+(x.goal?'<b>'+x.done+'</b> / '+x.goal+'語'+(x.done>=x.goal?'<span class="okm">○</span>':""):'<span class="muted">きょうはなし</span>')+'</div>').join("")+'</div>';}

/* 輪がそろった日・連続・週 */
function achievedFn(){const cnt={};S.log.forEach(a=>{if(isAns(a)){const k=dayKey(a[2]);cnt[k]=(cnt[k]||0)+1;}});const from=S.meta.badgeFrom||0;
  return k=>!!S.days[k]||(keyMs(k)<from&&(cnt[k]||0)>=PAST_MIN);}
function mondayOf(ds){return addDays(ds,-((new Date(ds).getDay()+6)%7));}
function streakInfo(ach){const REST=cfg("rest");const today=todayStart();const r={cur:0,best:0,restLeft:REST,ach:0,w5:[],w7:[],weekNow:0};
  const fa=S.log.find(isAns);if(!fa)return r;const first=dayStart(fa[2]);const used={};let cur=0;
  for(let d=first;d<=today;d=addDays(d,1)){const k=dayKey(d);
    if(ach(k)){cur++;r.ach++;if(cur>r.best)r.best=cur;}
    else if(d!==today&&cur>0){const m=k.slice(0,7);if((used[m]||0)<REST)used[m]=(used[m]||0)+1;else cur=0;}}
  r.cur=cur;r.restLeft=REST-(used[dayKey(today).slice(0,7)]||0);
  const mNow=mondayOf(today);
  for(let w=mondayOf(first);w<=today;w=addDays(w,7)){let n=0;for(let i=0;i<7;i++){if(ach(dayKey(addDays(w,i))))n++;}
    if(n>=5)r.w5.push(dayKey(w));if(n>=7)r.w7.push(dayKey(w));if(w===mNow)r.weekNow=n;}
  return r;}
function roundStat(r){const us=new Set(UNITS.filter(u=>u.round===r).map(u=>u.id));let total=0,done=0,solid=0,marked=0;
  ITEMS.forEach(it=>{if(!us.has(it.u))return;total++;const s=ST[it.id];if(s){done++;if(s.stage>=3)solid++;if(isMarked(s))marked++;}});return {total,done,solid,marked};}

/* シークレットバッジの一覧。img は取り込んだ絵（カードと同じしくみ）。絵がない端末では big/small の文字のメダル */

function badgeDefs(){const ach=achievedFn();const st=streakInfo(ach);const today=todayStart();const defs=[];
  let ans=0;S.log.forEach(a=>{if(isAns(a))ans++;});
  let fix=0,lng=0,clr=0,kclr=0;ITEMS.forEach(it=>{const s=ST[it.id];if(!s)return;if(s.maxStage>=3)fix++;if(s.maxStage>=6)lng++;if(s.clr)clr++;if(s.kclr)kclr++;});
  const one=(key,cat,cls,big,small,name,cond,ok,prog,x)=>defs.push(Object.assign({key,cat,cls,big,small,name,cond,ok:ok?[key]:[],prog},x||{}));

/* ======================================================
   テストの点数（つきそう人が入力）とテスト結果のバッジ
====================================================== */
const TSUB=[["ma","算数"],["ja","国語"],["sc","理科"],["so","社会"]];
function testsSorted(){return S.tests.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.id<b.id?-1:(a.id>b.id?1:0)));}
function testTotal(t){let n=0;for(const x of TSUB){const v=t.sc?t.sc[x[0]]:null;if(v==null)return null;n+=v;}return n;}
/* 週テストごとに、これまでの最高をこえた教科（最初の1回はくらべる相手がないので対象外） */
function weeklyBests(){const best={},out={};testsSorted().forEach(t=>{if(t.kind!=="w")return;
  const vals=TSUB.map(x=>[x[0],x[1],t.sc?t.sc[x[0]]:null]);vals.push(["tot","4科合計",testTotal(t)]);const hit=[];
  vals.forEach(v=>{if(v[2]==null)return;if(best[v[0]]!=null&&v[2]>best[v[0]])hit.push(v[1]);if(best[v[0]]==null||v[2]>best[v[0]])best[v[0]]=v[2];});
  if(hit.length)out[t.id]=hit;});return out;}
function readTf(){const f=view.tf;const g=id=>{const e=$(id);return e?e.value:null;};
  const d=g("#tD");if(d!=null)f.d=d;const no=g("#tNo");if(no!=null)f.no=no;TSUB.forEach(x=>{const v=g("#t_"+x[0]);if(v!=null)f[x[0]]=v;});}

  let h='<div class="panel mt" id="tPanel"><h2>テストの点数　<span class="muted small">つきそう人が入力</span></h2>'
    +'<p class="muted small">週テストで点数がこれまでの最高をこえたときと、組分けテストでSクラスになったときに、バッジがとどきます。</p>'
    +'<div class="lbl">テストの種類</div><div class="chips">'+[["w","週テスト"],["k","組分けテスト"]].map(x=>'<button class="chip'+(f.kind===x[0]?" on":"")+'" data-tk="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'
    +'<div class="tgrid mt"><label>テストの日<input type="date" id="tD" value="'+esc(f.d||dayKey(Date.now()))+'"></label><label>回（なくてもよい）<input type="number" id="tNo" min="1" max="40" inputmode="numeric" placeholder="例：6" value="'+esc(f.no)+'"></label></div>'
    +'<div class="lbl">点数（受けた教科だけ）</div><div class="tgrid four">'+TSUB.map(x=>'<label>'+x[1]+'<input type="number" id="t_'+x[0]+'" min="0" max="999" inputmode="numeric" value="'+esc(f[x[0]])+'"></label>').join("")+'</div>'
    +(f.kind==="k"?'<div class="lbl">組（クラス）</div><div class="chips">'+["S","C","B","A"].map(c=>'<button class="chip'+(f.cls===c?" on":"")+'" data-tc="'+c+'">'+c+'</button>').join("")+'</div>':"")
    +'<div class="row mt"><button class="btn sm primary" id="tAdd">記録する</button><span class="small'+(f.err?" red":" grn")+'" id="tMsg" role="status">'+esc(f.msg)+'</span></div>';
  if(list.length){h+='<ul class="list mt">'+list.map(t=>{const sc=TSUB.filter(x=>t.sc&&t.sc[x[0]]!=null).map(x=>x[1].charAt(0)+t.sc[x[0]]).join("　");const tot=testTotal(t);
      return '<li><div class="body"><div class="qq"><b>'+esc(mdText(t.d))+'</b>　'+(t.kind==="k"?"組分けテスト":"週テスト")+(t.no?"　第"+esc(t.no)+"回":"")+(t.cls?'　<b>'+esc(t.cls)+'クラス</b>':"")+'</div>'
        +'<div class="small">'+esc(sc)+(tot!=null?"　計"+tot:"")+'</div>'+(wb[t.id]?'<div class="small grn"><b>自己ベスト：'+esc(wb[t.id].join("・"))+'</b></div>':"")+'</div>'
        +'<button class="btn sm'+(f.del===t.id?" ng":"")+'" data-tdel="'+esc(t.id)+'">'+(f.del===t.id?"もう一度おすと消える":"消す")+'</button></li>';}).join("")+'</ul>';}
  else h+='<div class="empty">まだ記録はありません。</div>';
  return h+'</div>';}
function bindTestPanel(el){const f=view.tf;
  el.querySelectorAll("[data-tk]").forEach(b=>b.addEventListener("click",()=>{readTf();f.kind=b.dataset.tk;f.msg="";f.del=null;renderNotesKeep();}));
  el.querySelectorAll("[data-tc]").forEach(b=>b.addEventListener("click",()=>{readTf();f.cls=f.cls===b.dataset.tc?"":b.dataset.tc;f.msg="";renderNotesKeep();}));
  el.querySelectorAll("[data-tdel]").forEach(b=>b.addEventListener("click",()=>{readTf();const id=b.dataset.tdel;
    if(f.del!==id){f.del=id;f.msg="";renderNotesKeep();return;}
    S.tests=S.tests.filter(t=>t.id!==id);(S.meta.testDel=S.meta.testDel||{})[id]=Date.now();f.del=null;f.err=false;f.msg="消しました。";checkBadges();fxIds=fxIds.filter(x=>!/^(wb|ks):/.test(x));save();renderNotesKeep();}));
  const add=$("#tAdd");if(add)add.addEventListener("click",()=>{readTf();f.del=null;f.err=true;
    const d=f.d||dayKey(Date.now());if(!/^\d{4}-\d\d-\d\d$/.test(d)){f.msg="テストの日を入れてください。";renderNotesKeep();return;}
    const sc={};let bad=false,n=0;TSUB.forEach(x=>{const raw=String(f[x[0]]==null?"":f[x[0]]).trim();if(raw==="")return;const v=Number(raw);if(!isFinite(v)||v<0||v>999||Math.floor(v)!==v){bad=true;return;}sc[x[0]]=v;n++;});
    if(bad){f.msg="点数は0〜999の数字で入れてください。";renderNotesKeep();return;}
    if(!n&&!(f.kind==="k"&&f.cls)){f.msg=f.kind==="k"?"点数かクラスを入れてください。":"点数を1つ以上入れてください。";renderNotesKeep();return;}
    let no=null;if(String(f.no||"").trim()!==""){no=Number(f.no);if(!isFinite(no)||no<1||no>99||Math.floor(no)!==no){f.msg="回は数字で入れてください。";renderNotesKeep();return;}}
    const t={id:"t"+Date.now().toString(36),d,kind:f.kind==="k"?"k":"w",no,sc,cls:f.kind==="k"?(f.cls||""):""};S.tests.push(t);
    checkBadges();save();const wb=weeklyBests()[t.id];
    f.err=false;f.msg="記録しました。"+(wb?"自己ベスト："+wb.join("・"):"")+(t.cls==="S"?"Sクラス！":"");TSUB.forEach(x=>{f[x[0]]="";});f.no="";f.cls="";

/* ======================================================

const sheet=document.createElement("div");sheet.id="sheet";sheet.setAttribute("aria-label","印刷用シート");document.body.appendChild(sheet);
const SH={mode:1,scope:"mark",rk:{}};
function sheetKey(it,idx){if(!isRnd(it))return idx[it.id];if(SH.rk[it.id]==null)SH.rk[it.id]=Math.random();return SH.rk[it.id];}
function sheetItems(scope){const idx={};ITEMS.forEach((it,i)=>{idx[it.id]=i;});let l;
  if(scope==="today")l=todayMissed().map(x=>ITEM[x.id]);else if(scope==="kanji")l=kanjiList();else if(scope==="round"){const r=curRound();l=ITEMS.filter(it=>UNIT[it.u].round===r);}else l=ITEMS.filter(it=>isMarked(ST[it.id]));
  return l.slice().sort((a,b)=>SUBS.indexOf(UNIT[a.u].sub)-SUBS.indexOf(UNIT[b.u].sub)||UNIT[a.u].round-UNIT[b.u].round||sheetKey(a,idx)-sheetKey(b,idx));}

  if(it.k==="kanji"||it.k==="kana"){let h="";it.a.replace(/[『』「」]/g,"").split("").forEach(c=>{h+=(c==="＝"||c==="・")?esc(c):'<span class="bx"></span>';});return h+(it.s?" "+esc(it.s):"");}
  return '<span class="line"></span>';}
function openSheet(scope){if(scope)SH.scope=scope;SH.rk={};buildSheet();sheet.classList.add("show");document.body.style.overflow="hidden";sheet.scrollTop=0;}
function closeSheet(){sheet.classList.remove("show");document.body.style.overflow="";}
function buildSheet(){const hide=SH.mode===1,withE=SH.mode===2;const d=new Date();const date=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  const n={today:sheetItems("today").length,mark:sheetItems("mark").length,kanji:sheetItems("kanji").length,round:sheetItems("round").length};const list=sheetItems(SH.scope);

    +'<span class="chips">'+[[1,"答えをかくす（書きこみ用）"],[0,"答えつき"],[2,"答えと解説つき"]].map(x=>'<button class="chip'+(SH.mode===x[0]?" on":"")+'" data-sm="'+x[0]+'">'+x[1]+'</button>').join("")+'</span>'

  if(!list.length)h+='<div class="empty">この対象の語は、いまはありません。</div>';

        +'<td class="a">'+(hide?sheetBlanks(it):esc(fullAns(it))+(it.y?' <span class="yo">'+esc(it.y)+'</span>':""))+'</td><td class="cnt">'+(s&&s.w?"×"+s.w:"")+'</td></tr>';}).join("")+'</table>';});
  h+='</div>';sheet.innerHTML=h;

  sheet.querySelector("#sClose").addEventListener("click",closeSheet);
  sheet.querySelectorAll("[data-ss]").forEach(b=>b.addEventListener("click",()=>{SH.scope=b.dataset.ss;buildSheet();}));

const FB_CONFIG={apiKey:"AIzaSyBG_tnNafzVao3_jThXLHY0XbjMSv7OHBk",authDomain:"anki-drill.firebaseapp.com",projectId:"anki-drill",storageBucket:"anki-drill.firebasestorage.app",messagingSenderId:"629552548443",appId:"1:629552548443:web:7da5f23c9d235db6824d7e"};

function fbBackend(){let U,F,auth,db;

    watchCards(uid,cb,onErr){return F.onSnapshot(F.collection(db,"users",uid,"cardsets"),sn=>{cb(sn.docs.map(d=>Object.assign({},d.data(),{id:d.id})));},onErr);},
    getCard(uid,id){return F.getDoc(F.doc(db,"users",uid,"cards",id)).then(sn=>{if(!sn.exists())return null;const d=sn.data();return {f:d.f?d.f.toUint8Array():null,b:d.b?d.b.toUint8Array():null};});},
    putCard(uid,c){return F.setDoc(F.doc(db,"users",uid,"cards",c.id),{set:c.set,n:c.n,kind:c.kind,item:c.item||null,w:c.w||"",f:F.Bytes.fromBase64String(c.f),b:c.b?F.Bytes.fromBase64String(c.b):null});},

const SY={be:null,loading:false,st:"idle",loadAt:0,slow:false,wd:null,user:null,err:"",unsub:null,cl:{},cs:null,logOk:false,stOk:false,sent:new Set(),sentState:"",pend:0,timer:null,last:0,outAsk:false,hold:null,agree:false};
const SY_DERIVED=/^(wb|ks):/;   // テストの点数から作り直すバッジは送らない
const SY_CACHE=new WeakMap();
function entInfo(a){let x=SY_CACHE.get(a);if(!x){let m="0000-00";try{m=new Date(a[2]).toISOString().slice(0,7);}catch(e){}
  x={s:JSON.stringify([String(a[0]),a[1],a[2],String(a[3]||"")]),m};SY_CACHE.set(a,x);}return x;}
function errCode(e){return String((e&&(e.code||e.message))||e||"error").slice(0,80);}
function hm(t){const d=new Date(t);return d.getHours()+":"+pad2(d.getMinutes());}
function cfgOk(k,v){if(k==="unit")return typeof v==="string";if(!Object.prototype.hasOwnProperty.call(DEF,k))return false;
  if(Array.isArray(DEF[k]))return Array.isArray(v)&&v.length>0&&v.length<=12&&v.every(n=>typeof n==="number"&&isFinite(n)&&n>0);
  return typeof v===typeof DEF[k]&&(typeof v!=="number"||isFinite(v));}

/* クラウドの設定・バッジなどを、この端末に合わせる。変化があれば true */
function mergeState(c){let ch=false;const ct=(c.cfgT&&typeof c.cfgT==="object")?c.cfgT:{};const lt=S.meta.cfgT=S.meta.cfgT||{};
  if(c.cfg&&typeof c.cfg==="object")Object.keys(c.cfg).forEach(k=>{const v=c.cfg[k];if(!cfgOk(k,v))return;const a=Number(ct[k])||0;
    const b=Object.prototype.hasOwnProperty.call(S.cfg,k)?(lt[k]||1):0;
    if(a>b||(a===b&&JSON.stringify(S.cfg[k])!==JSON.stringify(v))){S.cfg[k]=v;lt[k]=a;ch=true;}});
  const bd={};if(c.badges&&typeof c.badges==="object")Object.keys(c.badges).forEach(k=>{if(!SY_DERIVED.test(k))bd[k]=c.badges[k];});
  const tl=[];if(c.tests&&typeof c.tests==="object")Object.keys(c.tests).forEach(id=>{const t=c.tests[id];if(t&&typeof t==="object")tl.push(Object.assign({},t,{id:id}));});
  if(mergeExtras({days:c.days,badges:bd,tests:tl,testDel:c.testDel,badgeFrom:c.badgeFrom}))ch=true;
  return ch;}
/* この端末にあって、クラウドにないもの */
function stateDiff(){const c=SY.cs||{};const d={};let n=0;
  const cc=c.cfg||{},ct=c.cfgT||{},lt=S.meta.cfgT||{};
  Object.keys(S.cfg).forEach(k=>{const v=S.cfg[k];if(!cfgOk(k,v))return;const b=lt[k]||1;const a=Object.prototype.hasOwnProperty.call(cc,k)?(Number(ct[k])||0):-1;
    if(b>a){(d.cfg=d.cfg||{})[k]=v;(d.cfgT=d.cfgT||{})[k]=b;n++;}});
  const cd=c.days||{};Object.keys(S.days).forEach(k=>{if(S.days[k]&&!cd[k]){(d.days=d.days||{})[k]=1;n++;}});
  const cb=c.badges||{};Object.keys(S.badges).forEach(k=>{if(SY_DERIVED.test(k))return;const t=S.badges[k];if(!t)return;if(!cb[k]||t<cb[k]){(d.badges=d.badges||{})[k]=t;n++;}});
  const cdel=c.testDel||{},td=S.meta.testDel||{};Object.keys(td).forEach(id=>{if(!cdel[id]){(d.testDel=d.testDel||{})[id]=td[id];n++;}});
  const cts=c.tests||{};S.tests.forEach(t=>{if(!cts[t.id]){const o={d:t.d,kind:t.kind,no:t.no==null?null:t.no,cls:t.cls||""};if(t.sc&&Object.keys(t.sc).length)o.sc=t.sc;(d.tests=d.tests||{})[t.id]=o;n++;}});
  const bf=S.meta.badgeFrom;if(bf&&(!c.badgeFrom||bf<c.badgeFrom)){d.badgeFrom=bf;n++;}
  return n?d:null;}

/* ほかの端末の記録が届いたあと。演出（メダル・音）は出さない */
function afterRemote(){const ids=fxIds.slice(),rg=fxRing;rebuild();checkBadges();fxIds=ids;fxRing=rg;save();softRender();}
function softRender(){if(view.sess){updateCounts();return;}if(CE.open)return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  if((view.tab==="mock"&&view.mock.mode!=="intro")||(view.tab==="order"&&view.order.mode!=="list"))return;

function syncStart(){if(SY.be||SY.loading)return;SY.loading=true;SY.st="load";SY.err="";syncWatchdog();paintSync();
  let be;try{be=window.__cloudBackend?window.__cloudBackend():fbBackend();}catch(e){SY.loading=false;SY.st="off";SY.err=errCode(e);syncWatchdog(false);paintSync();return;}
  Promise.resolve().then(()=>be.init()).then(()=>{SY.be=be;SY.loading=false;if(SY.st==="load")SY.st="auth";syncWatchdog();paintSync();be.onAuth(syncAuth);},e=>{SY.loading=false;SY.st="off";SY.err=errCode(e);syncWatchdog(false);paintSync();});}
/* 準備（部品の読み込み・ログインの確認）が長びいたら「読み込み直す」を出す。
   スマホでは、画面を切りかえている間に読み込みが止まったまま戻らないことがある */
const SY_WD_MS=12000;
function syncWatchdog(on){clearTimeout(SY.wd);SY.wd=null;SY.slow=false;if(on===false)return;SY.loadAt=Date.now();
  SY.wd=setTimeout(()=>{SY.wd=null;if(SY.st==="load"||SY.st==="auth"){SY.slow=true;paintSync();}},(window.__syncWdMs||SY_WD_MS));}
function syncStuck(){return (SY.st==="load"||SY.st==="auth")&&Date.now()-SY.loadAt>(window.__syncWdMs||SY_WD_MS);}
function syncStop(){cardStop();if(SY.unsub){try{SY.unsub();}catch(e){}}SY.unsub=null;clearTimeout(SY.timer);SY.cl={};SY.cs=null;SY.logOk=false;SY.stOk=false;SY.sent=new Set();SY.sentState="";SY.hold=null;SY.agree=false;}
function syncAuth(u){syncStop();syncWatchdog(false);SY.user=u||null;SY.err="";SY.outAsk=false;SY.st=u?"in":"out";
  if(u){syncWatch();cardWatch();}
  paintSync(true);softRender();}
function syncWatch(){if(!SY.be||!SY.user||SY.unsub)return;SY.err="";const uid=SY.user.uid;const live=()=>SY.user&&SY.user.uid===uid;
  SY.unsub=SY.be.watch(uid,{
    onLogs(list,fromCache){if(!live())return;const fresh=[];
      (list||[]).forEach(x=>{const old=SY.cl[x.m];const set=new Set();(x.e||[]).forEach(s=>{if(typeof s!=="string")return;set.add(s);if(!old||!old.has(s)){try{fresh.push(JSON.parse(s));}catch(e){}}});SY.cl[x.m]=set;});
      SY.logOk=!fromCache;if(S.meta.syncOn&&fresh.length){const n=mergeEntries(fresh,false);if(n){noteRecv(n);afterRemote();}}
      syncSoon(300);paintSync();},
    onState(data,fromCache){if(!live())return;SY.cs=data||{};SY.stOk=!fromCache;if(S.meta.syncOn&&mergeState(SY.cs))afterRemote();
      syncSoon(300);paintSync();},
    onError(e){if(!live())return;const u=SY.unsub;SY.unsub=null;if(u){try{u();}catch(_){}}SY.logOk=false;SY.stOk=false;SY.err=errCode(e);paintSync();}
  });paintSync();}
function syncSoon(ms){if(!SY.user||!SY.unsub)return;clearTimeout(SY.timer);SY.timer=setTimeout(reconcile,ms==null?2500:ms);}
function localOnly(){const out=[];for(const a of S.log){const x=entInfo(a);const c=SY.cl[x.m];if(!(c&&c.has(x.s)))out.push(x);}return out;}
function cloudCount(){let n=0;Object.keys(SY.cl).forEach(m=>{n+=SY.cl[m].size;});return n;}
/* クラウドの中身を、まとめてこの端末に取りこむ（この端末をはじめて合わせるとき） */
function pullAll(){const fresh=[];Object.keys(SY.cl).forEach(m=>SY.cl[m].forEach(s=>{try{fresh.push(JSON.parse(s));}catch(e){}}));
  const n=mergeEntries(fresh,false);if(n)noteRecv(n);let ch=n>0;if(mergeState(SY.cs||{}))ch=true;if(ch)afterRemote();else save();}
/* ほかの端末の記録を受け取ったことを覚えておき、「きょう」とノートに出す */
function noteRecv(n){S.meta.lastIn={t:Date.now(),n:n};if(!view.sess)view.banner="ほかの端末の記録 "+n+"件を受け取りました。";}
/* この端末にあってクラウドにない記録を送る。クラウドの中身を受け取ってからでないと送らない。
   はじめて合わせる端末に記録があるときは、送る前に確かめる（ためしに解いた記録が混ざるのを防ぐ） */
function reconcile(){clearTimeout(SY.timer);if(!SY.be||!SY.user||!SY.unsub||!SY.logOk||!SY.stOk)return;const uid=SY.user.uid;
  let lo=localOnly();
  if(!S.meta.syncOn){if(lo.length&&!SY.agree){SY.hold={n:lo.length,c:cloudCount()};paintSync();return;}
    SY.hold=null;SY.agree=false;S.meta.syncOn=1;pullAll();lo=localOnly();}
  const by={};lo.forEach(x=>{if(!SY.sent.has(x.s))(by[x.m]=by[x.m]||[]).push(x.s);});
  Object.keys(by).forEach(m=>{const all=by[m];for(let i=0;i<all.length;i+=1500){const part=all.slice(i,i+1500);part.forEach(s=>SY.sent.add(s));
    syncPush(()=>SY.be.pushLog(uid,m,part),()=>part.forEach(s=>SY.sent.delete(s)));}});
  const d=stateDiff();if(d){const sig=JSON.stringify(d);if(sig!==SY.sentState){SY.sentState=sig;syncPush(()=>SY.be.pushState(uid,d),()=>{SY.sentState="";});}}
  if(!SY.pend)SY.last=Date.now();paintSync();}
function syncPush(run,undo){SY.pend++;let p;try{p=Promise.resolve(run());}catch(e){p=Promise.reject(e);}
  p.then(()=>{SY.pend--;SY.last=Date.now();SY.err="";paintSync();},e=>{SY.pend--;undo();SY.err=errCode(e);paintSync();});}

/* ---- 画面 ---- */
function syncErrText(code){
  if(/permission-denied/.test(code))return "データベースの規則で止められました。Firebaseの「ルール」の文面を確かめてください。（permission-denied）";
  if(/unavailable|network/.test(code))return "インターネットにつながっていません。記録はこの端末に保存され、つながったときに送られます。";
  if(/resource-exhausted/.test(code))return "今日の無料の利用枠をこえました。あしたになると、また同期されます。（resource-exhausted）";
  return "同期できません。（"+code+"）";}
function loginErrText(code){
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(code))return "メールアドレスかパスワードがちがいます。";
  if(/too-many-requests/.test(code))return "まちがいが続いたため、しばらくログインできません。時間をおいてください。";
  if(/network/.test(code))return "インターネットにつながっていません。";
  if(/operation-not-allowed/.test(code))return "Firebaseで「メール／パスワード」のログインが有効になっていません。";
  if(/user-disabled/.test(code))return "このユーザーは、Firebaseで止められています。";
  return "ログインできません。（"+code+"）";}
function syncText(){const off=(typeof navigator!=="undefined"&&navigator.onLine===false);
  const OFF="インターネットにつながっていません。記録はこの端末に保存され、つながったときに送られます。";
  if(SY.st==="idle"||SY.st==="load")return SY.slow?{t:"同期の準備に時間がかかっています。インターネットにつながっているか確かめて、「読み込み直す」をおしてください。",s:"同期の準備中",bad:true}:{t:"同期の準備をしています…",s:""};
  if(SY.st==="auth")return SY.slow?{t:"ログインの状態を確かめるのに時間がかかっています。「読み込み直す」をおしてください。",s:"同期の準備中",bad:true}:{t:"ログインの状態を確かめています…",s:""};
  if(SY.st==="off")return {t:off?OFF:"同期の部品を読み込めませんでした。インターネットにつながっているか確かめて、「読み込み直す」をおしてください。（"+SY.err+"）",s:"オフライン",bad:!off};
  if(!SY.user)return {t:"",s:S.meta.syncOn?"同期が止まっています（ノートでログイン）":"",bad:true};
  if(SY.err&&!SY.unsub)return {t:syncErrText(SY.err),s:"同期できません",bad:true};
  if(!(SY.logOk&&SY.stOk))return off?{t:OFF,s:"オフライン"}:{t:"クラウドにつないでいます…",s:"同期中…"};
  if(SY.hold)return {t:"",s:"同期の確認待ち（ノート）",bad:true};
  if(SY.err)return {t:syncErrText(SY.err),s:"同期できません",bad:true};
  if(SY.pend)return {t:"記録を送っています…",s:"同期中…"};
  return {t:"同期ずみ（"+hm(SY.last||Date.now())+"）",s:"同期ずみ"};}
function syncPanelHtml(mode){let h='<h2>端末どうしの同期</h2>';

function bindSync(box,mode){

      if(!mail||!pw){st.textContent="メールアドレスとパスワードを入れてください。";st.classList.add("bad");return;}
      if(!SY.be)return;bt.disabled=true;st.classList.remove("bad");st.textContent="ログインしています…";
      Promise.resolve().then(()=>SY.be.signIn(mail,pw)).then(()=>{},e=>{const s=$("#syStat"),b=$("#syIn");if(b)b.disabled=false;if(s){s.textContent=loginErrText(errCode(e));s.classList.add("bad");}});};
    $("#syIn").addEventListener("click",go);$("#syPw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});}
  else if(mode==="in"){
    $("#syNow").addEventListener("click",()=>{if(!SY.unsub)syncWatch();else reconcile();cardWatch();cardFetchMissing();paintSync();});
    $("#syOut").addEventListener("click",()=>{if(!SY.outAsk){SY.outAsk=true;$("#syOut").textContent="もう一度おすとログアウト";return;}
      SY.outAsk=false;delete S.meta.syncOn;save();Promise.resolve().then(()=>SY.be.signOut()).catch(()=>{});});}
  else if(mode==="hold"){
    $("#syYes").addEventListener("click",()=>{SY.agree=true;reconcile();paintSync();});
    $("#syNo").addEventListener("click",()=>{Promise.resolve().then(()=>SY.be.signOut()).catch(()=>{});});}
  else{$("#syRetry").addEventListener("click",()=>location.reload());}}
function paintSync(force){const x=syncText();const hd=$("#hdSync");
  if(hd){const on=!!SY.user||!!S.meta.syncOn;hd.textContent=on?x.s:"";hd.classList.toggle("bad",on&&!!x.bad);}
  const box=$("#syBox");if(!box)return;const mode=SY.user?(SY.hold?"hold":"in"):(SY.st==="out"?"out":"wait");
  if(force||box.dataset.mode!==mode){box.dataset.mode=mode;box.innerHTML=syncPanelHtml(mode);bindSync(box,mode);}
  const st=$("#syStat");if(st&&mode!=="out"){st.textContent=x.t;st.classList.toggle("bad",!!x.bad);}
  const rr=$("#syRetryRow");if(rr)rr.hidden=!(SY.st==="off"||SY.slow);
  if(mode==="hold"){const a=$("#syHn"),b=$("#syHc");if(a)a.textContent=SY.hold.n;if(b)b.textContent=SY.hold.c;}
  const cn=$("#syCnt");if(cn)cn.textContent=SY.logOk?("この端末の記録 "+S.log.length+"件　クラウドの記録 "+cloudCount()+"件"):"";
  const lo=$("#syLocal");if(lo){if(SY.logOk&&SY.stOk&&S.meta.syncOn&&!SY.hold){const n=localOnly().length;lo.textContent=n?("この端末にだけある記録 "+n+"件（まだクラウドに送れていません）"):"この端末の記録は、すべてクラウドにあります。";lo.classList.toggle("bad",n>0);lo.classList.toggle("grn",n===0);}else{lo.textContent="";lo.classList.remove("bad","grn");}}
  const rv=$("#syRecv");if(rv){const li=S.meta.lastIn;rv.textContent=(li&&li.t)?("ほかの端末の記録を受け取りました：最後は "+fmtDate(li.t)+" "+hm(li.t)+"（"+li.n+"件）"):"ほかの端末の記録は、まだ受け取っていません。";}}
function syncWake(){if(syncStuck()){SY.slow=true;paintSync();return;}
  if(!SY.be){if(!SY.loading)syncStart();return;}if(SY.st==="auth"){paintSync();return;}if(SY.user&&!SY.unsub)syncWatch();else syncSoon(300);if(SY.user){cardWatch();cardFetchMissing();}paintSync();}

/* ======================================================
   暗記カード（塾の補助プリントの画像）
   ・画像は公開ページには入れない。ログインした本人だけが読めるFirebaseに置く。
   ・各端末では IndexedDB に保存し、インターネットがなくても見られるようにする。
   ・カードは、ことばの問題（同じ語）に結びつけて出す。記録はその問題の記録になる。
====================================================== */
const CARD_KEY="gakushu-cards-v1";   // localStorage：取り込んだカードの一覧（画像は入れない）
const CD={sets:{},have:new Set(),urls:new Map(),db:null,dbOk:true,unsub:null,busy:false,prog:null,msg:"",err:false,pack:null,del:null,fetching:false,viewer:null};
let ITEM_CARDS={},CARD={};
function cardLoad(){try{const o=JSON.parse(localStorage.getItem(CARD_KEY)||"{}");CD.sets=(o&&o.sets&&typeof o.sets==="object")?o.sets:{};}catch(e){CD.sets={};}cardIndex();}
function cardSave(){try{localStorage.setItem(CARD_KEY,JSON.stringify({sets:CD.sets}));}catch(e){}}
function cardIndex(){ITEM_CARDS={};CARD={};Object.keys(CD.sets).sort().forEach(sid=>{const st=CD.sets[sid];(st.cards||[]).forEach(c=>{CARD[c.id]=Object.assign({set:sid},c);if(c.item){(ITEM_CARDS[c.item]=ITEM_CARDS[c.item]||[]).push(c.id);}});});}
function cardSetsSorted(){return Object.keys(CD.sets).map(k=>CD.sets[k]).sort((a,b)=>String(a.vol).localeCompare(String(b.vol))||a.round-b.round||(a.id<b.id?-1:1));}
function setsForUnit(u){const l=cardSetsSorted();return u.past?l.filter(st=>st.vol===u.vol):l.filter(st=>st.vol===u.vol&&st.round===u.round).slice(0,1);}
function setForUnit(u){return setsForUnit(u)[0]||null;}
/* この語に使うカード。その語の回のカードを先に、なければほかの回（総合など）のカード */
function cardFor(it){if(!cfg("cardOn")||!CD.dbOk)return null;const l=ITEM_CARDS[it.id];if(!l)return null;const r=UNIT[it.u].round;
  const ok=l.filter(id=>CD.have.has(id));if(!ok.length)return null;const own=ok.find(id=>{const st=CD.sets[CARD[id].set];return st&&st.round===r;});return own||ok[0];}

/* ---- IndexedDB ---- */
function idb(){if(CD.db)return Promise.resolve(CD.db);
  return new Promise((res,rej)=>{let r;try{r=indexedDB.open("gakushu-cards",1);}catch(e){rej(e);return;}
    r.onupgradeneeded=()=>{r.result.createObjectStore("img",{keyPath:"id"});};r.onsuccess=()=>{CD.db=r.result;res(CD.db);};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"));});}
function idbRun(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("img",mode);const st=tx.objectStore("img");let out;const rq=fn(st);if(rq)rq.onsuccess=()=>{out=rq.result;};
  tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}));}
function idbKeys(){return idbRun("readonly",st=>st.getAllKeys());}
function idbGet(id){return idbRun("readonly",st=>st.get(id));}
function idbPut(rec){return idbRun("readwrite",st=>st.put(rec));}
function idbDel(ids){if(!ids.length)return Promise.resolve();return idbRun("readwrite",st=>{ids.forEach(id=>st.delete(id));return null;});}
function toBlob(x){if(!x)return null;let u8=x,ty="image/jpeg";if(typeof x==="string"){if(x.indexOf("iVBOR")===0)ty="image/png";else if(x.indexOf("UklGR")===0)ty="image/webp";const bin=atob(x);u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);}return new Blob([u8],{type:ty});}
function cardUrl(id,side){const k=id+side;if(CD.urls.has(k))return Promise.resolve(CD.urls.get(k));
  return idbGet(id).then(rec=>{const b=rec&&rec[side];if(!b)return null;const u=URL.createObjectURL(b);CD.urls.set(k,u);return u;});}
function cardInit(){cardLoad();
  idbKeys().then(keys=>{CD.have=new Set(keys||[]);paintCards();}).catch(()=>{CD.dbOk=false;paintCards();});}

/* ---- クラウドとの同期（ログイン中） ---- */
function cardWatch(){if(!SY.be||!SY.user||!SY.be.watchCards||CD.unsub)return;const uid=SY.user.uid;
  CD.unsub=SY.be.watchCards(uid,list=>{if(!SY.user||SY.user.uid!==uid)return;cardFromCloud(list||[]);},e=>{CD.unsub=null;CD.err=true;CD.msg="カードの一覧を読めません。（"+errCode(e)+"）";paintCards();});}
function cardStop(){if(CD.unsub){try{CD.unsub();}catch(e){}}CD.unsub=null;}
function cardFromCloud(list){const ns={};
  list.forEach(d=>{if(!d||!d.id||!Array.isArray(d.cards))return;ns[d.id]={id:d.id,name:String(d.name||d.id),vol:String(d.vol||""),round:Number(d.round)||0,
    cards:d.cards.filter(c=>c&&c.id).map(c=>({id:String(c.id),n:Number(c.n)||0,kind:String(c.kind||"word"),item:c.item?String(c.item):null,w:String(c.w||"")}))};});
  const keep=new Set();Object.keys(ns).forEach(k=>ns[k].cards.forEach(c=>keep.add(c.id)));
  const gone=[...CD.have].filter(id=>!keep.has(id));
  CD.sets=ns;cardSave();cardIndex();
  if(gone.length){gone.forEach(id=>{CD.have.delete(id);["f","b"].forEach(s=>{const u=CD.urls.get(id+s);if(u){URL.revokeObjectURL(u);CD.urls.delete(id+s);}});});idbDel(gone).catch(()=>{});}
  paintCards();cardFetchMissing();}
/* この端末にまだないカードの画像を、クラウドから受け取って保存する */
function cardFetchMissing(){if(CD.fetching||CD.busy||!CD.dbOk||!SY.be||!SY.user||!SY.be.getCard)return;const uid=SY.user.uid;
  const need=Object.keys(CARD).filter(id=>!CD.have.has(id));if(!need.length){CD.prog=null;paintCards();return;}
  CD.fetching=true;CD.prog={done:0,total:need.length};paintCards();let i=0,fail=0;
  const next=()=>{if(!SY.user||SY.user.uid!==uid){CD.fetching=false;return Promise.resolve();}if(i>=need.length)return Promise.resolve();const id=need[i++];
    return Promise.resolve().then(()=>SY.be.getCard(uid,id)).then(d=>{if(!d||!d.f){fail++;return;}return idbPut({id,f:toBlob(d.f),b:toBlob(d.b)}).then(()=>{CD.have.add(id);});})
      .catch(()=>{fail++;}).then(()=>{CD.prog.done++;paintCards();return next();});};
  Promise.all([next(),next(),next()]).then(()=>{CD.fetching=false;CD.prog=null;if(fail){CD.err=true;CD.msg="カードの画像を "+fail+"枚 受け取れませんでした。「いますぐ同期」か、読み込み直しでもう一度ためします。";}paintCards();});}

/* ---- 取り込み（保護者が、ログインした端末で1回だけ） ---- */
function cardCheckPack(o){if(!o||o.app!=="gakushu-cards"||!Array.isArray(o.sets)||!o.sets.length)return "暗記カードのファイルではありません。";
  for(const st of o.sets){if(!st||!/^[0-9a-z]{2,8}$/.test(String(st.id))||!Array.isArray(st.cards)||!st.cards.length)return "ファイルの中身が正しくありません。";
    for(const c of st.cards){if(!c||!/^[0-9a-z]{2,8}-\d{1,3}$/.test(String(c.id))||typeof c.f!=="string"||c.f.length>1400000||(c.b!=null&&(typeof c.b!=="string"||c.b.length>1400000)))return "ファイルの中身が正しくありません。";}}
  return "";}
function cardImport(){const o=CD.pack;if(!o||CD.busy||!SY.user||!SY.be||!SY.be.putCard)return;const uid=SY.user.uid;
  const all=[];o.sets.forEach(st=>st.cards.forEach(c=>all.push({st,c})));
  CD.busy=true;CD.err=false;CD.msg="";CD.prog={done:0,total:all.length,up:true};paintCards();let i=0,bad=null;
  const one=x=>{const c=x.c;const card={id:c.id,set:x.st.id,n:Number(c.n)||0,kind:String(c.kind||"word"),item:c.item||null,w:String(c.w||""),f:c.f,b:c.b||null};
    return idbPut({id:c.id,f:toBlob(c.f),b:toBlob(c.b)}).then(()=>{CD.have.add(c.id);["f","b"].forEach(s=>{const u=CD.urls.get(c.id+s);if(u){URL.revokeObjectURL(u);CD.urls.delete(c.id+s);}});})
      .then(()=>SY.be.putCard(uid,card));};
  const next=()=>{if(bad||i>=all.length)return Promise.resolve();const x=all[i++];return one(x).then(()=>{CD.prog.done++;paintCards();return next();},e=>{bad=bad||e;});};
  Promise.all([next(),next(),next()]).then(()=>{if(bad)throw bad;
    return Promise.all(o.sets.map(st=>SY.be.putSet(uid,{id:st.id,name:String(st.name||st.id),vol:String(st.vol||""),round:Number(st.round)||0,
      cards:st.cards.map(c=>({id:c.id,n:Number(c.n)||0,kind:String(c.kind||"word"),item:c.item||null,w:String(c.w||"")}))})));})
    .then(()=>{const n=o.sets.length,m=all.length;
      o.sets.forEach(st=>{CD.sets[st.id]={id:st.id,name:String(st.name||st.id),vol:String(st.vol||""),round:Number(st.round)||0,cards:st.cards.map(c=>({id:c.id,n:Number(c.n)||0,kind:String(c.kind||"word"),item:c.item||null,w:String(c.w||"")}))};});
      cardSave();cardIndex();CD.pack=null;CD.busy=false;CD.prog=null;CD.msg=(o.sets.every(isArtSet)?"バッジの絵を取り込みました。":(n+"回分・"+m+"枚のカードを取り込みました。"))+"ほかの端末には、ログインしていれば自動でとどきます。";paintCards();},
      e=>{CD.busy=false;CD.prog=null;CD.err=true;CD.msg="取り込めませんでした。（"+errCode(e)+"）　もう一度「取り込む」をおしてください。";paintCards();});}
function cardDelete(sid){const st=CD.sets[sid];if(!st||!SY.user||!SY.be||!SY.be.delSet)return;CD.busy=true;paintCards();
  Promise.resolve().then(()=>SY.be.delSet(SY.user.uid,st)).then(()=>{CD.busy=false;CD.del=null;CD.msg=st.name+" のカードを消しました。";paintCards();},
    e=>{CD.busy=false;CD.err=true;CD.msg="消せませんでした。（"+errCode(e)+"）";paintCards();});}

/* ---- ノートの欄 ---- */
/* バッジの絵だけのセットか */
function isArtSet(st){return !!st&&Array.isArray(st.cards)&&st.cards.length>0&&st.cards.every(c=>c.kind==="badge");}
function cdCount(st){return isArtSet(st)?("バッジの絵 "+st.cards.length+"枚"):(st.cards.filter(c=>c.kind==="word").length+"語（"+st.cards.length+"枚）");}
function cardPanelHtml(){const sets=cardSetsSorted();let h='<h2>暗記カード</h2><p class="muted small">塾の暗記カードの絵を、ことばの問題に使います。カードはログインした端末だけで見られ、公開ページには入りません。</p>';
  if(!CD.dbOk)h+='<p class="small bad">この端末のブラウザでは、カードを保存できません。</p>';
  if(sets.length){h+='<ul class="cdlist">'+sets.map(st=>{const w=st.cards.filter(c=>c.kind==="word").length;const miss=st.cards.filter(c=>!CD.have.has(c.id)).length;
      return '<li><span><b>'+esc(st.name)+'</b>　<span class="muted small">'+cdCount(st)+(miss?'　この端末に未保存 '+miss+'枚':'')+'</span></span>'
        +(SY.user?'<button class="btn sm ghost" data-cddel="'+esc(st.id)+'"'+(CD.busy?" disabled":"")+'>'+(CD.del===st.id?"もう一度おすと消す":"消す")+'</button>':'')+'</li>';}).join("")+'</ul>';}
  else h+='<div class="empty">まだカードはありません。</div>';
  if(CD.prog)h+='<p class="small" id="cdProg">'+(CD.prog.up?"取り込み中":"カードをこの端末に保存中")+'… '+CD.prog.done+' / '+CD.prog.total+'枚</p>';
  if(CD.msg)h+='<p class="small'+(CD.err?" bad":"")+'" role="status">'+esc(CD.msg)+'</p>';
  if(!SY.user)h+='<p class="muted small mt">カードの取り込みと、ほかの端末への受け渡しは、ログインしているときにできます。</p>';
  else if(CD.pack){const p=CD.pack;h+='<div class="syask"><p><b>このファイルのカード</b></p><ul class="cdlist">'+p.sets.map(st=>'<li><span>'+esc(st.name||st.id)+'　<span class="muted small">'+cdCount(st)+(CD.sets[st.id]?'　取り込み済み（入れかえる）':'')+'</span></span></li>').join("")+'</ul>'
      +'<div class="row mt"><button class="btn sm primary" id="cdGo"'+(CD.busy?" disabled":"")+'>取り込む</button><button class="btn sm" id="cdCancel"'+(CD.busy?" disabled":"")+'>やめる</button></div></div>';}
  else h+='<div class="lbl">カードのファイルを取り込む（パソコンでの作業がおすすめ）</div><input type="file" id="cdFile" accept=".json,application/json"'+(CD.busy?" disabled":"")+'>';
  return h;}
function paintCards(){const box=$("#cdBox");if(!box)return;
  const pr=$("#cdProg");if(pr&&CD.prog&&box.dataset.busy==="1"){pr.textContent=(CD.prog.up?"取り込み中":"カードをこの端末に保存中")+"… "+CD.prog.done+" / "+CD.prog.total+"枚";return;}
  box.dataset.busy=CD.prog?"1":"";box.innerHTML=cardPanelHtml();
  const f=$("#cdFile");if(f)f.addEventListener("change",()=>{const file=f.files&&f.files[0];if(!file)return;CD.msg="ファイルを読んでいます…";CD.err=false;paintCards();
    const rd=new FileReader();rd.onload=()=>{let o=null;try{o=JSON.parse(rd.result);}catch(e){}const bad=cardCheckPack(o);if(bad){CD.msg=bad;CD.err=true;CD.pack=null;}else{CD.pack=o;CD.msg="";CD.err=false;}paintCards();};
    rd.onerror=()=>{CD.msg="ファイルを読めませんでした。";CD.err=true;paintCards();};rd.readAsText(file);});
  const go=$("#cdGo");if(go)go.addEventListener("click",cardImport);
  const cc=$("#cdCancel");if(cc)cc.addEventListener("click",()=>{CD.pack=null;CD.msg="";paintCards();});
  box.querySelectorAll("[data-cddel]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.cddel;if(CD.del!==id){CD.del=id;paintCards();return;}cardDelete(id);}));}

/* ---- 出題画面：カードの絵 ---- */
function unitDeck(u){const sts=setsForUnit(u);const st=sts[0]||null;const deck=[];sts.forEach(x=>x.cards.slice().sort((a,b)=>a.n-b.n).forEach(c=>deck.push({k:"img",c})));
  ITEMS.forEach(it=>{if(it.u!==u.id||!DCARDS[it.id])return;const l=ITEM_CARDS[it.id];if(l&&l.some(id=>CD.have.has(id)))return;deck.push({k:"dc",id:it.id});});return {st,deck};}
function cardBtn(u){if(u.sub!=="ことば")return "";return unitDeck(u).deck.length?'<button class="btn sm" data-cards="'+esc(u.id)+'">カード</button>':"";}
/* ドリルのカード（独自の例文とイラスト）。《答え|おもての形》、答えの中の〔〕は読み */
function dcMark(t,back){return esc(t).replace(/《(.*?)\|(.*?)》/g,(m,a,fr)=>'<span class="dc-a">'+(back?a.replace(/〔(.*?)〕/g,'<span class="dc-y">（$1）</span>'):fr)+'</span>');}
function dcardHtml(id,back){const c=DCARDS[id];if(!c)return "";
  const t=c.ex.map(e=>'<p>・'+dcMark(e,back)+'</p>').join("")+'<p class="mean">＝'+esc(c.mean)+'</p>'+(c.note?'<p class="note">＊'+esc(c.note)+'</p>':"");
  return '<div class="dcard'+(back?" back":"")+'" data-did="'+esc(id)+'"><div class="dc-pic">'+c.svg+'</div><div class="dc-txt">'+t+'</div><div class="dc-tag">ドリルのカード</div></div>';}
function cardImgHtml(cid,side){return '<div class="cardimg"><img data-cid="'+esc(cid)+'" data-side="'+side+'" alt="暗記カード"></div>';}
function cardFill(root,onMiss){root.querySelectorAll("img[data-cid]").forEach(img=>{cardUrl(img.dataset.cid,img.dataset.side).then(u=>{if(u)img.src=u;else if(onMiss)onMiss(img.dataset.cid);}).catch(()=>{if(onMiss)onMiss(img.dataset.cid);});});}
function cardPrefetch(cid,side){if(cid)cardUrl(cid,side).catch(()=>{});}

/* ---- カードをめくる（回べつ） ---- */
const cardv=document.createElement("div");cardv.id="cardv";cardv.setAttribute("aria-label","暗記カード");document.body.appendChild(cardv);
function openCardViewer(uid){const u=UNIT[uid];if(!u||!unitDeck(u).deck.length)return;CD.viewer={uid,i:0,back:false};cardv.classList.add("show");document.body.style.overflow="hidden";paintViewer();}
function closeCardViewer(){CD.viewer=null;cardv.classList.remove("show");cardv.innerHTML="";document.body.style.overflow="";}
function paintViewer(){const v=CD.viewer;if(!v)return;const u=UNIT[v.uid];const d=unitDeck(u);const cards=d.deck;if(v.i>=cards.length)v.i=cards.length-1;const x=cards[v.i];
  const word=x.k==="dc"||x.c.kind==="word";const side=(word&&v.back)?"b":"f";
  const body=x.k==="dc"?dcardHtml(x.id,v.back):(CD.have.has(x.c.id)?'<img data-cid="'+esc(x.c.id)+'" data-side="'+side+'" alt="">':'<span class="muted">この端末に、まだカードの絵がありません。</span>');
  cardv.innerHTML='<div class="cv-in"><div class="row between"><b>'+esc((x.k==="img"&&CARD[x.c.id]&&CD.sets[CARD[x.c.id].set])?CD.sets[CARD[x.c.id].set].name:(d.st?d.st.name:(u.vol+" "+u.name)))+'</b><button class="btn sm" id="cvClose">とじる</button></div>'
    +'<button class="cv-card'+(x.k==="dc"?" dc":"")+'" id="cvFlip" aria-label="カードを返す">'+body+'</button>'
    +'<div class="row between mt"><button class="btn" id="cvPrev"'+(v.i?"":" disabled")+'>◀ 前</button><span class="muted small">'+(v.i+1)+' / '+cards.length+(word?'　'+(v.back?"うら（答え）":"おもて"):"")+'</span><button class="btn" id="cvNext"'+(v.i<cards.length-1?"":" disabled")+'>次 ▶</button></div>'
    +'<p class="muted small mt">カードをおすと、うら返ります。めくるだけで、記録はつきません。</p></div>';
  if(x.k==="img"){cardFill(cardv);if(word)cardPrefetch(x.c.id,"b");}const nx=cards[v.i+1];if(nx&&nx.k==="img")cardPrefetch(nx.c.id,"f");
  $("#cvClose").addEventListener("click",closeCardViewer);
  $("#cvFlip").addEventListener("click",()=>{if(!word)return;v.back=!v.back;paintViewer();});
  $("#cvPrev").addEventListener("click",()=>{if(v.i>0){v.i--;v.back=false;paintViewer();}});
