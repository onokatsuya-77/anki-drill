<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>暗記ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --bg2:#F1F3F6; --bg3:#E6E9EE; --ink:#1A2230; --ink2:#5E6875; --line:#D3D9E2;
  --ai:#22497A; --ai-ink:#FFFFFF; --ai-soft:#E3ECF7;
  --shu:#C2312B; --shu-ink:#FFFFFF; --shu-soft:#FBE8E6;
  --midori:#2B7A4B; --midori-ink:#FFFFFF; --midori-soft:#E1F1E7;
  --ki:#9A5E0A; --ki-soft:#FBF0D9;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
    --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
    --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
    --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
    --ki:#E7B562; --ki-soft:#3A2D14;
  }
}
:root[data-theme="dark"]{
  --bg:#131922; --bg2:#1B2432; --bg3:#243043; --ink:#E8ECF2; --ink2:#A3ACB9; --line:#33405A;
  --ai:#8FB4E8; --ai-ink:#0E1826; --ai-soft:#1D2E47;
  --shu:#F28B82; --shu-ink:#2A0E0C; --shu-soft:#3B1E1C;
  --midori:#7FD0A0; --midori-ink:#0B2416; --midori-soft:#1B3628;
  --ki:#E7B562; --ki-soft:#3A2D14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
p{margin:0}
#app{max-width:680px;margin:0 auto;padding:0 14px 60px;}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:10px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line);}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.top h1{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.04em}
.top .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);margin-top:1px}
.counts{display:inline-flex;gap:10px}
.counts b{color:var(--ink);font-weight:700}
.counts .mk b{color:var(--shu)}
.counts .un b{color:var(--ai)}
@media (max-width:400px){.tabs button{font-size:.82rem}}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:-1px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 8px;font-size:.9rem;white-space:nowrap;color:var(--ink2);cursor:pointer;font-weight:700}
.tabs button.on{color:var(--ai);border-bottom-color:var(--ai)}
.tabs button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
main{padding-top:16px}
.tab{display:none}
.tab.on{display:block}

.panel{background:var(--bg2);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.panel h2{font-size:1.02rem;margin-bottom:8px}
.lbl{font-size:.85rem;color:var(--ink2);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:.92rem;cursor:pointer}
.chip.on{border-color:var(--ai);background:var(--ai-soft);color:var(--ai);font-weight:700}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 16px;font-size:1rem;cursor:pointer;min-height:46px;font-weight:700}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.ok{background:var(--midori);border-color:var(--midori);color:var(--midori-ink)}
.btn.ng{background:var(--shu);border-color:var(--shu);color:var(--shu-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.mt{margin-top:12px}
.mt2{margin-top:20px}
.muted{color:var(--ink2);font-size:.88rem}
.small{font-size:.85rem}

/* quiz card */
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;min-height:340px;display:flex;flex-direction:column}
.card .meta{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:.85rem}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;background:var(--bg3);color:var(--ink2);font-weight:700}
.tag.r1{background:#E9EEDF;color:#4A5D1E}.tag.r2{background:#EBE4F2;color:#5A3F80}.tag.r3{background:#FDEBD3;color:#8A4B06}.tag.r4{background:#DDEAF6;color:#1E4E7A}.tag.r5{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag.r1,:root[data-theme="dark"] .tag.r2,:root[data-theme="dark"] .tag.r3,:root[data-theme="dark"] .tag.r4,:root[data-theme="dark"] .tag.r5{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.r1,:root:not([data-theme="light"]) .tag.r2,:root:not([data-theme="light"]) .tag.r3,:root:not([data-theme="light"]) .tag.r4,:root:not([data-theme="light"]) .tag.r5{background:var(--bg3);color:var(--ink2)}}
.q{font-size:1.18rem;font-weight:700;line-height:1.55;margin:14px 0 6px;flex:0 0 auto}
.hint{color:var(--ink2);font-size:.88rem}
.ansarea{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;margin:14px 0}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.box{width:2.1em;height:2.1em;border:1.5px solid var(--ink2);border-radius:3px;display:grid;place-items:center;font-family:var(--serif);font-size:1.55rem;font-weight:800;line-height:1;color:var(--ai);position:relative;background:var(--bg)}
.box::after{content:"";position:absolute;inset:0;border:1px dashed var(--line);margin:3px;border-radius:2px;opacity:.7}
.box span{opacity:0;transition:opacity .18s}
.card.revealed .box span{opacity:1}
.box.suffix{border:0;width:auto;height:auto;font-size:1.25rem;color:var(--ink);font-family:var(--sans);font-weight:700}
.box.suffix::after{display:none}
.answer{font-family:var(--serif);font-size:1.4rem;font-weight:800;line-height:1.35;color:var(--ai);display:none}
.card.revealed .answer{display:block}
.note{display:none;color:var(--ink2);font-size:.92rem;margin-top:10px;padding-left:10px;border-left:3px solid var(--line)}
.card.revealed .note{display:block}
.alt{display:none;font-size:.88rem;color:var(--ink2);margin-top:4px}
.card.revealed .alt{display:block}
.yomi{display:none;font-size:.9rem;color:var(--ink2);letter-spacing:.06em;margin-bottom:4px}
.card.revealed .yomi{display:block}
.expl{display:none;width:100%;margin-top:12px;padding:10px 12px;background:var(--bg2);border-left:3px solid var(--ai);border-radius:0 8px 8px 0;font-size:.92rem;line-height:1.6}
.card.revealed .expl{display:block}
.expl-t{font-size:.72rem;font-weight:700;color:var(--ai);letter-spacing:.1em;margin-bottom:3px}
.expl p + p{margin-top:4px}
.expl .pt{font-weight:700}
.expl .pt::before{content:"★ ";color:var(--ki)}
.badge.n.first{background:var(--ki-soft);color:var(--ki)}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark .btn{min-height:56px;font-size:1.08rem}
.prog{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--ai);width:0}
@media (prefers-reduced-motion:reduce){.box span{transition:none}}

/* next steps / progress */
.next h2{margin-bottom:6px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--ai);border-radius:var(--r);padding:11px 14px;cursor:pointer;line-height:1.4}
.step:first-child{background:var(--ai-soft)}
.step b{font-size:1.02rem}
.step-n{font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--ai);min-width:1.2em}
.step .go{margin-left:auto;color:var(--ai);font-size:.9rem}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.prow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem}
.prow-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pbar{position:relative;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-top:4px}
.pbar i{position:absolute;left:0;top:0;height:100%;display:block}
.pbar i.d{background:var(--ai)}
.pbar i.m{background:var(--shu)}
.red{color:var(--shu)}
.btn.sm[disabled]{opacity:.4}

/* tips */
.tip h2{font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tip .tags .tag{font-size:.7rem}
.tipb{margin:8px 0 0;padding-left:1.3em;font-size:.95rem;line-height:1.7}
.tipb li + li{margin-top:4px}
.tipb li.key{font-weight:700}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.list li:first-child{border-top:0}
.list .num{color:var(--ink2);font-size:.85rem;min-width:1.8em;padding-top:2px}
.list .body{flex:1}
.list .qq{font-size:.95rem}
.list .aa{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.08rem}
.yomi-in{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:.04em}
.list .body .small.muted{margin-top:2px;line-height:1.5}
.list .st{font-size:.8rem;color:var(--ink2);white-space:nowrap;padding-top:3px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700}
.badge.w{background:var(--shu-soft);color:var(--shu)}
.badge.c{background:var(--midori-soft);color:var(--midori)}
.badge.n{background:var(--bg3);color:var(--ink2)}
.setbtn{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.setbtn + .setbtn{margin-top:8px}
.setbtn b{font-size:1rem}
.setbtn .muted{font-size:.8rem}

/* order */
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:44px;border:1.5px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.slot.filled{border-style:solid;border-color:var(--ai);background:var(--ai-soft)}
.slot .n{font-family:var(--serif);font-weight:800;color:var(--ink2);min-width:1.4em}
.slot.filled .n{color:var(--ai)}
.slot .y{margin-left:auto;font-size:.85rem;color:var(--ink2);white-space:nowrap}
.slot.right{border-style:solid;border-color:var(--midori);background:var(--midori-soft)}
.slot.wrong{border-style:solid;border-color:var(--shu);background:var(--shu-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .btn{font-weight:400;font-size:.98rem}

/* mock */
.timerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--headH,96px));z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-family:var(--serif);font-weight:800;font-size:1.35rem;letter-spacing:.05em}
.timer.warn{color:var(--ki)}
.timer.over{color:var(--shu)}
.mq{padding:14px 0;border-top:1px solid var(--line)}
.mq:first-of-type{border-top:0}
.mq .qt{font-weight:700;margin-bottom:8px}
.mq .qn{font-family:var(--serif);font-weight:800;color:var(--ink2);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--bg);text-align:left;font-size:.98rem;line-height:1.5}
.opt.on{border-color:var(--ai);background:var(--ai-soft)}
.opt.right{border-color:var(--midori);background:var(--midori-soft)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.opt .k{font-weight:700;min-width:1.4em}
.daimon{font-family:var(--serif);font-weight:800;font-size:1.1rem;margin:22px 0 4px;color:var(--ink)}
.write{border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--ink2);font-size:.92rem;background:var(--bg)}
.gradeans{font-family:var(--serif);font-weight:800;color:var(--ai);font-size:1.15rem}
.self{display:flex;gap:8px;margin-top:8px}
.score{font-family:var(--serif);font-weight:800;font-size:2.4rem;color:var(--ai);line-height:1.1}
.score small{font-size:1rem;color:var(--ink2);font-family:var(--sans);font-weight:400}

/* notes */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:800;line-height:1.1}
.stat.w b{color:var(--shu)}
.stat span{font-size:.78rem;color:var(--ink2)}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
input[type=search]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink)}
.empty{padding:22px 10px;text-align:center;color:var(--ink2);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* ---- 新アプリで足した見た目 ---- */
:root{--ki-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ki-ink:#2A1C02}}
:root[data-theme="dark"]{--ki-ink:#2A1C02}
#sess{display:none}
#sess.on{display:block}
.tag.r6{background:#F8E1DC;color:#8A2A20}.tag.r7{background:#DDF0EA;color:#1F5E52}.tag.r8{background:#F3E9C9;color:#6E5206}.tag.r9{background:#E6E3F5;color:#45368A}.tag.r10{background:#E5E7EB;color:#374151}
:root[data-theme="dark"] .tag{background:var(--bg3);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:var(--bg3);color:var(--ink2)}}
.mark3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mark3 .btn{min-height:64px;font-size:1.25rem;flex-direction:column;gap:1px;line-height:1.15;padding:8px 4px}
.mark3 .btn small{font-size:.74rem;font-weight:700}
.btn.tri{background:var(--ki);border-color:var(--ki);color:var(--ki-ink)}
.sep{font-family:var(--serif);font-size:1.3rem;font-weight:800;color:var(--ink2)}
.banner{background:var(--midori-soft);color:var(--midori);border-radius:var(--r);padding:10px 14px;font-weight:700;margin-bottom:12px;font-size:.95rem}
.banner.warn{background:var(--shu-soft);color:var(--shu)}
.kprompt{font-family:var(--serif);font-size:1.7rem;font-weight:800;letter-spacing:.06em;margin:14px 0 2px}
.q.sub{font-size:.98rem;font-weight:400;color:var(--ink2);margin-top:10px}
.stat.tri b{color:var(--ki)}
.stat.ok b{color:var(--midori)}
.badge.t{background:var(--ki-soft);color:var(--ki)}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stgc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center}
.stgc b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:800;line-height:1.2}
.stgc span{font-size:.68rem;color:var(--ink2);white-space:nowrap}
input[type=date]{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
#nFound .list li{align-items:center}
.tests{list-style:none;margin:0;padding:0;font-size:.95rem}
.tests li{padding:5px 0;border-top:1px solid var(--line)}
.tests li:first-child{border-top:0}
.tests li.past{color:var(--ink2)}
.list .num{font-weight:700}

/* ---- バッジと3つの輪 ---- */
@media (max-width:460px){.tabs button{font-size:.76rem;padding-left:0;padding-right:0}}
.tabs button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--shu);margin-left:3px;vertical-align:top}
.grn{color:var(--midori)}
.ringrow{display:flex;align-items:center;gap:16px}
.ringrow.mt2{margin-top:18px}
.rings{flex:0 0 auto}
.rings circle{fill:none;stroke-width:9}
.rings .trk{stroke:var(--bg3)}
.rings .p{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px}
.rings .p.none{opacity:.3}
.rings .r-ai{stroke:var(--ai)}.rings .r-midori{stroke:var(--midori)}.rings .r-ki{stroke:var(--ki)}
.ringlist{display:grid;gap:3px;font-size:.98rem}
.ringlist b{font-family:var(--serif);font-size:1.15rem;font-weight:800}
.ringlist .dot{display:inline-block;width:.72em;height:.72em;border-radius:50%;margin-right:8px}
.dot.ai{background:var(--ai)}.dot.midori{background:var(--midori)}.dot.ki{background:var(--ki)}
.ringlist .okm{color:var(--midori);font-weight:700;margin-left:8px}
button.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;text-align:left;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.banner.bnew{background:var(--ki-soft);color:var(--ki)}
#sess .banner.bnew{margin:14px 0 0}
.banner.bnew .go{border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;font-size:.85rem;white-space:nowrap}
.banner.bnew:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px;margin-top:12px;align-items:start}
.bdg{display:block;background:none;border:0;padding:0;text-align:center;cursor:pointer;color:var(--ink2);font:inherit}
.medal{position:relative;width:68px;height:68px;border-radius:50%;margin:0 auto 6px;display:grid;place-content:center;border:2px dashed var(--line);background:var(--bg);line-height:1}
.medal b{font-family:var(--serif);font-weight:800;font-size:1.5rem;display:block}
.medal.sm b{font-size:1.02rem}
.medal i{font-style:normal;font-size:.62rem;font-weight:700;display:block;margin-top:3px}
.bdg.c-ai{--c:var(--ai);--cs:var(--ai-soft)}.bdg.c-midori{--c:var(--midori);--cs:var(--midori-soft)}.bdg.c-ki{--c:var(--ki);--cs:var(--ki-soft)}.bdg.c-shu{--c:var(--shu);--cs:var(--shu-soft)}
.bdg.on{color:var(--ink)}
.bdg.on .medal{border:3px solid var(--c);background:var(--cs);color:var(--c);box-shadow:inset 0 0 0 3px var(--bg)}
.bdg.shut{opacity:.55}
.bdg.sel .medal,.bdg:focus-visible .medal{outline:2px solid var(--ai);outline-offset:3px}
.bdg:focus-visible{outline:none}
.medal .cnt{position:absolute;right:-10px;bottom:-4px;background:var(--c,var(--ink2));color:var(--bg);border-radius:999px;font-size:.68rem;font-weight:700;padding:3px 6px;font-family:var(--sans)}
.medal .new{position:absolute;right:-6px;top:-4px;background:var(--shu);color:var(--shu-ink);border-radius:999px;font-size:.62rem;font-weight:700;padding:3px 5px}
.bn{display:block;font-size:.78rem;font-weight:700;line-height:1.35}
.bs{display:block;font-size:.72rem;color:var(--ink2);margin-top:1px;min-height:1em}
.bdetail{margin-top:14px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-size:.92rem;line-height:1.6}
/* ---- メダル（金属の見た目）と、もらったときの演出 ---- */
.m-ai,.bdg.c-ai{--m1:#A9C8F0;--m2:#3F72B5;--m3:#1D3F70;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.m-midori,.bdg.c-midori{--m1:#A8E0BC;--m2:#3A9462;--m3:#1C5A37;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.m-ki,.bdg.c-ki{--m1:#FFEDB0;--m2:#DDAA28;--m3:#8C6208;--mt:#3F2B00;--ms:rgba(255,255,255,.45)}
.m-shu,.bdg.c-shu{--m1:#F8B9B3;--m2:#CB463F;--m3:#7C1E19;--mt:#FFFFFF;--ms:rgba(0,0,0,.35)}
.bdg.on .medal{border:0;color:var(--mt);text-shadow:0 1px 1px var(--ms);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),linear-gradient(145deg,var(--m1),var(--m2) 46%,var(--m3));box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),inset 0 0 0 5px var(--m3),0 2px 5px rgba(0,0,0,.22)}
.bdg.on .medal .cnt,.bdg.on .medal .new{text-shadow:none}
.rings.flash{animation:ringpop 1.2s ease-out}
.rings.flash .p{animation:ringglow 1.2s ease-out}
@keyframes ringpop{0%{transform:scale(1)}30%{transform:scale(1.14)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes ringglow{0%,100%{stroke-width:9}30%{stroke-width:12;filter:brightness(1.35)}}
#cele{position:fixed;inset:0;z-index:50;background:rgba(9,14,26,.88);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;color:#FFFFFF;text-align:center}
[hidden]{display:none!important}
.cele-in{position:relative;max-width:420px;width:100%}
.cele-top{font-weight:700;letter-spacing:.08em;color:#F2D58A;min-height:1.6em;margin-bottom:10px;font-size:1.05rem}
.stage{perspective:900px;display:grid;place-items:center;height:232px}
.bigm{position:relative;width:190px;height:190px;transform-style:preserve-3d;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.bigm .face,.bigm .edge{position:absolute;inset:0;border-radius:50%}
.bigm .edge{background:var(--m3)}
.bigm .face{-webkit-backface-visibility:hidden;backface-visibility:hidden;display:grid;place-content:center;overflow:hidden;color:var(--mt);text-shadow:0 2px 1px var(--ms);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 44%),linear-gradient(145deg,var(--m1),var(--m2) 46%,var(--m3));box-shadow:inset 0 0 0 5px rgba(255,255,255,.4),inset 0 0 0 11px var(--m3),inset 0 0 0 13px rgba(255,255,255,.28)}
.bigm .front{transform:translateZ(5px)}
.bigm .back{transform:rotateY(180deg) translateZ(5px)}
.bigm .face b,.bigm .face i,.bigm .face em{display:block;font-style:normal;line-height:1}
.bigm .front b{font-family:var(--serif);font-weight:800;font-size:4.4rem}
.bigm .front b.sm{font-size:2.6rem}
.bigm .front i{font-weight:700;font-size:1.05rem;margin-top:10px;letter-spacing:.06em}
.bigm .back i{font-size:.85rem;font-weight:700}
.bigm .back b{font-family:var(--serif);font-weight:800;font-size:1.65rem;margin-top:8px}
.bigm .back em{font-weight:700;font-size:1rem;margin-top:8px;min-height:1em}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 64%);transform:translateX(-130%);pointer-events:none}
.front.go .shine{animation:shine .9s ease-out}
@keyframes shine{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
#cele h2{font-family:var(--serif);font-size:1.6rem;font-weight:800;margin-top:12px;color:#FFFFFF}
.cele-cond{margin-top:6px;font-size:.98rem;color:#D5DCE8;line-height:1.6}
.cele-more{margin-top:6px;font-size:.92rem;color:#F2D58A;min-height:1.3em}
.cele-hint{margin-top:8px;font-size:.8rem;color:#9FAABD}
#celeBtn{margin-top:16px;min-width:190px;background:#FFFFFF;border-color:#FFFFFF;color:#1A2230}
#celeBtn:focus-visible{outline:3px solid #F2D58A;outline-offset:3px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-8vh;border-radius:2px;animation-name:conf;animation-timing-function:linear;animation-fill-mode:both}
@keyframes conf{to{transform:translateY(116vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.rings.flash,.rings.flash .p,.front.go .shine{animation:none}}
/* ---- テストの点数の入力 ---- */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid.four{grid-template-columns:repeat(4,1fr)}
.tgrid label{display:block;font-size:.82rem;color:var(--ink2);min-width:0}
.tgrid input{display:block;width:100%;min-width:0;margin-top:3px;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
#tPanel .list li{align-items:center}
/* ---- 印刷用シート（画面では重ねて表示、印刷ではシートだけ） ---- */
#sheet{display:none;position:fixed;inset:0;z-index:20;background:#fff;color:#111;overflow:auto;padding:0 0 40px}
#sheet.show{display:block}
#sheet .bar{position:sticky;top:0;background:#f3f4f6;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sheet .bar .btn{background:#fff;border-color:#bbb;color:#111;min-height:40px;padding:8px 14px}
#sheet .bar .btn.primary{background:#22497A;border-color:#22497A;color:#fff}
#sheet .bar .chip{background:#fff;border-color:#bbb;color:#111}
#sheet .bar .chip.on{border-color:#22497A;background:#E3ECF7;color:#22497A}
.paper{max-width:760px;margin:0 auto;padding:24px 20px;font-family:var(--sans);font-size:13px;line-height:1.5;color:#111}
.paper h1{font-family:var(--serif);font-size:20px;font-weight:800;margin-bottom:2px}
.paper .sub{font-size:12px;color:#555;margin-bottom:14px}
.paper h2{font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid #111}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper td{border-bottom:1px solid #ccc;padding:6px 4px;vertical-align:top}
.paper td.n{width:2.2em;color:#666}
.paper td.r{width:3.6em;color:#666;font-size:11px}
.paper td.a{width:36%;font-family:var(--serif);font-weight:800;font-size:14px}
.paper td.cnt{width:2.6em;color:#B03A31;font-size:11px;text-align:right}
.paper .bx{display:inline-block;width:1.7em;height:1.7em;border:1px solid #333;margin-right:2px;vertical-align:middle}
.paper .line{display:inline-block;width:94%;border-bottom:1px solid #333;height:1.5em}
.paper .empty{color:#666;font-size:12px;padding:6px 0;text-align:left}
.paper .ex{font-size:11px;color:#444;margin-top:2px;line-height:1.45}
.paper .yo{font-family:var(--sans);font-weight:400;font-size:11px;color:#555}
@media print{
  @page{margin:14mm}
  body{background:#fff;overflow:visible!important}
  #app,#cele{display:none!important}
  #sheet{display:block!important;position:static;overflow:visible;padding:0}
  #sheet .bar{display:none!important}
  .paper{max-width:none;padding:0}
  .paper h2{break-after:avoid}
  .paper tr{break-inside:avoid}
}

/* ---- 同期 ---- */
.sync{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.sync:empty{display:none}
.sync.bad,#syStat.bad{color:var(--shu);font-weight:700}
.syask{border:2px solid var(--shu);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:.92rem;line-height:1.7}
.syask p{margin:0 0 4px}
input.syin{display:block;width:100%;max-width:26em;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink)}

/* ---- 出る順番 ---- */
.chips.ord{align-items:center;margin-bottom:6px}
.ordl{display:inline-block;min-width:4.2em;font-size:.9rem;color:var(--ink2)}

/* ---- 暗記カード ---- */
.cardimg{margin:4px 0 6px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;aspect-ratio:1030/568}
.cardimg img{display:block;width:100%;height:100%;object-fit:contain}
.card.revealed .cardimg{cursor:pointer}
.cdlist{list-style:none;margin:8px 0;padding:0}
.cdlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
p.bad,.small.bad{color:var(--shu);font-weight:700}
#cdBox input[type=file]{font:inherit;font-size:.9rem;max-width:100%}
#cardv{display:none;position:fixed;inset:0;z-index:25;background:#161b24;overflow:auto}
#cardv .btn{color:#1d2433;background:#fff;border-color:#fff}
#cardv .btn[disabled]{opacity:.35}
#cardv.show{display:block}
#cardv .cv-in{max-width:980px;margin:0 auto;padding:16px;color:#fff}
#cardv .cv-in .muted{color:#cfd6e0}
.cv-card{display:flex;align-items:center;justify-content:center;width:100%;margin-top:12px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:1030/568;cursor:pointer}
.cv-card img{display:block;width:100%;height:100%;object-fit:contain}
@media print{#cardv{display:none!important}}
@media (max-width:520px){.cardimg{margin-left:-10px;margin-right:-10px;border-radius:6px}}

/* ---- ドリルのカード ---- */
.dcard{position:relative;width:100%;aspect-ratio:1030/568;background:#fff;border:2px solid #7d9b83;border-radius:8px;box-sizing:border-box;display:flex;overflow:hidden;container-type:inline-size}
.dc-pic{flex:0 0 42%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.dc-pic svg{width:100%;height:100%;display:block}
.dc-txt{flex:1 1 auto;min-width:0;writing-mode:vertical-rl;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDGothic","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;padding:3.4cqw 3.2cqw 3cqw 1cqw;font-size:16px;font-size:2.75cqw;line-height:1.72;font-weight:700;color:#222;letter-spacing:.03em;overflow:hidden}
.dc-txt p{margin:0 0 0 1.6cqw}
.dc-txt .note{font-size:.78em;color:#444}
.dc-a{color:#1f7fd0}
.dc-y{font-size:.6em}
.dc-tag{position:absolute;left:.8cqw;bottom:.6cqw;font-size:1.3cqw;color:#7f9184;font-weight:700;letter-spacing:.05em;background:rgba(255,255,255,.85);border-radius:4px;padding:0 .5cqw}

#sess .dcard{margin:4px 0 6px}
.card.revealed .dcard{cursor:pointer}
.cv-card.dc{display:block;aspect-ratio:auto;background:transparent}
.cv-card.dc .dcard{border:0;border-radius:12px}
@media (max-width:520px){#sess .dcard{margin-left:-10px;margin-right:-10px;width:calc(100% + 20px);border-radius:6px}}

.wbox{display:inline-grid;place-items:center;width:8em;max-width:100%;height:2.1em;padding:0 .3em;box-sizing:border-box;border:1.5px solid var(--ink2);border-radius:3px;font-family:var(--serif);font-size:1.55rem;font-weight:800;line-height:1;color:var(--ai);position:relative;background:var(--bg);white-space:nowrap}
.wbox::after{content:"";position:absolute;inset:0;border:1px dashed var(--line);margin:3px;border-radius:2px;opacity:.7}
.wbox span{opacity:0}
.card.revealed .wbox span{opacity:1}
.paper .bxl{display:inline-block;width:6.5em;height:1.7em;border:1px solid #333;vertical-align:middle}

/* シークレットバッジ */
.bdg.secret:not(.on) .medal{border:2px dashed var(--ink2);background:repeating-linear-gradient(135deg,var(--bg2,#F1F3F6) 0 6px,var(--bg) 6px 12px)}
.bdg.secret:not(.on) .medal b{font-size:1.9rem;color:var(--ink2)}
.m-nobu,.bdg.c-nobu{--m1:#7A5A22;--m2:#2A180A;--m3:#6B4A10;--mt:#F6D678;--ms:rgba(0,0,0,.65);--c:#B8862B;--cs:#F6E7C1}
.bdg.on.c-nobu .medal{background:radial-gradient(circle at 30% 22%,rgba(255,236,190,.38),rgba(255,255,255,0) 42%),linear-gradient(145deg,#4A2E14,#1A0E06 55%,#0A0603);box-shadow:inset 0 0 0 2px #F6D678,inset 0 0 0 5px #8C6208,0 2px 6px rgba(0,0,0,.35)}
.medal .mimg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);display:none;pointer-events:none}
.bdg.on .medal.hasimg{background:none;box-shadow:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.medal.hasimg .mimg{display:block}
.medal.hasimg>b,.medal.hasimg>i{visibility:hidden}
.m-nobu .bigm .face{background:radial-gradient(circle at 32% 24%,rgba(255,236,190,.45),rgba(255,255,255,0) 44%),linear-gradient(145deg,#4A2E14,#1A0E06 55%,#0A0603);box-shadow:inset 0 0 0 5px rgba(246,214,120,.6),inset 0 0 0 11px #6B4A10,inset 0 0 0 13px rgba(246,214,120,.35)}
.m-nobu .bigm .edge{background:#6B4A10}
.bigm .front.hasimg{background:none;box-shadow:none;overflow:visible}
.bigm .front.hasimg>b,.bigm .front.hasimg>i{visibility:hidden}
.bigm .front .fimg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;-webkit-user-drag:none;user-select:none}
.shclip{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.m-nobu .cele-top{color:#FFD86B;letter-spacing:.14em}
</style>
</head>

","q":"次のⅠ・Ⅱの文の正誤の組み合わせとして正しいものを選びなさい。\nⅠ 弥生時代のやじりは、縄文時代のものより小さくて軽くなりました。\nⅡ 青銅器は、おもに祭器として使われました。","o":["Ⅰ＝正・Ⅱ＝正","Ⅰ＝正・Ⅱ＝誤","Ⅰ＝誤・Ⅱ＝正","Ⅰ＝誤・Ⅱ＝誤"],"ans":2,"x":"弥生時代のやじりは大きく重くなった（戦い用）のでⅠは誤。青銅器は祭器なのでⅡは正。"}]},{"title":"2　古墳時代・飛鳥時代","qs":[{"id":"m:9","t":"w","q":"大阪府堺市にある、日本最大の前方後円墳の名を答えなさい。","a":"大仙古墳","y":"だいせんこふん","h":"漢字4字（仁徳陵古墳でも可）","x":"全長486m。仁徳天皇の墓とされる。"},{"id":"m:10","t":"w","q":"ワカタケル大王の名がきざまれた鉄剣が出土した埼玉県の古墳の名を答えなさい。","a":"稲荷山古墳","y":"いなりやまこふん","h":"漢字5字","x":"埼玉＝稲荷山＝鉄剣。熊本＝江田船山＝鉄刀。"},{"id":"m:11","t":"mc","q":"渡来人が日本に伝えたものとして正しくないものを選びなさい。","o":["須恵器をつくる技術","機織りの技術","儒教","土偶をつくる技術"],"ans":3,"x":"土偶は縄文時代のもので、渡来人とは関係ない。"},{"id":"m:12","t":"w","q":"603年、聖徳太子が定めた、能力や手柄に応じて役人の位をあたえる制度を何といいますか。","a":"冠位十二階","y":"かんいじゅうにかい","h":"漢字5字","x":"翌604年が憲法十七条（役人の心がまえ）。"},{"id":"m:13","t":"mc","q":"憲法十七条について述べた文として正しいものを選びなさい。","o":["家柄にとらわれず、能力によって役人の位を定めました。","役人としての心がまえを示したものでした。","壬申の乱をおさめるためにつくられました。","土地と人民を国家のものとすることを定めました。"],"ans":1,"x":"アは冠位十二階、エは改新の詔（公地公民）の内容。壬申の乱は672年で時代がちがう。"},{"id":"m:14","t":"w","q":"607年、遣隋使として隋に送られた人物の名を答えなさい。","a":"小野妹子","y":"おののいもこ","h":"漢字4字","x":"「日出づる処の天子」の手紙を隋の皇帝に。"},{"id":"m:15","t":"mc","q":"仏教を日本に公に伝えた朝鮮半島の国はどこですか。","o":["新羅","高句麗","百済","伽耶"],"ans":2,"x":"538年、百済から。儒教も百済から（5世紀）。"},{"id":"m:16","t":"w","q":"645年、中大兄皇子とともに蘇我氏を倒した人物の名を答えなさい。","a":"中臣鎌足","y":"なかとみのかまたり","h":"漢字4字","x":"後の藤原鎌足。藤原氏の祖。"},{"id":"m:17","t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 白村江の戦い　B 壬申の乱　C 大化の改新　D 藤原京に都が移る","o":["A→C→B→D","C→A→B→D","C→B→A→D","A→B→C→D"],"ans":1,"x":"大化の改新645→白村江663→壬申の乱672→藤原京694。"},{"id":"m:18","t":"w","q":"天武天皇のころにつくられた、日本で最初の銅銭を何といいますか。","a":"富本銭","y":"ふほんせん","h":"漢字3字","x":"和同開珎（708年・奈良時代）より古い。"}]},{"title":"3　奈良時代","qs":[{"id":"m:19","t":"w","q":"701年、唐の制度にならって定められた法令を何といいますか。","a":"大宝律令","y":"たいほうりつりょう","h":"漢字4字","x":"律＝刑罰、令＝政治のしくみ。"},{"id":"m:20","t":"mc","q":"律令の税や兵役について述べた文として正しいものを選びなさい。","o":["租は、地方の特産物を都に納める税です。","庸は、都で10日間働く代わりに布を納める税です。","調は、口分田にかけられ稲を納める税です。","防人は、1年間都の守りにつく兵士です。"],"ans":1,"x":"租＝稲、調＝特産物、庸＝布。防人は3年間九州、衛士が1年間都。"},{"id":"m:21","t":"w","q":"平城京が手本にした唐の都の名を答えなさい。","a":"長安","y":"ちょうあん","h":"漢字2字","x":"平安京も長安がモデル。碁盤の目の道路。"},{"id":"m:22","t":"mc","q":"聖武天皇について述べた次のⅠ・Ⅱの文の正誤の組み合わせとして正しいものを選びなさい。\nⅠ 国ごとに国分寺・国分尼寺を建てるよう命じました。\nⅡ 都を平城京から平安京に移しました。","o":["Ⅰ＝正・Ⅱ＝正","Ⅰ＝正・Ⅱ＝誤","Ⅰ＝誤・Ⅱ＝正","Ⅰ＝誤・Ⅱ＝誤"],"ans":1,"x":"国分寺は聖武天皇（741年）。平安京に移したのは桓武天皇（794年）なのでⅡは誤。"},{"id":"m:23","t":"w","q":"各地で仏の教えを説き、池や橋をつくり、後に東大寺の大仏づくりに協力した僧の名を答えなさい。","a":"行基","y":"ぎょうき","h":"漢字2字","x":"鑑真（唐から来た僧・唐招提寺）と混同しない。"},{"id":"m:24","t":"mc","q":"743年に出された、開墾した田を永久に自分のものにしてよいとするきまりはどれですか。","o":["三世一身の法","班田収授の法","墾田永年私財法","改新の詔"],"ans":2,"x":"743年墾田永年私財法＝永久。723年三世一身の法＝3代まで。"},{"id":"m:25","t":"w","q":"唐から来日し、日本の僧の制度を整えた鑑真が奈良に開いた寺の名を答えなさい。","a":"唐招提寺","y":"とうしょうだいじ","h":"漢字4字","x":"「唐から招いた」鑑真の寺。"},{"id":"m:26","t":"mc","q":"書物とその説明の組み合わせとして正しいものを選びなさい。","o":["『古事記』 ― 各国の産物や地名の由来をまとめた","『風土記』 ― 720年に完成した歴史書","『万葉集』 ― 現存する日本最古の和歌集","『日本書紀』 ― 712年に完成した歴史書"],"ans":2,"x":"古事記712（歴史）、風土記713（産物・地名）、日本書紀720（歴史）、万葉集（和歌）。"},{"id":"m:27","t":"w","q":"正倉院の建物に用いられている、三角柱の木材を組んで壁をつくる建築様式を何といいますか。","a":"校倉造","y":"あぜくらづくり","h":"漢字3字","x":"寝殿造（貴族の屋敷・平安時代）と区別。"}]},{"title":"4　平安時代","qs":[{"id":"m:28","t":"w","q":"794年、都を平安京に移した天皇の名を答えなさい。","a":"桓武天皇","y":"かんむてんのう","h":"漢字4字","x":"784年長岡京、794年平安京。"},{"id":"m:29","t":"mc","q":"桓武天皇の政治について述べた文として正しくないものを選びなさい。","o":["国司に対する監督をきびしくしました。","農民の兵役をやめ、負担を軽くしました。","坂上田村麻呂を征夷大将軍に任命しました。","菅原道真の提案で遣唐使を停止しました。"],"ans":3,"x":"遣唐使の停止は894年、菅原道真の提案。桓武天皇（8世紀末）より約100年後。"},{"id":"m:30","t":"w","q":"894年、遣唐使の停止を提案した人物の名を答えなさい。","a":"菅原道真","y":"すがわらのみちざね","h":"漢字4字","x":"後に大宰府に流され、「学問の神様」に。"},{"id":"m:31","t":"mc","q":"天皇が成人した後に、天皇をたすけて政治を行う役職を何といいますか。","o":["摂政","関白","太政大臣","征夷大将軍"],"ans":1,"x":"幼いとき＝摂政、成人後＝関白。"},{"id":"m:32","t":"w","q":"「この世をば わが世とぞ思ふ 望月の かけたることも なしと思へば」とよんだ人物の名を答えなさい。","a":"藤原道長","y":"ふじわらのみちなが","h":"漢字4字","x":"「望月の歌」。藤原氏の全盛期。"},{"id":"m:33","t":"mc","q":"939年、関東地方で反乱を起こした人物と、瀬戸内海で反乱を起こした人物の組み合わせとして正しいものを選びなさい。","o":["平将門 ― 藤原純友","藤原純友 ― 平将門","源義家 ― 平将門","平将門 ― 源義家"],"ans":0,"x":"関東＝平将門（下総）、瀬戸内海＝藤原純友（伊予）。源義家は11世紀の東北。"},{"id":"m:34","t":"w","q":"1086年、白河上皇が始めた、上皇が院で行う政治を何といいますか。","a":"院政","y":"いんせい","h":"漢字2字","x":"摂関政治→院政→平氏の政治の順。"},{"id":"m:35","t":"mc","q":"平清盛について述べた文として正しいものを選びなさい。","o":["保元の乱で源義朝に敗れました。","武士として初めて征夷大将軍になりました。","大輪田泊を整え、日宋貿易をさかんにしました。","平泉を中心に約100年間栄えました。"],"ans":2,"x":"清盛は平治の乱で義朝に勝った。役職は太政大臣（征夷大将軍ではない）。平泉は奥州藤原氏。"},{"id":"m:36","t":"w","q":"最澄が比叡山に建てた寺の名を答えなさい。","a":"延暦寺","y":"えんりゃくじ","h":"漢字3字","x":"滋賀県。空海は高野山金剛峯寺（和歌山県）。"},{"id":"m:37","t":"mc","q":"作者と作品の組み合わせとして正しいものを選びなさい。","o":["清少納言 ― 『源氏物語』","紫式部 ― 『枕草子』","紀貫之 ― 『土佐日記』","清少納言 ― 『竹取物語』"],"ans":2,"x":"紀貫之＝土佐日記・古今和歌集。紫式部＝源氏物語、清少納言＝枕草子。竹取物語の作者は不明。"},{"id":"m:38","t":"w","q":"平安時代の貴族の屋敷のつくりを何といいますか。","a":"寝殿造","y":"しんでんづくり","h":"漢字3字","x":"渡り廊下で建物をつなぐ。"},{"id":"m:39","t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 院政が始まる　B 保元の乱　C 藤原道長が摂政になる　D 平清盛が太政大臣になる","o":["C→A→B→D","A→C→B→D","C→B→A→D","A→B→C→D"],"ans":0,"x":"道長摂政1016→院政1086→保元1156→清盛太政大臣1167。"},{"id":"m:40","t":"w","q":"荘園に認められた、朝廷に税を納めなくてもよい権利を何といいますか。","a":"不輸の権","y":"ふゆのけん","h":"漢字2字＋の権","x":"不入の権は役人の立ち入りを断る権利。"}]}]},{"id":"c2","title":"第6〜9回","doneId":"mock:done:c2","cycle":2,"note":"いまは第6〜8回の分。第9回の問題が入ると、ここに足される。","sections":[{"title":"第6回　鎌倉時代","qs":[{"t":"mc","q":"1185年、源頼朝が国ごとに置いた、軍事・警察の仕事をする役職はどれですか。","o":["地頭","守護","執権","国司"],"ans":1,"x":"守護＝国ごと。地頭＝荘園ごとで、土地の管理と年貢の取り立て。","id":"m:c2-6-01"},{"t":"w","q":"将軍が御家人の領地を認めたり、手柄に応じて新しい領地をあたえたりすることを何といいますか。","a":"御恩","y":"ごおん","h":"漢字2字","x":"将軍→御家人が御恩、御家人→将軍が奉公。この関係が封建制度。","id":"m:c2-6-02"},{"t":"mc","q":"鎌倉幕府のしくみについて述べた文として正しいものを選びなさい。","o":["侍所は、裁判を担当しました。","問注所は、御家人の取りしまりを担当しました。","政所は、政治一般を担当しました。","六波羅探題は、鎌倉に置かれました。"],"ans":2,"x":"侍所＝御家人の取りしまりと軍事、政所＝政治一般、問注所＝裁判。六波羅探題は京都。","id":"m:c2-6-03"},{"t":"w","q":"1221年、後鳥羽上皇が幕府をたおそうとして敗れた戦いを何といいますか。","a":"承久の乱","y":"じょうきゅうのらん","h":"漢字2字＋の乱","x":"源氏の将軍が3代で絶えたのをきっかけに起こった。上皇は隠岐に流された。","id":"m:c2-6-04"},{"t":"mc","q":"人物とできごとの組み合わせとして正しいものを選びなさい。","o":["北条義時 ― 御成敗式目","北条泰時 ― 承久の乱","北条時宗 ― 元寇","北条政子 ― 永仁の徳政令"],"ans":2,"x":"義時＝承久の乱（1221年）、泰時＝御成敗式目（1232年）、時宗＝元寇（1274年・1281年）。","id":"m:c2-6-05"},{"t":"w","q":"承久の乱の後、朝廷の監視と西国の御家人の取りしまりのために、京都に置かれた役所を何といいますか。","a":"六波羅探題","y":"ろくはらたんだい","h":"漢字5字","x":"これで幕府の支配が全国におよぶようになった。","id":"m:c2-6-06"},{"t":"mc","q":"元寇について述べた文として正しくないものを選びなさい。","o":["1回目の襲来を文永の役、2回目を弘安の役といいます。","元軍は、集団戦法と火薬を使った兵器で日本の武士を苦しめました。","元寇の後、御家人は十分な領地をほうびとしてあたえられました。","文永の役の後、博多湾の沿岸に石塁が築かれました。"],"ans":2,"x":"新しい土地を得た戦いではなかったので、十分なほうびが出せず、御家人の不満が高まった。","id":"m:c2-6-07"},{"t":"w","q":"稲をかりとった後に麦をつくるように、同じ田畑で1年に2種類の作物をつくることを何といいますか。","a":"二毛作","y":"にもうさく","h":"漢字3字","x":"鎌倉時代に西日本で広まった。同じ作物を年2回つくる二期作と区別する。","id":"m:c2-6-08"},{"t":"mc","q":"鎌倉時代の仏教について、開いた人物と宗派の組み合わせとして正しいものを選びなさい。","o":["法然 ― 浄土真宗","親鸞 ― 浄土宗","日蓮 ― 時宗","道元 ― 曹洞宗"],"ans":3,"x":"法然＝浄土宗、親鸞＝浄土真宗、一遍＝時宗、日蓮＝日蓮宗、栄西＝臨済宗、道元＝曹洞宗。","id":"m:c2-6-09"},{"t":"w","q":"琵琶法師によって語り伝えられた、平氏の盛衰をえがいた軍記物を何といいますか。","a":"平家物語","y":"へいけものがたり","h":"漢字4字","x":"語りで伝えたので、文字を読めない人にも親しまれた。","id":"m:c2-6-10"},{"t":"mc","q":"次のできごとを古い順に並べたものとして正しいものを選びなさい。\nA 承久の乱　B 御成敗式目が定められる　C 守護・地頭が置かれる　D 文永の役","o":["C→A→B→D","A→C→B→D","C→B→A→D","A→B→C→D"],"ans":0,"x":"守護・地頭1185年→承久の乱1221年→御成敗式目1232年→文永の役1274年。","id":"m:c2-6-11"},{"t":"w","q":"東大寺南大門にある、運慶・快慶らがつくった彫刻を何といいますか。","a":"金剛力士像","y":"こんごうりきしぞう","h":"漢字5字","x":"力強く写実的な、鎌倉文化を代表する彫刻。","id":"m:c2-6-12"}]},{"title":"第7回　室町時代","qs":[{"t":"mc","q":"1333年に鎌倉幕府を倒し、建武の新政を行った天皇はだれですか。","o":["後鳥羽上皇","後醍醐天皇","桓武天皇","聖武天皇"],"ans":1,"x":"後鳥羽上皇は承久の乱（1221年）。後醍醐天皇は建武の新政（1334年）。","id":"m:c2-7-01"},{"t":"w","q":"1338年、北朝の天皇から征夷大将軍に任命され、京都に幕府を開いた人物はだれですか。","a":"足利尊氏","y":"あしかがたかうじ","h":"漢字4字","x":"後醍醐天皇に協力して鎌倉幕府を倒したが、後に天皇と対立して兵をあげた。","id":"m:c2-7-02"},{"t":"mc","q":"室町幕府のしくみについて述べた文として正しいものを選びなさい。","o":["将軍をたすける役職を執権といいました。","管領には、有力な守護大名が任命されました。","関東を支配するために六波羅探題が置かれました。","地方には国司が置かれました。"],"ans":1,"x":"室町幕府で将軍をたすけるのは管領。関東には鎌倉府。執権・六波羅探題は鎌倉幕府。","id":"m:c2-7-03"},{"t":"w","q":"1392年に南北朝の合一を行い、京都の室町に花の御所を建てて幕府の全盛期をきずいた3代将軍はだれですか。","a":"足利義満","y":"あしかがよしみつ","h":"漢字4字","x":"日明貿易を始め、北山に金閣を建てた。","id":"m:c2-7-04"},{"t":"mc","q":"日明貿易について述べた文として正しくないものを選びなさい。","o":["貿易船と倭寇を区別するために、勘合という合い札が使われました。","日本が明に貢ぎ物をもっていく朝貢の形で行われました。","明から銅銭や陶磁器、絹織物などが輸入されました。","日本から木綿やお経などが輸出されました。"],"ans":3,"x":"木綿やお経は朝鮮からの輸入品。日本からの輸出品は銅・硫黄・刀剣など。","id":"m:c2-7-05"},{"t":"w","q":"1429年、沖縄で3つの小国が統一されて成立し、中継貿易でさかえた国を何といいますか。","a":"琉球王国","y":"りゅうきゅうおうこく","h":"漢字4字","x":"都は首里。明銭や東南アジアの香料を積んで、堺や博多にやって来た。","id":"m:c2-7-06"},{"t":"mc","q":"室町時代の産業について述べた文として正しいものを選びなさい。","o":["定期市は、月に3回開かれるようになりました。","馬借とよばれる、高い利子で金を貸す業者が現れました。","同業者の組合である座の数や種類が増えました。","甲斐ではみかん、紀伊ではぶどうが特産物になりました。"],"ans":2,"x":"定期市は月6回のところも。馬借は運送業者で、金貸しは土倉・酒屋。紀伊＝みかん、甲斐＝ぶどう。","id":"m:c2-7-07"},{"t":"w","q":"農民たちが神社などで開き、村のおきてや年貢の納入などについて話し合った会合を何といいますか。","a":"寄合","y":"よりあい","h":"漢字2字","x":"このような自治を行う村を惣（惣村）という。","id":"m:c2-7-08"},{"t":"mc","q":"一揆と起こった場所の組み合わせとして正しいものを選びなさい。","o":["正長の土一揆 ― 加賀国","山城の国一揆 ― 近江国","加賀の一向一揆 ― 石川県","正長の土一揆 ― 京都府"],"ans":2,"x":"正長＝近江国（滋賀県）、山城＝山城国（京都府）、加賀＝加賀国（石川県）。","id":"m:c2-7-09"},{"t":"w","q":"1467年に京都で始まり、11年も続いて京都を焼け野原にした戦乱を何といいますか。","a":"応仁の乱","y":"おうにんのらん","h":"漢字2字＋の乱","x":"8代将軍足利義政のころ。細川勝元と山名宗全の争いに後つぎ争いがからんだ。","id":"m:c2-7-10"},{"t":"mc","q":"室町文化について、人物とことがらの組み合わせとして正しいものを選びなさい。","o":["足利義政 ― 金閣","雪舟 ― 連歌","観阿弥・世阿弥 ― 能","足利義満 ― 銀閣"],"ans":2,"x":"義満＝金閣（北山文化）、義政＝銀閣（東山文化）、雪舟＝水墨画、観阿弥・世阿弥＝能。","id":"m:c2-7-11"},{"t":"w","q":"慈照寺の東求堂に見られる、畳をしきつめ、ふすまや障子で間仕切りをした、現在の和風建築のもとになった建築様式を何といいますか。","a":"書院造","y":"しょいんづくり","h":"漢字3字","x":"角柱・違い棚・付書院も特色。","id":"m:c2-7-12"}]},{"title":"第8回　安土・桃山時代","qs":[{"t":"mc","q":"1543年に鉄砲を日本に伝えた人々と、流れ着いた島の組み合わせとして正しいものを選びなさい。","o":["スペイン人 ― 屋久島","ポルトガル人 ― 種子島","ポルトガル人 ― 平戸","スペイン人 ― 種子島"],"ans":1,"x":"鉄砲はポルトガル人が種子島（鹿児島県）に伝えた。スペイン人のザビエルはキリスト教。","id":"m:c2-8-01"},{"t":"w","q":"1549年に鹿児島に来て、日本に初めてキリスト教を伝えたイエズス会の宣教師はだれですか。","a":"フランシスコ＝ザビエル","y":"ふらんしすこざびえる","h":"カタカナ","x":"スペイン人。平戸・山口・京都などで布教し、2年ほどで日本を去った。","id":"m:c2-8-02"},{"t":"mc","q":"南蛮貿易について述べた文として正しくないものを選びなさい。","o":["長崎や平戸などで行われました。","日本からはおもに銀が輸出されました。","ポルトガル人やスペイン人との貿易です。","日本には銅銭や陶磁器がおもに輸入されました。"],"ans":3,"x":"銅銭・陶磁器の輸入は日明貿易。南蛮貿易の輸入品は鉄砲・火薬・生糸・絹織物。","id":"m:c2-8-03"},{"t":"w","q":"下の身分の者が、実力によって上の身分の者を倒す風潮を何といいますか。","a":"下剋上","y":"げこくじょう","h":"漢字3字","x":"応仁の乱の後に広まり、戦国大名が生まれた。","id":"m:c2-8-04"},{"t":"mc","q":"織田信長について述べた文として正しいものを選びなさい。","o":["桶狭間の戦いで武田勝頼を破りました。","将軍足利義政を追放して室町幕府を滅ぼしました。","安土城を築き、楽市楽座の政策を行いました。","石山本願寺のあと地に大阪城を築きました。"],"ans":2,"x":"桶狭間は今川義元、追放した将軍は足利義昭、大阪城は豊臣秀吉。","id":"m:c2-8-05"},{"t":"w","q":"1575年、織田・徳川の連合軍が鉄砲を効果的に使って武田勝頼を破った戦いを何といいますか。","a":"長篠の戦い","y":"ながしののたたかい","h":"漢字2字＋の戦い","x":"現在の愛知県。鉄砲隊が騎馬隊を破った。","id":"m:c2-8-06"},{"t":"mc","q":"豊臣秀吉が行ったことを、古い順に正しく並べたものを選びなさい。","o":["関白になる → 山崎の戦い → 全国統一","山崎の戦い → 関白になる → 全国統一","全国統一 → 山崎の戦い → 関白になる","山崎の戦い → 全国統一 → 関白になる"],"ans":1,"x":"1582年山崎の戦い→1585年関白→1590年全国統一。","id":"m:c2-8-07"},{"t":"w","q":"豊臣秀吉が、年貢を確実に取るために全国的な規模で行った土地の調査を何といいますか。","a":"太閤検地","y":"たいこうけんち","h":"漢字4字","x":"土地の面積や石高、耕作者を検地帳に記録した。","id":"m:c2-8-08"},{"t":"mc","q":"刀狩令について述べた文として正しくないものを選びなさい。","o":["百姓から刀や鉄砲などの武器を取りあげました。","一揆を防いで、田畑の耕作にうちこませることがねらいでした。","取りあげた武器は大仏の釘などにするとされました。","武士と百姓の区別があいまいになりました。"],"ans":3,"x":"刀狩によって武士と百姓の身分がはっきり分かれた（兵農分離）。","id":"m:c2-8-09"},{"t":"w","q":"豊臣秀吉が明を征服しようとして朝鮮に大軍を送った2度の戦いのうち、1592年に始まったものを何といいますか。","a":"文禄の役","y":"ぶんろくのえき","h":"漢字2字＋の役","x":"2度目は1597年の慶長の役。秀吉の病死で日本軍は引きあげた。","id":"m:c2-8-10"},{"t":"mc","q":"桃山文化について、人物とことがらの組み合わせとして正しいものを選びなさい。","o":["千利休 ― 障壁画","狩野永徳 ― 茶道","出雲の阿国 ― 浄瑠璃","狩野永徳 ― 唐獅子図屏風"],"ans":3,"x":"千利休＝茶道、狩野永徳＝障壁画・唐獅子図屏風、出雲の阿国＝阿国歌舞伎。","id":"m:c2-8-11"},{"t":"w","q":"現在の兵庫県にあり、世界文化遺産にも登録されている、桃山文化を代表する城を何といいますか。","a":"姫路城","y":"ひめじじょう","h":"漢字3字","x":"高くそびえる天守をもつ城郭建築の代表。","id":"m:c2-8-12"}]}]}],"tests":[{"date":"2026-11-08","name":"組分けテスト","cycle":2,"rounds":[6,7,8,9]},{"date":"2026-12-13","name":"組分けテスト","cycle":3,"rounds":[11,12,13,14]},{"date":"2027-01-11","name":"志望校判定テスト","cycle":0},{"date":"2027-01-24","name":"組分けテスト","cycle":4,"rounds":[16,17,18]}],"items":[{"id":"s5b01-001","u":"s5b01","q":"数万年前、日本列島が大陸と陸続きだったころ、ナウマン象などの化石が発掘された長野県の湖","a":"野尻湖","y":"のじりこ","k":"kanji","e":"長野県。ナウマン象やオオツノジカの化石が見つかった。旧石器時代は日本が大陸と陸続きで、象が歩いて来られた。"},{"id":"s5b01-002","u":"s5b01","q":"石を打ち欠いただけの、旧石器時代の道具","a":"打製石器","y":"だせいせっき","k":"kanji","e":"「打」＝打ち欠く。石をたたいて割っただけの石器。みがいた磨製石器（縄文時代）と区別する。"},{"id":"s5b01-003","u":"s5b01","q":"1946年、相沢忠洋が打製石器を発見し、日本にも旧石器時代があったことを明らかにした群馬県の遺跡","a":"岩宿","y":"いわじゅく","s":"遺跡","k":"kanji","e":"相沢忠洋が関東ローム層から黒曜石の打製石器を見つけた。これで「日本にも旧石器時代があった」とわかった。「岩宿＝群馬」をセットで。"},{"id":"s5b01-004","u":"s5b01","q":"岩宿遺跡がある都道府県","a":"群馬県","y":"ぐんまけん","k":"kanji","e":"岩宿遺跡は群馬県みどり市。長野県（野尻湖）と混同しやすい。"},{"id":"s5b01-005","u":"s5b01","q":"旧石器時代の人々は、狩りや木の実の採集をしながらどのようにくらしていたか","a":"移住しながらくらしていた","k":"free","e":"食べ物をさがして移動する生活。定住が始まるのは縄文時代（竪穴住居）から。"},{"id":"s5b01-006","u":"s5b01","q":"約1万年前、地球の気候があたたかくなり、氷河がとけて起こったこと","a":"海面が上昇し、今のような日本列島ができた","k":"free","e":"氷河がとけて海面が上がり、大陸とはなれて島になった。これが縄文時代の始まりごろ。"},{"id":"s5b01-007","u":"s5b01","q":"縄目の文様がつけられた土器","a":"縄文土器","y":"じょうもんどき","k":"kanji","e":"縄をころがした文様がある。厚くてもろい。土器で煮たきができ、どんぐりなども食べられるようになった。"},{"id":"s5b01-008","u":"s5b01","q":"縄文時代はどのくらい続いたか","a":"1万年以上","k":"free","e":"約1万数千年前から紀元前4世紀ごろまで。旧石器時代は「数万年前」、縄文時代は「約1万年」と桁で覚える。"},{"id":"s5b01-009","u":"s5b01","q":"地面を掘り下げて柱を立て、屋根をかけた縄文時代の住居","a":"竪穴住居","y":"たてあなじゅうきょ","k":"kanji","e":"地面を掘り下げ（＝竪穴）、柱を立てて草の屋根をかける。縄文時代に始まり、奈良時代の農民もまだ住んでいた。"},{"id":"s5b01-010","u":"s5b01","q":"石をみがいてつくった石器","a":"磨製石器","y":"ませいせっき","k":"kanji","e":"「磨」＝みがく。石をみがいて形を整えた。縄文時代から。旧石器時代の打製石器とセットで区別。"},{"id":"s5b01-011","u":"s5b01","q":"動物の骨や角でつくった、つりばりなどの道具","a":"骨角器","y":"こっかくき","k":"kanji","e":"動物の骨や角でつくったつりばりや矢じり。「骨」と「角」の字を思い出せば書ける。"},{"id":"s5b01-012","u":"s5b01","q":"たくさんの貝がらが積み上げられた縄文時代の遺跡","a":"貝塚","y":"かいづか","k":"kanji","n":"全国に約3000か所","e":"貝がらのごみ捨て場。骨や土器も出てきて当時のくらしがわかる。内陸で見つかるのは、当時の海面が今より高かったから（当時の海岸線がわかる）。"},{"id":"s5b01-013","u":"s5b01","q":"明治時代にアメリカ人のモースが発見した東京都の貝塚","a":"大森貝塚","y":"おおもりかいづか","k":"kanji","e":"東京都。モースが列車の窓から見つけた。「大森＝モース＝東京」をセットで。"},{"id":"s5b01-014","u":"s5b01","q":"大森貝塚を発見したアメリカ人","a":"モース","k":"kana","e":"アメリカ人の動物学者。大森貝塚の発掘が日本の考古学の手本になった。"},{"id":"s5b01-015","u":"s5b01","q":"魔よけや安産・豊かな収穫を祈るためにつくられた、おもに女性をかたどった土の人形","a":"土偶","y":"どぐう","k":"kanji","e":"縄文時代。おもに女性の形で、魔よけ・安産・豊作を祈った。古墳時代の埴輪と混同しやすい。土偶＝縄文、埴輪＝古墳。"},{"id":"s5b01-016","u":"s5b01","q":"青森市にある、最大500人をこえる人がくらした縄文時代の大規模な集落跡","a":"三内丸山","y":"さんないまるやま","s":"遺跡","k":"kanji","n":"約1500年間続いた。世界文化遺産","e":"青森県。遠くの黒曜石やひすいも出土し、遠い地域と交流していたことがわかる。"},{"id":"s5b01-017","u":"s5b01","q":"縄文時代、足りないものをおぎなった交換の方法","a":"物々交換","y":"ぶつぶつこうかん","k":"kanji","e":"お金がない時代、品物と品物をとりかえた。黒曜石やひすいが遠くまで運ばれたのはこのため。"},{"id":"s5b01-018","u":"s5b01","q":"縄文時代の社会にほとんどなかったもの（住居や墓に差がないことからわかる）","a":"貧富の差・身分のちがい","k":"free","e":"住居の大きさや墓に差がないから。差が生まれるのは弥生時代に稲作が始まってから。"},{"id":"s5b01-019","u":"s5b01","q":"縄文時代の終わりごろ、中国や朝鮮半島から伝わった2つのもの","a":"稲作と金属器（鉄器・青銅器）","k":"free","e":"九州北部に伝わった。弥生時代の2大特色。"},{"id":"s5b01-020","u":"s5b01","q":"縄文土器と比べた弥生土器の特徴","a":"うすくてかたく、文様が少ない","k":"free","n":"東京都文京区弥生で初めて発見","e":"縄文土器は厚くてもろい、弥生土器はうすくてかたい。"},{"id":"s5b01-021","u":"s5b01","q":"弥生時代は紀元前4世紀ごろから紀元後3世紀ごろまで、約何年間続いたか","a":"約700年間","k":"free","e":"紀元前4世紀（前400〜前301年）から紀元後3世紀（201〜300年）まで。紀元前と後をまたぐので約700年。"},{"id":"s5b01-022","u":"s5b01","q":"稲作が紀元前2世紀ごろに達した、本州北端の県","a":"青森県","y":"あおもりけん","k":"kanji","e":"稲作は九州北部から始まり、本州の北のはしまで広がった。"},{"id":"s5b01-023","u":"s5b01","q":"弥生時代に、まだ稲作が行われていなかった2つの地域","a":"北海道と沖縄","k":"free","e":"寒い北海道と、暑い沖縄には広まらず、狩りや漁の生活が続いた。"},{"id":"s5b01-024","u":"s5b01","q":"田を耕すために使った木製の農具（2つ）","a":"すき・くわ","k":"free","e":"木でつくった。すきは土を掘り起こす、くわは土をたがやす。鉄の農具が広まるのは古墳時代（渡来人）。"},{"id":"s5b01-025","u":"s5b01","q":"ぬかるんだ田で足がしずまないようにはいたもの","a":"田げた","k":"free","e":"大きな板を足にひもでくくりつけた。"},{"id":"s5b01-026","u":"s5b01","q":"稲の穂をつみとるために使われた石器","a":"石包丁","y":"いしぼうちょう","k":"kanji","e":"稲の穂だけをつみとる石の道具。穴にひもを通して指にかけた。「稲刈り＝石包丁」。"},{"id":"s5b01-027","u":"s5b01","q":"収穫した稲をたくわえた、ねずみ返しのある建物","a":"高床倉庫","y":"たかゆかそうこ","k":"kanji","e":"床を高くして湿気とねずみを防ぐ。柱についた板が「ねずみ返し」。"},{"id":"s5b01-028","u":"s5b01","q":"収穫した稲の脱穀に使った木の道具（2つ）","a":"うすときね","k":"free","e":"うすに入れた稲をきねでついて、もみがらを取る＝脱穀。"},{"id":"s5b01-029","u":"s5b01","q":"弥生時代、武器や工具（木の農具をつくる道具）として使われた金属器","a":"鉄器","y":"てっき","k":"kanji","e":"じょうぶで武器や工具に使った。数が少なく貴重で、石器もまだ使われた。祭りに使う青銅器と役割を分けて覚える。"},{"id":"s5b01-030","u":"s5b01","q":"銅剣・銅鉾・銅鐸・銅鏡などの青銅器は、おもに何として使われたか","a":"祭器（豊作などを神々に祈る道具）","k":"free","e":"青銅はやわらかいので実用の武器に向かず、祭りの道具になった。"},{"id":"s5b01-031","u":"s5b01","q":"人々の生活のようすが描かれたものもある、つりがね形の青銅器","a":"銅鐸","y":"どうたく","k":"kanji","e":"表面に狩りや脱穀の絵が描かれたものがあり、当時のようすがわかる。"},{"id":"s5b01-032","u":"s5b01","q":"福岡県にある、弥生時代の集落や水田のあとが残る遺跡","a":"板付","y":"いたづけ","s":"遺跡","k":"kanji","e":"福岡県。日本最古級の水田あと。稲作が九州北部から広まった証拠。"},{"id":"s5b01-033","u":"s5b01","q":"静岡市にある、弥生時代の水田のあとが残る遺跡","a":"登呂","y":"とろ","s":"遺跡","k":"kanji","e":"静岡県静岡市。水田・住居・高床倉庫のあとが残る。"},{"id":"s5b01-034","u":"s5b01","q":"敵の侵入に備えて、まわりに濠をめぐらせた集落","a":"環濠集落","y":"かんごうしゅうらく","k":"kanji","e":"「濠」＝ほり。戦いに備えて村のまわりに濠をめぐらせた。稲作が広まって争いが起きた証拠。"},{"id":"s5b01-035","u":"s5b01","q":"佐賀県にある、日本最大級の環濠集落の遺跡","a":"吉野ヶ里","y":"よしのがり","s":"遺跡","k":"kanji","n":"2重の濠。かめ棺が3000以上","e":"佐賀県。物見やぐらや大きな建物のあともあり、「くに」の中心だったと考えられる。"},{"id":"s5b01-036","u":"s5b01","q":"稲作が広まると、人々の間に生まれたもの","a":"貧富の差・身分の差","k":"free","e":"米のたくわえの多い少ないで差がつき、指導者（王）が現れた。"},{"id":"s5b01-037","u":"s5b01","q":"弥生時代に争いが起きた原因","a":"土地や水、たくわえた米をめぐって","k":"free","e":"稲作に必要な土地や水、たくわえた米をめぐる争い。だから環濠集落や大きなやじり（武器）が生まれた。"},{"id":"s5b01-038","u":"s5b01","q":"縄文時代と比べた、弥生時代のやじりの特徴","a":"大きくて重い（戦いの武器になった）","k":"free","e":"縄文のやじりは小さく軽い（狩り用）。弥生後半は大きく重い（人との戦い用）。矢が狩りの道具から戦いの武器に変わった。"},{"id":"s5b01-039","u":"s5b01","q":"有力なむらの指導者がいくつかのむらをまとめ、小さなくにをつくった。その指導者は何とよばれたか","a":"王","y":"おう","k":"kanji","e":"むら→くに。指導者が「王」になり、古墳時代には「豪族」とよばれる。"},{"id":"s5b01-040","u":"s5b01","q":"紀元前1世紀ごろ、倭は100あまりの小国に分かれていたと記した中国の歴史書","a":"『漢書』地理志","y":"かんじょちりし","k":"kanji","e":"「紀元前1世紀・100あまりの小国・楽浪郡」がキーワード。"},{"id":"s5b01-041","u":"s5b01","q":"1世紀の中ごろ、倭の奴国の王の使いに漢の皇帝が金印を授けたと記した歴史書","a":"『後漢書』東夷伝","y":"ごかんじょとういでん","k":"kanji","e":"「1世紀半ば・奴国・金印」がキーワード。"},{"id":"s5b01-042","u":"s5b01","q":"金印にきざまれた5つの文字","a":"漢委奴国王","y":"かんのわのなのこくおう","k":"kanji","e":"「委」は倭（わ）と同じ。5字とも書けるように。"},{"id":"s5b01-043","u":"s5b01","q":"金印が江戸時代（18世紀の終わりごろ）に発見された福岡県の島","a":"志賀島","y":
